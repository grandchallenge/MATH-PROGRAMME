artifact:
  id: WORKFLOW-COVERAGE-001
  type: workflow_control
  title: Full programme workflow coverage, self-authenticating discovery, and exact-artifact publication
  pillar: MATH-PROGRAMME
  status: active
  disposition: ADR-0011 establishes global execution authority; ADR-0012 governs discovery and environment; ADR-0014 binds publication to the exact policy artifact and governs repository tests and experiments.
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve distinctions among execution success, artifact identity, declared reproducibility, certification, promotion, and theorem support.
    findings:
      - The controls establish repository and publication facts only; no mathematical claim is promoted.
  Prospector:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Ensure executable discovery boundaries are independent of the objects they audit.
    findings:
      - Campaign, CI, repository-test, and experiment surfaces now have independent discovery and route checks.
  Experimentalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Retain deterministic replay, bounded tests, and exact promotion of the policy-built site bytes.
    findings:
      - Repository tests run through standard-library discovery and the successful main policy packages one deterministic site archive.
  Cartographer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Make workflow roots, command routes, test imports, formal gates, artifacts, and publication succession explicit.
    findings:
      - The graph now reaches campaign commands, CI imports, repository tests, experiment modules, formal jobs, and the downstream Pages artifact.
  Verifier:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Reject narrowed discovery, hidden experiments, missing tests, artifact substitution, digest failure, mutable environments, and stale deployment.
    findings:
      - Each rejection class has a direct validator and adversarial mutation test.
  Adversary:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Attempt command spoofing, untested experiment insertion, Pages rebuild, cross-run artifact collision, and digest bypass.
    findings:
      - The policy requires operative commands and Pages selects one validated-site artifact from the exact triggering run with outer and inner digest verification.
  Formalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Require actual compiler and complete certification commands rather than wrapper or artifact labels.
    findings:
      - LOG-GCD, PC-WP04, and MATHCERT remain direct formal gates; site artifact identity is not presented as theorem certification.
  Steward:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - State runtime, retention, and reproducibility costs without claiming a full supply-chain lock.
    findings:
      - The validated site artifact is retained for one day; Python patch and transitive dependency movement remain outside the declared guarantee.
  Composer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Present ADR-0011, ADR-0012, and ADR-0014 as one layered control system.
    findings:
      - The public workflow page distinguishes execution authority, discovery, environment, exact artifact promotion, and current-tip publication.
  Grammarian:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Avoid equating test success, artifact identity, publication, certification, and proof.
    findings:
      - Current wording preserves those boundaries.
  Amanuensis:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Align all three ADRs, workflow files, validators, ledger, terminology, inventory, and public navigation.
    findings:
      - WORKFLOW-COVERAGE-001 remains the single workflow-control authority and records the complete three-stage decision history.
  Archivist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve exact external evidence and artifact provenance without confusing short-lived CI artifacts with permanent releases.
    findings:
      - The site artifact is run-scoped and short-lived; documentary release authority and external MATHCERT evidence remain separate.
  Mechanist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Ensure every executable control and experiment has an actual route and that Pages consumes the policy output rather than recomputing it.
    findings:
      - CI import reachability, unittest discovery, experiment import reachability, and exact-artifact download close the execution graph.
  Typesetter:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve strict MkDocs output and deploy the exact bytes generated by that strict build.
    findings:
      - The policy packages the strict site and Pages verifies and deploys it without rebuilding.
  Referee:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Require a green exact final-head global workflow, path-scoped checks, and post-merge Pages evidence before claiming complete publication closure.
    findings:
      - Merge readiness requires all PR-head gates; post-merge deployment remains a separate push-triggered fact.
