artifact:
  id: WORKFLOW-COVERAGE-001
  type: workflow_control
  title: Full programme workflow coverage and policy-gated publication
  pillar: MATH-PROGRAMME
  status: active
  disposition: Global replay reachability, exact external certification evidence, RH retained blockers, retired-path continuity, immutable action references, and Pages deployment order are governed under ADR-0011.
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve the distinction among executable success, bounded certification, artifact promotion, and theorem support.
    findings:
      - The global gate records execution facts only and cannot promote an open mathematical claim.
  Prospector:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Ensure every newly introduced campaign executable becomes discoverable and intentionally registered.
    findings:
      - Campaign replay, validation, and adversarial validation scripts fail closed when absent from the governed registry.
  Experimentalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Retain deterministic replay output and adversarial mutation coverage for executable campaign packages.
    findings:
      - The registry executes BSD, RH, and Poincare replay and rejection suites under bounded subprocesses.
  Cartographer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Make workflow, replay, external-evidence, continuity, historical-identity, and publication dependencies explicit.
    findings:
      - The global gate is upstream of Pages and incorporates local campaign, formal-fixture, pinned external certification, retained-blocker, and retired-path routes.
  Verifier:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Reject missing workflow jobs, unregistered executables, mutable action references, dynamic external checkout coordinates, stale current-path references, and publication bypasses.
    findings:
      - Workflow inventory and adversarial tests exercise each rejection class.
  Adversary:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Attempt silent RH promotion, omitted campaign replay, moving external evidence, dynamic external checkout, direct Pages deployment, and restoration of retired current authority.
    findings:
      - Each mutation is rejected by a dedicated machine-readable test.
  Formalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Require actual kernel builds and bounded certificate checks rather than wrapper-status proxies.
    findings:
      - LOG-GCD, PC-WP04, and the external MATHCERT package are accepted only through direct compiler or complete certification commands.
  Steward:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep the repository green state meaningful without hiding the increased runtime cost.
    findings:
      - ADR-0011 explicitly accepts universal formal replay cost as a governance choice.
  Composer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Present the global gate, fast-feedback workflows, historical-identity control, and publication sequence as one coherent control system.
    findings:
      - The public workflow coverage page separates global authority, path-scoped acceleration, historical provenance, and publication.
  Grammarian:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Avoid language that equates merge, CI, replay, certification, publication, historical recoverability, current authority, and proof.
    findings:
      - Current governance and public wording preserve those distinctions.
  Amanuensis:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Align ADR-0006, ADR-0011, workflow inventory, artifact ledger, terminology, evidence records, historical-identity crosswalk, and public navigation.
    findings:
      - WORKFLOW-COVERAGE-001 is registered with synchronized continuity surfaces.
      - Frozen pre-renumbering Poincare reviews remain recoverable without presenting their retired filename as current authority.
  Archivist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Record external MATHCERT and retired Poincare identities without duplicating or obscuring current formal and documentary authority.
    findings:
      - The external repository, exact commit, controlled paths, command, and claim boundary are explicit.
      - The retired Poincare alias is tied to exact version history and an enumerated historical-identity crosswalk.
  Mechanist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Ensure the versioned workflow graph actually executes every declared control.
    findings:
      - Global jobs cover campaign replay, retired-path continuity, LOG-GCD Lean, PC-WP04 Lean, and pinned MATHCERT replay before publication.
  Typesetter:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve strict MkDocs output while routing workflow governance into the public site.
    findings:
      - The workflow coverage page and ADR-0011 are included in navigation and remain subordinate to policy-gated deployment.
  Referee:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Require a green final-head global workflow including all continuity, formal, and external gates before merge readiness.
    findings:
      - No workflow-control promotion or merge readiness is inferred before the complete PR-head run succeeds.
