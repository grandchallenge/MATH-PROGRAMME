      - Repository tests and experiment modules now have fail-closed execution routes.
      - Pages deploys the exact policy-built site artifact and does not rebuild it.
      - Current-tip publication supersedes successful but stale main commits.
      - RH-WP01 and RH-WP02 remain unpromoted while their blocking reviews remain active.
