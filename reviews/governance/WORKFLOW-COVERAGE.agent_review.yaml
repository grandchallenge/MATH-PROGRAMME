artifact:
  id: WORKFLOW-COVERAGE-001
  type: workflow_control
  title: Full programme workflow coverage, self-authenticating discovery, and current-tip publication
  pillar: MATH-PROGRAMME
  status: active
  disposition: ADR-0011 establishes global execution authority; ADR-0012 makes discovery, environment, operative semantics, and publication freshness self-authenticating.
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve the distinction among execution success, declared reproducibility, bounded certification, artifact promotion, and theorem support.
    findings:
      - The global gate records repository execution facts only and cannot promote an open mathematical claim.
  Prospector:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Ensure executable discovery is independent of the registry under audit.
    findings:
      - Campaign executability is detected by shebang or main guard regardless of filename; registry command authority remains separate.
  Experimentalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Retain deterministic replay output, bounded timeouts, and adversarial mutation coverage.
    findings:
      - Existing BSD, RH, and Poincaré replay packages and the new coverage rejection classes remain deterministic and bounded.
  Cartographer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Make workflow roots, campaign commands, CI imports, formal gates, external evidence, continuity, and publication succession explicit.
    findings:
      - The control graph now separates code-owned discovery, registry command authority, AST import reachability, and current-tip publication.
  Verifier:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Reject missing jobs, narrowed discovery, unreachable executables, marker spoofing, mutable runners, ad hoc installs, dynamic external checkouts, and stale deployment.
    findings:
      - Each rejection class has a direct validator and adversarial test.
  Adversary:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Attempt unexpected executable names, comments posing as commands, silent RH promotion, moving external evidence, direct Pages deployment, and superseded-main publication.
    findings:
      - Synthetic mutations are rejected without broadening any mathematical claim.
  Formalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Require actual kernel builds and complete external certification commands rather than wrapper-status proxies.
    findings:
      - LOG-GCD, PC-WP04, and external MATHCERT remain accepted only through direct compiler or complete certification evidence.
  Steward:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - State the runtime and reproducibility costs without claiming a transitive hash lock.
    findings:
      - Exact top-level pins and fixed Ubuntu runners are governed, while the remaining transitive-lock obligation is explicit.
  Composer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Present ADR-0011 and ADR-0012 as one coherent layered control system.
    findings:
      - The public workflow coverage page distinguishes global authority, discovery, reachability, dependency declaration, history, and publication.
  Grammarian:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Avoid equating merge, CI, replay, declared reproducibility, certification, publication, current authority, and proof.
    findings:
      - Current governance and public wording preserve those distinctions.
  Amanuensis:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Align ADR-0011, ADR-0012, workflow inventory, artifact ledger, terminology, dependency files, historical controls, and public navigation.
    findings:
      - WORKFLOW-COVERAGE-001 remains the single registered authority and now records both decision stages.
  Archivist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Record external evidence, retired identity, and dependency-version provenance without obscuring current authority or mathematical source status.
    findings:
      - External MATHCERT and historical Poincaré identities remain exact and bounded; PyPI versions govern only the workflow environment.
  Mechanist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Ensure every executable campaign and CI control has an actual route from the versioned workflow graph.
    findings:
      - Campaign content discovery and CI AST import reachability close the remaining execution graph.
  Typesetter:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve strict MkDocs output while publishing both workflow decisions and the integrated coverage page.
    findings:
      - ADR-0011, ADR-0012, and the workflow coverage page are navigation targets.
  Referee:
    status: reviewed
    reviewed_by: MATH-PROGRAMME workflow coverage council
    reviewed_at: '2026-07-26'
    obligations:
      - Require a green exact final-head global workflow including all continuity, semantic, formal, and external gates before readiness or merge.
    findings:
      - Initial second-pass discovery confirmed the campaign executable set was complete and exposed only an adversarial diagnostic mismatch, which was repaired without weakening the control.
