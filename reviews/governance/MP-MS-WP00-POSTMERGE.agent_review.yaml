artifact:
  id: MP-MS-WP00-POSTMERGE
  type: governance_review
  title: Post-merge MATHSOLVE routing, waiver, lineage, and Cert-promotion review
  pillar: MATH-PROGRAMME
  status: active
  disposition: Corrective controls implemented; exact-head CI and linked corrective merges remain required.
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Preserve the distinction between route existence, completed Cert disposition, and positive mathematical promotion.
    findings:
      - Judgment may consume a completed disposition; claim promotion requires certified or qualified status.
  Prospector:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Inventory every active campaign without manufacturing routes for inactive domains.
    findings:
      - The registry covers exactly the eight ACTIVE campaigns.
  Experimentalist:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Preserve bounded computation and negative-result boundaries during routing.
    findings:
      - Routing records do not upgrade finite, statistical, regulated, or failed-route evidence.
  Cartographer:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Record Forge, Solve, Cert, placement, migration, and promotion edges explicitly.
    findings:
      - Every active campaign has exact Forge, Solve-manifest, and Cert issue identities.
  Verifier:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Reject provider, manifest, campaign, Cert-identity, and blocker drift.
    findings:
      - Exact provider PR, provider commit, and eight manifest blob identities are pinned and tested.
  Adversary:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Test silent omission, stale identities, incomplete authority, expired waivers, stage drift, and nonpositive promotion.
    findings:
      - New tests reject each class; rejected and proof-debt dispositions cannot authorize claim promotion.
  Formalist:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Define the waiver authority set and certification-state lattice without implication by naming.
    findings:
      - Waivers require Referee, Steward, and Human Steward authority, exact stage scope, and a future review date; positive promotion is limited to certified or qualified.
  Steward:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Keep administrative exceptions narrow, reviewable, and reversible.
    findings:
      - Waivers are stage-scoped, carry an authorization identity, and fail after their review date.
  Composer:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Present the three-repository repair as one linked control system.
    findings:
      - INTELLECT governs lifecycle admission, MATHSOLVE owns campaign lineage, and MATH-PROGRAMME owns portfolio promotion.
  Grammarian:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Avoid using handoff, disposition, certification, and promotion as synonyms.
    findings:
      - The reviewed records use distinct terms and state transitions.
  Amanuensis:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Reconcile all campaign identities, review provenance, registry pins, and linked corrective work.
    findings:
      - Six missing MATHCERT route issues were created; existing NS-CI and HC routes were retained; all eight records are non-null.
  Archivist:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Preserve retrospective placement and exact historical source identities.
    findings:
      - BSD, PNP, RH, YM, and OZ remain Programme-embedded retrospective routes with migration debt.
  Mechanist:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Ensure future Solve-owned stages cannot execute in the Programme repository by accident.
    findings:
      - Programme-embedded routes remain admissible only at retrospective WP00 registration; future stages fail closed.
  Typesetter:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Keep machine records and review prose legible and exact.
    findings:
      - The registry, schema, validator, tests, and review record use the same identifiers and state vocabulary.
  Referee:
    status: reviewed
    reviewed_by: MP-MS-WP00 post-merge Council
    reviewed_at: '2026-07-28'
    obligations:
      - Require exact-head Programme CI and linked INTELLECT and MATHSOLVE corrective review before final promotion.
    findings:
      - The corrective design is acceptable, but merger must follow the dependency order and final provider identities must be re-pinned if either upstream head changes.
