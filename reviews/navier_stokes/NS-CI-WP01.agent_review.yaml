artifact:
  id: NS-CI-WP01
  type: work_package
  title: Exact false-proof atlas for critical Navier-Stokes integrability
  pillar: MATHFORGE
  status: referee_promoted

council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Data-class, theorem-scope, and universal-versus-existential quantifier fixtures match WP00 and WP02.
      - Compact support remains a restricted lane and is not identified with the full Fefferman class.

  Prospector:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Source-dependent fixtures preserve the audit states and operational interfaces established in WP00.

  Experimentalist:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - FP-010 rejects inference from finitely many finite approximations to a uniform continuum theorem.
      - Verified a posteriori analysis and simulations used for falsification remain permitted.

  Cartographer:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - All fourteen fixtures map to theorem-spine, claim, certification, or quantifier boundaries.
      - The atlas is extensible and does not claim exhaustive classification of all false proofs.

  Verifier:
    status: reviewed
    reviewed_by: exact-fixture-ci-and-independent-replay
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - FP-001, FP-002, FP-007, FP-008, and FP-012 replay exactly.
      - Forge CI workflow run 30058521633 passed.

  Adversary:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Counter-route attempts either trigger another fixture or add a genuinely new hypothesis.
      - No fixture overreaches from failure of an argument to falsity of the open target.

  Formalist:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - FP-011 correctly separates kernel-checked implication composition from proof of imported analytic premises.

  Steward:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Triggered fixtures require route termination or narrowing before mechanism work.
      - Passing the atlas is explicitly not a mechanism-validation certificate.

  Composer:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - The atlas uses a consistent false-claim, obstruction, scope, and nearest-route structure.

  Grammarian:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Failure of a proof route is never phrased as failure of the critical-integrability statement.

  Amanuensis:
    status: reviewed
    reviewed_by: wp01-cross-document-integration
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - WP01 agrees with WP00's corrected data class and one-way correspondence wording.
      - WP01 fixtures agree with WP02 theorem entries and strong-level test boundaries.
      - Authoritative provider and programme artifacts are registered in review provenance.

  Archivist:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Attribution-sensitive fixtures distinguish historical interior results from the operational global theorem interface.

  Mechanist:
    status: reviewed
    reviewed_by: wp01-adversarial-semantic-review
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Future mechanisms must state which fixtures they bypass and identify the new scale-compatible estimate used.

  Typesetter:
    status: reviewed
    reviewed_by: wp01-cross-document-integration
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Time-first mixed-norm notation and divergent cutoff constants are rendered consistently.

  Referee:
    status: reviewed
    reviewed_by: ns-ci-referee
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - The atlas is complete enough to govern rejection of the currently catalogued routes.
      - Promotion is eliminative only and carries no negative conclusion about Navier-Stokes regularity.

