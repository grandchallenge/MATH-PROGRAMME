artifact:
  id: NS-CI-WP06
  type: investigatory_work_package
  title: Navier–Stokes undecidability and reduction lane
  pillar: MATH-PROGRAMME
  status: active
  disposition: speculative_non_probative; literature, obligation mapping, risk analysis, and bounded interface fixtures only
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve the exact true-equation, data-class, event, solution-semantics, quantifier, representation, and formal-system identities.
    findings:
      - U001–U011 expose the reduction and undecidability-transfer obligations; U012 is the separate independence-transfer gate, and none is asserted discharged.
  Prospector:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Search for primary sources that discharge named obligations rather than papers sharing only adjacent terminology.
    findings:
      - Four adjacent-system sources are relevant, but none supplies the required true-equation reduction.
  Experimentalist:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep the bounded fixture deterministic, finite-step, and explicitly non-PDE.
    findings:
      - The fixture distinguishes finite-budget halting, gate activation, and threshold crossing under tested inputs only.
  Cartographer:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep the lane outside the active analytic theorem spine while making dependencies and escalation gates explicit.
    findings:
      - WP06 is a separate non-blocking branch subordinate to WP01/WP02.
  Verifier:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Reject one-way reductions, implicit solution quantifiers, noninteger machine states, nonfinite numerical parameters, and untested experiment modules.
    findings:
      - Repository execution policy and fixture tests cover the bounded software contract; theorem and transfer obligations remain open.
  Adversary:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Attempt transfers from Euler, averaged equations, ODE blow-up, numerical nontermination, instance undecidability, and nonunique solution semantics.
    findings:
      - Each attempted transfer is explicitly blocked by the claim boundary, risk ledger, and U010–U012 gates.
  Formalist:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Separate the represented target decision problem, its undecidability theorem, and independence of a universal sentence in a named formal system.
    findings:
      - U011 governs computability-theoretic transfer to the exact target problem; U012 separately requires formal-system-relative arithmetization and an independence bridge.
  Steward:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep resource priority with the active WP01/WP02 critical-integrability route.
    findings:
      - The lane is medium priority, non-blocking, and restricted to reconnaissance and bounded fixtures.
  Composer:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Present source evidence, transfer barriers, obligations, risks, and escalation as one coherent dossier.
    findings:
      - The integrated WP06 stack preserves those layers without implying a proof route.
  Grammarian:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Prevent interchange of Turing complete, undecidable, blow-up, singular, noncomputable, and independent.
    findings:
      - Current wording maintains the distinctions and names the exact unsupported claims.
  Amanuensis:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Align the campaign stack, ADR, domain registry, master plan, ledger, terminology, tests, and public page.
    findings:
      - The rebuilt artifact uses canonical campaign and decision paths and one stable artifact ID.
  Archivist:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Verify source identities and preserve the distinction between primary results and transfer speculation.
    findings:
      - The four source records were checked against their primary arXiv entries; transfer barriers remain explicit.
  Mechanist:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Require equation fidelity, effective representation, robust computation, viscous persistence, both reduction directions, exact solution semantics, and undecidability transfer.
    findings:
      - No mechanism or undecidability claim is authorized while U002 and U005–U011 remain theorem-level debt.
  Typesetter:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep result-status, equations, obligations, and claim boundaries legible in repository and public documentation.
    findings:
      - The dossier follows the existing campaign hierarchy and public domain route.
  Referee:
    status: reviewed
    reviewed_by: NS-CI-WP06 Agent Council
    reviewed_at: '2026-07-26'
    obligations:
      - Refuse reduction escalation until U001–U011 are discharged, and refuse independence language until U012 is separately discharged under a new Council decision.
    findings:
      - Current disposition is retain as literature and bounded interface reconnaissance; no next-stage promotion is recommended.
