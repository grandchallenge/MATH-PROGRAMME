artifact:
  id: NS-CI-WP04
  type: work_package
  title: Restricted theorem target scorecard
  pillar: MATH-PROGRAMME
  status: referee_selected_research_target

council_review:
  Axiomatist:
    status: reviewed
    obligations: []
    findings:
      - A2 preserves the whole-space equation, full Fefferman data class, finite-time quantifier, and universal Leray-Hopf solution quantifier.
      - The extra hypothesis Lambda in L2_t is explicit and does not assume the target norm.
      - D1 is not theorem-grade without an independent H_D; E1 is an auxiliary bridge.
  Prospector:
    status: reviewed
    obligations:
      - Continue publication monitoring and exact-source concordance during the A2 attack.
    findings:
      - Primary source extraction identifies universal L1_t information, a sufficient L5/2_t criterion, and the critical exponent two.
      - A bounded targeted search found no exact whole-space Lambda-in-L2 criterion; no novelty claim follows.
      - Recent axisymmetric-swirl and full-system claims are isolated in grandchallenge/MATHFORGE#20.
  Experimentalist:
    status: reviewed
    obligations: []
    findings:
      - WP03 remains closed; no numerical protocol is authorized as theorem evidence.
  Cartographer:
    status: reviewed
    obligations: []
    findings:
      - A2 routes through a new frequency estimate to the low-mode regularity theorem or directly to WP02 CR-004 and CR-007.
      - MATHSOLVE#24 owns the analytic attack DAG.
  Verifier:
    status: reviewed
    obligations:
      - Verify any future A2 proof or narrower lemma before theorem promotion.
    findings:
      - Source-envelope, low-frequency-enstrophy, and direct Holder closures fail exactly.
      - The remaining attack lanes require equation-specific packing, temporal, weighted-dissipation, or cancellation information.
  Adversary:
    status: reviewed
    obligations:
      - Replay WP01 against every new A2 mechanism.
    findings:
      - Exact scalar fixtures reject the source-envelope and product-of-L1 closures.
      - A2 survives as a research target because its statement is non-circular, not because an elementary proof works.
      - D1 is blocked as tautological until H_D is independently defined.
  Formalist:
    status: reviewed
    obligations:
      - Implement the selected A2 scaling and imported-interface fixture slice.
    findings:
      - Lambda in L2_t and the target critical integral are scale-invariant.
      - The analytic bridge remains visible and unproved.
  Steward:
    status: reviewed
    obligations: []
    findings:
      - Mechanism generation is open only for A2's named analytic lanes.
      - Broad numerical, novelty, universal-regularity, and claimed-proof promotion remain closed.
  Composer:
    status: reviewed
    obligations: []
    findings:
      - Selection rationale, candidate dispositions, and exit conditions are integrated.
  Grammarian:
    status: reviewed
    obligations: []
    findings:
      - Selected research target is distinguished from proved theorem, criterion, novelty, and universal claim.
  Amanuensis:
    status: reviewed
    obligations:
      - Maintain A2 route terminations and claim-triage provenance during the next stage.
    findings:
      - MATHFORGE, MATHSOLVE, MATHCERT, WP01, and WP02 artifacts are cross-integrated without blocking conflict.
  Archivist:
    status: reviewed
    obligations:
      - Preserve later exact source findings and claimed-proof dispositions.
    findings:
      - Established results, bounded negative searches, and unreviewed claims have distinct source states.
  Mechanist:
    status: reviewed
    obligations:
      - Execute the A2 level-set, excursion, weighted-dissipation, high-low, and packet-adversary lanes.
    findings:
      - A2 exposes a source-defined critical half-power gap.
      - Three elementary mechanisms have terminated with exact gaps.
  Typesetter:
    status: reviewed
    obligations: []
    findings:
      - Scaling exponents, viscosity factors, mixed-norm order, and candidate identifiers are normalized.
  Referee:
    status: reviewed
    obligations:
      - Review any claimed proof, narrower lemma, no-go result, or retirement recommendation arising from A2.
    findings:
      - NS-CI-R014-A2 is approved as SELECTED_RESEARCH_TARGET_UNPROVED.
      - D1 is not selected; E1 is retained as an auxiliary bridge.
      - Selection does not establish truth or novelty.

