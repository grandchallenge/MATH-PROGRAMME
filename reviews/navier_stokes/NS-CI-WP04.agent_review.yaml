artifact:
  id: NS-CI-WP04
  type: work_package
  title: Restricted theorem target scorecard
  pillar: MATH-PROGRAMME
  status: active_shortlist_review

council_review:
  Axiomatist:
    status: reviewed
    obligations:
      - Finalize the exact imported definition and quantifier profile for A2.
      - Reject D1 unless an independent hypothesis H_D is supplied.
      - Normalize the approximation topology in E1.
    findings:
      - A2, D1, and E1 are distinct restricted statements rather than silent replacements of the universal target.
      - D1 is presently an interface, not a theorem-grade hypothesis.
  Prospector:
    status: reviewed
    obligations:
      - Confirm that no exact Lambda-in-L2 criterion already appears in the literature.
      - Complete claimed-proof triage in grandchallenge/MATHFORGE#20.
    findings:
      - Generic B, C, and F families were terminated as established, scaling-gap-limited, or low-leverage.
      - A2, D1, and E1 form the provisional shortlist.
  Experimentalist:
    status: reviewed
    obligations: []
    findings:
      - WP03 remains closed because no approved numerical protocol can decide the continuum implications.
  Cartographer:
    status: reviewed
    obligations:
      - Update the dependency graph after Referee selection.
    findings:
      - A2 consumes CR-004 and CR-007 after a new frequency estimate.
      - D1 consumes CR-005 and CR-007 after a uniform compensated inequality.
      - E1 consumes CR-004 and CR-006 after compactness and lower semicontinuity.
  Verifier:
    status: pending
    obligations:
      - Test A2 against the product-of-L1 obstruction and search for a valid weighted frequency estimate.
      - Verify the whole-space compactness route in E1.
    findings:
      - The elementary A2 low-frequency estimate does not close the target integral.
  Adversary:
    status: pending
    obligations:
      - Attempt to collapse A2 to an established Besov or LPS criterion.
      - Reject every D1 formulation that encodes its compensated conclusion.
      - Test E1 for quantifier reversal and hidden global-stability assumptions.
    findings:
      - Multiplication of Lambda-squared and the energy dissipation density would repeat a WP01 integrability error.
  Formalist:
    status: reviewed
    obligations:
      - Implement the first scaling and quantifier fixtures after statement freeze.
    findings:
      - A2 is exactly scale-critical.
      - D1 requires cutoff covariance and a coefficient scaling as lambda-squared.
      - E1 is primarily a quantifier-order and imported-interface theorem.
  Steward:
    status: reviewed
    obligations: []
    findings:
      - Broad mechanism generation, WP03, numerical regularity claims, and novelty claims remain closed.
  Composer:
    status: pending
    obligations:
      - Integrate the final selected theorem or no-selection rationale.
  Grammarian:
    status: reviewed
    obligations:
      - Preserve the distinction between provisional lead and selected target.
    findings:
      - The exact mixed-norm order and universal Leray-Hopf quantifier are preserved.
  Amanuensis:
    status: reviewed
    obligations:
      - Maintain source, decision, and claimed-proof provenance until Referee disposition.
    findings:
      - MATHFORGE, MATHSOLVE, MATHCERT, WP01, and WP02 artifacts are cross-linked without a current semantic conflict.
  Archivist:
    status: reviewed
    obligations:
      - Complete exact source-location concordance for A2 and the recent claimed proofs.
    findings:
      - Source states distinguish established results, absent exact criteria, and unreviewed recent claims.
  Mechanist:
    status: reviewed
    obligations:
      - Search for an equation-specific route through A2-L5.
      - Supply a non-tautological H_D or recommend D1 termination.
    findings:
      - A2 exposes a precise weighted-integrability obstruction.
      - D1 has no independent mechanism yet.
  Typesetter:
    status: reviewed
    obligations: []
    findings:
      - Scaling exponents and norm order are normalized.
  Referee:
    status: pending
    obligations:
      - Select at most one target after exact prior-art, adversarial, and Verifier review, or approve no selection.
    findings:
      - A2 is the provisional lead only; D1 is blocked; E1 is the bridge fallback.

