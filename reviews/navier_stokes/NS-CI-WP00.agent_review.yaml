council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Resolve the exact quantifier and domain correspondence with the official Clay positive branch.
      - Keep R3 and T3 hypothesis profiles separate.
    findings:
      - The primary R3 challenge is explicitly quantified over smooth compactly supported divergence-free data and Leray-Hopf solutions.
      - The word equivalent remains gated by proof debt NS-CI-D005.

  Prospector:
    status: blocked
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Extract exact theorem statements from Leray, Prodi, Serrin, Ladyzhenskaya, local strong theory, and weak-strong uniqueness sources.
      - Complete a dated current-status and claimed-proof audit.
    findings:
      - Seed bibliography is present.
      - Exact primary-source hypotheses are not yet committed.

  Experimentalist:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Preserve the rule that numerical experiments are mechanism probes and never continuum certificates.
    findings:
      - WP00 contains no numerical evidence.
      - WP03 is explicitly bounded as non-probative for global regularity.

  Cartographer:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Select NS-CI-R012 only after source and equivalence audit.
    findings:
      - The initial theorem spine and machine-readable dependency DAG agree.
      - The energy-space obstruction is represented as a blocker of a generic shortcut, not as evidence against the target theorem.

  Verifier:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Independently check the scaling calculation and concentrating witness.
      - Verify every arrow in the continuation bridge after source extraction.
    findings:
      - The local calculations are internally coherent.
      - Imported PDE theorems remain unverified and visibly marked.

  Adversary:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Build WP01 false-proof fixtures for reversed Lp inclusion, illegal interpolation, hidden H1 uniform bounds, and circular regularity.
      - Triage claimed resolutions without amplifying unsupported claims.
    findings:
      - The package states the smallest abstract obstruction.
      - The claim boundary rejects numerical boundedness and formalization theater as proof.

  Formalist:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Perform theorem-prover library reconnaissance before promising continuum formalization.
      - Keep imported analytic theorems as provenance-bearing assumptions until checked.
    findings:
      - The first formal target is the mixed-norm scaling identity.
      - The universal estimate is explicitly outside the initial formalization scope.

  Steward:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Prevent mechanism generation from outrunning the source and equivalence audit.
    findings:
      - The first executable step is bounded and advances NS-CI-L010.
      - Promotion is blocked while source and correspondence debts remain.

  Composer:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - The package proceeds from object and obstruction to theorem spine, debt, certification, and next action.

  Grammarian:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Preserve the distinction between a regularity criterion and proof that the criterion holds universally.
    findings:
      - Open, proved, imported, and unverified statements are linguistically distinguished.

  Amanuensis:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Register NS-CI-WP00 and ADR-0003 in the canonical ledgers.
      - Update review provenance after specialist and source audits.
    findings:
      - Stable identifiers and cross-document references are consistent across the initialization bundle.
      - Final mathematical promotion remains blocked; editorial integration of the draft is complete.

  Archivist:
    status: blocked
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Complete attribution, translation, priority, and modern-reference audit for the LPS theorem chain.
      - Record the exact Leray source edition and theorem location.
    findings:
      - Bibliographic seeds are adequate for initialization only.

  Mechanist:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Require each proposed mechanism to identify which estimate in the LPS proof it changes and how scaling is respected.
    findings:
      - The exponent gap is operationalized as the first mechanism constraint.

  Typesetter:
    status: reviewed
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations: []
    findings:
      - Norm exponents, domains, and scaling transformations are presented consistently in the integrated draft.

  Referee:
    status: blocked
    reviewed_by: campaign-initialization-agent
    reviewed_at: '2026-07-23'
    obligations:
      - Reassess after NS-CI-D001 through NS-CI-D005 are discharged or narrowed.
    findings:
      - Campaign initialization is suitable for draft review.
      - Mathematical promotion is premature because the core imported theorem chain is not source-audited.

