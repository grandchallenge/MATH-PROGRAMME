artifact:
  id: DOCS-DOCUMENTARY-001
  type: documentation_bundle
  title: Documentary Library and Poincaré reference web edition authority repair
  pillar: MATH-PROGRAMME
  status: published
  disposition: Seven documentary records and the PC-001 reference web edition are public; release-class artifacts remain metadata_only until stable locators are recorded.
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve each governing campaign statement, ambient category, quantifier, and open-or-solved status.
    findings:
      - Documentary publication remains presentation and orientation; no terminal mathematical claim is strengthened.
      - The Poincaré web edition preserves the qualified solved-problem archive boundary.
  Prospector:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep the collection useful for public discovery without creating an ungoverned claim surface.
    findings:
      - Every volume now crosswalks to a programme domain, campaign, and governing claim-authority artifact.
  Experimentalist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Do not present visual plates, web interactions, or release metadata as mathematical experiment evidence.
    findings:
      - Plate authority is fixed to pedagogical orientation only and is validated in the web-edition contract.
  Cartographer:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Align manifest volumes, domain registry entries, campaign IDs, public pages, source records, and claim authorities.
    findings:
      - The manifest records explicit domain, campaign, scope-relation, source-record, web-page, and claim-authority crosswalks.
      - The Navier–Stokes volume is explicitly a parent-challenge orientation for the narrower NS-CI-001 campaign.
  Verifier:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Reject schema drift, missing assets, mismatched hashes, misleading source labels, broken section contracts, and accessibility regressions.
    findings:
      - Documentary validation is integrated into programme policy and has dedicated adversarial rejection tests.
  Adversary:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Test pointer-versus-source confusion, checksum-versus-availability confusion, unknown campaigns, missing assets, duplicate slugs, and nested main landmarks.
    findings:
      - The validator fails closed for each named mutation and does not infer publication from digest presence.
  Formalist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep manifest and web-edition schemas explicit, closed to undeclared properties, and versioned.
    findings:
      - The manifest uses schema version 1.1.0 and the web-edition instance is validated against its reusable schema.
  Steward:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Explain authority, availability, and reading routes in language a public reader can follow.
    findings:
      - Source records, authoritative source bundles, rendered editions, web editions, and metadata-only availability are separated on the collection page.
  Composer:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Keep the library, source policy, artifact manifest, and reference web edition in a coherent navigation sequence.
    findings:
      - MkDocs navigation distinguishes the collection, volume records, source-record policy, release manifest, and web-edition contracts.
  Grammarian:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Eliminate authoritative-source ambiguity and normalize human-facing mathematical typography.
    findings:
      - Public text uses Poincaré, Hamilton–Perelman, and GCL–Chaidez while stable filenames and identifiers remain ASCII.
      - Pointer files are labelled source records; the complete illustrated bundle is labelled the authoritative source artifact.
  Amanuensis:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Register the publication layer, decision, terminology, review provenance, and final integrated authority.
    findings:
      - ADR-0010, the artifact ledger, terminology registry, glossary, manifest, and schema-bound review now agree.
  Archivist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve cryptographic identity without claiming public availability that has not been established.
    findings:
      - Release-class artifacts are recorded as metadata_only with null release locators.
      - Digests establish identity after acquisition but are not represented as publication evidence.
  Mechanist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Bind documentary validation to the existing programme workflow and retain a no-JavaScript reading path.
    findings:
      - The programme validator imports the documentary contract and its rejection tests run through the programme regression suite.
      - MathJax is a version-pinned enhancement rather than an archival authority.
  Typesetter:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Preserve responsive, keyboard, reduced-motion, print, and plate semantics while avoiding duplicate landmarks.
    findings:
      - The embedded manuscript uses an article landmark and the skip target is programmatically focusable.
  Referee:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-26'
    obligations:
      - Require explicit artifact authority, release availability, crosswalks, CI enforcement, and unchanged theorem boundaries.
    findings:
      - The repair governs publication and continuity only; it does not promote any open problem or strengthen PC-001.
