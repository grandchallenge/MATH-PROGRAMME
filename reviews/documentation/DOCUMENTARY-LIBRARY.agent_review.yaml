artifact:
  id: DOCS-DOCUMENTARY-001
  type: documentation_bundle
  title: Documentary Library manifest discovery and seven-edition continuity review
  pillar: MATH-PROGRAMME
  status: published
  disposition: Seven browser-native documentary editions are public and discovered exclusively through ARTIFACT_MANIFEST.json; Poincaré is reference tier, BSD is full tier, and five Millennium volumes are orientation tier. Release-class artifacts remain metadata_only until stable locators are recorded.
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Preserve each governing campaign statement, ambient category, quantifier, and open-or-solved status.
    findings:
      - Documentary publication remains presentation and orientation; no terminal mathematical claim is strengthened.
      - The Poincaré web edition preserves the qualified solved-problem archive boundary.
      - The six Millennium web editions preserve explicit open-problem and no-solution boundaries.
  Prospector:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Keep the collection useful for public discovery without creating an ungoverned claim surface.
    findings:
      - Every manifest volume crosswalks to a programme domain, campaign, claim authority, source record, web page, edition record, scope relation, and documentary tier.
  Experimentalist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Do not present visual plates, web interactions, or release metadata as mathematical experiment evidence.
    findings:
      - Plate authority is fixed to pedagogical orientation only and is validated across all seven editions.
  Cartographer:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Align manifest volumes, domain registry entries, campaign IDs, public pages, source records, edition records, tiers, and claim authorities.
    findings:
      - ARTIFACT_MANIFEST.json is the sole discovery authority and CI rejects omitted or orphaned editions.
      - The Navier–Stokes volume remains a parent-challenge orientation for the narrower NS-CI-001 campaign.
      - Reference, full, and orientation tiers describe expository scope rather than theorem strength.
  Verifier:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Reject schema drift, incomplete discovery, missing assets, mismatched hashes, topic drift, authority mismatch, duplicate plate identities, broken section contracts, and accessibility regressions.
    findings:
      - One manifest-driven validator now applies the shared web-edition contract to all seven volumes.
      - Adversarial tests cover omitted and orphaned editions, topic and scope drift, claim-authority mismatch, duplicate plate IDs and assets, and incomplete discovery.
  Adversary:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Test pointer-versus-source confusion, checksum-versus-availability confusion, incomplete discovery, unknown campaigns, missing assets, duplicate identities, and nested landmarks.
    findings:
      - The validator fails closed for every named mutation and does not infer publication from digest presence.
      - Shared BSD and Wave One infrastructure assertions have moved into the manifest-discovered validator; repository tests retain only problem-specific mathematical spines.
  Formalist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Keep manifest and web-edition schemas explicit, closed to undeclared properties, and versioned.
    findings:
      - The manifest schema is version 1.2.0 and requires edition_record plus documentary_tier.
      - All edition instances remain web-schema version 1.1.0 and are uniformly validated.
  Steward:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Explain authority, availability, discovery, and documentary tiers in language a public reader can follow.
    findings:
      - The collection page distinguishes source records, authoritative source bundles, rendered editions, web editions, edition records, metadata-only availability, and tier meaning.
  Composer:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Keep the library, source policy, manifest, edition records, and browser editions in a coherent navigation sequence.
    findings:
      - The collection table now links every web page, source record, and edition record, while MkDocs exposes every public reading route.
  Grammarian:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Eliminate source-authority ambiguity, normalize mathematical typography, and keep machine records reviewable.
    findings:
      - Edition JSON and tests are conventionally formatted.
      - The malformed Navier–Stokes viscosity declaration is corrected to nu greater than zero.
      - Pointer files remain source records; the complete illustrated bundle remains the authoritative source artifact.
  Amanuensis:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Register the seven-edition publication layer, terminology, review provenance, and final integrated authority.
    findings:
      - The artifact ledger, terminology registry, file manifest, collection policy, ADR-0010 implementation extension, and review provenance now include PRs 99 and 103.
  Archivist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Preserve cryptographic identity without claiming public availability that has not been established.
    findings:
      - Release-class artifacts remain metadata_only with null release locators.
      - Digests establish identity after acquisition but are not represented as publication evidence.
  Mechanist:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Bind manifest discovery and every edition contract to the global programme workflow while retaining a no-JavaScript reading path.
    findings:
      - The programme validator imports the generalized documentary contract and its rejection tests run through the programme regression suite.
      - MathJax remains a version-pinned enhancement rather than an archival authority.
  Typesetter:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Preserve responsive, keyboard, reduced-motion, print, plate, and semantic-landmark contracts across all editions.
    findings:
      - All embedded manuscripts use article landmarks, focusable skip targets, accessible plate metadata, and tier-appropriate status surfaces.
  Referee:
    status: reviewed
    reviewed_by: Documentary authority and continuity repair council
    reviewed_at: '2026-07-27'
    obligations:
      - Require explicit discovery authority, artifact authority, release availability, crosswalks, tier boundaries, CI enforcement, and unchanged theorem boundaries.
    findings:
      - The repair closes documentary consistency and coverage only; it does not promote any open problem, strengthen PC-001, or claim equal expository depth across tiers.
