  - id: DOCS-DOCUMENTARY-001-O001
    owner: Archivist
    description: Add stable release locators and change availability to published_release only after the checksum-identified artifacts are actually published.
    severity: medium
    blocking: false
  - id: DOCS-DOCUMENTARY-001-O002
    owner: Mechanist
    description: Reconsider locally hosted MathJax if the web edition later claims offline-complete or network-independent rendering.
    severity: low
    blocking: false
  - id: DOCS-DOCUMENTARY-001-O003
    owner: Composer
    description: Orientation-tier editions may be expanded toward full-tier expository depth without changing their claim authority or open-problem status.
    severity: low
