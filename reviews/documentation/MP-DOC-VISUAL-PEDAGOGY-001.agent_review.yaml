artifact:
  id: MP-DOC-VISUAL-PEDAGOGY-001
  type: documentary_visual_pedagogy_pilot
  title: Governed hybrid visual-pedagogy pilot
  pillar: MATH-PROGRAMME
  status: active
  disposition: VISUAL_PEDAGOGY_REFORM_APPROVED_FOR_BOUNDED_PILOT

council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: Agent Council / Axiomatist
    reviewed_at: '2026-08-09'
    obligations:
      - Require each governed plate to distinguish literal from nonliteral semantics.
    findings:
      - Current visual grammar can confuse a mathematical object with a merely suggestive shape; representation class must therefore be explicit.
  Prospector:
    status: reviewed
    reviewed_by: Agent Council / Prospector
    reviewed_at: '2026-08-09'
    obligations:
      - Preserve medium choice as a function of the mathematical object rather than a preferred file extension.
    findings:
      - A medium-neutral pipeline enables fields, surfaces, spectra, arithmetic data, dynamics, and exact diagrams to use different visual languages.
  Experimentalist:
    status: reviewed
    reviewed_by: Agent Council / Experimentalist
    reviewed_at: '2026-08-09'
    obligations:
      - Bind data-derived and simulation-derived images to their source data or computational process.
    findings:
      - Reproducible visualization remains exposition unless a separately governed support route gives the computation evidentiary force.
  Cartographer:
    status: reviewed
    reviewed_by: Agent Council / Cartographer
    reviewed_at: '2026-08-09'
    obligations:
      - Preserve the dependency chain from mathematical source through renderer, annotated master, review, and delivery derivatives.
    findings:
      - Representation-first production gives the documentary visual a traceable dependency graph rather than an opaque final asset.
  Verifier:
    status: reviewed
    reviewed_by: Agent Council / Verifier
    reviewed_at: '2026-08-09'
    obligations:
      - Add visual-semantic review beyond file presence, metadata validity, and accessibility checks.
    findings:
      - Machine validation can enforce declared contracts but cannot establish that a rendered manifold, field, plot, or transformation is mathematically faithful.
  Adversary:
    status: reviewed
    reviewed_by: Agent Council / Adversary
    reviewed_at: '2026-08-09'
    obligations:
      - Test dimension collapse, false scale, fictitious data, topology errors, hidden temporal compression, and metaphor presented as literal mathematics.
    findings:
      - A polished incorrect visual can create a stronger false intuition than no image; generated imagery must not be presumed semantically correct.
  Formalist:
    status: reviewed
    reviewed_by: Agent Council / Formalist
    reviewed_at: '2026-08-09'
    obligations:
      - Maintain a closed machine-readable visual contract without claiming that schema validation proves semantic correctness.
    findings:
      - Representation class, provenance, literal semantics, accessibility, derivatives, and claim boundary are suitable machine-checkable fields.
  Steward:
    status: reviewed
    reviewed_by: Agent Council / Steward
    reviewed_at: '2026-08-09'
    obligations:
      - Treat viewer delight as subordinate to and compatible with mathematical clarity, cognitive economy, and honest claim boundaries.
    findings:
      - Visual beauty is valuable when it helps the reader hold the object and relation rather than replacing mathematical structure with atmosphere.
  Composer:
    status: reviewed
    reviewed_by: Agent Council / Composer
    reviewed_at: '2026-08-09'
    obligations:
      - Use staged visual sequences for processes that cannot be responsibly compressed into one static symbol.
    findings:
      - Orientation, construction, invariant or relation, and consequence form a useful bounded visual composition grammar.
  Grammarian:
    status: reviewed
    reviewed_by: Agent Council / Grammarian
    reviewed_at: '2026-08-09'
    obligations:
      - Ensure captions, labels, notation, axes, coordinates, and stated visual semantics agree with the represented mathematics.
    findings:
      - Text must not be used to rescue a picture whose geometry asserts something materially different.
  Amanuensis:
    status: reviewed
    reviewed_by: Agent Council / Amanuensis
    reviewed_at: '2026-08-09'
    obligations:
      - Preserve predecessor identities, audit dispositions, decision records, review provenance, terminology, and the final authoritative integration.
    findings:
      - Existing documentary assets must be superseded explicitly rather than silently overwritten.
  Archivist:
    status: reviewed
    reviewed_by: Agent Council / Archivist
    reviewed_at: '2026-08-09'
    obligations:
      - Distinguish historical witnesses and facsimiles from modern reconstructions and present Programme authority.
    findings:
      - Historical visual style cannot confer documentary provenance on generated reconstruction imagery.
  Mechanist:
    status: reviewed
    reviewed_by: Agent Council / Mechanist
    reviewed_at: '2026-08-09'
    obligations:
      - Retain renderer identity, parameters, source inputs, and output identities when reproducibility is material.
    findings:
      - PNG, WebP, SVG, JPG, PDF, and interactive media are delivery artifacts; reproducible source and renderer records are the operational substrate.
  Typesetter:
    status: reviewed
    reviewed_by: Agent Council / Typesetter
    reviewed_at: '2026-08-09'
    obligations:
      - Apply SVG, raster, PDF, and motion media according to the mathematical representational problem.
    findings:
      - SVG remains appropriate for exact diagrams and overlays, while rich fields, surfaces, three-dimensional scenes, and dynamical processes require a broader production stack.
  Referee:
    status: reviewed
    reviewed_by: Agent Council / Referee
    reviewed_at: '2026-08-09'
    obligations:
      - Require independent visual-semantic and domain-sensitive review of the bounded pilot before any proposal for programme-wide migration.
    findings:
      - The diagnosis supports rejecting SVG-first as policy but does not yet support blanket conversion or full-library migration.

