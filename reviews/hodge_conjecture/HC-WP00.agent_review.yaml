  Experimentalist:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Keep HC-WP03 closed until a bounded exact or falsifying computation is authorized.
    findings:
      - WP00 uses no numerical evidence and does not treat periods as cycle certificates.

  Cartographer:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Keep HC-R021 unselected until WP01, WP02, and prior-art review are integrated.
    findings:
      - The DAG separates definitions, necessary direction, open target, boundary cases, known cases, obstruction nodes, and the target-selection gate.

  Verifier:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - The cycle-map/generator equivalence is correct.
      - The codimension n-1 argument uses hard Lefschetz only as a rational Hodge-structure isomorphism and does not assume an algebraic inverse correspondence.
      - The dimension-at-most-three consequence follows.
      - Programme, Forge, Solve, and Cert workflow runs passed.

  Adversary:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Convert all fifteen seeds into minimized WP01 fixtures.
    findings:
      - Integral, Kahler, projector, Hodge-locus, deformation, numerical, Tate, Chern, Abel-Jacobi, absolute/motivated, generic-fiber, and effectivity drifts are explicitly blocked.
      - Failure of a neighboring formulation is not presented as evidence against rational projective Hodge.

  Formalist:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Implement schema validation and semantic mutation fixtures.
      - Preserve full Hodge/Chow foundations as an explicit gap.
    findings:
      - The MATHCERT lane is bounded to statement identity and conditional abstract logic.
      - Imported continuum geometry remains visible in public proof status.

  Steward:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Permit WP01 and WP02 only.
      - Keep computation, mechanism generation, restricted-target selection, and novelty claims closed.
    findings:
      - Remaining historical and formalization debt is visible and nonblocking.

  Composer:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - The integrated artifact gives the object, obstruction, known boundary, statement lattice, debt, certification route, and next move in order.

  Grammarian:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Reserve algebraic for actual algebraic cycles or independently proved algebraic correspondences.
      - Retain rational Hodge class when rationality is material.
    findings:
      - Classical, integral, generalized, variational, absolute, motivated, standard, and Tate terminology is separated.

  Amanuensis:
    status: reviewed
    reviewed_by: hc-wp00-integration-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Carry the nonblocking provenance and formalization debt into WP01 and WP02.
    findings:
      - Programme PR 68, Forge PR 22, Solve PR 63, and Cert PR 24 are cross-linked and semantically consistent.
      - The authoritative integrated artifact is the WP00 README.
      - No cross-document conflict remains.

  Archivist:
    status: reviewed_with_debt
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Extract Hodge 1950 exact passage and notation concordance.
      - Identify the exact Zucker compact-Kahler appendix locator.
      - Extract Grothendieck 1969 and Tate 1965 theorem bodies with modern conventions.
    findings:
      - Source gaps are visible and are not silently filled from surveys.
      - Deligne's official account controls the operational formulation.

  Mechanist:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Require every future route to construct cycles and prove exact rational cohomology equality.
    findings:
      - Recognition, support, deformation locus, absolute, motivated, or arithmetic invariance alone do not discharge construction.

  Typesetter:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - Degree 2p, bidegree (p,p), codimension p, and dimension n conventions are consistent.

  Referee:
    status: reviewed
    reviewed_by: hc-wp00-referee-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Reopen review if a broader known-case claim or restricted target is proposed.
    findings:
      - Independent reconstruction confirms the canonical rational/projective statement and generator equivalence.
      - Independent reconstruction confirms the p=0,1,n-1,n boundary and dimension-at-most-three result.
      - The dual-divisor proof does not rely on algebraicity of the inverse Lefschetz correspondence.
      - Deligne's official account confirms the integral and Kahler boundaries, Hodge-locus distinction, Hodge nature of Kunneth/inverse-Lefschetz classes, Tate parallel, and absolute/motivated substitute status.
      - No proof, new known case, target, computation, or novelty claim is promoted.

