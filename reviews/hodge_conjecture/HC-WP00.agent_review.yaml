artifact:
  id: HC-WP00
  type: work_package
  title: Source, normalization, and equivalence audit for the Hodge conjecture
  pillar: MATH-PROGRAMME
  status: draft

council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Preserve smooth projective varieties over C and rational coefficients as the canonical profile.
      - Reopen review for any singular, Kahler, arithmetic, integral, or relative formulation.
    findings:
      - The canonical cycle-class map and quantifiers are consistently typed.
      - Rationality, projectivity, codimension, and cycle equivalence are explicit.

  Prospector:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Build the comprehensive higher-dimensional known-case ledger in WP02.
      - Preserve theorem-body-pending audit states.
    findings:
      - Official and primary source families are sufficient for the WP00 statement boundary.
      - Cubic fourfolds are admitted only as a selected special case.

  Experimentalist:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Keep HC-WP03 closed until a bounded falsification or exact-computation question is approved.
    findings:
      - WP00 uses no numerical evidence.
      - Period recognition and symbolic intersection calculations are classified as non-universal evidence.

  Cartographer:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Keep HC-R021 unselected until WP01, WP02, and prior-art review are integrated.
    findings:
      - The DAG separates definitions, easy direction, target, boundary cases, known-case ledger, eleven obstruction nodes, and target-selection gate.

  Verifier:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Recheck JSON/YAML/schema validity and repository policy checks after PR creation.
    findings:
      - The cycle-map/generator equivalence is correct.
      - The codimension n-1 reduction uses hard Lefschetz only as a cohomological Hodge-structure isomorphism and does not assume an algebraic inverse correspondence.
      - The dimension-at-most-three consequence follows.

  Adversary:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Convert all fifteen seeds into minimized WP01 fixtures.
    findings:
      - Integral, Kahler, projector, Hodge-locus, deformation, numerical, Tate, Chern, Abel-Jacobi, absolute/motivated, generic-fiber, and effectivity drifts are explicitly blocked.
      - No failed neighboring formulation is presented as evidence against the rational projective conjecture.

  Formalist:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Implement schema validation and semantic mutation fixtures.
      - Preserve full Hodge/Chow foundations as an explicit gap.
    findings:
      - The MATHCERT schema is bounded to statement identity and abstract conditional logic.
      - Imported continuum geometry cannot be hidden as axioms in public proof counts.

  Steward:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Permit only WP01 and WP02 after full WP00 promotion.
      - Keep computational, mechanism, target, and novelty stages closed.
    findings:
      - The bounded next action is PR validation and final review.
      - Remaining historical and formalization debt is nonblocking if visible.

  Composer:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - The integrated package presents object, obstruction, known boundary, statement lattice, debt, certification route, and next action in sequence.

  Grammarian:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Reserve algebraic for actual algebraic cycles or source-proved algebraic correspondences.
      - Preserve rational Hodge class rather than abbreviating to arbitrary Hodge class when rationality matters.
    findings:
      - Classical, integral, generalized, variational, absolute, motivated, standard, and Tate terminology is separated.

  Amanuensis:
    status: pending
    reviewed_by: null
    reviewed_at: null
    obligations:
      - Verify all cross-pillar links after draft PR numbers exist.
      - Update the artifact ledger and decision record.
      - Record CI evidence and complete final editorial integration.
    findings:
      - Draft artifact bundle is complete enough for consistency review.

  Archivist:
    status: reviewed_with_debt
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Extract Hodge 1950 exact passage and notation concordance.
      - Identify the exact Zucker compact-Kahler appendix locator.
      - Extract Grothendieck 1969 and Tate 1965 theorem bodies with modern conventions.
    findings:
      - Source gaps remain visible and are not silently filled from surveys.
      - Deligne's official account supplies the operational canonical formulation.

  Mechanist:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
      - Require every future mechanism to construct cycles and prove exact cohomology equality.
    findings:
      - Recognition, support, deformation-locus, absolute, motivated, or arithmetic invariance alone do not discharge the construction obligation.

  Typesetter:
    status: reviewed
    reviewed_by: hc-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - Degree 2p, bidegree (p,p), codimension p, and dimension n conventions are consistent.

  Referee:
    status: pending
    reviewed_by: null
    reviewed_at: null
    obligations:
      - Independently reconstruct the statement equivalence and boundary cases.
      - Confirm formulation separations and claim boundary.
      - Review after cross-pillar PRs and CI evidence exist.
    findings: []

