council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Preserve the finite, decidable carrier and the nonempty-support convention in every downstream formulation.
    findings:
      - The package works over a finite universe and a finite family of finite subsets.
      - Union-closure, frequency, support, nontriviality, and abundance are explicit.
      - The appropriate foundational layer is F0 finite and computable, with no choice principle required for the bounded audit.
  Prospector:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Keep lattice, information-theoretic, and exact-certificate routes separated until a proved bridge is recorded.
    findings:
      - The package identifies four productive viewpoints without presenting any as a proof of the conjecture.
  Experimentalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Any extension beyond universe size four requires a separately versioned enumerator output and independent replay.
    findings:
      - Exact enumeration is correctly classified as bounded tooling and finite-domain verification.
  Cartographer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Maintain the dependency DAG in reviews/union_closed/UC-WP01.dependency_dag.yaml.
    findings:
      - Definitions and the nontriviality convention precede the conjecture statement.
      - Literature status and finite replay feed the claim ledger independently.
      - WP02 consumes the definitions, conventions, and audited claim boundary rather than the exploratory narrative.
  Verifier:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Preserve the distinction between raw union-closed-family counts and Frankl-facing nontrivial counts.
      - Recheck source hashes and independent replay before promoting any expanded finite range.
    findings:
      - The exact n <= 4 claim is bounded, reproducible, and does not imply progress on the general conjecture.
      - The package makes no new theorem claim.
  Adversary:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Reject averaging arguments that do not use union-closure at the level required by the claimed frequency conclusion.
      - Reject general-conjecture language inferred from small-universe enumeration.
    findings:
      - False simplicity, finite-range overreach, and conflation of constant lower bounds with the one-half target are explicit failure modes.
  Formalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Keep the Finset representation and any lattice translation connected by explicit correspondence lemmas.
    findings:
      - The formal boundary is a Lean statement of the conjecture plus checked local lemmas and independently replayed finite certificates.
      - WP01 itself remains a status and handoff package rather than a formal proof artifact.
  Steward:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations: []
    findings:
      - The lay companion identifies the object, obstruction, result boundary, and next move without hype.
  Composer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations: []
    findings:
      - The package moves from statement to terrain, viewpoints, finite audit, ledger, failures, and handoff in dependency order.
  Grammarian:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Keep the nontriviality convention explicit whenever the word nontrivial appears.
    findings:
      - Core notation is introduced before use and the half-frequency inequality is stated without ambiguity.
  Amanuensis:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council consistency repair
    reviewed_at: '2026-07-24'
    obligations:
      - Keep the artifact ledger, review record, dependency DAG, claim ledger, authoritative WP01 document, ADR index, schemas, validator scope, and navigation synchronized.
    findings:
      - UC-WP01 is registered as the authoritative completed baseline artifact.
      - ADR-0002 and ADR-0007 record the pilot and the post-pilot contract normalization.
      - Review provenance and cross-document consistency references are complete after the 2026-07-24 repair.
  Archivist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Refresh date-sensitive literature-status claims before republication or external release.
    findings:
      - The package separates literature-derived status claims from computed and formal claims.
  Mechanist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council pilot
    reviewed_at: '2026-07-17'
    obligations:
      - Keep the source enumerator and independent replay implementation separate.
    findings:
      - The package names the executable enumeration, replay, ledger, and Lean handoff artifacts.
  Typesetter:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council consistency repair
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - MkDocs navigation exposes the canonical ADR index and all dedicated Agent Council ADR files.
      - Tables, displayed definitions, and bounded audit counts expose the programme structure adequately.
  Referee:
    status: reviewed
    reviewed_by: MATH-PROGRAMME Agent Council consistency repair
    reviewed_at: '2026-07-24'
    obligations:
      - Require a fresh novelty and source audit before any original theorem claim is attached to the Union-Closed campaign.
    findings:
      - Acceptance is limited to a reliable completed status spine, exact bounded audit, and discharged formalization entry point.
      - The package is not acceptable as evidence that Frankl's conjecture is close to resolution.
      - The corrected CI scope and lifecycle/disposition separation remove the previously identified governance contradictions.
