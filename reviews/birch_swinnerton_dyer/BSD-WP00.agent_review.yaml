artifact:
  id: BSD-WP00
  type: work_package
  title: Foundation, source, normalization, status, and equivalence audit for Birch-Swinnerton-Dyer
  pillar: MATHSOLVE
  status: active
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Preserve rank BSD, Sha finiteness, and the strong leading-term formula as distinct propositions.
    - Do not identify Selmer corank with Mordell-Weil rank without controlling the p-primary Sha term.
    findings:
    - The foundational profile and exact universal quantifier over elliptic curves over Q are explicit.
    - The statement lattice records valid implications and forbidden automatic converses.
  Prospector:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Replace compressed theorem-chain attributions with exact theorem-number records in WP02.
    - Preserve primary, secondary, preprint, and computational source classes.
    findings:
    - The official Wiles statement and current Clay status anchor the campaign.
    - Modern parity, converse, p-part, family, and computational sources are classified by scope.
  Experimentalist:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Treat curve computations as individual certificates or exploration, never as universal evidence.
    findings:
    - WP00 uses no numerical curve experiment.
    - Finite databases, positive proportions, and infinite twist families remain below the universal quantifier.
  Cartographer:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Keep p-adic branches split by reduction type, variable, and exceptional-zero profile.
    - Open restricted-target selection only after WP01 and WP02 promotion.
    findings:
    - The DAG separates analytic existence, Selmer mediation, low-rank theorems, restricted converses, and three open universal
      obligations.
    - Every open cut has an explicit discharge condition.
  Verifier:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Recheck the finite Euler-factor conversion and every corank implication during formal handoff.
    findings:
    - The Selmer exact sequence yields rank plus p-primary Sha corank, not rank alone.
    - Complete and incomplete L-functions are related by finitely many explicit local factors and must not be interchanged
      silently.
  Adversary:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Build WP01 fixtures for parity-to-rank, Selmer-to-rank, one-prime-to-global, and family-to-universal failures.
    findings:
    - The audit blocks root-number, near-zero, exceptional-zero, and hidden-Sha shortcuts.
    - No source is promoted beyond its curve class, prime profile, direction, or quantifier.
  Formalist:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Formalize statement separation, corank algebra, finite-factor order invariance, and functional-equation parity first.
    - Never import BSD itself as an axiom.
    findings:
    - The proposed MATHCERT boundary is useful without requiring a complete arithmetic-geometry library.
    - Deep theorems remain provenance-bearing interfaces.
  Steward:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Permit only WP01 and WP02 after promotion.
    - Keep mechanism generation, novelty claims, and restricted-target selection closed.
    findings:
    - WP00 is substantively complete for review.
    - Repository validation and independent Referee review were completed and no longer block progression.
  Composer:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
    - The package presents the object, obstruction, normalization, theorem frontier, implication boundary, debt, and next
      move in order.
  Grammarian:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Require exact lane labels instead of unqualified claims that BSD has been proved.
    findings:
    - Rank equality, Sha finiteness, strong BSD, p-parts, parity, and family results are linguistically separated.
    - The words equivalent and converse appear only with named hypotheses or exact logical records.
  Amanuensis:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Preserve final PR and workflow evidence in future revisions.
    - Preserve cross-document identifiers and source states in later revisions.
    findings:
    - The master plan, integrated README, audit, lattice, registries, DAG, debt, claim ledger, handoff, and next-step artifact
      agree.
    - No internal conflict was found in the draft bundle.
  Archivist:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Complete exact Gross-Zagier and Kolyvagin theorem concordance.
    - Audit the primary source behind recent full-BSD twist-family claims.
    findings:
    - Primary-source anchors and current-status evidence are recorded.
    - Remaining modern-source provenance gaps are explicit proof debt rather than promoted claims.
  Mechanist:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Require any later higher-rank route to identify the missing exterior-power, determinant, height, or reciprocity-law
      obligation.
    findings:
    - Rank-one distinguished-class mechanisms cannot be extrapolated rhetorically to higher rank.
    - The campaign has not yet selected a mechanism or restricted theorem target.
  Typesetter:
    status: reviewed
    reviewed_by: bsd-wp00-source-audit-agent
    reviewed_at: '2026-07-24'
    obligations:
    - Preserve the central point s=1 and the selected complete-L normalization consistently.
    findings:
    - Local factors, completed L-function, period, regulator, Tamagawa, torsion, and Sha notation are registered consistently.
  Referee:
    status: reviewed
    reviewed_by: independent-bsd-wp00-referee-pass
    reviewed_at: '2026-07-24'
    obligations:
    - Reopen review if a later artifact changes the L-function, period, Selmer, p-adic, or universal-quantifier conventions.
    findings:
    - The complete-versus-incomplete Euler-product concordance preserves order of vanishing and correctly warns that leading
      coefficients require the omitted factors.
    - The Selmer exact-sequence ledger correctly blocks identification of Selmer corank with Mordell-Weil rank without p-primary
      Sha control.
    - The low-rank, parity, restricted-converse, p-part, family, and computational statements retain their exact logical scope.
    - No new theorem, universal converse, Sha-finiteness theorem, or leading-term proof is claimed.
