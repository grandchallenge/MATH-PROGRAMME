council_review:
  Axiomatist:
    status: reviewed
    obligations: []
    findings:
      - The selected proposition is one exact 2-primary valuation identity, not universal or strong BSD.
  Prospector:
    status: reviewed
    obligations: []
    findings:
      - Current primary-source reconstruction retires the unrestricted rank-one converse and multiplicative odd-prime p-part from the open shortlist.
      - CM, explicit twist-family, and modulo-squares 2-primary results do not discharge the selected exact general identity.
  Experimentalist:
    status: reviewed
    obligations: []
    findings:
      - Finite computation is absent from the target premise and cannot support selection truth.
      - LMFDB 53.a1 is used only as a bounded non-vacuity witness.
  Cartographer:
    status: reviewed
    obligations: []
    findings:
      - The proof-obligation DAG exposes local-condition, reciprocity, correction-factor, and valuation-identification cuts.
  Verifier:
    status: reviewed
    obligations: []
    findings:
      - Deterministic replay checks score arithmetic, exactly-one selection, imports, gates, non-vacuity, and adversarial mutations.
  Adversary:
    status: reviewed
    obligations: []
    findings:
      - Universal, truth, finite-data, noncomposable-source, mechanism, non-vacuity-promotion, and one-prime-firewall mutations are rejected.
  Formalist:
    status: reviewed
    obligations: []
    findings:
      - Only composable WP02 interfaces are imported; boundary sources are not treated as assumptions.
  Steward:
    status: reviewed
    obligations: []
    findings:
      - Mechanism generation and novelty claims remain closed; WP05 is eligible but unauthorized.
  Composer:
    status: reviewed
    obligations: []
    findings:
      - Source delta, scorecard, decision, DAG, gate, witness, replay, and workflow form one bounded package.
  Grammarian:
    status: reviewed
    obligations: []
    findings:
      - Selected, unproved, source-boundary, theorem, class-nonempty, and novelty language remain distinct.
  Amanuensis:
    status: reviewed
    obligations: []
    findings:
      - WP01-WP04 identifiers, target status, domain records, and claim boundary are internally aligned.
  Archivist:
    status: reviewed
    obligations: []
    findings:
      - No novelty, priority, or first-proof claim is introduced.
  Mechanist:
    status: reviewed
    obligations: []
    findings:
      - The package identifies obligations but proposes no attack mechanism.
  Typesetter:
    status: reviewed
    obligations: []
    findings:
      - Complete-L, period, regulator, Tamagawa, torsion, and ord_2 notation are explicit.
  Referee:
    status: reviewed
    obligations: []
    findings:
      - Independent reconstruction confirms the current source frontier, nonempty curve class, score ordering, bounded conclusion, and fail-closed proof DAG.
      - BSD-R2-A1 is suitable for selection while remaining explicitly unproved and non-novelty-bearing.

