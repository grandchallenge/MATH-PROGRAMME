council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: pc-wp00-foundation-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Preserve explicit connectedness, compactness, boundary, and category conventions.
      - Discharge exact Top/PL/Diff source extraction in PC-WP02.
    findings:
      - Canonical topological and smooth statements are separated.
      - The dimension-three category bridge is visible.
      - Simple connectivity discharges orientability without Poincare.

  Prospector:
    status: reviewed
    reviewed_by: pc-wp00-source-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Build the versioned Perelman, Morgan-Tian, and Kleiner-Lott crosswalk.
    findings:
      - Official status, primary preprints, and reconstruction sources are distinguished.
      - Perelman's surgery-paper correction notice is preserved.

  Experimentalist:
    status: reviewed
    reviewed_by: pc-wp00-boundary-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Do not open numerical evidence work for the solved theorem.
    findings:
      - WP00 uses no numerical evidence.
      - Machine work is limited to delimited certification slices.

  Cartographer:
    status: reviewed
    reviewed_by: pc-wp00-dag-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Keep PC-WP03 closed until WP01/WP02 integration.
    findings:
      - The DAG separates category, analysis, surgery, extinction, terminal topology, and stronger routes.
      - Forbidden shortcut edges are explicit.

  Verifier:
    status: reviewed
    reviewed_by: pc-wp00-verification-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Reconstruct analytic hypotheses, parameters, and consumers in PC-WP02.
    findings:
      - The Ricci-flow core is represented only by theorem interfaces.
      - The terminal free-product argument is valid conditional on the connected-sum classification.
      - Finite extinction is not used without topology bookkeeping.

  Adversary:
    status: reviewed
    reviewed_by: pc-wp00-adversarial-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Build WP01 fixtures for the listed semantic shortcuts and circular routes.
    findings:
      - Poincare, elliptization, geometrization, and finite extinction are not called equivalent.
      - The terminal argument does not assume every simply connected prime is S3.
      - The formalization handoff does not package the conclusion as an axiom.

  Formalist:
    status: reviewed
    reviewed_by: pc-wp00-formalization-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Begin with finite factor-expression discharge and malformed-history fixtures.
      - Keep geometric theorems as provenance-bearing imports.
    findings:
      - The first MATHCERT target is properly delimited.
      - A syntactic group surrogate must be labeled as such.

  Steward:
    status: reviewed
    reviewed_by: pc-wp00-stage-gate-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Permit only PC-WP01 and PC-WP02 after WP00.
      - Require Referee integration before PC-WP03.
    findings:
      - Remaining debt is nonblocking for the next audit stage but blocking for source-completeness claims.
      - Solved theorem status is distinct from programme reconstruction completeness.

  Composer:
    status: reviewed
    reviewed_by: pc-wp00-editorial-pass
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - The package presents object, obstruction, routes, sources, DAG, debt, certification boundary, and next action in order.

  Grammarian:
    status: reviewed
    reviewed_by: pc-wp00-semantic-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Use theorem for current status and conjecture only historically.
      - Reserve equivalent for the dimension-three category formulations.
    findings:
      - Solved, imported, audited, proved-in-package, pending, and prohibited claims are separated.

  Amanuensis:
    status: reviewed
    reviewed_by: pc-wp00-integration-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Preserve node identifiers and debt references in WP01/WP02.
      - Add the final PR to review provenance after creation.
    findings:
      - Master plan, README, status, audit, DAG, debt, claim ledger, handoff, and next step are consistent.
      - Hodge remains Domain 03 and ADR-0004; Poincare is Domain 04 and ADR-0005.

  Archivist:
    status: reviewed
    reviewed_by: pc-wp00-archive-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Extract exact theorem locations for category, prime-decomposition, and Hamilton-Perelman sources.
      - Build the correction and divergence log.
    findings:
      - Primary, reconstruction, foundational, and precursor sources have distinct tiers.
      - Source completeness is explicitly pending.

  Mechanist:
    status: reviewed
    reviewed_by: pc-wp00-mechanism-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Expose the necessity of each analytic mechanism before proof compression.
    findings:
      - The operative chain is non-collapsing, singularity models, canonical neighbourhoods, surgery, and extinction.
      - Smooth-rounding folklore is rejected.

  Typesetter:
    status: reviewed
    reviewed_by: pc-wp00-typesetting-pass
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - Category labels, fundamental groups, quotients, and connected sums are consistently presented.

  Referee:
    status: reviewed
    reviewed_by: independent-pc-wp00-referee-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Reopen review for source-completeness, full-certification, or stronger-route equivalence claims.
      - Require WP01/WP02 integration before PC-WP03.
    findings:
      - The challenge is properly posed as reconstruction of a solved theorem.
      - The implication/equivalence matrix is sound at theorem-interface level.
      - The finite-extinction route is non-circular as normalized.
      - No new theorem or independent analytic verification is claimed.

