artifact:
  id: PC-WP00
  type: work_package
  title: Source, normalization, equivalence, and non-circularity audit for the Poincare theorem reconstruction
  pillar: MATHSOLVE
  status: promoted

council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: pc-wp00-foundation-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Preserve explicit connectedness, compactness, boundary, and category conventions.
      - Discharge the exact Top/PL/Diff theorem extraction in PC-WP02.
    findings:
      - The canonical topological and smooth statements are correctly separated.
      - The dimension-three category bridge is visible rather than hidden inside the choice of a metric.
      - Simple connectivity discharges orientability without invoking Poincare.

  Prospector:
    status: reviewed
    reviewed_by: pc-wp00-source-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Build a versioned theorem crosswalk among Perelman, Morgan-Tian, and Kleiner-Lott.
      - Preserve the correction notice in Perelman's surgery paper.
    findings:
      - Official status, Milnor statement, the three Perelman preprints, and Morgan-Tian headline theorems are identified.
      - Historical and reconstruction sources are not conflated with primary proof sources.

  Experimentalist:
    status: reviewed
    reviewed_by: pc-wp00-boundary-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Do not open numerical evidence work for the solved theorem.
    findings:
      - WP00 uses no computation as mathematical evidence.
      - The only proposed machine work is certification of delimited logical and combinatorial slices.

  Cartographer:
    status: reviewed
    reviewed_by: pc-wp00-dag-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Keep PC-WP03 closed until WP01 and WP02 integration.
    findings:
      - The DAG separates category, analysis, surgery, extinction, terminal topology, and stronger implication routes.
      - Forbidden shortcut edges are recorded.

  Verifier:
    status: reviewed
    reviewed_by: pc-wp00-verification-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Reconstruct exact analytic hypotheses, parameters, and theorem consumers in PC-WP02.
    findings:
      - WP00 makes only theorem-interface claims for the Ricci-flow core.
      - The terminal free-product argument is valid conditional on the cited connected-sum classification.
      - Finite extinction is not used without the surgery-topology ledger.

  Adversary:
    status: reviewed
    reviewed_by: pc-wp00-adversarial-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Build PC-WP01 fixtures for homology-sphere substitution, Whitehead-manifold substitution, boundary suppression, smooth-flow-through-singularity, extinction without bookkeeping, and circular prime-factor discharge.
    findings:
      - The audit does not call Poincare, elliptization, geometrization, and finite extinction equivalent.
      - The terminal argument avoids assuming every simply connected prime factor is S3.
      - The formalization handoff does not package the final theorem as an axiom.

  Formalist:
    status: reviewed
    reviewed_by: pc-wp00-formalization-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Begin with the finite factor-expression discharge and malformed-history fixtures.
      - Keep every geometric theorem as a provenance-bearing unformalized import.
    findings:
      - The first MATHCERT target is delimited and cannot be mistaken for full Ricci-flow formalization.
      - A syntactic surrogate must be labeled as such if group free-product infrastructure is unavailable.

  Steward:
    status: reviewed
    reviewed_by: pc-wp00-stage-gate-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Permit only PC-WP01 and PC-WP02 after WP00.
      - Require Referee integration before PC-WP03.
    findings:
      - Remaining proof debt is nonblocking for the next audit stages but blocking for a source-complete reconstruction claim.
      - The solved theorem status and incomplete programme-reconstruction status coexist without contradiction.

  Composer:
    status: reviewed
    reviewed_by: pc-wp00-editorial-pass
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - The package presents object, obstruction, route hierarchy, source audit, theorem DAG, debt, certification boundary, and next move in sequence.

  Grammarian:
    status: reviewed
    reviewed_by: pc-wp00-semantic-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Use theorem rather than conjecture when describing current status.
      - Reserve equivalent for the dimension-three category formulations, not the stronger theorem routes.
    findings:
      - Solved, imported, audited, proved-in-package, pending, and prohibited claims are linguistically separated.

  Amanuensis:
    status: reviewed
    reviewed_by: pc-wp00-integration-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Preserve cross-document node identifiers and proof-debt references in WP01/WP02.
      - Update the artifact ledger and decision record with the final PR reference.
    findings:
      - Master plan, README, audit, status record, DAG, debt register, claim ledger, certification handoff, and next-step record are internally consistent.

  Archivist:
    status: reviewed
    reviewed_by: pc-wp00-archive-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Extract exact theorem locations for Moise/Munkres, Kneser-Milnor, and the Hamilton-Perelman chain.
      - Build the source correction and divergence log.
    findings:
      - Primary sources, detailed reconstructions, foundational topology, and precursor geometry are assigned distinct source tiers.
      - Source completeness is explicitly pending.

  Mechanist:
    status: reviewed
    reviewed_by: pc-wp00-mechanism-pass
    reviewed_at: '2026-07-24'
    obligations:
      - In WP02, expose why each analytic mechanism is needed before permitting proof compression.
    findings:
      - The operative chain is non-collapsing, singularity models, canonical neighbourhoods, surgery, and finite extinction.
      - The package rejects the false mechanism summary that Ricci flow simply rounds every metric smoothly.

  Typesetter:
    status: reviewed
    reviewed_by: pc-wp00-typesetting-pass
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - Topological, PL, smooth, and dynamical formulations use stable labels.
      - Fundamental groups, quotient groups, and connected-sum notation are consistently presented.

  Referee:
    status: reviewed
    reviewed_by: independent-pc-wp00-referee-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Reopen review if a later artifact claims source completeness, full analytic certification, or equivalence of the stronger routes.
      - Require PC-WP01 and PC-WP02 integration before surgery-bookkeeping promotion.
    findings:
      - The corrected challenge is properly posed as reconstruction of a solved theorem.
      - The implication/equivalence matrix is sound at the stated theorem-interface level.
      - The direct finite-extinction route is non-circular as normalized.
      - The remaining debts are visible and appropriately assigned.
      - No new theorem or independent analytic verification is claimed.

