council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: pc-wp03-foundation-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Keep the orientable Poincare profile separate from the general no-locally-separating-RP2 profile.
      - Preserve the imported event and extinction assumptions in every derivative theorem.
    findings:
      - Separating and nonseparating transitions have distinct equations.
      - The twisted bundle is excluded only by the orientable profile, not deleted from the general source theorem.

  Prospector:
    status: reviewed
    reviewed_by: pc-wp03-source-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Complete quotation-level Perelman II and Kleiner-Lott locations in PC03-D001.
    findings:
      - Morgan-Tian Theorem 0.3, Proposition 15.3, and Corollary 15.4 govern the committed event algebra.
      - RP3#RP3 and both S2-bundle types remain visible where the source requires them.

  Experimentalist:
    status: reviewed
    reviewed_by: pc-wp03-fixture-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Integrate the standard-library validator into repository CI.
    findings:
      - Two positive and twelve malformed histories pass their expected outcomes.
      - No numerical simulation is used as topology evidence.

  Cartographer:
    status: reviewed
    reviewed_by: pc-wp03-dag-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Preserve PC03-D000 through PC03-C011 node identities in WP04.
    findings:
      - The DAG separates imported event existence, finite-history logic, reconstruction, normalization, and terminal discharge.
      - Forbidden shortcut edges include extinction-to-conclusion and discreteness-to-finiteness.

  Verifier:
    status: reviewed
    reviewed_by: pc-wp03-proof-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Reopen review if reconstruction equations or factor classes change.
    findings:
      - Reverse induction is finite and every changed component has one reconstruction equation.
      - The Poincare discharge uses only the independently obtained factor list and van Kampen group profiles.

  Adversary:
    status: reviewed
    reviewed_by: pc-wp03-adversarial-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Add mutation fixtures when the schema gains a new transition type.
    findings:
      - Source omission, component loss, ancestry collision, orientation drift, and finite-history overreach are executable failures.
      - A nonseparating cut cannot silently lose the S2-bundle factor.

  Formalist:
    status: reviewed
    reviewed_by: pc-wp03-formalization-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Execute the bounded WP04 evaluator-soundness handoff.
      - Do not name an opaque analytic axiom as though it were a formalized theorem.
    findings:
      - The schema/validator boundary and proof-kernel boundary are explicit.
      - RP3#RP3 is normalized rather than retained as an unexplained primitive.

  Steward:
    status: reviewed
    reviewed_by: pc-wp03-stage-gate-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Limit the next stage to bounded formalization and certificate replay.
    findings:
      - WP03 closes all transferred entry obligations from WP01/WP02.
      - Remaining debt blocks stronger claims but not conditional topology-certificate promotion.

  Composer:
    status: reviewed
    reviewed_by: pc-wp03-editorial-pass
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - The package proceeds from schema to transition semantics, ancestry, proof, adversarial tests, debt, and formalization handoff.

  Grammarian:
    status: reviewed
    reviewed_by: pc-wp03-semantic-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Preserve the adjective conditional whenever the WP03 certificate is named.
    findings:
      - Event existence, event validity, and event consequences are linguistically distinct.
      - Discrete, locally finite, finite, extinct, discarded, and vanished are not used interchangeably.

  Amanuensis:
    status: reviewed
    reviewed_by: pc-wp03-integration-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Register the final PR and CI run after creation.
    findings:
      - WP00, WP01, WP02, WP03, the master plan, claim ledgers, and decision records use consistent theorem identifiers.
      - Transferred debts PC-WP01-D004, PC-WP02-D006, PC-WP02-D009, and event-level PC-WP02-D010 are discharged or reclassified explicitly.

  Archivist:
    status: reviewed
    reviewed_by: pc-wp03-archive-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Discharge PC03-D001 with pinned cross-edition theorem locations.
    findings:
      - The governing topology statements are attached to exact Morgan-Tian theorem identifiers and pages.
      - Source correction debt does not alter the committed transition classes.

  Mechanist:
    status: reviewed
    reviewed_by: pc-wp03-mechanism-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Keep cap metric quality outside the topology validator.
    findings:
      - The schema captures the topological mechanism of cuts, caps, discards, and reverse connected sums.
      - It does not infer the geometric existence of a valid neck or cap.

  Typesetter:
    status: reviewed
    reviewed_by: pc-wp03-typesetting-pass
    reviewed_at: '2026-07-24'
    obligations: []
    findings:
      - Pre/post slices, component identifiers, factor identifiers, and connected-sum equations are consistently rendered.

  Referee:
    status: reviewed
    reviewed_by: independent-pc-wp03-referee-pass
    reviewed_at: '2026-07-24'
    obligations:
      - Reopen review for any claim of analytic verification, full proof formalization, or source-complete Perelman concordance.
    findings:
      - The finite event schema is exact enough to support deterministic validation.
      - The backward reconstruction and terminal group discharge are non-circular.
      - The certificate is correctly conditional on imported surgery and extinction interfaces.
      - PC-WP04 may proceed within the bounded formalization contract.

