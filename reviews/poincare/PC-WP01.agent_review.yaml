      - campaigns/poincare_reconstruction/WP02_HAMILTON_PERELMAN_LEDGER/04_SOURCE_NORMALIZED_THEOREMS.md
      - campaigns/poincare_reconstruction/WP02_HAMILTON_PERELMAN_LEDGER/06_DEPENDENCY_DAG.json
