    owner: Archivist
    description: Add quotation-level sources for the two historical counterexamples.
    severity: low
    blocking: false
  - id: PC-WP01-REV-002
    owner: Cartographer
    description: Bind topology mutation guards to the PC-WP03 event schema.
    severity: high
    blocking: true
promotion:
  ready_for_next_stage: true
  blockers: []
  certification_route: Promote jointly with PC-WP02; open PC-WP03 only after the event-schema debt is transferred explicitly.
