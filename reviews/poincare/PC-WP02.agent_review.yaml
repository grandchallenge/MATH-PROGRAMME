artifact:
  id: PC-WP02
  type: work_package
  title: Source-normalized Hamilton-Perelman theorem ledger
  pillar: MATHSOLVE
  status: integration_ready_at_theorem_interface_level
council_review:
  Axiomatist:
    status: reviewed
    obligations:
      - Complete quotation-level Top/PL/Diff and extinction-hypothesis source extraction.
    findings:
      - Category, orientability, topology-class, and group hypotheses are explicit.
      - The simply connected extinction bridge avoids assuming Poincare.
  Prospector:
    status: reviewed
    obligations:
      - Pin the exact Perelman and Kleiner-Lott versions before quotation-level certification.
    findings:
      - Primary, detailed-reconstruction, and foundational source tiers are separated.
      - The finite-extinction lane is correctly sourced to P-III and Morgan-Tian rather than Kleiner-Lott.
  Experimentalist:
    status: reviewed
    obligations:
      - Keep numerical Ricci-flow work outside the proof-support route.
    findings:
      - WP02 contains no numerical evidence and authorizes none.
  Cartographer:
    status: reviewed
    obligations:
      - Implement the PC-WP03 event graph with complete component ancestry.
    findings:
      - Nineteen theorem interfaces form an acyclic chain from category bridge to topological conclusion.
      - Forbidden shortcut edges are explicit.
  Verifier:
    status: reviewed
    obligations:
      - Complete constant-level ledgers for the analytic and finite-extinction inequalities before any independent-verification claim.
    findings:
      - Hypotheses, conclusions, consumers, source tiers, and boundaries are present for every theorem interface.
      - Finite extinction is not consumed directly as the Poincare conclusion.
  Adversary:
    status: reviewed
    obligations:
      - Re-run WP01 guards against every future theorem-statement refinement.
    findings:
      - All applicable PC-FP guards are attached to the theorem DAG.
      - Source drift, local/global scope, surgery topology, and formalization overclaim are blocked.
  Formalist:
    status: reviewed
    obligations:
      - Formalize only the finite history and terminal factor-expression slices first.
    findings:
      - The MATHCERT handoff keeps geometric existence as an explicit imported contract.
      - Malformed-history fixtures are specified.
  Steward:
    status: reviewed
    obligations:
      - Open PC-WP03 only with the topology-event and source-version obligations as inherited inputs.
    findings:
      - WP02 is promotable at theorem-interface reconstruction level.
      - Analytic proof debt blocks independent-verification language but not topology-bookkeeping work.
  Composer:
    status: reviewed
    obligations: []
    findings:
      - The package moves from sources to parameters, theorem interfaces, extinction, debt, and certification in dependency order.
  Grammarian:
    status: reviewed
    obligations:
      - Preserve AUDITED_IMPORT and PROVED_IN_PACKAGE distinctions.
    findings:
      - All-time, smooth, local-finite, finite-history, and extinction language is separated.
  Amanuensis:
    status: reviewed
    obligations:
      - Register WP02 after stacked PR integration and preserve the source-correction ledger.
    findings:
      - Source ledger, crosswalk, parameter registry, theorem ledger, extinction ledger, DAG, debt, claims, handoff, and next step are consistent.
      - WP01 guards and WP02 consumers agree.
  Archivist:
    status: reviewed
    obligations:
      - Complete PC-WP02-D001, D002, D008, and D010.
    findings:
      - P-II corrections govern superseded P-I assertions.
      - Morgan-Tian and Kleiner-Lott are not conflated with primary attribution.
  Mechanist:
    status: reviewed
    obligations:
      - Expand the surgery induction and width inequalities at constant level in later analytic ledgers.
    findings:
      - Noncollapsing, singularity models, canonical neighbourhoods, standard caps, surgery, and extinction are assigned distinct roles.
      - The parameter order prevents a fictitious single-parameter surgery mechanism.
  Typesetter:
    status: reviewed
    obligations: []
    findings:
      - Symbols and source identifiers are stable across the package.
      - Schematic formulas are labeled as schematic rather than exact source quotations.
  Referee:
    status: reviewed
    obligations:
      - Reopen review if the package is called an independent proof or full formalization.
      - Require the PC-WP03 event schema to inherit every topology and source-version obligation.
    findings:
      - The ledger is source-faithful at its declared theorem-interface level.
      - The correction boundary and finite-extinction route are correctly normalized.
      - WP02 is suitable for joint promotion with WP01.
