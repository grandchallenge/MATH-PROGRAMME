observations:
- observation_id: OBS-001
  category: real_subject_selection
  statement: TCM-C72-INTERFACE-001 predates this P04 pilot, was executed through a 64-shard exact computation over 329 frozen inputs, and was protected-merged after scientific and independent PR review; no experiment was created to fill criterion 8.
- observation_id: OBS-002
  category: p04_coverage
  statement: The existing source package supports all eleven P04 emphasis areas. Plot provenance is explicitly not applicable because no plot is part of or relied upon by the protected result.
- observation_id: OBS-003
  category: negative_evidence
  statement: The supplement retains 162, 163, and 177 oracle failures for the three algebras and does not collapse the finite comparisons into a superiority claim.
- observation_id: OBS-004
  category: uncertainty_boundary
  statement: Exact finite counts have no sampling uncertainty within the frozen corpus, while generalization to C90, other corpora, channels, code families, hardware, or asymptotic regimes remains unestablished.
- observation_id: OBS-005
  category: defect
  defect_id: P04-D001
  severity: documentation_reproducibility
  statement: The execution workflow used mutable ubuntu-latest. Python and action revisions were pinned, and host size was non-scientific, but an immutable original runner-image identity is not preserved in the durable source package.
  effect: Exact environment reconstruction is partial; no change is made to the original result and no stronger reproducibility claim is allowed.
- observation_id: OBS-006
  category: claim_boundary_preservation
  statement: All nine negative claim-boundary fields in the durable result receipt are preserved, together with the manifest's additional prohibitions on autonomous search and corpus/semiring tuning.
- observation_id: OBS-007
  category: status_boundary_preservation
  statement: The supplement keeps candidate_executable_not_promoted separate from the finite scientific adjudication C72_TCM_SHARED_DECODER_INTERFACE_CERTIFIED, preventing certification language from becoming artifact-promotion language.
- observation_id: OBS-008
  category: burden
  statement: The P04 application adds a bounded ten-file candidate pilot package, one governed contract test, and updates two incumbent discovery/test-manifest surfaces. No scientific source, workflow, result, artifact, or QUANTUM repository byte is changed.
- observation_id: OBS-009
  category: measured_burden_limit
  statement: Repository objects and review surfaces are measurable; operator minutes, reviewer minutes, compute cost attributable to this retrospective P04 communication pass, and counterfactual communication-error rates are UNKNOWN_NOT_MEASURED and are not invented.
known_deficits:
- Exact immutable runner-image identity for the original ubuntu-latest execution is not durably preserved.
- The P04 pilot does not reproduce the 64-shard scientific computation; it validates communication against already-protected source evidence.
- No controlled study estimates whether P04 reduces reader error or review time.
- G8/G9 for this candidate supplement remain deferred; the source experiment's independent PR approval does not transfer as a GCL-TCS promotion disposition.
