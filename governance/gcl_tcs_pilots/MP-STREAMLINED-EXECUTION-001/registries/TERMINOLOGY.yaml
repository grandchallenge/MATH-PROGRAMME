terms:
- term: routine bounded work
  meaning: Work already within delegated scope that does not cross a material mathematical, certification, security, provenance, constitutional, external-claim, or otherwise reserved authority boundary.
- term: material evidence closure
  meaning: The governed changed bytes, directly consumed protected artifacts, relevant validators/schemas/workflows/toolchain/policy bytes, and declared authority/claim scope that can affect a transition's conclusion.
- term: unrelated repository movement
  meaning: A protected-main change outside the candidate's material evidence closure that neither creates a material conflict nor changes a relevant authority or claim boundary.
- term: unchanged attestation reuse
  meaning: Satisfaction of an unaffected expensive required lane by verified protected content identity instead of unnecessary material replay.
- term: reserved boundary
  meaning: A transition requiring specialist, independent, or expressly reserved authority rather than routine delegated execution.
- term: non-author reviewer
  meaning: A reviewer who did not author the material content whose independent verification is required.
- term: protected readback
  meaning: Inspection of the protected repository state after merge to establish the admitted result without creating a second approval cycle.
- term: fail closed
  meaning: When material dependency or authority impact is ambiguous, block the unsafe narrow interpretation and route the smallest defensible conservative affected set.