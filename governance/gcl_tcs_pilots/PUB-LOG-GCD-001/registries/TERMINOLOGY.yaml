terms:
- term: positive semidefinite
  meaning: Every finite real Gram quadratic form for K(m,n)=log(gcd(m,n)) on the stated positive-natural domain is nonnegative; this does not imply strict positive definiteness.
- term: certified
  meaning: The stated Lean declaration has passed the protected repository-native certification/replay route recorded by the LOG-GCD source package.
- term: audited
  meaning: A governed review supports the stated interpretation or boundary, but the status is distinct from a certified formal theorem.
- term: published
  meaning: The governed public visibility gate has passed for the fixed public claim set; publication does not alter mathematical certification or canonical claim state.
- term: public claim set
  meaning: The exact certified claims C001 and C003 admitted by the publication manifest for public presentation.
- term: boundary claim set
  meaning: The exact audited constraints C004 and C005 that limit strictness, novelty, and priority descriptions.
- term: Finsupp realization
  meaning: The formally defined finitely supported divisor-coordinate feature map; it is not a separate claim of a completed l2(N) construction.
- term: priority not established
  meaning: Available evidence does not justify a first-proof, first-feature, or first-formalization claim; absence of a located earlier public artifact is not proof of priority.
- term: authority inflation by paraphrase
  meaning: A public explanation represents a source as stronger, broader, more novel, or more authoritative than the protected source evidence supports.