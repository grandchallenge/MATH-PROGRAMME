registry_id: TERM-LOG-GCD-TCS-001
artifact_id: LOG-GCD-001-TCS-PILOT-001
terms:
- term: positive semidefinite
  meaning: For every finite family in the stated positive-natural domain and every real coefficient family, the associated finite quadratic form is nonnegative; this does not imply strict positive definiteness.
- term: finite-Gram sense
  meaning: Kernel positivity is expressed through nonnegativity of every finite Gram quadratic form rather than by a separately formalized completed Hilbert-space construction.
- term: certified
  meaning: The exact Lean declaration is backed by the existing protected repository-native replay/certification evidence recorded by LOG-GCD-001.
- term: audited
  meaning: A governed interpretation, boundary, or literature-derived determination has been reviewed but is distinct from a certified formal theorem.
- term: Finsupp realization
  meaning: The divisor feature map has type ℕ →₀ ℝ, so finite support is formal and explicit; this is not itself a separate theorem constructing completed ℓ²(ℕ).
- term: source lock
  meaning: The immutable upstream repository, commit, formal-file blob, dependency manifest, licence, Lean toolchain, and mathlib revision used to provenance the adapted fixture.
- term: replay evidence
  meaning: Immutable workflow and environment evidence supporting the existing certification; reuse of unchanged replay identity is not a new certificate.
- term: formal/informal boundary
  meaning: Lean declarations carry mechanized theorem content, while explanatory prose, kernel interpretation, prior-art conclusions, and communication mappings retain their separately recorded statuses.
- term: priority not established
  meaning: The evidence does not justify a first-proof, first-feature, or first-formalization claim; failure to locate an earlier public artifact is not proof of priority.
- term: mathematical authority inflation
  meaning: Treating prose, CI success, publication, MATH-CORE representation, or communication conformance as if it strengthened a theorem, proof, certification, or canonical claim status.
