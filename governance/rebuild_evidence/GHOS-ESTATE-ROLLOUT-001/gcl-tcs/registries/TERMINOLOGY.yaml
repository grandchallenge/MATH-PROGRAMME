registry_id: GHOS-DOC-TERMS-001
artifact_id: GHOS-ESTATE-ROLLOUT-001-DOC-001
version: 0.1.0
date: '2026-09-02'
status: candidate
terms:
- term: GHOS_ESTATE_CONFORMANCE_GREEN
  definition: The terminal estate disposition stating that the frozen active estate
    has one governed terminal repository disposition per member and zero unexplained
    applicable routing/control gaps at the recorded material state.
  permitted_aliases:
  - estate green
  prohibited_inference: Does not mean future repository state is automatically conformant
    or that any mathematical, certification, publication, production, or commercial
    claim is authorized.
- term: GHOS_ROUTING_ENFORCED
  definition: Repository terminal disposition indicating candidate-independent routing
    enforcement is protected and required for the repository's applicable direct workflow
    estate, with governed proof/readback recorded.
  permitted_aliases:
  - routing enforced
  prohibited_inference: Does not certify workflow business logic or grant the controller
    new institutional authority.
- term: candidate-independent enforcement
  definition: Routing enforcement whose trusted implementation is obtained from protected
    or immutable bytes rather than executed from candidate-controlled implementation
    bytes.
  permitted_aliases: []
  prohibited_inference: Does not mean candidate content is trusted.
- term: material-object-bound evidence
  definition: Evidence remains valid across unrelated repository movement when the
    workflow, controller, enforcement, protection, consumer-pin, and merge-compatibility
    objects to which it is bound remain unchanged.
  permitted_aliases:
  - material evidence binding
  prohibited_inference: Does not permit ignoring changes to a material control object.
- term: persistent controller
  definition: An admitted controller capable of durable wake, durable state, recovery,
    stale-evidence rejection, and governed execution for workflows whose topology
    is not bounded atomic.
  permitted_aliases: []
  prohibited_inference: Capability does not imply constitutional, mathematical, certification,
    publication, production, or commercial authority.
- term: workflow routing coverage mismatch
  definition: Deterministic gate failure raised when the registered workflow path
    set does not exactly equal the actual sorted direct workflow inventory.
  permitted_aliases: []
  prohibited_inference: A hostile-probe occurrence is expected enforcement evidence,
    not a protected-repository failure.
- term: protected readback
  definition: Post-merge or post-administration re-fetch of the protected object used
    to verify that the intended exact state is live and no unrelated governed semantics
    changed.
  permitted_aliases: []
  prohibited_inference: A pre-merge candidate snapshot is not a protected readback.
- term: independent review
  definition: A review by a reviewer who is not the sole authoring system for the
    exact revision and whose disposition is durably recorded.
  permitted_aliases:
  - Referee review
  prohibited_inference: Machine-assisted self-checks G0 through G7 are not independent
    review.
- term: reviewed_terminal
  definition: Claim status used in this supplement for a bounded governance/control
    result already admitted on protected state with recorded review and readback.
  permitted_aliases: []
  prohibited_inference: Does not mean scientifically universal, mathematically proved,
    or permanently true under future state changes.
