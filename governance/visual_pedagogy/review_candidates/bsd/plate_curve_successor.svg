"/></g><circle cx="682.9" cy="507.5" r="10" fill="#fff2a9" stroke="#a84b3e" stroke-width="3"/><circle cx="682.9" cy="1182.5" r="7" fill="#fff2a9" opacity=".55"/><text x="690" y="505" font-family="Georgia" font-size="22" fill="#fff8e8">E₅ : y² = x³ − 25x</text><text x="690" y="545" font-family="Arial" font-size="16" font-weight="700" fill="#e4c678">P = (25/4, 75/8)</text><path d="M805 700H895" stroke="#bd913a" stroke-width="5"/><polygon points="895,700 875,688 875,712" fill="#bd913a"/><rect x="850" y="445" width="240" height="480" rx="18" fill="#fffaf0" stroke="#bd913a" stroke-width="2"/><text x="970" y="490" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#bd913a">EXACT TRIANGLE</text><path d="M895 780H1050L895 545Z" fill="#dbe9ec" stroke="#315f7a" stroke-width="5"/><path d="M895 750H925V780" fill="none" stroke="#bd913a" stroke-width="4"/><text x="972" y="815" text-anchor="middle" font-family="Georgia" font-size="19" fill="#07182f">3/2</text><text x="875" y="675" text-anchor="middle" font-family="Georgia" font-size="19" fill="#07182f" transform="rotate(-90 875 675)">20/3</text><text x="997" y="635" text-anchor="middle" font-family="Georgia" font-size="19" fill="#07182f" transform="rotate(-56 997 635)">41/6</text><text x="970" y="865" text-anchor="middle" font-family="Georgia" font-size="22" font-weight="700" fill="#557b64">Area = 5</text><text x="970" y="897" text-anchor="middle" font-family="Georgia" font-size="15" fill="#776f62">½·(3/2)·(20/3)=5</text><rect x="145" y="1100" width="910" height="210" rx="14" fill="#fffaf0" stroke="#bd913a" stroke-width="2"/><text x="600" y="1140" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#bd913a">ONE ARITHMETIC OBJECT · TWO VIEWS</text><text x="600" y="1190" text-anchor="middle" font-family="Georgia" font-size="21" fill="#07182f">The point is exact. The triangle is exact. The plotted window is finite.</text><text x="600" y="1230" text-anchor="middle" font-family="Georgia" font-size="19" font-style="italic" fill="#776f62">Finding a rational point opens the door; it does not certify the whole Mordell–Weil group.</text><text x="600" y="1275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#a84b3e">NO RANK OR BSD CLAIM IS MADE BY THE PLOT</text><line x1="150" y1="1450" x2="1050" y2="1450" stroke="#bd913a"/><text x="600" y="1487" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2" fill="#776f62">DATA-DERIVED PEDAGOGICAL PLATE · NOT PROOF AUTHORITY</text></svg>