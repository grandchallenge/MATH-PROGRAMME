<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">A Rational Point Opens a Door</title><desc id="d">A deterministic plot of E5, y squared equals x cubed minus 25x, highlights P equals 25 over 4 comma 75 over 8 and connects it to an exact rational right triangle of area five.</desc><defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#fff8e8"/><stop offset="1" stop-color="#e6d2aa"/></linearGradient><linearGradient id="n" x2="1" y2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#214d69"/></linearGradient><radialGradient id="g"><stop stop-color="#ffe9a0" stop-opacity=".8"/><stop offset="1" stop-color="#bd913a" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dy="10" stdDeviation="10" flood-opacity=".28"/></filter><clipPath id="plot"><rect x="125" y="365" width="680" height="670" rx="20"/></clipPath></defs><rect width="1200" height="1600" fill="#07182f"/><rect x="20" y="20" width="1160" height="1560" rx="8" fill="none" stroke="#bd913a" stroke-width="3"/><rect x="70" y="75" width="1060" height="1450" rx="18" fill="url(#p)" stroke="#bd913a" stroke-width="3" filter="url(#s)"/><text x="600" y="130" text-anchor="middle" font-family="Arial" font-size="17" letter-spacing="5" fill="#07182f">GRAND CHALLENGE LABS</text><text x="600" y="190" text-anchor="middle" font-family="Arial" font-size="18" letter-spacing="3" fill="#bd913a">BIRCH–SWINNERTON-DYER · PLATE I</text><text x="600" y="250" text-anchor="middle" font-family="Georgia" font-size="48" fill="#07182f">A Rational Point Opens a Door</text><text x="600" y="302" text-anchor="middle" font-family="Georgia" font-size="22" font-style="italic" fill="#776f62">One exact witness joins a cubic curve to an ancient question about area.</text><rect x="125" y="365" width="680" height="670" rx="20" fill="url(#n)" stroke="#bd913a" stroke-width="3"/><circle cx="480" cy="680" r="260" fill="url(#g)"/><line x1="150" y1="845" x2="780" y2="845" strok