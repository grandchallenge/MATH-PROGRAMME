<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">BSD theorem frontier — Batch-2 review candidate</title>
<desc id="desc">A six-row status matrix labels Mordell-Weil finite generation, modularity, and analytic-rank-zero-or-one terrain as established, while universal rank equality, universal finiteness of Tate-Shafarevich, and the complete complex leading-term formula are labelled open.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}
.h1{font-size:34px;font-weight:700} .h2{font-size:22px;font-weight:700}
.body{font-size:19px} .small{font-size:16px} .tiny{font-size:14px}
.mono{font-family:"DejaVu Sans Mono",monospace;font-size:17px}
.box{fill:white;stroke:#222;stroke-width:2} .soft{fill:#f2f2f2;stroke:#444;stroke-width:2}
.open{fill:white;stroke:#222;stroke-width:2;stroke-dasharray:9 7}
.line{stroke:#222;stroke-width:2;fill:none} .arrow{stroke:#222;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
.sep{stroke:#777;stroke-width:1.5} .label{font-size:15px;font-weight:700;letter-spacing:1px}
</style>
<rect width="1200" height="900" fill="white"/>

<text x="40" y="55" class="h1">BSD theorem frontier: exact scope, not coastline metaphor</text>
<text x="40" y="92" class="body">Each row states whether the mathematical terrain is established or still open, with its quantifier or hypothesis visible.</text>
<text x="80" y="160" class="label">CLAIM</text>
<text x="665" y="160" class="label">STATUS</text>
<text x="820" y="160" class="label">SCOPE / QUALIFIER</text>
<rect x="55" y="196" width="1090" height="62" rx="8" class="soft"/><text x="80" y="230" class="body">Mordell-Weil finite generation</text><text x="665" y="230" class="label">ESTABLISHED</text><text x="820" y="230" class="small">all elliptic curves over Q</text><rect x="55" y="274" width="1090" height="62" rx="8" class="soft"/><text x="80" y="308" class="body">Modularity / analytic continuation</text><text x="665" y="308" class="label">ESTABLISHED</text><text x="820" y="308" class="small">all elliptic curves over Q</text><rect x="55" y="352" width="1090" height="62" rx="8" class="soft"/><text x="80" y="386" class="body">analytic rank 0 or 1 terrain</text><text x="665" y="386" class="label">ESTABLISHED</text><text x="820" y="386" class="small">rank equality + finite Sha</text><rect x="55" y="430" width="1090" height="62" rx="8" class="open"/><text x="80" y="464" class="body">universal rank equality</text><text x="665" y="464" class="label">OPEN</text><text x="820" y="464" class="small">all analytic ranks</text><rect x="55" y="508" width="1090" height="62" rx="8" class="open"/><text x="80" y="542" class="body">universal finiteness of Sha</text><text x="665" y="542" class="label">OPEN</text><text x="820" y="542" class="small">general case</text><rect x="55" y="586" width="1090" height="62" rx="8" class="open"/><text x="80" y="620" class="body">complete complex leading-term formula</text><text x="665" y="620" class="label">OPEN</text><text x="820" y="620" class="small">general case + conventions</text>
<text x="55" y="735" class="small">"Analytic rank 0 or 1" is deliberately bounded; it is not silently extrapolated to higher rank.</text>
<text x="55" y="770" class="small">Database evidence, parity, Selmer bounds, family averages, and p-adic results do not by themselves settle the universal complex statement.</text>

<text x="40" y="872" class="small">Review candidate · documentary exposition only · visual_is_evidence: false</text>
</svg>
