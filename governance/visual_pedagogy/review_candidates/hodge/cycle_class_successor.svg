<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">From Subvarieties to Classes</title><desc id="desc">A literary exact/schematic composition of the rational cycle-class map from codimension-p algebraic cycles to H^{2p}(X,Q) ∩ H^{p,p}(X), showing that algebraic cycles yield Hodge classes while the general rational converse remains conjectural.</desc><defs>
      <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset=".58" stop-color="#102d4c"/><stop offset="1" stop-color="#07182F"/></linearGradient>
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8E8"/><stop offset=".48" stop-color="#F5EBD5"/><stop offset="1" stop-color="#E4D0A9"/></linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#FFF1B6" stop-opacity=".95"/><stop offset=".42" stop-color="#E4C678" stop-opacity=".45"/><stop offset="1" stop-color="#BD913A" stop-opacity="0"/></radialGradient>
      <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#204C6C"/><stop offset=".45" stop-color="#547F99"/><stop offset="1" stop-color="#9AB8C7"/></linearGradient>
      <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D6A0"/><stop offset="1" stop-color="#B7843D"/></linearGradient>
      <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFF8E8" stroke-opacity=".18" stroke-width="1"/></pattern>
      
    </defs><rect x="0" y="0" width="1200" height="1600" rx="0" fill="url(#night)" opacity="1"/><rect x="18" y="18" width="1164" height="1564" rx="8" fill="none" stroke="#BD913A" stroke-width="3" opacity="1"/><rect x="34" y="34" width="1132" height="1532" rx="0" fill="none" stroke="#E4C678" stroke-width="1" opacity="1"/><g transform="translate(48 48) scale(1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 48) scale(-1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(48 1552) scale(1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 1552) scale(-1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><rect x="70" y="76" width="1060" height="1448" rx="18" fill="url(#paper)" stroke="#BD913A" stroke-width="3" opacity="1" filter="url(#shadow)"/><rect x="70" y="76" width="1060" height="1448" rx="0" fill="#000" opacity="0.04" filter="url(#paperNoise)"/><text x="600" y="128" text-anchor="middle" fill="#07182F" font-family="Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" opacity="1" style="">GRAND CHALLENGE LABS</text><line x1="355" y1="150" x2="845" y2="150" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="188" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3" opacity="1" style="">HODGE · PLATE III</text><text x="600" y="248" text-anchor="middle" fill="#07182F" font-family="Georgia, Times New Roman, serif" font-size="48" font-weight="600" letter-spacing="0" opacity="1" style="">From Subvarieties to Classes</text><line x1="180" y1="282" x2="1020" y2="282" stroke="#E4C678" stroke-width="2" opacity="1"/><text x="600" y="318" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" letter-spacing="0" opacity="1" style="font-style:italic;">Geometry leaves a shadow in cohomology.</text><text x="600" y="346" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="400" letter-spacing="0" opacity="1" style="font-style:italic;">The conjecture asks how much of that shadow comes back.</text><circle cx="310" cy="680" r="230" fill="url(#halo)" opacity="0.55"/><ellipse cx="310" cy="680" rx="210" ry="145" fill="url(#ocean)" stroke="#07182F" stroke-width="4" opacity="0.96" transform="rotate(-12 310 680)" filter="url(#shadow)"/><path d="M145 690 C220 600 355 595 470 670" fill="none" stroke="#E4C678" stroke-width="6" opacity="0.95"/><path d="M175 755 C255 690 370 700 445 755" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.75"/><ellipse cx="310" cy="680" rx="78" ry="145" fill="none" stroke="#FFF9EC" stroke-width="2" opacity="0.65" transform="rotate(-12 310 680)"/><text x="310" y="930" text-anchor="middle" fill="#07182F" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="700" letter-spacing="0" opacity="1" style="">codimension-p algebraic cycles</text><line x1="505" y1="690" x2="675" y2="690" stroke="#BD913A" stroke-width="5" opacity="1"/><polygon points="675,690 661.3,698.2 661.3,681.8" fill="#BD913A" opacity="1"/><text x="590.0" y="670.0" text-anchor="middle" fill="#BD913A" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" letter-spacing="0" opacity="1" style="">clᵖ</text><text x="590" y="740" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" opacity="1" style="">cycle-class map</text><rect x="710" y="475" width="350" height="430" rx="18" fill="url(#night)" stroke="#BD913A" stroke-width="3" opacity="0.98" filter="url(#shadow)"/><ellipse cx="885" cy="690" rx="145" ry="150" fill="#756482" stroke="#E4C678" stroke-width="3" opacity="0.38"/><ellipse cx="885" cy="690" rx="105" ry="110" fill="#4F7796" stroke="#FFF9EC" stroke-width="2" opacity="0.36"/><text x="885" y="625" text-anchor="middle" fill="#FFF9EC" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700" letter-spacing="0" opacity="1" style="">H²ᵖ(X,Q)</text><path d="M845 700 Q885 660 925 700" fill="none" stroke="#E4C678" stroke-width="4" opacity="0.95"/><text x="885" y="720" text-anchor="middle" fill="#E4C678" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0" opacity="1" style="">intersection</text><text x="885" y="748" text-anchor="middle" fill="#FFF9EC" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700" letter-spacing="0" opacity="1" style="">Hᵖ,ᵖ(X)</text><text x="885" y="842" text-anchor="middle" fill="#E4C678" font-family="Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0" opacity="1" style="">rational Hodge classes</text><rect x="145" y="1050" width="425" height="150" rx="10" fill="#FFF9EC" stroke="#557B64" stroke-width="2" opacity="0.92"/><text x="163" y="1080" text-anchor="start" fill="#557B64" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">ESTABLISHED DIRECTION</text><text x="163" y="1110" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">Algebraic cycles produce</text><text x="163" y="1135" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">classes of Hodge type (p,p),</text><text x="163" y="1160" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">with rational coefficients.</text><rect x="630" y="1050" width="425" height="150" rx="10" fill="#FFF9EC" stroke="#A84B3E" stroke-width="2" opacity="0.92"/><text x="648" y="1080" text-anchor="start" fill="#A84B3E" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">OPEN BOUNDARY</text><text x="648" y="1110" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">Does every rational Hodge</text><text x="648" y="1135" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">class arise from algebraic</text><text x="648" y="1160" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">cycles?  CONJECTURAL.</text><text x="600" y="1260" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" opacity="1" style="">THE MAP MAY FORGET GEOMETRY</text><circle cx="430" cy="1325" r="24" fill="#86A9C0" stroke="#07182F" stroke-width="2" opacity="0.7"/><line x1="452" y1="1325" x2="690" y2="1325" stroke="#BD913A" stroke-width="1" opacity="1"/><polygon points="690,1325 676.3,1333.2 676.3,1316.8" fill="#BD913A" opacity="1"/><circle cx="500" cy="1325" r="24" fill="#86A9C0" stroke="#07182F" stroke-width="2" opacity="0.7"/><line x1="522" y1="1325" x2="690" y2="1325" stroke="#BD913A" stroke-width="1" opacity="1"/><polygon points="690,1325 676.3,1333.2 676.3,1316.8" fill="#BD913A" opacity="1"/><circle cx="570" cy="1325" r="24" fill="#86A9C0" stroke="#07182F" stroke-width="2" opacity="0.7"/><line x1="592" y1="1325" x2="690" y2="1325" stroke="#BD913A" stroke-width="1" opacity="1"/><polygon points="690,1325 676.3,1333.2 676.3,1316.8" fill="#BD913A" opacity="1"/><circle cx="720" cy="1325" r="34" fill="#756482" stroke="#07182F" stroke-width="2" opacity="0.7"/><text x="600" y="1385" text-anchor="middle" fill="#07182F" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" letter-spacing="0" opacity="1" style="font-style:italic;">The visual teaches direction and information loss — not general surjectivity.</text><line x1="155" y1="1452" x2="1045" y2="1452" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="1485" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">PEDAGOGICAL PLATE · NOT PROOF OR CERTIFICATION AUTHORITY</text></svg>