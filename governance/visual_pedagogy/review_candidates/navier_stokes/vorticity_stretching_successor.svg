<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Energy Guards; Vorticity Stretches</title><desc id="desc">A literary three-dimensional schematic of vortex stretching: a short thick tube becomes longer and thinner along a strain direction while the vorticity equation and global energy identity remain visually separate. It is not a numerical simulation or singularity claim.</desc><defs>
      <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset=".58" stop-color="#102d4c"/><stop offset="1" stop-color="#07182F"/></linearGradient>
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8E8"/><stop offset=".48" stop-color="#F5EBD5"/><stop offset="1" stop-color="#E4D0A9"/></linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#FFF1B6" stop-opacity=".95"/><stop offset=".42" stop-color="#E4C678" stop-opacity=".45"/><stop offset="1" stop-color="#BD913A" stop-opacity="0"/></radialGradient>
      <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#204C6C"/><stop offset=".45" stop-color="#547F99"/><stop offset="1" stop-color="#9AB8C7"/></linearGradient>
      <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D6A0"/><stop offset="1" stop-color="#B7843D"/></linearGradient>
      <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFF8E8" stroke-opacity=".18" stroke-width="1"/></pattern>
      
    </defs><rect x="0" y="0" width="1200" height="1600" rx="0" fill="url(#night)" opacity="1"/><rect x="18" y="18" width="1164" height="1564" rx="8" fill="none" stroke="#BD913A" stroke-width="3" opacity="1"/><rect x="34" y="34" width="1132" height="1532" rx="0" fill="none" stroke="#E4C678" stroke-width="1" opacity="1"/><g transform="translate(48 48) scale(1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 48) scale(-1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(48 1552) scale(1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 1552) scale(-1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><rect x="70" y="76" width="1060" height="1448" rx="18" fill="url(#paper)" stroke="#BD913A" stroke-width="3" opacity="1" filter="url(#shadow)"/><rect x="70" y="76" width="1060" height="1448" rx="0" fill="#000" opacity="0.04" filter="url(#paperNoise)"/><text x="600" y="128" text-anchor="middle" fill="#07182F" font-family="Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" opacity="1" style="">GRAND CHALLENGE LABS</text><line x1="355" y1="150" x2="845" y2="150" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="188" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3" opacity="1" style="">NAVIER–STOKES · PLATE II</text><text x="600" y="248" text-anchor="middle" fill="#07182F" font-family="Georgia, Times New Roman, serif" font-size="48" font-weight="600" letter-spacing="0" opacity="1" style="">Energy Guards; Vorticity Stretches</text><line x1="180" y1="282" x2="1020" y2="282" stroke="#E4C678" stroke-width="2" opacity="1"/><text x="600" y="322" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" letter-spacing="0" opacity="1" style="font-style:italic;">The difficulty is not that energy has no law. It is that three dimensions have a stretching term.</text><rect x="130" y="385" width="940" height="690" rx="18" fill="url(#night)" stroke="#BD913A" stroke-width="3" opacity="0.98" filter="url(#shadow)"/><path d="M165 450 C330 426 420 474 560 450 C700 426 820 474 1035 450" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 502 C330 471 420 533 560 502 C700 471 820 533 1035 502" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 554 C330 516 420 592 560 554 C700 516 820 592 1035 554" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 606 C330 582 420 630 560 606 C700 582 820 630 1035 606" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 658 C330 627 420 689 560 658 C700 627 820 689 1035 658" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 710 C330 672 420 748 560 710 C700 672 820 748 1035 710" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 762 C330 738 420 786 560 762 C700 738 820 786 1035 762" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 814 C330 783 420 845 560 814 C700 783 820 845 1035 814" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 866 C330 828 420 904 560 866 C700 828 820 904 1035 866" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 918 C330 894 420 942 560 918 C700 894 820 942 1035 918" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><path d="M165 970 C330 939 420 1001 560 970 C700 939 820 1001 1035 970" fill="none" stroke="#86A9C0" stroke-width="1.5" opacity="0.22"/><ellipse cx="355" cy="725" rx="145" ry="82" fill="url(#ocean)" stroke="#E4C678" stroke-width="3" opacity="0.95" transform="rotate(-18 355 725)" filter="url(#shadow)"/><ellipse cx="225" cy="765" rx="34" ry="78" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.55" transform="rotate(-18 225 765)"/><ellipse cx="485" cy="685" rx="34" ry="78" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.55" transform="rotate(-18 485 685)"/><text x="355" y="890" text-anchor="middle" fill="#FFF9EC" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="700" letter-spacing="0" opacity="1" style="">shorter · thicker</text><ellipse cx="790" cy="695" rx="220" ry="55" fill="url(#ocean)" stroke="#E4C678" stroke-width="3" opacity="0.95" transform="rotate(-18 790 695)" filter="url(#shadow)"/><ellipse cx="585" cy="760" rx="25" ry="53" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.6" transform="rotate(-18 585 760)"/><ellipse cx="995" cy="630" rx="25" ry="53" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.6" transform="rotate(-18 995 630)"/><text x="790" y="890" text-anchor="middle" fill="#FFF9EC" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="700" letter-spacing="0" opacity="1" style="">longer · thinner</text><line x1="520" y1="805" x2="930" y2="655" stroke="#A84B3E" stroke-width="5" opacity="1"/><polygon points="930,655 920.0,667.5 914.3,652.0" fill="#A84B3E" opacity="1"/><text x="725.0" y="708.0" text-anchor="middle" fill="#A84B3E" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" letter-spacing="0" opacity="1" style="">stretching direction</text><text x="265" y="635" text-anchor="middle" fill="#E4C678" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" letter-spacing="0" opacity="1" style="">ω</text><text x="870" y="590" text-anchor="middle" fill="#E4C678" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" opacity="1" style="">|ω| increases in the schematic</text><rect x="150" y="1130" width="440" height="165" rx="12" fill="#FFF9EC" stroke="#BD913A" stroke-width="2" opacity="0.95"/><text x="370" y="1170" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">LOCAL VORTICITY DYNAMICS</text><text x="370" y="1220" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="600" letter-spacing="0" opacity="1" style="">∂tω + (u·∇)ω</text><text x="370" y="1253" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="600" letter-spacing="0" opacity="1" style="">= (ω·∇)u + νΔω</text><rect x="610" y="1130" width="440" height="165" rx="12" fill="#FFF9EC" stroke="#557B64" stroke-width="2" opacity="0.95"/><text x="830" y="1170" text-anchor="middle" fill="#557B64" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">GLOBAL ENERGY GUARD</text><text x="830" y="1220" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="600" letter-spacing="0" opacity="1" style="">½‖u(t)‖²₂ + ν∫‖∇u‖²₂</text><text x="830" y="1253" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="600" letter-spacing="0" opacity="1" style="">= ½‖u(0)‖²₂</text><rect x="150" y="1330" width="900" height="82" rx="10" fill="#FFF9EC" stroke="#A84B3E" stroke-width="2" opacity="0.92"/><text x="168" y="1360" text-anchor="start" fill="#A84B3E" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">BOUNDARY</text><text x="168" y="1390" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">The tube geometry is schematic. No finite-time blowup, cascade, or continuum solution is claimed.</text><line x1="155" y1="1452" x2="1045" y2="1452" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="1485" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">PEDAGOGICAL PLATE · NOT PROOF OR CERTIFICATION AUTHORITY</text></svg>