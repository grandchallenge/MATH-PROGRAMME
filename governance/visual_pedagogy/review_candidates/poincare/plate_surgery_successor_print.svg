<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">The Craft of Controlled Surgery</title><desc id="desc">A literary schematic of controlled Ricci-flow surgery: a three-dimensional neck modeled on S² × I is recognized, cut on two spherical cross-sections, excised, capped, and recorded. It does not certify a valid surgery event.</desc><defs>
      <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset=".58" stop-color="#102d4c"/><stop offset="1" stop-color="#07182F"/></linearGradient>
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8E8"/><stop offset=".48" stop-color="#F5EBD5"/><stop offset="1" stop-color="#E4D0A9"/></linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#FFF1B6" stop-opacity=".95"/><stop offset=".42" stop-color="#E4C678" stop-opacity=".45"/><stop offset="1" stop-color="#BD913A" stop-opacity="0"/></radialGradient>
      <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#204C6C"/><stop offset=".45" stop-color="#547F99"/><stop offset="1" stop-color="#9AB8C7"/></linearGradient>
      <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D6A0"/><stop offset="1" stop-color="#B7843D"/></linearGradient>
      <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFF8E8" stroke-opacity=".18" stroke-width="1"/></pattern>
      
    </defs><rect x="0" y="0" width="1200" height="1600" rx="0" fill="url(#night)" opacity="1"/><rect x="18" y="18" width="1164" height="1564" rx="8" fill="none" stroke="#BD913A" stroke-width="3" opacity="1"/><rect x="34" y="34" width="1132" height="1532" rx="0" fill="none" stroke="#E4C678" stroke-width="1" opacity="1"/><g transform="translate(48 48) scale(1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 48) scale(-1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(48 1552) scale(1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 1552) scale(-1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><rect x="70" y="76" width="1060" height="1448" rx="18" fill="url(#paper)" stroke="#BD913A" stroke-width="3" opacity="1" filter="url(#shadow)"/><rect x="70" y="76" width="1060" height="1448" rx="0" fill="#000" opacity="0.04" filter="url(#paperNoise)"/><text x="600" y="128" text-anchor="middle" fill="#07182F" font-family="Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" opacity="1" style="">GRAND CHALLENGE LABS</text><line x1="355" y1="150" x2="845" y2="150" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="188" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3" opacity="1" style="">POINCARÉ · PLATE III</text><text x="600" y="248" text-anchor="middle" fill="#07182F" font-family="Georgia, Times New Roman, serif" font-size="48" font-weight="600" letter-spacing="0" opacity="1" style="">The Craft of Controlled Surgery</text><line x1="180" y1="282" x2="1020" y2="282" stroke="#E4C678" stroke-width="2" opacity="1"/><text x="600" y="322" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" letter-spacing="0" opacity="1" style="font-style:italic;">Surgery is not arbitrary cutting. It is a theorem-governed transaction with a receipt.</text><text x="260" y="395" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">1 · RECOGNIZE</text><text x="600" y="395" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">2 · CUT</text><text x="940" y="395" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">3 · CAP + CONTINUE</text><circle cx="260" cy="670" r="170" fill="url(#halo)" opacity="0.45"/><path d="M110 600 C155 485 225 505 260 590 C295 505 365 485 410 600 L410 745 C365 860 295 840 260 755 C225 840 155 860 110 745 Z" fill="url(#ocean)" stroke="#07182F" stroke-width="4" opacity="1" filter="url(#shadow)"/><ellipse cx="260" cy="675" rx="46" ry="95" fill="none" stroke="#E4C678" stroke-width="4" opacity="0.9" stroke-dasharray="10 8"/><text x="260" y="835" text-anchor="middle" fill="#07182F" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" letter-spacing="0" opacity="1" style="">S² × I neck</text><path d="M450 600 C492 505 548 520 575 592 L575 750 C548 828 492 842 450 745 Z" fill="url(#ocean)" stroke="#07182F" stroke-width="4" opacity="1" filter="url(#shadow)"/><path d="M750 600 C708 505 652 520 625 592 L625 750 C652 828 708 842 750 745 Z" fill="url(#ocean)" stroke="#07182F" stroke-width="4" opacity="1" filter="url(#shadow)"/><ellipse cx="570" cy="673" rx="27" ry="93" fill="none" stroke="#A84B3E" stroke-width="5" opacity="0.95" stroke-dasharray="12 8"/><ellipse cx="630" cy="673" rx="27" ry="93" fill="none" stroke="#A84B3E" stroke-width="5" opacity="0.95" stroke-dasharray="12 8"/><rect x="582" y="565" width="36" height="220" rx="0" fill="#F5EBD5" opacity="0.9"/><text x="600" y="855" text-anchor="middle" fill="#A84B3E" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="700" letter-spacing="0" opacity="1" style="">controlled neck removed</text><path d="M790 600 C825 525 875 532 900 610 L900 740 C875 815 825 820 790 744 C820 720 838 686 838 672 C838 650 820 625 790 600 Z" fill="url(#ocean)" stroke="#07182F" stroke-width="4" opacity="1" filter="url(#shadow)"/><path d="M1090 600 C1055 525 1005 532 980 610 L980 740 C1005 815 1055 820 1090 744 C1060 720 1042 686 1042 672 C1042 650 1060 625 1090 600 Z" fill="url(#ocean)" stroke="#07182F" stroke-width="4" opacity="1" filter="url(#shadow)"/><path d="M790 600 Q865 672 790 744" fill="url(#warm)" stroke="#557B64" stroke-width="4" opacity="1"/><path d="M1090 600 Q1015 672 1090 744" fill="url(#warm)" stroke="#557B64" stroke-width="4" opacity="1"/><text x="940" y="835" text-anchor="middle" fill="#557B64" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="700" letter-spacing="0" opacity="1" style="">standard-cap models</text><line x1="420" y1="675" x2="442" y2="675" stroke="#BD913A" stroke-width="3" opacity="1"/><polygon points="442,675 428.3,683.2 428.3,666.8" fill="#BD913A" opacity="1"/><line x1="758" y1="675" x2="782" y2="675" stroke="#BD913A" stroke-width="3" opacity="1"/><polygon points="782,675 768.3,683.2 768.3,666.8" fill="#BD913A" opacity="1"/><rect x="155" y="925" width="890" height="280" rx="14" fill="#FFF9EC" stroke="#BD913A" stroke-width="2" opacity="0.95"/><text x="600" y="970" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" opacity="1" style="">THE EVENT LEDGER</text><circle cx="245" cy="1040" r="25" fill="#07182F" opacity="1"/><text x="245" y="1048" text-anchor="middle" fill="#FFF9EC" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0" opacity="1" style="">01</text><text x="245" y="1090" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" opacity="1" style="">which sphere?</text><circle cx="440" cy="1040" r="25" fill="#07182F" opacity="1"/><text x="440" y="1048" text-anchor="middle" fill="#FFF9EC" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0" opacity="1" style="">02</text><text x="440" y="1090" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" opacity="1" style="">separating?</text><circle cx="635" cy="1040" r="25" fill="#07182F" opacity="1"/><text x="635" y="1048" text-anchor="middle" fill="#FFF9EC" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0" opacity="1" style="">03</text><text x="635" y="1090" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" opacity="1" style="">which caps?</text><circle cx="830" cy="1040" r="25" fill="#07182F" opacity="1"/><text x="830" y="1048" text-anchor="middle" fill="#FFF9EC" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0" opacity="1" style="">04</text><text x="830" y="1090" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" opacity="1" style="">what survives?</text><circle cx="985" cy="1040" r="25" fill="#07182F" opacity="1"/><text x="985" y="1048" text-anchor="middle" fill="#FFF9EC" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0" opacity="1" style="">05</text><text x="985" y="1090" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" opacity="1" style="">reverse equation</text><text x="600" y="1150" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="600" letter-spacing="0" opacity="1" style="">Topology changes. Bookkeeping is what makes the change mathematically legible.</text><rect x="120" y="1245" width="390" height="118" rx="10" fill="#FFF9EC" stroke="#4F7796" stroke-width="2" opacity="0.92"/><text x="138" y="1275" text-anchor="start" fill="#4F7796" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">IMPORTED THEOREM INTERFACE</text><text x="138" y="1305" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">Canonical-neighbourhood and</text><text x="138" y="1330" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">surgery-scale hypotheses remain external.</text><rect x="690" y="1245" width="390" height="118" rx="10" fill="#FFF9EC" stroke="#A84B3E" stroke-width="2" opacity="0.92"/><text x="708" y="1275" text-anchor="start" fill="#A84B3E" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">CLAIM BOUNDARY</text><text x="708" y="1305" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">This plate does not certify</text><text x="708" y="1330" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">that surgery is permissible.</text><line x1="155" y1="1452" x2="1045" y2="1452" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="1485" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">PEDAGOGICAL PLATE · NOT PROOF OR CERTIFICATION AUTHORITY</text></svg>