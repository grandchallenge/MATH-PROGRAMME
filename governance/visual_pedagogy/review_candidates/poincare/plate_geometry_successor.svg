<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">When Geometry Becomes an Engine</title><desc id="desc">A literary schematic of metric evolution under Ricci flow. A single imagined landscape changes through three time states while curvature concentration is separately encoded; the image is not a numerical Ricci-flow solution.</desc><defs>
      <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset=".58" stop-color="#102d4c"/><stop offset="1" stop-color="#07182F"/></linearGradient>
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8E8"/><stop offset=".48" stop-color="#F5EBD5"/><stop offset="1" stop-color="#E4D0A9"/></linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#FFF1B6" stop-opacity=".95"/><stop offset=".42" stop-color="#E4C678" stop-opacity=".45"/><stop offset="1" stop-color="#BD913A" stop-opacity="0"/></radialGradient>
      <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#204C6C"/><stop offset=".45" stop-color="#547F99"/><stop offset="1" stop-color="#9AB8C7"/></linearGradient>
      <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D6A0"/><stop offset="1" stop-color="#B7843D"/></linearGradient>
      <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFF8E8" stroke-opacity=".18" stroke-width="1"/></pattern>
      
    </defs><rect x="0" y="0" width="1200" height="1600" rx="0" fill="url(#night)" opacity="1"/><rect x="18" y="18" width="1164" height="1564" rx="8" fill="none" stroke="#BD913A" stroke-width="3" opacity="1"/><rect x="34" y="34" width="1132" height="1532" rx="0" fill="none" stroke="#E4C678" stroke-width="1" opacity="1"/><g transform="translate(48 48) scale(1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 48) scale(-1 1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(48 1552) scale(1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><g transform="translate(1152 1552) scale(-1 -1)" fill="none" stroke="#BD913A" stroke-width="2"><path d="M0 28Q0 0 28 0M8 28Q8 9 28 8"/><circle cx="18" cy="18" r="3" fill="#E4C678"/></g><rect x="70" y="76" width="1060" height="1448" rx="18" fill="url(#paper)" stroke="#BD913A" stroke-width="3" opacity="1" filter="url(#shadow)"/><rect x="70" y="76" width="1060" height="1448" rx="0" fill="#000" opacity="0.04" filter="url(#paperNoise)"/><text x="600" y="128" text-anchor="middle" fill="#07182F" font-family="Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" opacity="1" style="">GRAND CHALLENGE LABS</text><line x1="355" y1="150" x2="845" y2="150" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="188" text-anchor="middle" fill="#BD913A" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3" opacity="1" style="">POINCARÉ · PLATE II</text><text x="600" y="248" text-anchor="middle" fill="#07182F" font-family="Georgia, Times New Roman, serif" font-size="48" font-weight="600" letter-spacing="0" opacity="1" style="">When Geometry Becomes an Engine</text><line x1="180" y1="282" x2="1020" y2="282" stroke="#E4C678" stroke-width="2" opacity="1"/><text x="600" y="322" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="400" letter-spacing="0" opacity="1" style="font-style:italic;">A metric is not scenery laid on a world. It is the world’s changing fabric.</text><circle cx="600" cy="700" r="360" fill="url(#halo)" opacity="0.65"/><path d="M160 860 C230 670 335 560 445 600 C515 475 650 470 720 585 C805 540 930 625 1038 850 C910 1020 770 1050 600 1015 C430 1055 275 1025 160 860 Z" fill="url(#ocean)" stroke="#07182F" stroke-width="5" opacity="1" filter="url(#shadow)"/><path d="M205 825 C310 735 345 690 435 705 C520 622 625 612 700 690 C790 650 905 720 1000 840" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.92"/><path d="M210 885 C330 815 420 790 505 810 C590 745 690 750 770 812 C850 785 930 820 995 880" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.72"/><path d="M280 955 C390 900 505 890 600 920 C700 885 810 900 910 955" fill="none" stroke="#FFF9EC" stroke-width="3" opacity="0.6"/><path d="M340 610 C270 710 400 835 340 995" fill="none" stroke="#E4C678" stroke-width="1" opacity="0.45"/><path d="M480 610 C410 710 540 835 480 995" fill="none" stroke="#E4C678" stroke-width="1" opacity="0.45"/><path d="M600 610 C530 710 660 835 600 995" fill="none" stroke="#E4C678" stroke-width="1" opacity="0.45"/><path d="M720 610 C650 710 780 835 720 995" fill="none" stroke="#E4C678" stroke-width="1" opacity="0.45"/><path d="M860 610 C790 710 920 835 860 995" fill="none" stroke="#E4C678" stroke-width="1" opacity="0.45"/><circle cx="820" cy="690" r="105" fill="url(#halo)" opacity="0.95"/><circle cx="820" cy="690" r="34" fill="#A84B3E" opacity="0.55"/><circle cx="820" cy="690" r="60" fill="none" stroke="#A84B3E" stroke-width="3" opacity="0.9"/><text x="835" y="650" text-anchor="start" fill="#A84B3E" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0" opacity="1" style="">curvature</text><text x="835" y="672" text-anchor="start" fill="#A84B3E" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0" opacity="1" style="">concentration</text><text x="188" y="1080" text-anchor="start" fill="#BD913A" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">THE MOVING METRIC</text><line x1="190" y1="1120" x2="1000" y2="1120" stroke="#BD913A" stroke-width="3" opacity="1"/><circle cx="250" cy="1120" r="10" fill="#BD913A" opacity="1"/><text x="250" y="1160" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" letter-spacing="0" opacity="1" style="">t₀</text><text x="250" y="1187" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="400" letter-spacing="0" opacity="1" style="">chosen metric</text><circle cx="600" cy="1120" r="10" fill="#BD913A" opacity="1"/><text x="600" y="1160" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" letter-spacing="0" opacity="1" style="">t₁</text><text x="600" y="1187" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="400" letter-spacing="0" opacity="1" style="">geometry evolves</text><circle cx="950" cy="1120" r="10" fill="#BD913A" opacity="1"/><text x="950" y="1160" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" letter-spacing="0" opacity="1" style="">t₂</text><text x="950" y="1187" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="400" letter-spacing="0" opacity="1" style="">local scale sharpens</text><line x1="270" y1="1120" x2="580" y2="1120" stroke="#BD913A" stroke-width="2" opacity="1"/><polygon points="580,1120 566.3,1128.2 566.3,1111.8" fill="#BD913A" opacity="1"/><line x1="620" y1="1120" x2="930" y2="1120" stroke="#BD913A" stroke-width="2" opacity="1"/><polygon points="930,1120 916.3,1128.2 916.3,1111.8" fill="#BD913A" opacity="1"/><rect x="360" y="1230" width="480" height="92" rx="18" fill="#FFF9EC" stroke="#BD913A" stroke-width="2" opacity="0.94"/><text x="600" y="1270" text-anchor="middle" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" letter-spacing="0" opacity="1" style="">d g/dt = -2 Ric(g)</text><text x="600" y="1300" text-anchor="middle" fill="#776F62" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="400" letter-spacing="0" opacity="1" style="font-style:italic;">the metric itself evolves</text><rect x="115" y="350" width="280" height="125" rx="10" fill="#FFF9EC" stroke="#4F7796" stroke-width="2" opacity="0.92"/><text x="133" y="380" text-anchor="start" fill="#4F7796" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">SCALE MICROSCOPE</text><text x="133" y="410" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">Large curvature means</text><text x="133" y="435" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">small geometric scale.</text><rect x="805" y="350" width="280" height="125" rx="10" fill="#FFF9EC" stroke="#A84B3E" stroke-width="2" opacity="0.92"/><text x="823" y="380" text-anchor="start" fill="#A84B3E" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" opacity="1" style="">BOUNDARY</text><text x="823" y="410" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">No depicted surface is</text><text x="823" y="435" text-anchor="start" fill="#182033" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="400" letter-spacing="0" opacity="1" style="">a computed solution.</text><rect x="118" y="1357" width="107" height="34" rx="16" fill="#FFF9EC" stroke="#BD913A" stroke-width="1" opacity="0.95"/><text x="131" y="1380" text-anchor="start" fill="#BD913A" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" opacity="1" style="">SCHEMATIC</text><rect x="858" y="1357" width="206" height="34" rx="16" fill="#FFF9EC" stroke="#557B64" stroke-width="1" opacity="0.95"/><text x="871" y="1380" text-anchor="start" fill="#557B64" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" opacity="1" style="">MEMORABLE TRUE MODEL</text><line x1="155" y1="1452" x2="1045" y2="1452" stroke="#BD913A" stroke-width="1" opacity="1"/><text x="600" y="1485" text-anchor="middle" fill="#776F62" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" opacity="1" style="">PEDAGOGICAL PLATE · NOT PROOF OR CERTIFICATION AUTHORITY</text></svg>