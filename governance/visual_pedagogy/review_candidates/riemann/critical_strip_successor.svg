<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">The Critical Strip</title><desc id="d">An illuminated exact symbolic complex-plane plate showing the critical strip, critical line, pole at one, selected trivial zeros, and standard symmetries. No numerical nontrivial-zero data are plotted.</desc><defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#fff8e8"/><stop offset="1" stop-color="#e6d2aa"/></linearGradient><linearGradient id="n" x2="1" y2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#163f5c"/></linearGradient><radialGradient id="g"><stop stop-color="#ffe9a0" stop-opacity=".7"/><stop offset="1" stop-color="#bd913a" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dy="10" stdDeviation="10" flood-opacity=".28"/></filter></defs><rect width="1200" height="1600" fill="#07182f"/><rect x="20" y="20" width="1160" height="1560" rx="8" fill="none" stroke="#bd913a" stroke-width="3"/><rect x="70" y="75" width="1060" height="1450" rx="18" fill="url(#p)" stroke="#bd913a" stroke-width="3" filter="url(#s)"/><text x="600" y="130" text-anchor="middle" font-family="Arial" font-size="17" letter-spacing="5" fill="#07182f">GRAND CHALLENGE LABS</text><text x="600" y="190" text-anchor="middle" font-family="Arial" font-size="18" letter-spacing="3" fill="#bd913a">RIEMANN · PLATE II</text><text x="600" y="250" text-anchor="middle" font-family="Georgia" font-size="50" fill="#07182f">The Critical Strip</text><text x="600" y="302" text-anchor="middle" font-family="Georgia" font-size="22" font-style="italic" fill="#776f62">A narrow vertical country in the complex plane, framed by symmetry.</text><rect x="135" y="360" width="930" height="760" rx="20" fill="url(#n)" stroke="#bd913a" stroke-width="3"/><circle cx="805" cy="740" r="260" fill="url(#g)"/><g stroke="#799db5" stroke-width="1" opacity=".22"><path d="M165 500H1035M165 620H1035M165 740H1035M165 860H1035M165 980H1035"/><path d="M290 400V1080M430 400V1080M570 400V1080M710 400V1080M850 400V1080M990 400V1080"/></g><line x1="165" y1="740" x2="1035" y2="740" stroke="#fff8e8" stroke-width="2"/><line x1="740" y1="400" x2="740" y2="1080" stroke="#86a9c0" stroke-width="2"/><rect x="740" y="400" width="150" height="680" fill="#4f7796" opacity=".18"/><line x1="815" y1="400" x2="815" y2="1080" stroke="#e4c678" stroke-width="5"/><line x1="890" y1="400" x2="890" y2="1080" stroke="#86a9c0" stroke-width="2"/><g font-family="Arial" font-size="15" font-weight="700"><text x="740" y="1110" text-anchor="middle" fill="#86a9c0">Re(s)=0</text><text x="815" y="1110" text-anchor="middle" fill="#e4c678">Re(s)=1/2</text><text x="890" y="1110" text-anchor="middle" fill="#86a9c0">Re(s)=1</text><text x="1020" y="726" text-anchor="end" fill="#fff8e8">Re(s)</text><text x="752" y="425" fill="#fff8e8">Im(s)</text></g><circle cx="890" cy="740" r="11" fill="#a84b3e"/><text x="908" y="726" font-family="Arial" font-size="15" font-weight="700" fill="#e9aa91">pole s=1</text><g fill="#78a589" stroke="#f5e7bf" stroke-width="1"><circle cx="440" cy="740" r="9"/><circle cx="180" cy="740" r="9"/></g><g font-family="Arial" font-size="15" font-weight="700" fill="#a8cfb5"><text x="440" y="775" text-anchor="middle">−2</text><text x="180" y="775" text-anchor="middle">−4</text></g><path d="M760 510Q815 455 870 510M760 960Q815 1015 870 960" fill="none" stroke="#e4c678" stroke-width="2" stroke-dasharray="7 6"/><g font-family="Georgia" font-size="17" fill="#e4c678"><text x="815" y="475" text-anchor="middle">s ↔ 1−s</text><text x="815" y="1035" text-anchor="middle">s ↔ s̄</text></g><g font-family="Georgia" font-size="84" fill="#fff8e8" opacity=".15"><text x="815" y="680" text-anchor="middle">?</text><text x="815" y="875" text-anchor="middle">?</text></g><rect x="140" y="1160" width="430" height="155" rx="12" fill="#fffaf0" stroke="#557b64" stroke-width="2"/><rect x="630" y="1160" width="430" height="155" rx="12" fill="#fffaf0" stroke="#a84b3e" stroke-width="2"/><g font-family="Arial" font-size="14" font-weight="700" letter-spacing="2"><text x="165" y="1192" fill="#557b64">EXACT VISIBLE STRUCTURE</text><text x="655" y="1192" fill="#a84b3e">DELIBERATE OMISSION</text></g><g font-family="Georgia" font-size="18" fill="#182033"><text x="165" y="1225">0 &lt; Re(s) &lt; 1</text><text x="165" y="1255">critical line Re(s)=1/2</text><text x="165" y="1285">trivial zeros: negative even integers</text><text x="655" y="1225">No decorative “zero” dots.</text><text x="655" y="1255">Finite nontrivial-zero data require</text><text x="655" y="1285">a bound numerical source.</text></g><text x="600" y="1380" text-anchor="middle" font-family="Georgia" font-size="20" font-style="italic" fill="#07182f">The mystery is not where the strip is, but where every nontrivial zero lies within it.</text><line x1="150" y1="1450" x2="1050" y2="1450" stroke="#bd913a"/><text x="600" y="1487" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2" fill="#776f62">PEDAGOGICAL PLATE · NOT PROOF OR CERTIFICATION AUTHORITY</text></svg>
