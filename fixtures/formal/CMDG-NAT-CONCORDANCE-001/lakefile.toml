name = "cmdg-nat-concordance-001"
version = "0.1.0"
keywords = ["cmdg", "foundations", "natural-numbers", "concordance"]
defaultTargets = ["CMDGNatConcordance", "CMDGEuclidBridge"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "CMDGNatConcordance"

[[lean_lib]]
name = "CMDGEuclidBridge"

[[lean_lib]]
name = "CMDGCondensedCM1"

[[lean_lib]]
name = "CMDGCondensedCM2"
