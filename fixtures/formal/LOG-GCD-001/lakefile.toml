name = "loggcd-lean"
version = "0.1.0"
keywords = ["number-theory", "kernel", "positive-semidefinite", "formalization"]
defaultTargets = ["LogGcd", "LogGcdFeature"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "LogGcd"

[[lean_lib]]
name = "LogGcdFeature"
