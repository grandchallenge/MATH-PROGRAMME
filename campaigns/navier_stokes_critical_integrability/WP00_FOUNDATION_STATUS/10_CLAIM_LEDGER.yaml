      - Ladyzhenskaya-Prodi-Serrin regularity at the pair 4,6
      - weak-strong uniqueness
      - correspondence between the campaign data/domain and the official positive branch
    promotion_condition: Commit a theorem-by-theorem implication proof with every quantifier and domain difference resolved and obtain Referee approval.
