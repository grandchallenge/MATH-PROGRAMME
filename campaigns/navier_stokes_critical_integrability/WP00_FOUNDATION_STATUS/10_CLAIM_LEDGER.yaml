  - claim_id: NS-CI-WP00-C008
    short_name: compact-support-is-restricted
    claim_text: The compactly supported smooth divergence-free data class is a strict subclass of Fefferman's rapidly decreasing data class, so a compact-support-only universal theorem does not by itself settle the full whole-space positive Clay branch.
    claim_class: PROVED_IN_PACKAGE
    support_type: HUMAN_PROOF
    status: AUDITED
    certainty: HIGH
    source_or_artifact:
      - https://www.claymath.org/wp-content/uploads/2022/06/navierstokes.pdf
      - campaigns/navier_stokes_critical_integrability/WP00_FOUNDATION_STATUS/04_PROBLEM_AND_STATUS_AUDIT.md#2-corrected-canonical-challenge
    assumptions:
      - standard inclusion of compactly supported smooth functions in the rapidly decreasing smooth class
    promotion_condition: Any future extension from compact support to the full class must appear as a separate proved bridge.
    related_files:
      - DOMAIN_02_NAVIER_STOKES_CRITICAL_INTEGRABILITY_MASTER_PLAN.md
    knowledge_graph_refs: []

