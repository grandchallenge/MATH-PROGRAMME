schema_version: 1.0.0
campaign_id: HC-001
work_package_id: HC-WP00
terms:
  - symbol: X
    meaning: smooth projective algebraic variety over C
    constraints: finite type; smooth; projective
  - symbol: n
    meaning: complex dimension of X
    constraints: nonnegative integer
  - symbol: p
    meaning: codimension of cycles and Hodge bidegree
    constraints: 0 <= p <= n
  - symbol: H^k(X,Q)
    meaning: rational singular cohomology
    comparison: embedded in H^k(X,C) by extension of scalars
  - symbol: H^{a,b}(X)
    meaning: Hodge summand in H^(a+b)(X,C)
    warning: complex vector space; membership alone does not imply rationality
  - symbol: Hdg^{2p}(X,Q)
    meaning: H^(2p)(X,Q) intersect H^(p,p)(X) inside H^(2p)(X,C)
    warning: canonical target uses Q, not Z or arbitrary complex classes
  - symbol: Z^p(X)
    meaning: free abelian group on irreducible codimension-p closed subvarieties
  - symbol: CH^p(X)
    meaning: codimension-p Chow group Z^p(X) modulo rational equivalence
    warning: equality in CH^p is stronger than equality of cohomology classes
  - symbol: cl^p
    meaning: cohomological cycle-class map from codimension-p cycles
    codomain: H^(2p)(X,Z) or selected coefficient extension
  - symbol: cl_Q^p
    meaning: CH^p(X) tensor_Z Q to Hdg^(2p)(X,Q)
    target_role: canonical surjectivity map
  - symbol: h
    meaning: rational hyperplane class c1(O_X(1))
    hodge_type: (1,1)
  - symbol: L
    meaning: cup product with h
    warning: cohomological inverse from hard Lefschetz is not automatically an algebraic correspondence
  - symbol: coniveau
    meaning: filtration by codimension of algebraic support
    warning: belongs to generalized Hodge formulations, not the canonical statement by definition
  - symbol: Tate_twist
    meaning: weight-normalizing twist in Hodge or l-adic structures
    warning: conventions must be explicit when comparing products, correspondences, or arithmetic formulations
  - symbol: rational_equivalence
    meaning: equivalence generated by principal divisors in algebraic families
    warning: do not conflate with algebraic, homological, or numerical equivalence
coefficient_policy:
  canonical: Q
  integral: separate_false_in_general_formulation
  real_or_complex: insufficient_without_rational_structure
cycle_policy:
  permitted_output: finite rational linear combination of codimension-p subvarieties
  not_required:
    - effectiveness
    - irreducibility of the total representative
    - uniqueness
    - equality in CH^p between different representatives
