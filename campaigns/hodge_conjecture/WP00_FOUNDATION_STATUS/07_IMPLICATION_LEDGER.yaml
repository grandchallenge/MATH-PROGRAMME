    conditions:
      - smooth projective X over C
      - codimension-p algebraic cycle
    boundary: necessary direction only
  - id: HC-IMP-002
    source: cycle_class_surjectivity
    target: rational_generation_by_irreducible_subvarieties
    status: EQUIVALENT
    conditions:
      - cycle map factors through CH^p
      - rational coefficients
  - id: HC-IMP-003
    source: rational_generation_by_irreducible_subvarieties
    target: cycle_class_surjectivity
    status: EQUIVALENT
    conditions:
      - same image convention
