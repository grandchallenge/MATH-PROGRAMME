theorems:
  - id: OZ-THM-T001
    title: Finite Zudilin odd-zeta disjunction
    exact_statement: At least one of zeta(5), zeta(7), ..., zeta(33) is irrational.
    quantifier_scope: finite target set of odd indices 5 through 33
    modulus: not_applicable
    prime_scope: not_applicable
    normalization_ids: [OZ-NRM-N007]
    source_records: [OZ-MSS-S001, OZ-L4-T001, OZ-CER-E001]
    evidence_effects: [FORMALLY_REPLAYED, KNOWN_SPECIAL_CASE]
    disposition: FORMALLY_REPLAYED_KNOWN_SPECIAL_CASE
    target_lane: null
    novelty_status: KNOWN_SPECIAL_CASE
    promotion_boundary: Baseline theorem only; no individual zeta(5) or zeta(7) conclusion follows.
  - id: OZ-THM-T002
    title: Single-digit Apéry harmonic B-row congruence
    exact_statement: For primes p >= 5, 1 <= a < p, and 0 <= r < p, p^3 b_(ap+r) is congruent to b_a a_r modulo p.
    quantifier_scope: unbounded single base-p digit theorem
    modulus: p
    prime_scope: p>=5
    normalization_ids: [OZ-NRM-N001, OZ-NRM-N002, OZ-NRM-N003, OZ-NRM-N005, OZ-NRM-N006]
    source_records: [OZ-MSS-S002, OZ-CON-C002, OZ-CER-E005, OZ-L4-T006]
    evidence_effects: [SOURCE_PAPER_PROOF, REPLAYED_CANDIDATE_LEAN_DECLARATION, SOURCE_INTERNAL_REVIEW]
    disposition: SOURCE_PROOF_PRESENT_INDEPENDENT_REVIEW_OPEN
    target_lane: OZ-RT-APERY-BROW-001
    novelty_status: APPARENTLY_NEW_PENDING_REVIEW
    promotion_boundary: Independent proof review and exact manuscript-to-Lean correspondence remain required; no multi-digit modulo-p^3 theorem follows.
  - id: OZ-THM-T003
    title: Multi-digit Apéry modulo-p^3 law
    exact_statement: The submitted master form p^3 b_n a_q is congruent to b_q a_n modulo p^3, q=floor(n/p), only on its recorded finite verification domain.
    quantifier_scope: finite p and n domain
    bounded_domain: 5 <= p <= 31 and n <= 320
    modulus: p3
    prime_scope: 5<=p<=31
    normalization_ids: [OZ-NRM-N001, OZ-NRM-N003, OZ-NRM-N005]
    source_records: [OZ-MSS-S003, OZ-CON-C003, OZ-CMP-X003]
    evidence_effects: [EXACT_FINITE_COMPUTATION]
    disposition: FINITE_EVIDENCE_ONLY
    target_lane: null
    novelty_status: NOT_ASSESSED
    promotion_boundary: The bounded computation may not be restated as an unbounded theorem.
  - id: OZ-THM-T004
    title: Abstract character-twisted harmonic companion theorem
    exact_statement: Under H1-H5, a chi-homogeneous tame harmonic companion of weight w satisfies p^w B_(ap+r) congruent to chi(p) B_a A_r modulo p.
    quantifier_scope: abstract conditional theorem
    modulus: p
    prime_scope: as specified by H1-H5
    normalization_ids: [OZ-NRM-N005]
    source_records: [OZ-MSS-S004, OZ-CON-C004, OZ-L4-T005]
    evidence_effects: [SOURCE_PAPER_PROOF, FORMALLY_REPLAYED]
    disposition: FORMALLY_REPLAYED_ABSTRACT_CONDITIONAL
    target_lane: null
    novelty_status: APPARENTLY_NEW_PENDING_REVIEW
    promotion_boundary: No concrete family theorem follows until H1-H5 are discharged for that family.
  - id: OZ-THM-T005
    title: First concrete H1-H5 application
    exact_statement: For one selected nontrivial family, instantiate OZ-THM-T004 only after separate proofs of H1, H2, H3, H4, and H5.
    quantifier_scope: concrete family theorem not yet selected
    modulus: p
    prime_scope: to be locked during family selection
    normalization_ids: [OZ-NRM-N005]
    source_records: [OZ-MSS-S004, OZ-CON-C004, OZ-L4-T005, OZ-CMP-X006]
