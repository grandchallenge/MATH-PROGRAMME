external_primary_candidates:
- candidate_id: OZ-LIT-CAND-003
  source: arXiv:1508.00297v1
  title: "Divisibility properties of sporadic Apéry-like numbers"
  compared_objects:
  - OZ-CON-C001
  - OZ-CON-C004
  finding: A_ROW_PRIOR_ART_ONLY
  notes: Proves Lucas congruences for the integral sporadic sequences. No harmonic-companion theorem was located
    in the arXiv record or keyword audit; absence is not an exhaustive novelty proof.
- candidate_id: OZ-LIT-CAND-004
  source: arXiv:2102.11839v2
  title: "New representations for all sporadic Apéry-like sequences, with applications to congruences"
  compared_objects:
  - OZ-CON-C001
  - OZ-CON-C004
  finding: A_ROW_PRIOR_ART_ONLY
  notes: Constant-term representations, strong Lucas congruences and supercongruences for integral rows; does not
    by itself discharge harmonic H1-H5 applications.
- candidate_id: OZ-LIT-CAND-005
  source: arXiv:2301.12248v1
  title: Gessel-Lucas congruences for sporadic sequences
  compared_objects:
  - OZ-CON-C001
  - OZ-CON-C004
  finding: A_ROW_MOD_P2_PRIOR_ART
  notes: Covers all 15 integral sequences modulo p^2 and two-term supercongruences. It does not establish the submitted
    harmonic B-row character-twisted theorem.
- candidate_id: OZ-LIT-CAND-APERY-LIMITS
  source: arXiv:2011.03400v1
  title: "Apéry Limits: Experiments and Proofs"
  compared_objects:
  - OZ-REC-R001
  - OZ-HAR-H001
  finding: KNOWN_EQUIVALENT_NORMALISATION
  notes: Gives the classical recurrence and secondary solution B(n) with limit zeta(3)/6. The submitted bMin is
    the factor-six normalisation 6B(n); an explicit equivalence edge is required.
- candidate_id: OZ-LIT-CAND-006
  source: arXiv:2503.07625v2
  title: A Formal Proof of the Irrationality of zeta(3) in Lean 4
  compared_objects:
  - OZ-L4-T001
  finding: NEIGHBOURING_FORMALIZATION_PRIOR_ART
  notes: Formalizes zeta(3), not the Zudilin odd-zeta disjunction. It supplies relevant formal-analysis and PNT
    infrastructure, not the same theorem.
