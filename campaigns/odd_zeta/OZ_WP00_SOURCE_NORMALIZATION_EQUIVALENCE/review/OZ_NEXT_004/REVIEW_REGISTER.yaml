- role: Verifier
  verdict: PARTIAL
  findings:
  - Five Python replay lanes passed locally.
  - The large audit lane timed out after anchor checks.
  - Two computation lanes lack normalized replay commands.
  - Pinned Lean replay is delegated to the PR workflow and remains pending until a successful run is recorded.
- role: Adversary
  verdict: BLOCKING_FINDINGS
  findings:
