exact_target:
  statement: >-
    For every prime p with p != 2 and every a,r with a<p and r<p,
    p^2 bFranel(a p+r) is congruent modulo p to bFranel(a) franel(r).
  base_row: franel(n) = sum from k=0 to n of C(n,k)^3
  companion: >-
    bFranel(n) = sum from k=0 to n C(n,k)^3 times
    [(1/4) H_k^(2) + (3/4) H_k^2 - (3/4) H_k H_(n-k)].
  modulus: p
  prime_scope: odd primes
  weight: 2
  character: trivial
  exclusions:
    - No statement about a recurrence-defined Franel second solution is inferred.
    - No multi-digit theorem is inferred.
    - No novelty or irrationality conclusion is inferred.
hypotheses:
  - id: H1
    name: digit factorization of the summand
    status: FORMALLY_DISCHARGED
    proof: >-
      Lucas gives C(ap+r,bp+s) congruent to C(a,b)C(r,s) modulo p.
      Cubing preserves the congruence, yielding the required factorization for SF(n,k)=C(n,k)^3.
    lean_witness: ZetaLucas.bFranel_lucas H1 block using choose_digits
    adversarial_boundary: A base-row recurrence is not used as a substitute for summand factorization.
  - id: H2
    name: support
    status: FORMALLY_DISCHARGED
    proof: If k>n then C(n,k)=0, so SF(n,k)=0.
    lean_witness: ZetaLucas.bFranel_lucas H2 block using Nat.choose_eq_zero_of_lt
    adversarial_boundary: The finite summation range is exact.
  - id: H3
    name: digit splitting of letter arguments on nonzero support
    status: FORMALLY_DISCHARGED
    proof: >-
      The k-letters split by Euclidean division. For the n-k letter, nonzero low-digit
      support forces s<=r; together with b<=a this excludes a borrow and gives
      (ap+r)-(bp+s)=(a-b)p+(r-s), with r-s<p.
    lean_witness: ZetaLucas.bFranel_lucas H3 block and frMon_mem
    adversarial_boundary: The no-borrow conclusion depends on nonzero S(r,s); it is not unconditional.
  - id: H4
    name: tameness of letter arguments
    status: FORMALLY_DISCHARGED
    proof: The arguments k and n-k are at most n on the support k<=n.
    lean_witness: ZetaLucas.bFranel_lucas H4 block
    adversarial_boundary: This is the formal argument<=n condition, not a weaker p^2 diagnostic.
  - id: H4c
    name: coefficient p-integrality
    status: FORMALLY_DISCHARGED
    proof: >-
      The only denominator is 4. For prime p with p!=2, p does not divide 4, so
      1/4, 3/4 and -3/4 are p-integral.
    lean_witness: ZetaLucas.bFranel_lucas H4c block
    adversarial_boundary: The theorem excludes p=2 and makes no all-prime claim.
  - id: Hw
    name: exact total harmonic weight
    status: FORMALLY_DISCHARGED
    proof: >-
      H_k^(2) has degree 2, H_k H_k has degree 1+1, and H_k H_(n-k) has degree 1+1.
      Every monomial has total weight 2.
    lean_witness: ZetaLucas.bFranel_lucas Hw block
    adversarial_boundary: Numeric denominator growth is not used to infer the weight.
  - id: H5
    name: character homogeneity
    status: FORMALLY_DISCHARGED
    proof: Every harmonic letter has the trivial character, so each monomial character is 1.
    lean_witness: ZetaLucas.bFranel_lucas H5 block
    adversarial_boundary: No quadratic-character instance is inferred.
