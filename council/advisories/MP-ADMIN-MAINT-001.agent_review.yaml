artifact:
  id: MP-ADMIN-MAINT-001
  type: administrative_maintenance_control
  title: Core Clarity and Workflow Coverage Maintenance Control
  pillar: MATH-PROGRAMME
  status: blocked
  disposition: Candidate control is structurally reviewable; binding disposition remains blocked on Council D1-D8, non-author Referee review, and Human Steward release.
council_review:
  Axiomatist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Preserve one authority per state dimension and distinguish protected state, mutable navigation, historical evidence, and consumer projection.
      - Make every exception narrower than the rule it modifies and unable to create mathematical or external claim authority.
    findings:
      - The authority split among Programme, Forge, Solve, Cert, and INTELLECT is coherent.
      - D1, D2, D3, D5, D7, and D8 should be approved only with the corrections recorded in this advisory.
  Prospector:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Treat maintenance automation as operational infrastructure rather than evidence of mathematical novelty or progress.
    findings:
      - The package identifies recurring governance failure modes without inflating them into research claims.
      - A 90-day pilot should measure defect frequency, manual burden, false positives, and repair latency before permanent cadence is fixed.
  Experimentalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Define pilot metrics and preserve baseline data before scheduled controls become binding.
    findings:
      - The proposed weekly, monthly, quarterly, and annual loops are reasonable as pilot frequencies.
      - The pilot should record checks run, defects found, time to repair, repeated defects, waived controls, and administrator effort.
  Cartographer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Preserve the five-repository authority topology and expose every cross-repository synchronization edge.
      - Maintain a current workflow coverage matrix with explicit non-applicability records.
    findings:
      - The control covers the principal provider, producer, adjudicator, Programme, and consumer interfaces.
      - D5 required a separate machine-readable issue-mirror policy; that policy has now been added as MP-ADMIN-MIRROR-001.
  Verifier:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Require exact-head execution, failure preservation, and adversarial rejection for every promoted administrative control.
      - Reject workflow coverage inferred only from a workflow file or a prior successful run.
    findings:
      - The candidate validator and tests cover authority inflation, ceremonial repins, premature activation, missing capabilities, stale mirrors, waiver inflation, emergency abuse, and claim inflation.
      - Binding release still requires a current exact-head green policy run after all Council corrections.
  Adversary:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Attack stale evidence, issue-body authority, ceremonial repins, waiver laundering, emergency non-expiry, branch-protection weakening, and repeated review deferral.
    findings:
      - Required-check and certification waivers are too consequential for ordinary 30-day Steward approval and should always require Council authority unless a narrowly defined security emergency applies.
      - Emergency authority must never permit claim promotion, campaign admission, certification disposition, evidence deletion, or branch-protection weakening.
  Formalist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Use machine-computable temporal rules and explicit state transitions.
      - Separate candidate, pilot, binding, returned, rejected, and superseded states.
    findings:
      - The candidate and promotion state machine is fail closed.
      - D2 should replace the proposed two-business-day tracker target with a machine-computable 72-hour elapsed-time target, while allowing a documented calendar exception for statutory closures.
  Steward:
    status: pending
    obligations:
      - Decide D1-D8 after the office findings, independent Referee report, and exact-head workflow evidence are complete.
      - Set the pilot start, owner, review date, and resource ceiling.
    findings:
      - No binding Steward disposition has been issued.
  Composer:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Present event-triggered synchronization as the primary control and periodic reviews as assurance layers.
    findings:
      - The human plan now has a clear sequence from authority and identity through controls, defects, exceptions, Council decisions, and promotion.
  Grammarian:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Control the terms current, historical, authoritative, material change, covered, qualified, waiver, emergency override, and promoted.
    findings:
      - The package generally preserves the required distinctions.
      - The terminology registry should receive these terms before binding release.
  Amanuensis:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Preserve the seventh-pass foundation, Council docket, issue mirror policy, review evidence, successor relations, and final external attestation.
    findings:
      - Programme issue #182, Council issue #183, PR #184, and the candidate artifacts form one traceable administrative package.
      - This advisory is not the required non-author Referee report and must not be presented as such.
  Archivist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Keep immutable closures and failed workflow evidence while retiring obsolete current-state pointers.
    findings:
      - The plan correctly distinguishes historical evidence from current state.
      - Retention periods for routine sweep evidence should be set during the pilot from observed volume and audit value.
  Mechanist:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Convert approved cadence and coverage requirements into scheduled workflows, exact evidence outputs, and repair routes.
    findings:
      - Scheduled automation should not be added until D1 and D2 are binding.
      - Any active campaign missing a critical required capability should fail closed for that campaign immediately; umbrella-wide admission freeze should trigger when two active campaigns or more than twenty percent of the active portfolio are incomplete, whichever threshold is stricter.
  Typesetter:
    status: reviewed
    reviewed_by: MATH-PROGRAMME administrative maintenance advisory
    reviewed_at: '2026-07-31'
    obligations:
      - Keep the maintenance plan in strict documentation navigation and preserve legible tables, headings, and identifiers.
    findings:
      - The plan is now included in MkDocs governance navigation.
      - No visual presentation should imply that the candidate control is binding.
  Referee:
    status: pending
    obligations:
      - Perform a non-author integrated review after Council corrections and exact-head CI are complete.
      - Confirm that the package reduces maintenance burden rather than institutionalizing repeated full-umbrella reconciliation.
    findings:
      - No independent Referee disposition has been issued.
