version: 1
name: agent_review
machine_schema: schemas/agent_review.schema.json
purpose: Records Agent Council review state for programme artifacts.

artifact:
  id: nonempty string
  type:
    enum:
      - work_package
      - theorem_spine
      - certificate
      - research_artifact
  title: string
  pillar:
    enum:
      - MATHFORGE
      - MATHSOLVE
      - MATHCERT
  status:
    enum:
      - draft
      - active
      - blocked
      - ready_for_certification
      - certified

council_review:
  required_agents:
    - Axiomatist
    - Prospector
    - Experimentalist
    - Cartographer
    - Verifier
    - Adversary
    - Formalist
    - Steward
    - Composer
    - Grammarian
    - Archivist
    - Mechanist
    - Typesetter
    - Referee
  each_agent_record:
    status:
      enum:
        - pending
        - reviewed
        - blocked
    reviewed_by: optional string
    reviewed_at: optional date
    obligations: list of strings
    findings: list of strings

unresolved_obligations:
  item:
    id: nonempty string
    owner: one required agent name
    description: nonempty string
    severity:
      enum:
        - low
        - medium
        - high
        - critical
    blocking: boolean

promotion:
  ready_for_next_stage: boolean
  blockers: list of strings
  certification_route: string or null

promotion_rule: A Work Package is not ready for certification while any unresolved obligation has severity critical and blocking true.
