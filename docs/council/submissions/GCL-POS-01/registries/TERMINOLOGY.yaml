registry_id: GCL-POS-01-TERMS
version: 0.1.0
date: '2026-07-27'
status: candidate
terms:
- term: authority status
  definition: The institutional standing of a governed record. Values include candidate, admitted, authoritative, superseded, and withdrawn.
  aliases: []
- term: claim-bounded communication
  definition: Communication that preserves a claim's type, status, scope, assumptions, limitations, and falsifiers.
  aliases: [claim-bounded technical communication]
- term: consequential claim
  definition: A claim whose downstream use can affect research conclusions, public statements, reusable guarantees, or governance decisions.
  aliases: []
- term: evidence record
  definition: A machine-readable record that identifies evidence, its method, scope, result summary, version, and limitations.
  aliases: []
- term: fail closed
  definition: To block the requested state transition when a mandatory record or condition is absent.
  aliases: [fail-closed]
- term: governed artifact
  definition: An artifact that enters the GCL registration, review, promotion, release, or supersession system.
  aliases: []
- term: position piece
  definition: An artifact that states an institutional interpretation or recommendation and preserves its claim boundary.
  aliases: [position paper]
- term: promotion status
  definition: The lifecycle state of an artifact in the promotion process.
  aliases: []
- term: public inheritance
  definition: The requirement that public exposition preserve the claim status, scope, assumptions, and material limitations of its source.
  aliases: []
- term: research instrument
  definition: In this piece, the combined practices and controls that convert inquiry into records used for later judgment and action. This is an analogy, not a claim that documents are sensors.
  aliases: []
