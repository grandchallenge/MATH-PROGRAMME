<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 430' role='img' aria-labelledby='rhstatus-t rhstatus-d'><title id='rhstatus-t'>E. What the audit has and has not established</title><desc id='rhstatus-d'>Schematic audit reading order: reconstructed conditional transfer; source bridges requiring verification; unresolved Bernoulli-to-cohomology valuation bound. This is not a complete dependency graph.</desc><g font-family='Arial, Helvetica, sans-serif'><rect x='0' y='0' width='760' height='430' fill='#ffffff' stroke='#ffffff' rx='0'/><text x='28' y='34' font-size='23' fill='#20262b' text-anchor='start' font-weight='700'>E. What the audit has and has not established</text><text x='732' y='58' font-size='12' fill='#56616a' text-anchor='end' font-weight='600'>SCHEMATIC STATUS MAP</text><line x1='28' y1='70' x2='732' y2='70' stroke='#d8dde0' stroke-width='1'/><rect x='36' y='92' width='688' height='70' fill='#eaf1f3' stroke='#d8dde0' rx='6'/><text x='52' y='117' font-size='18' fill='#35647a' text-anchor='start' font-weight='700'>Reconstructed mathematics</text><text x='52' y='143' font-size='15' fill='#20262b' text-anchor='start' font-weight='400'>Local restriction and quotient inflation, under their hypotheses.</text><line x1='380' y1='162' x2='380' y2='188' stroke='#56616a' stroke-width='2'/><polyline points='375,179 380,188 385,179' fill='none' stroke='#56616a' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/><rect x='36' y='188' width='688' height='70' fill='#f5f6f7' stroke='#d8dde0' rx='6'/><text x='52' y='213' font-size='18' fill='#20262b' text-anchor='start' font-weight='700'>Source bridges still to verify</text><text x='52' y='239' font-size='15' fill='#20262b' text-anchor='start' font-weight='400'>Do the actual arithmetic modules and eigenspaces match?</text><line x1='380' y1='258' x2='380' y2='284' stroke='#56616a' stroke-width='2'/><polyline points='375,275 380,284 385,275' fill='none' stroke='#56616a' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/><rect x='36' y='284' width='688' height='84' fill='#fbf2ef' stroke='#9b5140' rx='6'/><text x='52' y='309' font-size='18' fill='#9b5140' text-anchor='start' font-weight='700'>Open arithmetic estimate</text><text x='52' y='333' font-size='15' fill='#20262b' text-anchor='start' font-weight='400'>ML.vChar: bound the size of arithmetic structures by divisibility.</text><text x='52' y='354' font-size='14' fill='#56616a' text-anchor='start' font-weight='400'>The reciprocity hypothesis Rec and the precise inequality need scrutiny.</text><text x='380' y='403' font-size='15' fill='#20262b' text-anchor='middle' font-weight='700'>Original Lean replay and final RH/GRH claim: not independently certified.</text></g></svg>
