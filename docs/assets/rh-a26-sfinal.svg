<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-labelledby="title desc"><title id="title">Local-to-global cohomological accounting</title><desc id="desc">Second cohomology length plus global invariant length equals Sha length plus local invariant lengths. Discard the nonnegative global invariant term, bound local invariants, and absorb their contribution to recover the conditional exponent 150.</desc><rect width="760" height="348" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#20262b" text-anchor="middle"><text x="380" y="34" font-size="23" font-weight="700">Local-to-global cohomological accounting</text><path d="M28 49 H732" stroke="#d8dde0"/><rect x="32" y="70" width="312" height="87" rx="5" fill="#f5f6f7" stroke="#a5afb4"/><text x="188" y="94" font-size="15" font-weight="700">Global second cohomology</text><text x="188" y="119" font-size="16">V + global invariant length</text><text x="188" y="140" font-size="12">Kernel and cokernel accounting</text><text x="380" y="123" font-size="25">=</text><rect x="416" y="70" width="312" height="87" rx="5" fill="#eaf1f3" stroke="#35647a"/><text x="572" y="94" font-size="15" font-weight="700">Duality contributions</text><text x="572" y="119" font-size="16">Sha length + local lengths</text><text x="572" y="140" font-size="12">Conditional on classical duality inputs</text><path d="M188 157 V173 H572 V157 M380 173 V188 M374 182 L380 188 L386 182" fill="none" stroke="#56616a" stroke-width="1.6"/><rect x="72" y="189" width="616" height="63" rx="5" fill="#f5f6f7" stroke="#d8dde0"/><text x="380" y="212" font-size="15" font-weight="700">Discard the nonnegative global term</text><text x="380" y="235" font-size="15">V ≤ s + n(2 + floor(logℓ n) + E)</text><path d="M380 252 V266" stroke="#56616a"/><rect x="72" y="267" width="616" height="53" rx="5" fill="#eaf1f3" stroke="#35647a"/><text x="380" y="289" font-size="15" font-weight="700">Absorb the local logarithmic contribution</text><text x="380" y="309" font-size="15" fill="#35647a">Sha exponent 141 → conditional Lemma K exponent 150</text><text x="380" y="340" font-size="11" fill="#56616a">Original formal replay and foundational correspondence remain open.</text></g></svg>
