<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" role="img" aria-labelledby="title desc">
  <title id="title">The Minderlings of the MATH Stack</title>
  <desc id="desc">A six-role orientation diagram for the Grand Challenge mathematics stack: discover, discipline, certify.</desc>
  <defs>
    <linearGradient id="night" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071526"/><stop offset="1" stop-color="#0d2a44"/></linearGradient>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f1e8"/></linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#06111f" flood-opacity="0.18"/></filter>
    <style>
      .title{font:800 54px Georgia,serif;letter-spacing:4px;fill:#fff}.subtitle{font:700 24px system-ui,sans-serif;letter-spacing:7px;fill:#f3b33d}.maxim{font:600 22px system-ui,sans-serif;fill:#f7fbff}.card{fill:url(#paper);stroke:#d7cdb8;stroke-width:2;filter:url(#softShadow)}.role{font:800 25px system-ui,sans-serif}.tag{font:700 13px system-ui,sans-serif;letter-spacing:2px}.body{font:500 17px system-ui,sans-serif;fill:#1d2630}.small{font:500 14px system-ui,sans-serif;fill:#303943}.label{font:800 14px system-ui,sans-serif;letter-spacing:1.8px}.icon{font:700 74px system-ui,sans-serif}.flowbox{fill:#f7fbff;stroke:#ccd6df;stroke-width:2}.footer{fill:#071526}.mono{font:650 17px ui-monospace,Consolas,monospace;fill:#eaf4ff}.white{fill:#fff}.forge{fill:#138a39}.solve{fill:#b87504}.cert{fill:#54318c}.lane{fill:#007a88}.fixture{fill:#9b4e00}.stack{fill:#0b5cab}
    </style>
  </defs>
  <rect width="1800" height="1020" rx="22" fill="#f6f4ee"/>
  <rect x="0" y="0" width="1800" height="132" rx="22" fill="url(#night)"/>
  <text x="42" y="66" class="title">THE MINDERLINGS OF THE MATH STACK</text>
  <text x="262" y="112" class="subtitle">DISCOVER. DISCIPLINE. CERTIFY.</text>
  <text x="1030" y="42" class="maxim">No theorem without a spine.</text>
  <text x="1030" y="72" class="maxim">No computation without a ledger.</text>
  <text x="1030" y="102" class="maxim">No conjecture without a map.</text>
  <text x="1470" y="48" font-family="system-ui,sans-serif" font-size="25" font-weight="800" fill="#fff">MATH STACK</text>
  <text x="1470" y="82" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#2da8ff">MATHFORGE</text>
  <text x="1470" y="112" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#f2b632">MATHSOLVE</text>
  <text x="1620" y="112" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#56d364">MATHCERT</text>

  <g transform="translate(22,158)">
    <g transform="translate(0,0)"><rect class="card" width="275" height="505" rx="16"/><text x="24" y="36" class="tag stack">MINDERLING 0 · MALE</text><text x="24" y="74" class="role stack">STACK STEWARD</text><circle cx="137" cy="184" r="82" fill="#1f6fb8"/><text x="96" y="208" class="icon white">🧭</text><text x="28" y="312" class="body">Orientation. Coherence.</text><text x="28" y="338" class="body">Guard the boundaries.</text><text x="28" y="388" class="label stack">MISSION</text><text x="28" y="416" class="small">Keep the stack navigable,</text><text x="28" y="438" class="small">doctrine aligned, and</text><text x="28" y="460" class="small">boundary language clear.</text></g>
    <g transform="translate(300,0)"><rect class="card" width="275" height="505" rx="16"/><text x="24" y="36" class="tag forge">MINDERLING 1 · FEMALE</text><text x="24" y="74" class="role forge">FORGE QUARTERMASTER</text><circle cx="137" cy="184" r="82" fill="#2da44e"/><text x="96" y="208" class="icon white">⚗</text><text x="28" y="312" class="body">Mine signals. Forge artifacts.</text><text x="28" y="338" class="body">Evidence, not proof.</text><text x="28" y="388" class="label forge">MISSION</text><text x="28" y="416" class="small">Produce clean, bounded,</text><text x="28" y="438" class="small">machine-consumable</text><text x="28" y="460" class="small">campaign artifacts.</text></g>
    <g transform="translate(600,0)"><rect class="card" width="275" height="505" rx="16"/><text x="24" y="36" class="tag solve">MINDERLING 2 · MALE</text><text x="24" y="74" class="role solve">SOLVE TACTICIAN</text><circle cx="137" cy="184" r="82" fill="#d29922"/><text x="96" y="208" class="icon white">📜</text><text x="28" y="312" class="body">Organize the struggle.</text><text x="28" y="338" class="body">Route. Record. Reduce.</text><text x="28" y="388" class="label solve">MISSION</text><text x="28" y="416" class="small">Turn artifacts into</text><text x="28" y="438" class="small">obligations, tactics, and</text><text x="28" y="460" class="small">the campaign spine.</text></g>
    <g transform="translate(900,0)"><rect class="card" width="275" height="505" rx="16"/><text x="24" y="36" class="tag cert">MINDERLING 3 · FEMALE</text><text x="24" y="74" class="role cert">CERT ASSAYER</text><circle cx="137" cy="184" r="82" fill="#6f42c1"/><text x="96" y="208" class="icon white">🔎</text><text x="28" y="312" class="body">Check claims. Replay exactly.</text><text x="28" y="338" class="body">Guard the proof boundary.</text><text x="28" y="388" class="label cert">MISSION</text><text x="28" y="416" class="small">Verify certificates and</text><text x="28" y="438" class="small">replays. Accept, reject,</text><text x="28" y="460" class="small">or request more.</text></g>
    <g transform="translate(1200,0)"><rect class="card" width="275" height="505" rx="16"/><text x="24" y="36" class="tag lane">MINDERLING 4 · ANDROGYNOUS</text><text x="24" y="74" class="role lane">LANE CARTOGRAPHER</text><circle cx="137" cy="184" r="82" fill="#0a8f9e"/><text x="96" y="208" class="icon white">🗺</text><text x="28" y="312" class="body">Make every lane repeatable.</text><text x="28" y="338" class="body">Map. Template. Standardize.</text><text x="28" y="388" class="label lane">MISSION</text><text x="28" y="416" class="small">Define lane doctrine,</text><text x="28" y="438" class="small">schemas, budgets, statuses,</text><text x="28" y="460" class="small">and promotion routes.</text></g>
    <g transform="translate(1500,0)"><rect class="card" width="275" height="505" rx="16"/><text x="24" y="36" class="tag fixture">MINDERLING 5 · ANDROGYNOUS</text><text x="24" y="74" class="role fixture">FIXTURE KEEPER</text><circle cx="137" cy="184" r="82" fill="#c56a12"/><text x="96" y="208" class="icon white">🌱</text><text x="28" y="312" class="body">Keep the reference path</text><text x="28" y="338" class="body">boring, stable, and true.</text><text x="28" y="388" class="label fixture">MISSION</text><text x="28" y="416" class="small">Maintain the end-to-end</text><text x="28" y="438" class="small">fixture. Link, audit, and</text><text x="28" y="460" class="small">prove the path works.</text></g>
  </g>

  <g transform="translate(48,705)">
    <rect class="flowbox" x="0" y="0" width="215" height="96" rx="14"/><text x="24" y="38" class="role" fill="#183247" font-size="22">RAW SIGNALS</text><text x="26" y="66" class="small">papers · data · notes</text>
    <text x="238" y="58" font-size="44" fill="#20384e">→</text>
    <rect class="flowbox" x="300" y="0" width="250" height="96" rx="14"/><text x="326" y="38" class="role forge" font-size="22">MATHFORGE</text><text x="326" y="66" class="small">candidate ore artifacts</text>
    <text x="574" y="58" font-size="44" fill="#20384e">→</text>
    <rect class="flowbox" x="635" y="0" width="260" height="96" rx="14"/><text x="661" y="38" class="role solve" font-size="22">MATHSOLVE</text><text x="661" y="66" class="small">obligations · campaign spine</text>
    <text x="920" y="58" font-size="44" fill="#20384e">→</text>
    <rect class="flowbox" x="980" y="0" width="260" height="96" rx="14"/><text x="1006" y="38" class="role cert" font-size="22">MATHCERT</text><text x="1006" y="66" class="small">checked / rejected claims</text>
    <text x="1265" y="58" font-size="44" fill="#20384e">→</text>
    <rect class="flowbox" x="1325" y="0" width="310" height="96" rx="14"/><text x="1352" y="38" class="role" fill="#0b5cab" font-size="22">READERS &amp; COMMUNITY</text><text x="1352" y="66" class="small">transparent, reproducible trust</text>
  </g>

  <rect class="footer" x="0" y="850" width="1800" height="170"/>
  <text x="45" y="895" class="mono">PILLAR BOUNDARIES</text><text x="45" y="930" class="mono" fill="#2da8ff">MATHFORGE</text><text x="178" y="930" class="mono">discovers candidate ore.</text><text x="45" y="962" class="mono" fill="#f2b632">MATHSOLVE</text><text x="178" y="962" class="mono">organizes obligations and tactics.</text><text x="45" y="994" class="mono" fill="#56d364">MATHCERT</text><text x="178" y="994" class="mono">certifies or rejects claims.</text>
  <text x="610" y="895" class="mono">TRUST QUARTET</text><text x="610" y="930" class="mono">1. What is proved?</text><text x="610" y="962" class="mono">2. What is checked?</text><text x="610" y="994" class="mono">3. What remains open? 4. What needs audit?</text>
  <text x="1180" y="895" class="mono">OPERATING LAW</text><text x="1180" y="930" class="mono">✓ no theorem without a spine</text><text x="1180" y="962" class="mono">✓ no computation without a ledger</text><text x="1180" y="994" class="mono">✓ no proof without a reader</text>
</svg>
