<text x="75" y="252" fill="#f8efd9" font-size="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >KNOWN ZETA ZEROS</text>
<text x="763" y="252" fill="#f8efd9" font-size="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >THE FOUR-ZERO COUNTERMODEL</text>
<text x="75" y="305" fill="#625d54" font-size="21" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >Known examples on Re(s) = 1/2</text>
<text x="763" y="305" fill="#625d54" font-size="21" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >Roots of P(s), all off Re(s) = 1/2</text>
