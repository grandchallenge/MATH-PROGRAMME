<circle cx="1136" cy="386" r="9" fill="#b98a34" stroke="#fffdf8" stroke-width="2"/>
<circle cx="996" cy="596" r="9" fill="#b98a34" stroke="#fffdf8" stroke-width="2"/>
<circle cx="1136" cy="596" r="9" fill="#b98a34" stroke="#fffdf8" stroke-width="2"/>
<text x="762" y="668" fill="#061224" font-size="23" font-family="Georgia, 'Times New Roman', serif" font-weight="500" >P(s) = ((s − 1/3)² + 4)((s − 2/3)² + 4)</text>
<text x="762" y="703" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >P(s) = P(1 − s), with roots 1/3 ± 2i and 2/3 ± 2i.</text>
<text x="762" y="736" fill="#b98a34" font-size="21" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >P(1/2 + it) = (145/36 − t²)² + t²/9  &gt;  0</text>
<line x1="48" y1="797" x2="1392" y2="797" stroke="#d5ad55" stroke-width="2" />
<text x="49" y="831" fill="#625d54" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >The comparison uses different imaginary scales; the polynomial is not the Riemann zeta function.</text>
<text x="49" y="865" fill="#081a31" font-size="23" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Exact lesson: reflection and conjugation can pair off-line zeros without excluding them.</text>
</svg>