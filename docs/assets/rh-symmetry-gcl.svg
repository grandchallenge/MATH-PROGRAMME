<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="907" viewBox="0 0 1440 907" role="img" aria-labelledby="title desc">
<title id="title">Riemann zeta zero examples contrasted with a reflected polynomial whose four zeros are off the critical line</title>
<desc id="desc">On the left, three actual known zeta zeros at imaginary heights approximately 14.134725, 21.022040 and 25.010858 all have real part one half. On the right, an exactly reflection-symmetric real polynomial has zeros at one third plus or minus two i and two thirds plus or minus two i. Different imaginary scales are used. This is a countermodel to a symmetry-only argument, not to RH.</desc>
<rect x="0" y="0" width="1440" height="907" rx="0" fill="#fffaf0" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1440" height="94" rx="0" fill="#061224" stroke="none" stroke-width="1"/>
<rect x="0" y="92" width="1440" height="3" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="46" y="56" fill="#f8efd9" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >GCL</text>
<line x1="144" y1="25" x2="144" y2="68" stroke="#d5ad55" stroke-width="2" />
<text x="163" y="56" fill="#f8efd9" font-size="19" font-family="Georgia, 'Times New Roman', serif" font-weight="500" letter-spacing="2">GRAND CHALLENGE LABS</text>
<text x="1387" y="56" fill="#f8efd9" font-size="17" font-family="Georgia, 'Times New Roman', serif" font-weight="400" text-anchor="end" letter-spacing="1.2">MATHEMATICS  /  AN EXACT OBSTRUCTION</text>
<text x="48" y="151" fill="#061224" font-size="43" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >SYMMETRY ALONE DOES NOT PROVE RH</text>
<text x="49" y="189" fill="#625d54" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >The completed zeta function has reflection symmetry; the symmetry does not force zeros onto the critical line.</text>
