<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="876" viewBox="0 0 1440 876" role="img" aria-labelledby="title desc">
<title id="title">A visual history of the Riemann Hypothesis from Euler to the 2026 announcement</title>
<desc id="desc">A GCL parchment-and-navy two-row chronology of ten selected milestones, from Euler's prime product in 1737 to the external Alpöge–Claude Lean proof claim in 2026; the final event is explicitly marked as a proof claim.</desc>
<rect x="0" y="0" width="1440" height="876" rx="0" fill="#fffaf0" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1440" height="94" rx="0" fill="#061224" stroke="none" stroke-width="1"/>
<rect x="0" y="92" width="1440" height="3" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="46" y="57" fill="#f8efd9" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >GCL</text>
<line x1="144" y1="25" x2="144" y2="68" stroke="#d5ad55" stroke-width="2" />
<text x="164" y="56" fill="#f8efd9" font-size="19" font-family="Georgia, 'Times New Roman', serif" font-weight="500" letter-spacing="2.4">GRAND CHALLENGE LABS</text>
<text x="1390" y="56" fill="#f8efd9" font-size="17" font-family="Georgia, 'Times New Roman', serif" font-weight="400" text-anchor="end" letter-spacing="1.5">MATHEMATICS  /  HISTORICAL RECORD</text>
<text x="48" y="153" fill="#061224" font-size="45" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >THE RIEMANN HYPOTHESIS</text>
<text x="49" y="188" fill="#625d54" font-size="21" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >A selected history of the zeta function, its zeros, and the 2026 Lean announcement</text>
<line x1="48" y1="202" x2="1390" y2="202" stroke="#d5c5a4" stroke-width="2" />
<rect x="48" y="231" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="48" y="231" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="68" y="280" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1737</text>
<line x1="68" y1="296" x2="273" y2="296" stroke="#d5c5a4" stroke-width="1" />
<text x="68" y="335" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Euler</text>
<text x="68" y="371" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >The Euler product</text>
<text x="68" y="397" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >connects the zeta</text>
<text x="68" y="423" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >series to prime</text>
<text x="68" y="449" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >factorization.</text>
<rect x="321" y="231" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="321" y="231" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="341" y="280" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1837</text>
<line x1="341" y1="296" x2="546" y2="296" stroke="#d5c5a4" stroke-width="1" />
<text x="341" y="335" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Dirichlet</text>
<text x="341" y="371" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >L-functions prove</text>
<text x="341" y="397" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >the existence of</text>
<text x="341" y="423" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >primes in suitable</text>
<text x="341" y="449" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >progressions.</text>
<rect x="594" y="231" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="594" y="231" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="614" y="280" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1859</text>
<line x1="614" y1="296" x2="819" y2="296" stroke="#d5c5a4" stroke-width="1" />
<text x="614" y="335" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Riemann</text>
<text x="614" y="371" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >Analytic continuation,</text>
<text x="614" y="397" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >functional equation,</text>
<text x="614" y="423" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >and the conjecture</text>
<text x="614" y="449" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >on nontrivial zeros.</text>
<rect x="867" y="231" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="867" y="231" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="887" y="280" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1896</text>
<line x1="887" y1="296" x2="1092" y2="296" stroke="#d5c5a4" stroke-width="1" />
<text x="887" y="335" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Prime number theorem</text>
<text x="887" y="371" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >Hadamard and</text>
<text x="887" y="397" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >de la Vallée Poussin</text>
<text x="887" y="423" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >prove the asymptotic</text>
<text x="887" y="449" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >law for prime counts.</text>
<rect x="1140" y="231" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="1140" y="231" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="1160" y="280" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1914</text>
<line x1="1160" y1="296" x2="1365" y2="296" stroke="#d5c5a4" stroke-width="1" />
<text x="1160" y="335" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Hardy</text>
<text x="1160" y="371" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >Infinitely many</text>
<text x="1160" y="397" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >zeta zeros lie</text>
<text x="1160" y="423" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >on the critical</text>
<text x="1160" y="449" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >line Re(s) = 1/2.</text>
<rect x="48" y="532" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="48" y="532" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="68" y="581" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1953</text>
<line x1="68" y1="597" x2="273" y2="597" stroke="#d5c5a4" stroke-width="1" />
<text x="68" y="636" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Turing</text>
<text x="68" y="672" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >Published a method</text>
<text x="68" y="698" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >for numerically</text>
<text x="68" y="724" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >checking zeros with</text>
<text x="68" y="750" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >rigorous controls.</text>
<rect x="321" y="532" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="321" y="532" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="341" y="581" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1974</text>
<line x1="341" y1="597" x2="546" y2="597" stroke="#d5c5a4" stroke-width="1" />
<text x="341" y="636" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Levinson</text>
<text x="341" y="672" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >At least one third</text>
<text x="341" y="698" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >of the nontrivial</text>
<text x="341" y="724" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >zeros lie on the</text>
<text x="341" y="750" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >critical line.</text>
<rect x="594" y="532" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="594" y="532" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="614" y="581" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >1989</text>
<line x1="614" y1="597" x2="819" y2="597" stroke="#d5c5a4" stroke-width="1" />
<text x="614" y="636" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Conrey</text>
<text x="614" y="672" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >More than two fifths</text>
<text x="614" y="698" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >of the zeros lie</text>
<text x="614" y="724" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >on the critical line;</text>
<text x="614" y="750" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >a stronger bound.</text>
<rect x="867" y="532" width="245" height="268" rx="3" fill="#fffdf8" stroke="#d5c5a4" stroke-width="1"/>
<rect x="867" y="532" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="887" y="581" fill="#b98a34" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >2000</text>
<line x1="887" y1="597" x2="1092" y2="597" stroke="#d5c5a4" stroke-width="1" />
<text x="887" y="636" fill="#061224" font-size="25" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Clay Institute</text>
<text x="887" y="672" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >RH appears among</text>
<text x="887" y="698" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >the Millennium</text>
<text x="887" y="724" fill="#061224" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >Prize Problems.</text>
<rect x="1140" y="532" width="245" height="268" rx="3" fill="#081a31" stroke="#d5ad55" stroke-width="2"/>
<rect x="1140" y="532" width="5" height="268" rx="0" fill="#d5ad55" stroke="none" stroke-width="1"/>
<text x="1160" y="581" fill="#d5ad55" font-size="37" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >2026</text>
<line x1="1160" y1="597" x2="1365" y2="597" stroke="#d5ad55" stroke-width="1" />
<text x="1160" y="636" fill="#f8efd9" font-size="23" font-family="Georgia, 'Times New Roman', serif" font-weight="700" >Alpöge and Claude</text>
<text x="1160" y="672" fill="#f8efd9" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >RH and Dirichlet</text>
<text x="1160" y="698" fill="#f8efd9" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >GRH proof claimed</text>
<text x="1160" y="724" fill="#f8efd9" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >in Lean; substantial</text>
<text x="1160" y="750" fill="#f8efd9" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >external checks</text>
<text x="1160" y="776" fill="#f8efd9" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="400" >reported.</text>
<line x1="48" y1="826" x2="1391" y2="826" stroke="#d5c5a4" stroke-width="1" />
<text x="50" y="852" fill="#625d54" font-size="15" font-family="Georgia, 'Times New Roman', serif" font-weight="500" >HISTORICAL MILESTONES: EULER · DIRICHLET · RIEMANN · HARDY · TURING · LEVINSON · CONREY</text>
<text x="1390" y="852" fill="#b98a34" font-size="15" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="end">2026: ANNOUNCEMENT, NOT CERTIFICATION</text>
</svg>