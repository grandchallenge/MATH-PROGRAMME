<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Invariant-form completeness</title><desc id="desc">Place-labelled permutations and block unitary tensor powers are mutual commutants. Complexification and alternation turn this identity into a spanning theorem for trace expressions.</desc>
<rect width="760" height="350" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20262b">
<text x="28" y="35" font-size="23" font-weight="700">Invariant-form completeness</text>
<path d="M28 50 H732" stroke="#d8dde0"/>
<rect x="32" y="83" width="280" height="94" rx="6" fill="#eaf1f3" stroke="#35647a"/>
<rect x="448" y="83" width="280" height="94" rx="6" fill="#eaf1f3" stroke="#35647a"/>
<text x="172" y="114" text-anchor="middle" font-size="24" font-weight="700">A</text><text x="172" y="141" text-anchor="middle" font-size="16">Place-labelled permutations</text><text x="172" y="161" text-anchor="middle" font-size="13">Unital, adjoint-closed algebra</text>
<text x="588" y="114" text-anchor="middle" font-size="24" font-weight="700">B</text><text x="588" y="141" text-anchor="middle" font-size="16">Block-unitary tensor powers</text><text x="588" y="161" text-anchor="middle" font-size="13">Span via polynomial interpolation</text>
<path d="M312 108 H448 l-9 -5 m9 5 l-9 5 M448 153 H312 l9 -5 m-9 5 l9 5" fill="none" stroke="#35647a" stroke-width="2"/>
<text x="380" y="99" text-anchor="middle" font-size="15">A′ = B</text><text x="380" y="173" text-anchor="middle" font-size="15">B′ = A</text>
<path d="M172 177 V205 H380 M588 177 V205 H380 V224" fill="none" stroke="#56616a" stroke-width="2"/>
<rect x="90" y="224" width="580" height="80" rx="6" fill="#f5f6f7" stroke="#d8dde0"/>
<text x="380" y="252" text-anchor="middle" font-size="18" font-weight="700">All invariant alternating forms</text><text x="380" y="279" text-anchor="middle" font-size="15">Complexify → expand in permutations → alternate traces</text>
<text x="380" y="330" text-anchor="middle" font-size="13" fill="#56616a">Spanning, not linear independence; no stable-range assumption.</text>
</g></svg>
