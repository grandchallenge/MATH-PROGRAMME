<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">Integral stability preserves the torsion budget</title><desc id="desc">The explicit stable rank, common witness rank and filtered rank lie in the stable range. Both relevant integral torsion cardinalities agree exactly with those at the explicit rank.</desc>
<rect width="760" height="310" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20262b">
<text x="28" y="35" font-size="23" font-weight="700">Integral stability preserves the torsion budget</text><path d="M28 50 H732" stroke="#d8dde0"/>
<text x="380" y="83" text-anchor="middle" font-size="14" fill="#35647a">Stable range in both adjacent degrees</text>
<path d="M45 130 H715" stroke="#a5afb4" stroke-width="2"/><path d="M150 130 H715" stroke="#35647a" stroke-width="4"/>
<g fill="#35647a"><circle cx="150" cy="130" r="7"/><circle cx="380" cy="130" r="7"/><circle cx="640" cy="130" r="7"/></g>
<g text-anchor="middle"><text x="150" y="117" font-size="18" font-weight="700">N*</text><text x="380" y="117" font-size="18" font-weight="700">n</text><text x="640" y="117" font-size="18" font-weight="700">ℓᵏn</text>
<text x="150" y="155" font-size="13">Explicit rank</text><text x="380" y="155" font-size="13">Witness rank</text><text x="640" y="155" font-size="13">Filtered rank</text></g>
<path d="M380 170 V185 H150 V170 M640 170 V210 H150 V185 M144 177 L150 170 L156 177" fill="none" stroke="#35647a" stroke-width="1.8"/>
<text x="505" y="179" text-anchor="middle" font-size="12" fill="#56616a">Exact torsion transport</text>
<rect x="72" y="226" width="616" height="58" rx="5" fill="#eaf1f3" stroke="#35647a"/>
<text x="380" y="247" text-anchor="middle" font-size="14">Evaluate both geometric torsion bounds at the same rank</text>
<text x="380" y="272" text-anchor="middle" font-size="19" font-weight="700">N* = 2(k+1)+4 = 4E+6</text>
<text x="380" y="302" text-anchor="middle" font-size="12" fill="#56616a">Schematic rank axis, not to scale. E = e+1 and k = 2E.</text>
</g></svg>
