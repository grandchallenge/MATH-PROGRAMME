<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' role='img' aria-labelledby='rhquotient-t rhquotient-d'><title id='rhquotient-t'>D. When can we safely forget symmetries?</title><desc id='rhquotient-d'>Exact S3 parity fibers, schematic placement. The map to the quotient C2 groups all three even permutations and all three odd permutations. The actual Galois group is not pictured.</desc><g font-family='Arial, Helvetica, sans-serif'><rect x='0' y='0' width='760' height='400' fill='#ffffff' stroke='#ffffff' rx='0'/><text x='28' y='34' font-size='23' fill='#20262b' text-anchor='start' font-weight='700'>D. When can we safely forget symmetries?</text><text x='732' y='58' font-size='12' fill='#56616a' text-anchor='end' font-weight='600'>EXACT FINITE MODEL</text><line x1='28' y1='70' x2='732' y2='70' stroke='#d8dde0' stroke-width='1'/><text x='180' y='101' font-size='17' fill='#20262b' text-anchor='middle' font-weight='700'>Six symmetries in S3</text><text x='590' y='101' font-size='17' fill='#20262b' text-anchor='middle' font-weight='700'>Two quotient classes</text><rect x='35' y='121' width='319' height='75' fill='#eaf1f3' stroke='#d8dde0' rx='6'/><text x='48' y='142' font-size='13' fill='#35647a' text-anchor='start' font-weight='700'>Even permutations</text><text x='58' y='176' font-size='16' fill='#20262b' text-anchor='start' font-weight='400'>identity</text><text x='158' y='176' font-size='16' fill='#20262b' text-anchor='start' font-weight='400'>(123)</text><text x='258' y='176' font-size='16' fill='#20262b' text-anchor='start' font-weight='400'>(132)</text><line x1='354' y1='157' x2='525' y2='157' stroke='#35647a' stroke-width='2'/><polyline points='516,162 525,157 516,152' fill='none' stroke='#35647a' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/><rect x='525' y='130' width='198' height='54' fill='#ffffff' stroke='#35647a' rx='6'/><text x='624' y='163' font-size='18' fill='#35647a' text-anchor='middle' font-weight='700'>Even coset</text><rect x='35' y='236' width='319' height='75' fill='#f5f6f7' stroke='#d8dde0' rx='6'/><text x='48' y='257' font-size='13' fill='#56616a' text-anchor='start' font-weight='700'>Odd permutations</text><text x='58' y='291' font-size='16' fill='#20262b' text-anchor='start' font-weight='400'>(23)</text><text x='158' y='291' font-size='16' fill='#20262b' text-anchor='start' font-weight='400'>(12)</text><text x='258' y='291' font-size='16' fill='#20262b' text-anchor='start' font-weight='400'>(13)</text><line x1='354' y1='272' x2='525' y2='272' stroke='#56616a' stroke-width='2'/><polyline points='516,277 525,272 516,267' fill='none' stroke='#56616a' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/><rect x='525' y='245' width='198' height='54' fill='#ffffff' stroke='#56616a' rx='6'/><text x='624' y='278' font-size='18' fill='#56616a' text-anchor='middle' font-weight='700'>Odd coset</text><text x='380' y='345' font-size='15' fill='#20262b' text-anchor='middle' font-weight='400'>A function that is constant within each group descends to the quotient.</text><text x='380' y='370' font-size='14' fill='#56616a' text-anchor='middle' font-weight='400'>For the arithmetic argument, vanishing on inertia supplies this condition.</text></g></svg>
