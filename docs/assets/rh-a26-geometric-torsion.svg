<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-labelledby="title desc">
<title id="title">Geometry to torsion: dimension shifting</title><desc id="desc">The coinvariant lattice determinant gives a factor b to the power A. Each positive-degree shift adds a stabilizer homology factor at most s to the power A times s to the power j. The product bounds integral torsion, under equivariant exactness.</desc>
<rect width="760" height="384" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20262b">
<text x="28" y="35" font-size="23" font-weight="700">Geometry to torsion: dimension shifting</text><path d="M28 50 H732" stroke="#d8dde0"/>
<rect x="28" y="70" width="704" height="52" rx="5" fill="#f5f6f7" stroke="#d8dde0"/>
<text x="380" y="91" text-anchor="middle" font-size="15" font-weight="700">Exact augmented equivariant chain complex</text>
<text x="380" y="109" text-anchor="middle" font-size="13">At most A orbits and stabilizers of order at most s</text>
<path d="M380 122 V140 H192 V154 M380 140 H568 V154" stroke="#56616a" stroke-width="2" fill="none"/>
<rect x="28" y="154" width="328" height="100" rx="5" fill="#eaf1f3" stroke="#35647a"/>
<text x="192" y="177" text-anchor="middle" font-size="16" font-weight="700">Final coinvariant relations</text><text x="192" y="201" text-anchor="middle" font-size="14">Determinant of short columns</text><text x="192" y="232" text-anchor="middle" font-size="24" fill="#35647a">bᴬ</text>
<rect x="404" y="154" width="328" height="100" rx="5" fill="#f5f6f7" stroke="#d8dde0"/>
<text x="568" y="177" text-anchor="middle" font-size="16" font-weight="700">Positive-degree stabilizer costs</text><text x="568" y="201" text-anchor="middle" font-size="14">Shapiro and long exact sequence</text><text x="568" y="232" text-anchor="middle" font-size="19">∏ⱼ s^(A sʲ), j = 1,…,m</text>
<path d="M192 254 V276 H568 V254 M380 276 V290" stroke="#56616a" stroke-width="2" fill="none"/>
<rect x="112" y="290" width="536" height="58" rx="5" fill="#eaf1f3" stroke="#35647a"/>
<text x="380" y="312" text-anchor="middle" font-size="13">Multiply the costs; relax the sum of powers</text><text x="380" y="336" text-anchor="middle" font-size="19" font-weight="700">|Tor Hₘ| ≤ bᴬ × s^(m A sᵐ)</text>
<text x="380" y="371" text-anchor="middle" font-size="13" fill="#56616a">For the alternating face differential, b = m + 2.</text>
</g></svg>
