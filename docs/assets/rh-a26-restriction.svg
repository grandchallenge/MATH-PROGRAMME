<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 380' role='img' aria-labelledby='rhcollapse-t rhcollapse-d'><title id='rhcollapse-t'>C. A transformation can erase information</title><desc id='rhcollapse-d'>Exact finite counterexample: first cohomology of C3 with trivial F3 coefficients has three classes 0, 1, 2. Restriction to the trivial subgroup sends all three to zero.</desc><g font-family='Arial, Helvetica, sans-serif'><rect x='0' y='0' width='760' height='380' fill='#ffffff' stroke='#ffffff' rx='0'/><text x='28' y='34' font-size='23' fill='#20262b' text-anchor='start' font-weight='700'>C. A transformation can erase information</text><text x='732' y='58' font-size='12' fill='#56616a' text-anchor='end' font-weight='600'>EXACT FINITE MODEL</text><line x1='28' y1='70' x2='732' y2='70' stroke='#d8dde0' stroke-width='1'/><text x='175' y='100' font-size='17' fill='#20262b' text-anchor='middle' font-weight='700'>Three distinct classes</text><text x='590' y='100' font-size='17' fill='#20262b' text-anchor='middle' font-weight='700'>One class after restriction</text><line x1='220' y1='130' x2='536' y2='200' stroke='#56616a' stroke-width='2'/><polyline points='526,203 536,200 528,193' fill='none' stroke='#56616a' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/><rect x='125' y='107' width='95' height='46' fill='#f5f6f7' stroke='#d8dde0' rx='6'/><text x='172' y='136' font-size='23' fill='#20262b' text-anchor='middle' font-weight='700'>0</text><line x1='220' y1='200' x2='536' y2='200' stroke='#9b5140' stroke-width='2'/><polyline points='527,205 536,200 527,195' fill='none' stroke='#9b5140' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/><rect x='125' y='177' width='95' height='46' fill='#eaf1f3' stroke='#d8dde0' rx='6'/><text x='172' y='206' font-size='23' fill='#20262b' text-anchor='middle' font-weight='700'>1</text><line x1='220' y1='270' x2='536' y2='200' stroke='#9b5140' stroke-width='2'/><polyline points='528,207 536,200 526,197' fill='none' stroke='#9b5140' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/><rect x='125' y='247' width='95' height='46' fill='#eaf1f3' stroke='#d8dde0' rx='6'/><text x='172' y='276' font-size='23' fill='#20262b' text-anchor='middle' font-weight='700'>2</text><rect x='536' y='177' width='104' height='46' fill='#f5f6f7' stroke='#d8dde0' rx='6'/><text x='588' y='206' font-size='23' fill='#20262b' text-anchor='middle' font-weight='700'>0</text><text x='380' y='322' font-size='18' fill='#9b5140' text-anchor='middle' font-weight='700'>The two nonzero classes become zero.</text><text x='380' y='349' font-size='16' fill='#56616a' text-anchor='middle' font-weight='400'>Index = 3; division by 3 is impossible modulo 3.</text></g></svg>
