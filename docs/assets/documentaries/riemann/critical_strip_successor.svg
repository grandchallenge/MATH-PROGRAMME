<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" role="img" aria-labelledby="title desc"><title id="title">Plate II — The critical strip</title><desc id="desc">An exact schematic complex-plane frame labels the critical strip, critical line, pole at one, negative-even trivial zeros, and zero symmetries while intentionally omitting numerical nontrivial-zero dots.</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset="1" stop-color="#102d4c"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7efd9"/><stop offset="1" stop-color="#dfcda8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".32"/></filter></defs><rect width="1055" height="1491" fill="url(#night)"/><rect x="26" y="26" width="1003" height="1439" rx="8" fill="none" opacity="1" stroke="#c99b3c" stroke-width="4"/><rect x="42" y="42" width="971" height="1407" rx="0" fill="none" opacity="1" stroke="#f0cf73" stroke-width="1"/><line x1="45" y1="120" x2="1010" y2="120" stroke="#c99b3c" stroke-width="2" opacity="1"/><line x1="45" y1="1370" x2="1010" y2="1370" stroke="#c99b3c" stroke-width="2" opacity="1"/><rect x="78" y="140" width="899" height="1175" rx="18" fill="url(#paper)" opacity="1" stroke="#c99b3c" stroke-width="4"/><text x="112" y="200" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="700" style="">Plate II — The critical strip</text><text x="112" y="244" text-anchor="start" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" style="font-style:italic;">Exact symbolic frame; no decorative nontrivial-zero coordinates.</text><text x="112" y="300" text-anchor="start" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">ORIENTATION</text><text x="112" y="334" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" style="">s = σ + it</text><text x="943" y="334" text-anchor="end" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" style="">no finite zero dataset plotted</text><rect x="170" y="410" width="715" height="560" rx="4" fill="#fffaf0" opacity="1" stroke="#173b60" stroke-width="2"/><rect x="272.14285714285717" y="410" width="510.7142857142857" height="560" rx="0" fill="#dce8ef" opacity="0.8"/><line x1="272.14285714285717" y1="410" x2="272.14285714285717" y2="970" stroke="#173b60" stroke-width="2" opacity="1" stroke-dasharray="5 5"/><line x1="527.5" y1="410" x2="527.5" y2="970" stroke="#b43b2e" stroke-width="4" opacity="1"/><line x1="782.8571428571429" y1="410" x2="782.8571428571429" y2="970" stroke="#173b60" stroke-width="2" opacity="1" stroke-dasharray="5 5"/><line x1="170" y1="690.0" x2="885" y2="690.0" stroke="#173b60" stroke-width="3" opacity="1"/><line x1="870" y1="690.0" x2="889" y2="690.0" stroke="#173b60" stroke-width="3" opacity="1"/><polygon points="889,690.0 877.0,697.2 877.0,682.8" fill="#173b60"/><line x1="272.14285714285717" y1="425" x2="272.14285714285717" y2="404" stroke="#173b60" stroke-width="3" opacity="1"/><polygon points="272.14285714285717,404 279.4,416.0 264.9,416.0" fill="#173b60"/><text x="897" y="697.0" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="700" style="">Re(s)</text><text x="262.14285714285717" y="392" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="700" style="">Im(s)</text><text x="272.14285714285717" y="720.0" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" style="">0</text><text x="527.5" y="720.0" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="18" font-