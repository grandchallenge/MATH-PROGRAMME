<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The Music of the Primes</title><desc id="d">An illuminated prime spiral rises into the critical strip and the zeta function.</desc><rect width="1024" height="1536" fill="#09172D"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#C19A4B" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Arial" font-size="24" fill="#D8B665">GRAND CHALLENGE LIBRARY · RH-001</text><text x="512" y="310" text-anchor="middle" font-family="Georgia" font-size="78" fill="#FFF7DF">THE MUSIC OF THE PRIMES</text><rect x="330" y="520" width="365" height="560" fill="none" stroke="#C19A4B" stroke-width="5"/><line x1="512" y1="520" x2="512" y2="1080" stroke="#D8B665" stroke-width="9"/><g fill="#FFF0B5"><circle cx="512" cy="610" r="11"/><circle cx="512" cy="720" r="11"/><circle cx="512" cy="850" r="11"/><circle cx="512" cy="990" r="11"/></g><text x="512" y="1250" text-anchor="middle" font-family="Georgia" font-size="38" fill="#FFF7DF">ζ(s) = ∏ₚ (1 − p⁻ˢ)⁻¹</text></svg>