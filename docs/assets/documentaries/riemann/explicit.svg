<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The zeros speak to the primes</title><desc id="d">An explicit-formula bridge sends waves from complex zeros into prime-counting fluctuations.</desc><rect width="1024" height="1536" fill="#F4EAD5"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#C19A4B" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="64" fill="#09172D">THE ZEROS SPEAK TO THE PRIMES</text><path d="M100 780C220 570 350 970 500 740S780 560 920 850" fill="none" stroke="#665F89" stroke-width="14"/><g fill="#C19A4B"><circle cx="230" cy="710" r="14"/><circle cx="500" cy="740" r="14"/><circle cx="760" cy="680" r="14"/></g><text x="512" y="1160" text-anchor="middle" font-family="Georgia" font-size="36" fill="#09172D">ψ(x) = main term − waves from zeros</text></svg>