<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">Evidence is not the infinite quantifier</title><desc id="d">Finite verification, critical-line proportions, random matrices, and spectral analogies stop before the universal claim.</desc><rect width="1024" height="1536" fill="#F4EAD5"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#C19A4B" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="56" fill="#09172D">EVIDENCE IS NOT THE INFINITE QUANTIFIER</text><path d="M160 1080V480H650" fill="none" stroke="#665F89" stroke-width="12"/><path d="M650 480l-45-30v60z" fill="#665F89"/><line x1="720" y1="360" x2="720" y2="1190" stroke="#C19A4B" stroke-width="8" stroke-dasharray="18 12"/><text x="420" y="1160" text-anchor="middle" font-family="Georgia" font-size="34" fill="#09172D">every finite height</text><text x="790" y="1160" text-anchor="middle" font-family="Georgia" font-size="34" fill="#09172D">all zeros</text></svg>