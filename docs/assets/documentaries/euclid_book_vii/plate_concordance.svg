<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From Euclidean measuring to bounded modern gcd interpretation</title>
  <desc id="desc">Pedagogical concordance plate with three columns. The historical column lists unit, number, measuring, common measure, repeated subtraction, and greatest common measure. The bounded modern column lists positive natural representatives, divisibility, coprimality, and gcd. The later mathematics column lists the remainder algorithm, extended Euclid, Bezout identity, and linear Diophantine solvability, all marked not verbatim in the admitted Euclidean loci.</desc>
  <rect width="1200" height="720" fill="#FAF5E8"/>
  <rect x="44" y="44" width="1112" height="632" rx="18" fill="none" stroke="#B78935" stroke-width="3"/>
  <text x="82" y="108" fill="#071A36" font-family="Georgia, serif" font-size="42" font-weight="700">Plate II · Historical → bounded modern → later</text>
  <line x1="82" y1="140" x2="1118" y2="140" stroke="#B78935" stroke-width="2"/>
  <g font-family="Georgia, serif">
    <text x="105" y="205" fill="#071A36" font-size="27" font-weight="700">Book VII source surface</text>
    <text x="446" y="205" fill="#071A36" font-size="27" font-weight="700">Bounded modern bridge</text>
    <text x="812" y="205" fill="#071A36" font-size="27" font-weight="700">Later mathematics</text>
  </g>
  <g fill="#1D2940" font-family="Arial, sans-serif" font-size="22">
    <text x="105" y="260">unit ≠ Euclidean number</text><text x="105" y="300">measures / common measure</text><text x="105" y="340">prime to one another</text><text x="105" y="380">repeated subtraction</text><text x="105" y="420">greatest common measure</text><text x="105" y="460">VII.2 porism</text>
    <text x="446" y="260">positive representatives</text><text x="446" y="300">exact divisibility</text><text x="446" y="340">gcd(a,b) = 1</text><text x="446" y="380">subtraction trace</text><text x="446" y="420">normalized gcd</text><text x="446" y="460">common divisors divide gcd</text>
    <text x="812" y="260">division with remainder</text><text x="812" y="300">extended Euclid</text><text x="812" y="340">Bézout identity</text><text x="812" y="380">signed coefficients</text><text x="812" y="420">linear Diophantine theorem</text><text x="812" y="460">not verbatim Euclid here</text>
  </g>
  <g stroke="#B78935" stroke-width="2"><line x1="405" y1="185" x2="405" y2="505"/><line x1="770" y1="185" x2="770" y2="505"/></g>
  <text x="82" y="570" fill="#071A36" font-family="Georgia, serif" font-size="25" font-weight="700">Authority rule</text>
  <text x="82" y="610" fill="#1D2940" font-family="Arial, sans-serif" font-size="20">Only the source-locked statements and concordance govern the historical column. Later results are separately protected modern mathematics.</text>
  <text x="82" y="645" fill="#1D2940" font-family="Arial, sans-serif" font-size="18">pedagogical_orientation_only · legible without colour · no source, proof, or certification authority</text>
</svg>
