<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">252 and 105 by repeated subtraction</title>
  <desc id="desc">Pedagogical plate showing the repeated-subtraction sequence 252 minus 105 equals 147, 147 minus 105 equals 42, 105 minus 42 equals 63, 63 minus 42 equals 21, and 42 minus 21 equals 21. The final note says 21 measures 42 and is a common measure of 252 and 105. The plate explicitly states that it is not a historical-source or proof authority.</desc>
  <rect width="1200" height="720" fill="#FAF5E8"/>
  <rect x="46" y="46" width="1108" height="628" rx="18" fill="none" stroke="#B78935" stroke-width="3"/>
  <text x="90" y="112" fill="#071A36" font-family="Georgia, serif" font-size="44" font-weight="700">Plate I · Repeated subtraction</text>
  <text x="90" y="154" fill="#1D2940" font-family="Georgia, serif" font-size="24">252 and 105 · a modern orientation to the Book VII construction</text>
  <line x1="90" y1="180" x2="1110" y2="180" stroke="#B78935" stroke-width="2"/>
  <g fill="#071A36" font-family="Georgia, serif" font-size="31">
    <text x="165" y="245">252 − 105 = 147</text>
    <text x="165" y="315">147 − 105 = 42</text>
    <text x="165" y="385">105 − 42 = 63</text>
    <text x="165" y="455">63 − 42 = 21</text>
    <text x="165" y="525">42 − 21 = 21</text>
  </g>
  <g stroke="#B78935" stroke-width="3" fill="none">
    <path d="M120 230h24v310h-24"/>
    <path d="M690 230h24v310h-24"/>
  </g>
  <text x="755" y="318" fill="#071A36" font-family="Georgia, serif" font-size="28" font-weight="700">Common measure</text>
  <text x="755" y="365" fill="#1D2940" font-family="Georgia, serif" font-size="25">21 measures 42.</text>
  <text x="755" y="408" fill="#1D2940" font-family="Georgia, serif" font-size="25">21 also measures 252 and 105.</text>
  <text x="90" y="615" fill="#1D2940" font-family="Arial, sans-serif" font-size="19">pedagogical_orientation_only · not historical-source, proof, or certification authority · modern quotient/remainder notation is intentionally absent</text>
</svg>
