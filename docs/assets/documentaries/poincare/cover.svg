<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" role="img" aria-labelledby="title desc">
<title id="title">The Shape of a Sphere — illuminated cover</title><desc id="desc">A luminous three-sphere represented by intersecting great circles and contractible loops in a navy and gold manuscript frame.</desc><defs>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset="1" stop-color="#102d4c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".95"/><stop offset=".45" stop-color="#d5a43f" stop-opacity=".55"/><stop offset="1" stop-color="#d5a43f" stop-opacity="0"/></radialGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7efd9"/><stop offset="1" stop-color="#dfcda8"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
<pattern id="stars" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="8" cy="14" r="1.5" fill="#f7d77b"/><circle cx="48" cy="31" r="1" fill="#fff" opacity=".8"/><circle cx="67" cy="66" r="1.2" fill="#b8d8ff"/><circle cx="24" cy="59" r=".8" fill="#fff"/></pattern>
</defs>
