 New Roman, serif" font-size="23" font-weight="600" style="">Geometry changes through g(t); curvature is a derived field.</text><text x="145" y="1045" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" style="">Smoothing and concentration are distinct observable features.</text><text x="145" y="1100" text-anchor="start" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">BOUNDARY</text><text x="145" y="1135" text-anchor="start" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="600" style="">No panel is a computed Ricci-flow solution or singularity certificate.</text><line x1="112" y1="1252" x2="943" y2="1252" stroke="#c99b3c" stroke-width="2" opacity="1"/><text x="527" y="1292" text-anchor="middle" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="600" style="">Pedagogical reconstruction · visual_is_evidence = false</text></svg>