<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" role="img" aria-labelledby="title desc"><title id="title">Plate II — Metric evolution under Ricci flow</title><desc id="desc">Three staged schematic surfaces under Ricci flow show metric evolution, smoothing, and qualitative curvature concentration without claiming a computed solution or singularity.</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset="1" stop-color="#102d4c"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7efd9"/><stop offset="1" stop-color="#dfcda8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".32"/></filter></defs><rect width="1055" height="1491" fill="url(#night)"/><rect x="26" y="26" width="1003" height="1439" rx="8" fill="none" opacity="1" stroke="#c99b3c" stroke-width="4"/><rect x="42" y="42" width="971" height="1407" rx="0" fill="none" opacity="1" stroke="#f0cf73" stroke-width="1"/><line x1="45" y1="120" x2="1010" y2="120" stroke="#c99b3c" stroke-width="2" opacity="1"/><line x1="45" y1="1370" x2="1010" y2="1370" stroke="#c99b3c" stroke-width="2" opacity="1"/><rect x="78" y="140" width="899" height="1175" rx="18" fill="url(#paper)" opacity="1" stroke="#c99b3c" stroke-width="4"/><text x="112" y="200" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="700" style="">Plate II — Metric evolution under Ricci flow</text><text x="112" y="244" text-anchor="start" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" style="font-style:italic;">Time-indexed geometry; qualitative curvature is encoded separately.</text><text x="112" y="300" text-anchor="start" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">ORIENTATION</text><text x="112" y="332" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="31" font-weight="700" style="">∂g/∂t = −2 Ric(g)</text><text x="943" y="332" text-anchor="end" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" style="">schematic — not a numerical flow</text><rect x="120" y="380" width="235" height="505" rx="14" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="142" y="422" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700" style="">t₀</text><text x="238" y="458" text-anchor="middle" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="400" style="">initial metric</text><path d="M148 620 C185 520 250 540 270 585 C295 630 310 690 325 705 C290 755 200 760 155 700 Z" fill="#79a6c8" stroke="#173b60" stroke-width="4" opacity="1"/><path d="M162 620 C215 595 272 640 315 615" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.85"/><path d="M162 660 C215 635 272 680 315 655" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.85"/><path d="M162 700 C215 675 272 720 315 695" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.85"/><path d="M190 580 C170 630 205 680 190 720" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.75"/><path d="M235 580 C215 630 250 680 235 720" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.75"/><path d="M280 580 C260 630 295 680 280 720" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.75"/><text x="142" y="810" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="600" style="">qualitative |Rm|</text><rect x="142" y="827" width="190" height="16" rx="8" fill="#e7dfcf" opacity="1"/><rect x="142" y="827" width="65" height="16" rx="8" fill="#b43b2e" opacity="0.65"/><rect x="390" y="380" width="235" height="505" rx="14" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width