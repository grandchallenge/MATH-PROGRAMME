<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" role="img" aria-labelledby="title desc"><title id="title">Plate III — Controlled neck surgery</title><desc id="desc">A schematic three-dimensional neck is identified, cut along two sphere cross-sections, excised, and replaced by standard-cap models; topology bookkeeping and theorem boundaries are explicit.</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset="1" stop-color="#102d4c"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7efd9"/><stop offset="1" stop-color="#dfcda8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".32"/></filter></defs><rect width="1055" height="1491" fill="url(#night)"/><rect x="26" y="26" width="1003" height="1439" rx="8" fill="none" opacity="1" stroke="#c99b3c" stroke-width="4"/><rect x="42" y="42" width="971" height="1407" rx="0" fill="none" opacity="1" stroke="#f0cf73" stroke-width="1"/><line x1="45" y1="120" x2="1010" y2="120" stroke="#c99b3c" stroke-width="2" opacity="1"/><line x1="45" y1="1370" x2="1010" y2="1370" stroke="#c99b3c" stroke-width="2" opacity="1"/><rect x="78" y="140" width="899" height="1175" rx="18" fill="url(#paper)" opacity="1" stroke="#c99b3c" stroke-width="4"/><text x="112" y="200" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="700" style="">Plate III — Controlled neck surgery</text><text x="112" y="244" text-anchor="start" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" style="font-style:italic;">A three-stage S² × I reconstruction with explicit cutting spheres and caps.</text><text x="112" y="300" text-anchor="start" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">ORIENTATION</text><text x="112" y="334" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" style="">local model: S² × I</text><text x="943" y="334" text-anchor="end" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" style="">theorem-bound schematic</text><rect x="115" y="390" width="245" height="520" rx="14" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="237" y="430" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700" style="">1 · identify neck</text><path d="M150 570 C185 545 212 550 237 565 C262 550 290 545 325 570 L325 715 C290 740 262 735 237 720 C212 735 185 740 150 715 Z" fill="#79a6c8" stroke="#173b60" stroke-width="4" opacity="1"/><ellipse cx="150" cy="642" rx="18" ry="73" fill="none" opacity="1" stroke="#173b60" stroke-width="3"/><ellipse cx="325" cy="642" rx="18" ry="73" fill="none" opacity="1" stroke="#173b60" stroke-width="3"/><ellipse cx="237" cy="642" rx="14" ry="60" fill="none" opacity="1" stroke="#c99b3c" stroke-width="4" stroke-dasharray="8 6"/><text x="237" y="790" text-anchor="middle" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="600" style="">high-curvature neck</text><rect x="390" y="390" width="245" height="520" rx="14" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="512" y="430" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700" style="">2 · cut / remove</text><path d="M425 570 C460 545 487 550 512 565 C537 550 565 545 600 570 L600 715 C565 740 537 735 512 720 C487 735 460 740 425 715 Z" fill="#79a6c8" stroke="#173b60" stroke-width="4" opacity="1"/><ellipse cx="425" cy="642" rx="18" ry="73" fill="none" opacity="1" stroke="#173b60" stroke-width="3"/><ellipse cx="600" cy="642" rx="18" ry="73" fill="none" opacity="1" stroke="#173b60" stroke-width="3"/><ellipse cx="474" cy="642" rx="18" ry="65" fill="none" opacity="1" stroke="#b43b2e" stroke-width="5" stroke-dasharray="10 7"/><ellipse cx="550" cy="642" rx="18" ry="65" fill="none" opacity="1" stroke="#b43b2e" stroke-width="5" stroke-dasharray="10 7"/><text x="474" y="750" text-anchor="middle" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">S²₋</text><text x="550" y="750" text-anchor="middle" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">S²₊</text><rect x="482" y="565" width="60" height="155" rx="0" fill="#f7efd9" opacity="0.82"/><text x="512" y="805" text-anchor="middle" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="600" style="">excised neck</text><rect x="665" y="390" width="245" height="520" rx="14" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="787" y="430" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700" style="">3 · attach caps</text><path d="M700 585 C740 555 780 565 790 610 C803 660 780 705 735 720 C715 710 700 690 700 665 Z" fill="#79a6c8" stroke="#173b60" stroke-width="4" opacity="1"/><path d="M875 585 C835 555 795 565 785 610 C772 660 795 705 840 720 C860 710 875 690 875 665 Z" fill="#79a6c8" stroke="#173b60" stroke-width="4" opacity="1"/><path d="M780 582 Q805 642 780 702" fill="none" stroke="#46785b" stroke-width="5" opacity="1"/><path d="M795 582 Q770 642 795 702" fill="none" stroke="#46785b" stroke-width="5" opacity="1"/><text x="787" y="790" text-anchor="middle" fill="#46785b" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="600" style="">standard-cap models</text><line x1="360" y1="645" x2="382" y2="645" stroke="#b43b2e" stroke-width="3" opacity="1"/><polygon points="382,645 370.0,652.2 370.0,637.8" fill="#b43b2e"/><line x1="635" y1="645" x2="657" y2="645" stroke="#b43b2e" stroke-width="3" opacity="1"/><polygon points="657,645 645.0,652.2 645.0,637.8" fill="#b43b2e"/><rect x="115" y="945" width="795" height="225" rx="12" fill="#f3ead6" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="140" y="983" text-anchor="start" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">TOPOLOGY BOOKKEEPING</text><text x="140" y="1020" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="600" style="">Cutting changes topology; the event must be recorded and later reversed.</text><text x="140" y="1060" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="400" style="">Canonical-neighbourhood and surgery-scale claims are imported theorems.</text><text x="140" y="1115" text-anchor="start" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">BOUNDARY</text><text x="140" y="1150" text-anchor="start" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="700" style="">The plate does not certify a valid surgery event.</text><line x1="112" y1="1252" x2="943" y2="1252" stroke="#c99b3c" stroke-width="2" opacity="1"/><text x="527" y="1292" text-anchor="middle" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="600" style="">Pedagogical reconstruction · visual_is_evidence = false</text></svg>