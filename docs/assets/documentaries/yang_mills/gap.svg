<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The silence above the vacuum</title><desc id="d">A Hamiltonian spectrum shows a vacuum at zero and the required positive interval before the first excitation.</desc><rect width="1024" height="1536" fill="#F0E7D5"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#C39B4B" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="62" fill="#081827">THE SILENCE ABOVE THE VACUUM</text><line x1="160" y1="1080" x2="870" y2="1080" stroke="#081827" stroke-width="10"/><line x1="160" y1="580" x2="870" y2="580" stroke="#496E82" stroke-width="10"/><line x1="160" y1="470" x2="870" y2="470" stroke="#496E82" stroke-width="6"/><path d="M260 1050V610" stroke="#C39B4B" stroke-width="8" stroke-dasharray="18 12"/><text x="320" y="850" font-family="Georgia" font-size="48" fill="#081827">Δ &gt; 0</text><text x="512" y="1180" text-anchor="middle" font-family="Georgia" font-size="30" fill="#081827">vacuum</text></svg>