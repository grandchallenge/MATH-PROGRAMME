<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">From classical action to quantum theory</title><desc id="d">A classical Yang–Mills field passes through regularization, positivity, reconstruction, and continuum-limit obligations.</desc><rect width="1024" height="1536" fill="#F0E7D5"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#C39B4B" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="58" fill="#081827">FROM CLASSICAL ACTION TO QUANTUM THEORY</text><g fill="#dce1e3" stroke="#496E82" stroke-width="7"><rect x="90" y="620" width="180" height="250"/><rect x="315" y="620" width="180" height="250"/><rect x="540" y="620" width="180" height="250"/><rect x="765" y="620" width="170" height="250"/></g><g font-family="Arial" font-size="23" fill="#081827" text-anchor="middle"><text x="180" y="750">REGULATE</text><text x="405" y="750">POSITIVITY</text><text x="630" y="750">RECONSTRUCT</text><text x="850" y="750">LIMIT</text></g></svg>