<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<title id="title">The Element in Half the Worlds</title>
<desc id="desc">An illuminated navy and gold cover showing three overlapping set-worlds, a network of elements, and the exact half-frequency conjecture.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="28%" r="82%"><stop offset="0" stop-color="#17365D"/><stop offset="0.62" stop-color="#071A36"/><stop offset="1" stop-color="#030D1D"/></radialGradient>
  <pattern id="stars" width="96" height="96" patternUnits="userSpaceOnUse"><circle cx="18" cy="25" r="1.2" fill="#E9C76B" opacity=".55"/><circle cx="72" cy="58" r=".8" fill="#fff8dc" opacity=".4"/><circle cx="43" cy="83" r=".7" fill="#B78935" opacity=".35"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1536" fill="url(#bg)"/><rect width="1024" height="1536" fill="url(#stars)" opacity=".65"/>
<rect x="28" y="28" width="968" height="1480" rx="8" fill="none" stroke="#B78935" stroke-width="5"/>
<rect x="43" y="43" width="938" height="1450" rx="4" fill="none" stroke="#E9C76B" stroke-width="1.5" opacity=".75"/>
<path d="M70 92 H290 M734 92 H954 M70 1444 H290 M734 1444 H954" stroke="#B78935" stroke-width="2"/>
<circle cx="512" cy="92" r="6" fill="#E9C76B"/><circle cx="512" cy="1444" r="6" fill="#E9C76B"/>
<text x="512" y="132" text-anchor="middle" fill="#E9C76B" font-family="Georgia,serif" font-size="22" letter-spacing="5">GRAND CHALLENGE LABS</text>
<text x="512" y="192" text-anchor="middle" fill="#FFF7E3" font-family="Georgia,serif" font-size="54" font-weight="600">The Element in Half the Worlds</text>
<text x="512" y="232" text-anchor="middle" fill="#E9C76B" font-family="Georgia,serif" font-size="24" font-style="italic">Frankl’s Conjecture and the Structure of Union-Closed Families</text>
<g transform="translate(512 760)" filter="url(#glow)">
  <circle r="300" fill="none" stroke="#B78935" stroke-width="3" opacity=".8"/>
  <circle cx="-125" cy="-20" r="180" fill="none" stroke="#E9C76B" stroke-width="5"/>
  <circle cx="130" cy="-10" r="184" fill="none" stroke="#E9C76B" stroke-width="5"/>
  <circle cx="0" cy="142" r="175" fill="none" stroke="#E9C76B" stroke-width="5"/>
  <g fill="#FFF7E3" stroke="#B78935" stroke-width="2">
    <circle cx="-215" cy="-70" r="11"/><circle cx="-90" cy="-170" r="11"/><circle cx="0" cy="-25" r="13"/>
    <circle cx="120" cy="-165" r="11"/><circle cx="220" cy="-40" r="11"/><circle cx="-95" cy="150" r="11"/>
    <circle cx="10" cy="240" r="11"/><circle cx="130" cy="145" r="11"/>
  </g>
  <g stroke="#E9C76B" stroke-width="3" opacity=".9">
    <path d="M-215 -70 L-90 -170 L0 -25 L120 -165 L220 -40 L130 145 L10 240 L-95 150 Z" fill="none"/>
    <path d="M-215 -70 L0 -25 L220 -40 M-95 150 L0 -25 L130 145"/>
  </g>
</g>
<rect x="170" y="1110" width="684" height="150" rx="8" fill="#061329" stroke="#B78935" stroke-width="2"/>
<text x="512" y="1162" text-anchor="middle" fill="#FFF7E3" font-family="Georgia,serif" font-size="25">Every finite nonempty union-closed family</text>
<text x="512" y="1202" text-anchor="middle" fill="#FFF7E3" font-family="Georgia,serif" font-size="25">is conjectured to contain an element in at least half its sets.</text>
<text x="512" y="1243" text-anchor="middle" fill="#E9C76B" font-family="Arial,sans-serif" font-size="20" letter-spacing="5">OPEN CONJECTURE</text>
<text x="512" y="1394" text-anchor="middle" fill="#E9C76B" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PEDAGOGICAL ORIENTATION ONLY</text>
</svg>
