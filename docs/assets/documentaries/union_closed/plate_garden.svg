<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<title id="title">The Garden That Closes</title><desc id="desc">A branching garden of sets where pairs flow upward to their unions, illustrating local closure and the global frequency question.</desc><defs><radialGradient id="bg" cx="50%" cy="28%" r="82%"><stop offset="0" stop-color="#17365D"/><stop offset="0.62" stop-color="#071A36"/><stop offset="1" stop-color="#030D1D"/></radialGradient><pattern id="stars" width="96" height="96" patternUnits="userSpaceOnUse"><circle cx="18" cy="25" r="1.2" fill="#E9C76B" opacity=".55"/><circle cx="72" cy="58" r=".8" fill="#fff8dc" opacity=".4"/><circle cx="43" cy="83" r=".7" fill="#B78935" opacity=".35"/></pattern></defs><rect width="1024" height="1536" fill="url(#bg)"/><rect width="1024" height="1536" fill="url(#stars)" opacity=".65"/><rect x="28" y="28" width="968" height="1480" rx="8" fill="none" stroke="#B78935" stroke-width="5"/><rect x="43" y="43" width="938" height="1450" rx="4" fill="none" stroke="#E9C76B" stroke-width="1.5" opacity=".75"/><path d="M70 92 H290 M734 92 H954 M70 1444 H290 M734 1444 H954" stroke="#B78935" stroke-width="2"/><circle cx="512" cy="92" r="6" fill="#E9C76B"/><circle cx="512" cy="1444" r="6" fill="#E9C76B"/><text x="512" y="132" text-anchor="middle" fill="#E9C76B" font-family="Georgia,serif" font-size="22" letter-spacing="5">GRAND CHALLENGE LABS</text><text x="512" y="192" text-anchor="middle" fill="#FFF7E3" font-family="Georgia,serif" font-size="54" font-weight="600">The Garden That Closes</text><text x="512" y="232" text-anchor="middle" fill="#E9C76B" font-family="Georgia,serif" font-size="24" font-style="italic">Plate I · The Garden That Closes</text><g transform="translate(110 330)"><path d="M100 870 C180 680 240 590 390 470 C520 365 650 270 790 150" fill="none" stroke="#B78935" stroke-width="10" opacity=".45"/><g font-family="Georgia,serif" font-size="25" text-anchor="middle"><g transform="translate(70 870)"><rect width="210" height="86" rx="12" fill="#F3EAD5" stroke="#B78935" stroke-width="3"/><text x="105" y="52" fill="#1D2940">{a}</text></g><g transform="translate(320 850)"><rect width="210" height="86" rx="12" fill="#F3EAD5" stroke="#B78935" stroke-width="3"/><text x="105" y="52" fill="#1D2940">{b}</text></g><g transform="translate(180 650)"><rect width="250" height="90" rx="12" fill="#F3EAD5" stroke="#B78935" stroke-width="3"/><text x="125" y="55" fill="#1D2940">{a,b}</text></g><g transform="translate(505 610)"><rect width="250" height="90" rx="12" fill="#F3EAD5" stroke="#B78935" stroke-width="3"/><text x="125" y="55" fill="#1D2940">{b,c}</text></g><g transform="translate(360 390)"><rect width="300" height="96" rx="12" fill="#F3EAD5" stroke="#E9C76B" stroke-width="4"/><text x="150" y="59" fill="#1D2940">{a,b,c}</text></g></g><g stroke="#E9C76B" stroke-width="4"><path d="M175 850 L285 740"/><path d="M420 850 L340 740"/><path d="M310 650 L465 486"/><path d="M630 610 L565 486"/></g><text x="400" y="990" text-anchor="middle" fill="#FFF7E3" font-family="Georgia,serif" font-size="28">Closure governs pairs; Frankl asks for one globally abundant element.</text></g><text x="512" y="1394" text-anchor="middle" fill="#E9C76B" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PEDAGOGICAL ORIENTATION ONLY</text></svg>
