0 505 455 600 C410 690 300 690 250 600Z"/><path d="M490 420 C555 300 690 315 750 430 C690 540 550 540 490 420Z"/></g><g fill="#1D2940" text-anchor="middle" font-size="22"><text x="125" y="750">special</text><text x="125" y="780">families</text><text x="352" y="590">constant</text><text x="352" y="620">bounds</text><text x="620" y="410">formal and</text><text x="620" y="440">lattice results</text></g><line x1="80" y1="820" x2="760" y2="820" stroke="#E9C76B" stroke-width="5"/><g fill="#FFF7E3" font-size="25"><text x="80" y="870">0</text><text x="570" y="870" font-size="21">known constants</text><text x="760" y="870">1/2</text></g><circle cx="760" cy="820" r="16" fill="none" stroke="#9C5548" stroke-width="5"/><text x="420" y="980" text-anchor="middle" fill="#E9C76B" font-size="29">The frontier advances; the universal half threshold remains open.</text></g><text x="512" y="1394" text-anchor="middle" fill="#E9C76B" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PEDAGOGICAL ORIENTATION ONLY</text></svg>
