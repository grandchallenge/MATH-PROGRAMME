troke="#E9C76B" stroke-width="4"><circle cx="402" cy="120" r="34"/><circle cx="210" cy="350" r="30"/><circle cx="594" cy="350" r="30"/><circle cx="402" cy="560" r="30"/><circle cx="90" cy="600" r="28"/><circle cx="714" cy="600" r="28"/><circle cx="210" cy="820" r="30"/><circle cx="594" cy="820" r="30"/><circle cx="402" cy="1040" r="34"/></g><g fill="#1D2940" font-family="Georgia,serif" font-size="22" text-anchor="middle"><text x="402" y="128">⊤</text><text x="210" y="358">a∨b</text><text x="594" y="358">b∨c</text><text x="402" y="568">b</text><text x="90" y="608">a</text><text x="714" y="608">c</text><text x="210" y="828">u</text><text x="594" y="828">v</text><text x="402" y="1048">⊥</text></g><text x="402" y="900" text-anchor="middle" fill="#FFF7E3" font-family="Georgia,serif" font-size="27">Join closure, upper cones, irreducibles, and exact deletion obligations.</text></g><text x="512" y="1394" text-anchor="middle" fill="#E9C76B" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PEDAGOGICAL ORIENTATION ONLY</text></svg>
