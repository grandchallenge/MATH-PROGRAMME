<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<title id="title">The Certificate Forge</title><desc id="desc">A forge separates finite enumeration, Lean theorems, imported literature, hybrid certificates, and the still-open universal conjecture.</desc><defs><radialGradient id="bg" cx="50%" cy="28%" r="82%"><stop offset="0" stop-color="#17365D"/><stop offset="0.62" stop-color="#071A36"/><stop offset="1" stop-color="#030D1D"/></radialGradient><pattern id="stars" width="96" height="96" patternUnits="userSpaceOnUse"><circle cx="18" cy="25" r="1.2" fill="#E9C76B" opacity=".55"/><circle cx="72" cy="58" r=".8" fill="#fff8dc" opacity=".4"/><circle cx="43" cy="83" r=".7" fill="#B78935" opacity=".35"/></pattern></defs><rect width="1024" height="1536" fill="url(#bg)"/><rect width="1024" height="1536" fill="url(#stars)" opacity=".65"/><rect x="28" y="28" width="968" height="1480" rx="8" fill="none" stroke="#B78935" stroke-width="5"/><rect x="43" y="43" width="938" height="1450" rx="4" fill="none" stroke="#E9C76B" stroke-width="1.5" opacity=".75"/><path d="M70 92 H290 M734 92 H954 M70 1444 H290 M734 1444 H954" stroke="#B78935" stroke-width="2"/><circle cx="512" cy="92" r="6" fill="#E9C76B"/><circle cx="512" cy="1444" r="6" fill="#E9C76B"/><text x="512" y="132" text-anchor="middle" fill="#E9C76B" font-family="Georgia,serif" font-size="22" letter-spacing="5">GRAND CHALLENGE LABS</text><text x="512" y="192" text-anchor="middle" fill="#FFF7E3" font-family="Georgia,serif" font-size="54" font-weight="600">The Certificate Forge</text><text x="512" y="232" text-anchor="middle" fill="#E9C76B" font-family="Georgia,serif" font-size="24" font-style="italic">Plate V · The Certificate Forge</text><g transform="translate(95 350)" font-family="Georgia,serif"><path d="M410 40 L760 230 L650 760 L410 1020 L170 760 L60 230 Z" fill="#061329" stroke="#B78935" stroke-width="5"/><g fill="#F3EAD5" stroke="#E9C76B" stroke-width="3"><rect x="250" y="110" width="320" height="95" rx="10"/><rect x="130" y="300" width="260" height="95" rx="10"/><rect x="430" y="300" width="260" height="95" rx="10"/><rect x="130" y="510" width="260" height="95" rx="10"/><rect x="430" y="510" width="260" height="95" rx="10"/><rect x="250" y="720" width="320" height="110" rx="10"/></g><g fill="#1D2940" font-size="24" text-anchor="middle"><text x="410" y="168">Exact finite replay</text><text x="260" y="358">Lean theorem</text><text x="560" y="358">Literature result</text><text x="260" y="568">Hybrid package</text><text x="560" y="568">Source audit</text><text x="410" y="778">Claim boundary</text></g><g stroke="#B78935" stroke-width="5"><path d="M410 205 V720 M390 348 H430 M390 558 H430"/></g><text x="410" y="935" text-anchor="middle" fill="#E9C76B" font-size="28">A certificate proves only the claim encoded by its contract.</text><text x="410" y="980" text-anchor="middle" fill="#FFF7E3" font-size="24">No bounded artifact promotes the universal conjecture.</text></g><text x="512" y="1394" text-anchor="middle" fill="#E9C76B" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PEDAGOGICAL ORIENTATION ONLY</text></svg>
