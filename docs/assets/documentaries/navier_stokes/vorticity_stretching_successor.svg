N</text><text x="112" y="334" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" style="">∂tω + (u·∇)ω = (ω·∇)u + νΔω</text><text x="943" y="334" text-anchor="end" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" style="">schematic — not a simulation</text><rect x="110" y="390" width="245" height="475" rx="14" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="232" y="430" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700" style="">t₀</text><path d="M154.5 567 C232 555.0 232 555.0 309.5 567 L309.5 663 C232 675.0 232 675.0 154.5 663 Z" fill="#9ec2d7" stroke="#173b60" stroke-width="4" opacity="1"/><ellipse cx="154.5" cy="615" rx="16" ry="48" fill="none" opacity="1" stroke="#173b60" stroke-width="3"/><ellipse cx="309.5" cy="615" rx="16" ry="48" fill="none" opacity="1" stroke="#173b60" stroke-width="3"/><line x1="172.5" y1="615" x2="291.5" y2="615" stroke="#b43b2e" stroke-width="3" opacity="1"/><polygon points="291.5,615 279.5,622.2 279.5,607.8" fill="#b43b2e"/><text x="232.0" y="597.0" text-anchor="middle" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="600" style="">ω / stretch direction</text><text x="232" y="760" text-anchor="middle" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="600" style="">baseline tube</text><rect x="145" y="790" width="175" height="12" rx="6" fill="#e7dfcf" opacity="1"/><rect x="145" y="790" width="65" height="12" rx="6" fill="#b43b2e" opacity="0.7"/><rect x="385" y="390" width="245" height="475" rx="14" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="507" y="430" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700" style="">t₁</text><path d="M417.0 580 C507 571.25 507 571.25 597.0 580 L597