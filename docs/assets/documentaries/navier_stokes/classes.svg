<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">Weak existence is not smooth existence</title><desc id="d">Nested solution classes distinguish Leray–Hopf weak solutions, strong solutions, and globally smooth solutions.</desc><rect width="1024" height="1536" fill="#F2EAD7"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#B99043" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="54" fill="#071D2B">WEAK EXISTENCE IS NOT SMOOTH EXISTENCE</text><circle cx="512" cy="790" r="360" fill="#d8e2dd" stroke="#3d7380" stroke-width="8"/><circle cx="512" cy="790" r="235" fill="#e7d7b8" stroke="#B99043" stroke-width="8"/><circle cx="512" cy="790" r="115" fill="#071D2B" stroke="#B99043" stroke-width="8"/><text x="512" y="480" text-anchor="middle" font-family="Arial" font-size="28" fill="#071D2B">LERAY–HOPF WEAK</text><text x="512" y="620" text-anchor="middle" font-family="Arial" font-size="28" fill="#071D2B">STRONG</text><text x="512" y="800" text-anchor="middle" font-family="Arial" font-size="28" fill="#F2EAD7">SMOOTH</text></svg>