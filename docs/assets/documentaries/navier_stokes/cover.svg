<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The River and the Storm</title><desc id="d">A dark illuminated cover shows streamlines, a vortex, and the incompressible Navier–Stokes equation.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071D2B"/><stop offset="1" stop-color="#173b50"/></linearGradient><style>.s{font-family:Georgia,serif}.n{font-family:Arial,sans-serif}.g{fill:#d8b665}.r{stroke:#c29a48;fill:none}</style></defs><rect width="1024" height="1536" fill="url(#bg)"/><rect x="30" y="30" width="964" height="1476" class="r" stroke-width="3"/><text x="512" y="125" text-anchor="middle" class="n g" font-size="23" letter-spacing="4">GRAND CHALLENGE LIBRARY · NS-CI-001</text><text x="512" y="255" text-anchor="middle" class="s" fill="#fff7df" font-size="70">THE RIVER AND THE STORM</text><text x="512" y="325" text-anchor="middle" class="s g" font-size="29" font-style="italic">Navier–Stokes existence and smoothness</text><path d="M90 840 C260 680 350 990 520 815 S790 665 940 870" fill="none" stroke="#8bb5b8" stroke-width="12"/><path d="M90 900 C260 740 350 1050 520 875 S790 725 940 930" fill="none" stroke="#d8b665" stroke-width="5"/><circle cx="740" cy="820" r="110" fill="none" stroke="#d8b665" stroke-width="8" stroke-dasharray="18 10"/><text x="512" y="1230" text-anchor="middle" class="s" fill="#fff7df" font-size="39">∂ₜu + (u·∇)u = −∇p + νΔu</text><text x="512" y="1360" text-anchor="middle" class="s g" font-size="24" font-style="italic">Energy dissipates. Vorticity stretches. The global frontier remains open.</text></svg>