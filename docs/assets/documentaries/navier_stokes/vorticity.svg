<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">Energy guards; vorticity stretches</title><desc id="d">Energy cascades downward while a vortex tube lengthens and thins under three-dimensional stretching.</desc><rect width="1024" height="1536" fill="#F2EAD7"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#B99043" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="58" fill="#071D2B">ENERGY GUARDS; VORTICITY STRETCHES</text><path d="M180 780C280 420 700 420 840 780C700 1140 280 1140 180 780Z" fill="none" stroke="#3d7380" stroke-width="18"/><path d="M370 500C470 650 550 910 650 1060" fill="none" stroke="#B99043" stroke-width="9"/><text x="512" y="1320" text-anchor="middle" font-family="Georgia" font-size="30" fill="#071D2B">two dimensions omit the stretching term; three dimensions do not</text></svg>