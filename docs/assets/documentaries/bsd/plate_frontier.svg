<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">Islands of theorem, ocean of conjecture</title><desc id="d">Established islands show Mordell-Weil, modularity, and analytic rank zero or one; higher rank and strong BSD remain beyond the open frontier.</desc><defs><style>.s{font-family:Georgia,'Times New Roman',serif}.n{font-family:Arial,sans-serif}.navy{fill:#081a2e}.gold{fill:#d8b665}.rule{stroke:#c29a48;fill:none}</style></defs><rect width="1024" height="1536" fill="#0b2d46"/><rect x="30" y="30" width="964" height="1476" class="rule" stroke-width="3"/><text x="512" y="112" text-anchor="middle" class="n gold" font-size="25" letter-spacing="4">PLATE V · THE THEOREM FRONTIER</text><text x="512" y="205" text-anchor="middle" class="s" fill="#fff6dc" font-size="66">ISLANDS OF THEOREM</text><text x="512" y="265" text-anchor="middle" class="s gold" font-size="34" font-style="italic">Ocean of conjecture</text><path d="M0 430 C120 380 220 490 340 430 S570 380 690 455 S900 385 1024 440 V1536 H0Z" fill="#164764"/><path d="M0 560 C150 505 250 620 390 550 S650 510 770 590 S930 530 1024 575" fill="none" stroke="#6e9e9d" stroke-width="6" opacity=".7"/><g transform="translate(90 360)"><path d="M0 220 Q110 20 240 110 Q330 180 280 300 Q140 350 0 220Z" fill="#e8d8ba" stroke="#c29a48" stroke-width="4"/><text x="145" y="150" text-anchor="middle" class="n navy" font-size="21">MORDELL–WEIL</text><text x="145" y="195" text-anchor="middle" class="s navy" font-size="25">finite generation</text></g><g transform="translate(590 360)"><path d="M0 210 Q95 20 230 95 Q330 170 280 305 Q145 350 0 210Z" fill="#f3ead5" stroke="#c29a48" stroke-width="4"/><text x="145" y="150" text-anchor="middle" class="n navy" font-size="21">MODULARITY</text><text x="145" y="195" text-anchor="middle" class="s navy" font-size="25">analytic continuation</text></g><g transform="translate(310 750)"><path d="M0 220 Q120 25 285 90 Q420 170 350 330 Q165 370 0 220Z" fill="#e8d8ba" stroke="#c29a48" stroke-width="4"/><text x="185" y="145" text-anchor="middle" class="n navy" font-size="21">ANALYTIC RANK 0 OR 1</text><text x="185" y="195" text-anchor="middle" class="s navy" font-size="25">rank equality</text><text x="185" y="235" text-anchor="middle" class="s navy" font-size="24">finite Sha</text><text x="185" y="280" text-anchor="middle" class="n navy" font-size="17">GROSS–ZAGIER · KOLYVAGIN</text></g><path d="M95 1160 Q310 1065 510 1170 T930 1155" fill="none" stroke="#d8b665" stroke-width="5" stroke-dasharray="18 12"/><text x="512" y="1120" text-anchor="middle" class="n gold" font-size="22" letter-spacing="3">THE OPEN FRONTIER</text><text x="512" y="1250" text-anchor="middle" class="s" fill="#fff6dc" font-size="36">higher rank · universal finiteness of Sha</text><text x="512" y="1300" text-anchor="middle" class="s" fill="#fff6dc" font-size="36">complete complex leading-term formula</text><text x="512" y="1410" text-anchor="middle" class="s gold" font-size="28" font-style="italic">A database charts the coast. It does not cross the ocean.</text></svg>
