<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" role="img" aria-labelledby="title desc"><title id="title">Plate I — The congruent number 5</title><desc id="desc">A deterministic plot of y squared equals x cubed minus 25x marks the verified rational point 25/4,75/8 and displays the corresponding rational right triangle with sides 3/2, 20/3, and 41/6.</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset="1" stop-color="#102d4c"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7efd9"/><stop offset="1" stop-color="#dfcda8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".32"/></filter></defs><rect width="1055" height="1491" fill="url(#night)"/><rect x="26" y="26" width="1003" height="1439" rx="8" fill="none" opacity="1" stroke="#c99b3c" stroke-width="4"/><rect x="42" y="42" width="971" height="1407" rx="0" fill="none" opacity="1" stroke="#f0cf73" stroke-width="1"/><line x1="45" y1="120" x2="1010" y2="120" stroke="#c99b3c" stroke-width="2" opacity="1"/><line x1="45" y1="1370" x2="1010" y2="1370" stroke="#c99b3c" stroke-width="2" opacity="1"/><rect x="78" y="140" width="899" height="1175" rx="18" fill="url(#paper)" opacity="1" stroke="#c99b3c" stroke-width="4"/><text x="112" y="200" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="700" style="">Plate I — The congruent number 5</text><text x="112" y="244" text-anchor="start" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" style="font-style:italic;">Exact curve E₅, one verified rational point, and its area-five triangle.</text><text x="112" y="300" text-anchor="start" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">ORIENTATION</text><text x="112" y="334" text-anch