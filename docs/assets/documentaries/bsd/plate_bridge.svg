<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">From prime counts to the central point</title><desc id="d">Prime point counts become Euler factors and an L-function whose central zero is compared with rank.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c29a48"/></marker><style>.s{font-family:Georgia,'Times New Roman',serif}.n{font-family:Arial,sans-serif}.navy{fill:#081a2e}.gold{fill:#c29a48}.rule{stroke:#c29a48;fill:none}</style></defs><rect width="1024" height="1536" fill="#f3ead5"/><rect x="30" y="30" width="964" height="1476" class="rule" stroke-width="3"/><text x="512" y="112" text-anchor="middle" class="n navy" font-size="25" letter-spacing="4">PLATE III · LOCAL TO GLOBAL</text><text x="512" y="205" text-anchor="middle" class="s navy" font-size="66">EVERY PRIME WHISPERS</text><text x="512" y="265" text-anchor="middle" class="s gold" font-size="34" font-style="italic">The Euler product lets them speak together.</text><g transform="translate(85 365)"><g><rect width="180" height="150" rx="8" fill="#e7d7b8" stroke="#c29a48" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="n navy" font-size="22">p = 2</text><text x="90" y="90" text-anchor="middle" class="s navy" font-size="26">#E(F₂)</text></g><g transform="translate(220)"><rect width="180" height="150" rx="8" fill="#0d2940" stroke="#c29a48" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="n gold" font-size="22">p = 3</text><text x="90" y="90" text-anchor="middle" class="s" fill="#fff6dc" font-size="26">#E(F₃)</text></g><g transform="translate(440)"><rect width="180" height="150" rx="8" fill="#e7d7b8" stroke="#c29a48" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="n navy" font-size="22">p = 5</text><text x="90" y="90" text-anchor="middle" class="s navy" font-size="26">#E(F₅)</text></g><g transform="translate(660)"><rect width="180" height="150" rx="8" fill="#0d2940" stroke="#c29a48" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="n gold" font-size="22">p = 7</text><text x="90" y="90" text-anchor="middle" class="s" fill="#fff6dc" font-size="26">#E(F₇)</text></g></g><path d="M512 555v125" stroke="#c29a48" stroke-width="5" marker-end="url(#a)"/><g transform="translate(130 720)"><rect width="764" height="210" rx="16" fill="#0d2940" stroke="#c29a48" stroke-width="3"/><text x="382" y="60" text-anchor="middle" class="n gold" font-size="22">THE GLOBAL ANALYTIC OBJECT</text><text x="382" y="128" text-anchor="middle" class="s" fill="#fff6dc" font-size="42">L(E,s) = ∏ₚ Lₚ(E,s)</text><text x="382" y="175" text-anchor="middle" class="s gold" font-size="24">all good and bad local factors retained</text></g><path d="M512 950v125" stroke="#c29a48" stroke-width="5" marker-end="url(#a)"/><g transform="translate(170 1110)"><line x1="0" y1="120" x2="680" y2="120" stroke="#6d6250" stroke-width="2"/><line x1="340" y1="0" x2="340" y2="210" stroke="#6d6250" stroke-width="2"/><path d="M0 42 C110 196 225 120 340 120 S540 28 680 185" fill="none" stroke="#355d78" stroke-width="7"/><circle cx="340" cy="120" r="12" fill="#c29a48"/><text x="340" y="260" text-anchor="middle" class="s navy" font-size="30">How deep is the silence at s = 1?</text></g><text x="512" y="1450" text-anchor="middle" class="s gold" font-size="27" font-style="italic">No single prime knows the rank.</text></svg>
