<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">Two ledgers in the same hand</title><desc id="d">The arithmetic ledger of rational points is paired with the analytic ledger of point counts and the L-function.</desc><defs><style>.s{font-family:Georgia,'Times New Roman',serif}.n{font-family:Arial,sans-serif}.navy{fill:#081a2e}.gold{fill:#c29a48}.rule{stroke:#c29a48;fill:none}</style></defs><rect width="1024" height="1536" fill="#f3ead5"/><rect x="30" y="30" width="964" height="1476" class="rule" stroke-width="3"/><text x="512" y="112" text-anchor="middle" class="n navy" font-size="25" letter-spacing="4">PLATE II · TWO LEDGERS</text><text x="512" y="205" text-anchor="middle" class="s navy" font-size="66">ONE CURVE, TWO LANGUAGES</text><text x="512" y="265" text-anchor="middle" class="s gold" font-size="34" font-style="italic">Arithmetic remembers. Analysis listens.</text><g transform="translate(70 350)"><rect width="390" height="900" rx="14" fill="#fffaf0" stroke="#c29a48" stroke-width="3"/><text x="195" y="65" text-anchor="middle" class="n navy" font-size="22">ARITHMETIC LEDGER</text><path d="M45 235 C110 90 160 100 200 235 S300 380 345 235" fill="none" stroke="#355d78" stroke-width="6"/><g fill="#c29a48"><circle cx="90" cy="170" r="9"/><circle cx="155" cy="285" r="9"/><circle cx="245" cy="145" r="9"/><circle cx="310" cy="310" r="9"/></g><text x="195" y="420" text-anchor="middle" class="s navy" font-size="34">E(ℚ) ≅ ℤʳ ⊕ torsion</text><line x1="60" y1="465" x2="330" y2="465" class="rule"/><text x="75" y="535" class="s navy" font-size="28">• rational generators</text><text x="75" y="595" class="s navy" font-size="28">• torsion cycles</text><text x="75" y="655" class="s navy" font-size="28">• canonical heights</text><text x="75" y="715" class="s navy" font-size="28">• regulator determinant</text></g><g transform="translate(564 350)"><rect width="390" height="900" rx="14" fill="#0d2940" stroke="#c29a48" stroke-width="3"/><text x="195" y="65" text-anchor="middle" class="n gold" font-size="22">ANALYTIC LEDGER</text><g fill="#fff0b5"><circle cx="80" cy="150" r="7"/><circle cx="150" cy="120" r="5"/><circle cx="220" cy="180" r="8"/><circle cx="300" cy="130" r="6"/><circle cx="110" cy="240" r="9"/><circle cx="260" cy="250" r="7"/></g><text x="195" y="420" text-anchor="middle" class="s" fill="#fff6dc" font-size="31">L(E,s) = ∏ Lₚ(E,s)</text><line x1="60" y1="465" x2="330" y2="465" class="rule"/><text x="75" y="535" class="s" fill="#fff6dc" font-size="28">• point counts mod p</text><text x="75" y="595" class="s" fill="#fff6dc" font-size="28">• Euler factors</text><text x="75" y="655" class="s" fill="#fff6dc" font-size="28">• functional equation</text><text x="75" y="715" class="s" fill="#fff6dc" font-size="28">• central Taylor series</text><g transform="translate(45 790)"><line x1="0" y1="80" x2="300" y2="80" stroke="#8ea9b9" stroke-width="2"/><line x1="150" y1="0" x2="150" y2="160" stroke="#8ea9b9" stroke-width="2"/><path d="M0 30 C75 130 110 80 150 80 S225 15 300 130" fill="none" stroke="#e2bf74" stroke-width="6"/><circle cx="150" cy="80" r="9" fill="#fff0b5"/></g></g><g transform="translate(512 815)"><circle r="92" fill="#f3ead5" stroke="#c29a48" stroke-width="5"/><text x="0" y="-12" text-anchor="middle" class="n navy" font-size="23">BSD</text><text x="0" y="26" text-anchor="middle" class="s navy" font-size="26">r = ord</text></g><text x="512" y="1360" text-anchor="middle" class="s navy" font-size="35" font-style="italic">The conjecture says the ledgers balance exactly.</text></svg>
