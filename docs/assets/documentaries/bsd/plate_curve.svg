<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The ancient question of rational solutions</title><desc id="d">Rational triangles, a cubic curve, sparse rational points, and a warning that finite search is not a proof.</desc><defs><style>.s{font-family:Georgia,'Times New Roman',serif}.n{font-family:Arial,sans-serif}.navy{fill:#081a2e}.gold{fill:#c29a48}.rule{stroke:#c29a48;fill:none}</style></defs><rect width="1024" height="1536" fill="#f3ead5"/><rect x="30" y="30" width="964" height="1476" class="rule" stroke-width="3"/><rect x="48" y="48" width="928" height="1440" class="rule" opacity=".45"/><text x="512" y="112" text-anchor="middle" class="n navy" font-size="25" letter-spacing="4">PLATE I · RATIONAL SOLUTIONS</text><text x="512" y="205" text-anchor="middle" class="s navy" font-size="66">THE ANCIENT QUESTION</text><text x="512" y="265" text-anchor="middle" class="s gold" font-size="34" font-style="italic">A point is easy. All points are hard.</text><g transform="translate(80 360)"><rect width="390" height="410" rx="12" fill="#e7d7b8" stroke="#c29a48" stroke-width="2"/><text x="195" y="50" text-anchor="middle" class="n navy" font-size="22">CONGRUENT-NUMBER DOORWAY</text><path d="M70 315 L320 315 L70 120 Z" fill="none" stroke="#355d78" stroke-width="8"/><rect x="70" y="285" width="30" height="30" fill="none" stroke="#c29a48" stroke-width="4"/><text x="195" y="360" text-anchor="middle" class="s navy" font-size="30">Area = 5</text></g><g transform="translate(554 360)"><rect width="390" height="410" rx="12" fill="#0d2940" stroke="#c29a48" stroke-width="2"/><text x="195" y="50" text-anchor="middle" class="n gold" font-size="22">THE CURVE</text><path d="M30 245 C85 90 135 85 185 245 S285 400 355 245" fill="none" stroke="#e2bf74" stroke-width="7"/><path d="M30 245 C90 205 125 290 185 245 S290 200 355 245" fill="none" stroke="#79a5a4" stroke-width="3"/><g fill="#fff0b5"><circle cx="92" cy="160" r="8"/><circle cx="150" cy="292" r="8"/><circle cx="243" cy="135" r="8"/><circle cx="300" cy="312" r="8"/></g><text x="195" y="355" text-anchor="middle" class="s" fill="#fff6dc" font-size="31">y² = x³ − 25x</text></g><g transform="translate(85 850)"><rect width="854" height="420" rx="12" fill="#fffaf0" stroke="#c29a48" stroke-width="2"/><text x="427" y="55" text-anchor="middle" class="n navy" font-size="22">THE CONSTELLATION OF RATIONAL POINTS</text><line x1="90" y1="230" x2="765" y2="230" stroke="#6d6250" stroke-width="2"/><line x1="427" y1="95" x2="427" y2="340" stroke="#6d6250" stroke-width="2"/><g fill="#355d78"><circle cx="130" cy="145" r="8"/><circle cx="190" cy="285" r="11"/><circle cx="270" cy="195" r="7"/><circle cx="345" cy="310" r="9"/><circle cx="500" cy="150" r="10"/><circle cx="585" cy="280" r="7"/><circle cx="680" cy="125" r="12"/><circle cx="740" cy="300" r="9"/></g><text x="427" y="380" text-anchor="middle" class="s" fill="#6d6250" font-size="25">Finite search can find stars. It cannot certify that the sky is complete.</text></g><text x="512" y="1400" text-anchor="middle" class="s navy" font-size="31" font-style="italic">Rank is the number of independent arithmetic directions.</text></svg>
