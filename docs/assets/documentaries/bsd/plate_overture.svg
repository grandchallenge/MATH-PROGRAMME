<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The strong BSD ledger</title><desc id="d">The leading-term formula is surrounded by period, regulator, Tate-Shafarevich, Tamagawa, and torsion terms.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#061527"/><stop offset="1" stop-color="#12344a"/></linearGradient><style>.s{font-family:Georgia,'Times New Roman',serif}.n{font-family:Arial,sans-serif}.navy{fill:#081a2e}.gold{fill:#d8b665}.rule{stroke:#c29a48;fill:none}</style></defs><rect width="1024" height="1536" fill="url(#bg)"/><rect x="30" y="30" width="964" height="1476" class="rule" stroke-width="3"/><text x="512" y="112" text-anchor="middle" class="n gold" font-size="25" letter-spacing="4">PLATE IV · THE REFINED LEDGER</text><text x="512" y="205" text-anchor="middle" class="s" fill="#fff6dc" font-size="66">THE FIRST NONZERO NOTE</text><text x="512" y="265" text-anchor="middle" class="s gold" font-size="34" font-style="italic">Every arithmetic term enters with exact weight.</text><g transform="translate(100 360)"><rect width="824" height="340" rx="20" fill="#f3ead5" stroke="#c29a48" stroke-width="4"/><text x="412" y="75" text-anchor="middle" class="n navy" font-size="22">STRONG BSD · FIXED CONVENTIONS REQUIRED</text><text x="412" y="160" text-anchor="middle" class="s navy" font-size="42">L⁽ʳ⁾(E,1) / r!</text><line x1="275" y1="190" x2="550" y2="190" stroke="#c29a48" stroke-width="4"/><text x="412" y="250" text-anchor="middle" class="s navy" font-size="34">Ω · Reg · #Sha · ∏cₚ</text><text x="412" y="302" text-anchor="middle" class="s navy" font-size="27">divided by torsion²</text></g><g transform="translate(512 1050)"><circle r="255" fill="none" stroke="#c29a48" stroke-width="2" stroke-dasharray="8 10"/><circle r="115" fill="#f3ead5" stroke="#c29a48" stroke-width="4"/><text text-anchor="middle" y="-10" class="n navy" font-size="22">CENTRAL</text><text text-anchor="middle" y="30" class="s navy" font-size="34">s = 1</text><g transform="translate(0 -255)"><circle r="72" fill="#e7d7b8" stroke="#c29a48" stroke-width="3"/><text text-anchor="middle" y="5" class="s navy" font-size="30">Ω</text><text text-anchor="middle" y="35" class="n navy" font-size="16">PERIOD</text></g><g transform="translate(240 -75)"><circle r="72" fill="#0d2940" stroke="#c29a48" stroke-width="3"/><text text-anchor="middle" y="5" class="s gold" font-size="28">Reg</text><text text-anchor="middle" y="35" class="n gold" font-size="16">HEIGHTS</text></g><g transform="translate(150 205)"><circle r="72" fill="#e7d7b8" stroke="#c29a48" stroke-width="3"/><text text-anchor="middle" y="5" class="s navy" font-size="28">#Sha</text><text text-anchor="middle" y="35" class="n navy" font-size="14">LOCAL/GLOBAL</text></g><g transform="translate(-150 205)"><circle r="72" fill="#0d2940" stroke="#c29a48" stroke-width="3"/><text text-anchor="middle" y="5" class="s gold" font-size="28">∏cₚ</text><text text-anchor="middle" y="35" class="n gold" font-size="14">BAD PRIMES</text></g><g transform="translate(-240 -75)"><circle r="72" fill="#e7d7b8" stroke="#c29a48" stroke-width="3"/><text text-anchor="middle" y="5" class="s navy" font-size="28">tors²</text><text text-anchor="middle" y="35" class="n navy" font-size="14">FINITE</text></g></g><text x="512" y="1450" text-anchor="middle" class="s gold" font-size="27" font-style="italic">Numerical balance is evidence until every term is certified.</text></svg>
