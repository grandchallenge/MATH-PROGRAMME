<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" role="img" aria-labelledby="title desc"><title id="title">Plate III — The cycle-class map</title><desc id="desc">A conceptual vector diagram maps codimension-p algebraic cycles with rational coefficients through the cycle-class map into rational Hodge classes, showing possible information loss and a dashed conjectural converse.</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06152b"/><stop offset="1" stop-color="#102d4c"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7efd9"/><stop offset="1" stop-color="#dfcda8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".32"/></filter></defs><rect width="1055" height="1491" fill="url(#night)"/><rect x="26" y="26" width="1003" height="1439" rx="8" fill="none" opacity="1" stroke="#c99b3c" stroke-width="4"/><rect x="42" y="42" width="971" height="1407" rx="0" fill="none" opacity="1" stroke="#f0cf73" stroke-width="1"/><line x1="45" y1="120" x2="1010" y2="120" stroke="#c99b3c" stroke-width="2" opacity="1"/><line x1="45" y1="1370" x2="1010" y2="1370" stroke="#c99b3c" stroke-width="2" opacity="1"/><rect x="78" y="140" width="899" height="1175" rx="18" fill="url(#paper)" opacity="1" stroke="#c99b3c" stroke-width="4"/><text x="112" y="200" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="700" style="">Plate III — The cycle-class map</text><text x="112" y="244" text-anchor="start" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="400" style="font-style:italic;">Established algebraic-to-Hodge direction; conjectural rational converse isolated.</text><text x="112" y="300" text-anchor="start" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">ORIENTATION</text><text x="112" y="334" text-anchor="start" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700" style="">codimension p on a smooth projective X</text><text x="943" y="334" text-anchor="end" fill="#46785b" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" style="">conceptual exact labels</text><rect x="120" y="430" width="315" height="430" rx="16" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="3"/><text x="277" y="475" text-anchor="middle" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700" style="">ALGEBRAIC SIDE</text><text x="277" y="535" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" style="">Zᵖ(X) ⊗ Q</text><ellipse cx="277" cy="615" rx="95.0" ry="28" fill="#dce8ef" opacity="1" stroke="#173b60" stroke-width="2"/><text x="277" y="621" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="600" style="">codim-p cycle 1</text><ellipse cx="277" cy="675" rx="77.5" ry="28" fill="#dce8ef" opacity="1" stroke="#173b60" stroke-width="2"/><text x="277" y="681" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="600" style="">codim-p cycle 2</text><ellipse cx="277" cy="735" rx="105.0" ry="28" fill="#dce8ef" opacity="1" stroke="#173b60" stroke-width="2"/><text x="277" y="741" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="600" style="">codim-p cycle 3</text><text x="277" y="815" text-anchor="middle" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="600" style="">formal Q-linear combinations</text><line x1="450" y1="645" x2="605" y2="645" stroke="#b43b2e" stroke-width="4" opacity="1"/><polygon points="605,645 593.0,652.2 593.0,637.8" fill="#b43b2e"/><text x="527.5" y="627.0" text-anchor="middle" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="600" style="">clᵖ</text><text x="527" y="700" text-anchor="middle" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">cycle-class map</text><rect x="620" y="430" width="315" height="430" rx="16" fill="#fffaf0" opacity="1" stroke="#c99b3c" stroke-width="3"/><text x="777" y="475" text-anchor="middle" fill="#c99b3c" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700" style="">COHOMOLOGICAL SIDE</text><text x="777" y="545" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="25" font-weight="700" style="">H²ᵖ(X,Q) ∩ Hᵖ,ᵖ(X)</text><text x="777" y="625" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="600" style="">rational Hodge classes</text><path d="M665 705 C710 675 735 675 770 705" fill="none" stroke="#2e719e" stroke-width="3" opacity="1"/><path d="M665 740 C710 710 735 710 770 705" fill="none" stroke="#2e719e" stroke-width="3" opacity="1"/><circle cx="800" cy="705" r="26" fill="#dce8ef" opacity="1" stroke="#173b60" stroke-width="2"/><text x="800" y="711" text-anchor="middle" fill="#173b60" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="700" style="">α</text><text x="777" y="790" text-anchor="middle" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="600" style="">different cycles may share a class</text><rect x="120" y="930" width="815" height="250" rx="12" fill="#f3ead6" opacity="1" stroke="#c99b3c" stroke-width="2"/><text x="145" y="970" text-anchor="start" fill="#46785b" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">ESTABLISHED DIRECTION</text><text x="145" y="1008" text-anchor="start" fill="#46785b" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" style="">algebraic cycles  →  rational (p,p) classes</text><line x1="145" y1="1040" x2="910" y2="1040" stroke="#c99b3c" stroke-width="1" opacity="1"/><text x="145" y="1080" text-anchor="start" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="700" style="">OPEN CONVERSE</text><text x="145" y="1118" text-anchor="start" fill="#b43b2e" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="700" style="">rational Hodge class  ⇢  Q-combination of algebraic cycles ?</text><text x="145" y="1152" text-anchor="start" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="600" style="">No injectivity or general surjectivity is asserted by this diagram.</text><line x1="112" y1="1252" x2="943" y2="1252" stroke="#c99b3c" stroke-width="2" opacity="1"/><text x="527" y="1292" text-anchor="middle" fill="#6e7781" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="600" style="">Pedagogical reconstruction · visual_is_evidence = false</text></svg>