<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The exact rational frontier</title><desc id="d">Known divisor and low-dimensional terrain is separated from false integral and unrestricted Kähler variants.</desc><rect width="1024" height="1536" fill="#F3E9D8"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#B89549" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="62" fill="#14203A">THE EXACT RATIONAL FRONTIER</text><rect x="130" y="420" width="330" height="650" fill="#e6ddeb" stroke="#7b689c" stroke-width="8"/><rect x="565" y="420" width="330" height="650" fill="#f0d9d0" stroke="#8c3d2e" stroke-width="8"/><text x="295" y="650" text-anchor="middle" font-family="Georgia" font-size="34" fill="#14203A">rational</text><text x="295" y="710" text-anchor="middle" font-family="Georgia" font-size="34" fill="#14203A">smooth</text><text x="295" y="770" text-anchor="middle" font-family="Georgia" font-size="34" fill="#14203A">projective</text><text x="730" y="650" text-anchor="middle" font-family="Georgia" font-size="34" fill="#8c3d2e">integral</text><text x="730" y="710" text-anchor="middle" font-family="Georgia" font-size="34" fill="#8c3d2e">unrestricted</text><text x="730" y="770" text-anchor="middle" font-family="Georgia" font-size="34" fill="#8c3d2e">Kähler</text></svg>