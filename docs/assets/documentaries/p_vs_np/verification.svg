<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">Finding and checking</title><desc id="d">A maze contrasts discovering a path with rapidly verifying a supplied path certificate.</desc><rect width="1024" height="1536" fill="#F3EBD8"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#C39A45" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="64" fill="#11172B">FINDING AND CHECKING</text><path d="M150 500h220v170H250v160h270V650h180v210h180" fill="none" stroke="#485b91" stroke-width="15"/><path d="M150 1040h720" stroke="#C39A45" stroke-width="8" stroke-dasharray="22 12"/><text x="512" y="1260" text-anchor="middle" font-family="Georgia" font-size="30" fill="#11172B">a short certificate may be easier to verify than to discover</text></svg>