<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d"><title id="t">The grammar of reduction</title><desc id="d">Directed gateways map one decision problem into another while preserving yes and no instances.</desc><rect width="1024" height="1536" fill="#F3EBD8"/><rect x="35" y="35" width="954" height="1466" fill="none" stroke="#C39A45" stroke-width="3"/><text x="512" y="150" text-anchor="middle" font-family="Georgia" font-size="64" fill="#11172B">THE GRAMMAR OF REDUCTION</text><circle cx="250" cy="760" r="125" fill="#dcd8c8" stroke="#485b91" stroke-width="8"/><circle cx="770" cy="760" r="125" fill="#11172B" stroke="#C39A45" stroke-width="8"/><path d="M390 760H620" stroke="#C39A45" stroke-width="12"/><path d="M620 730l65 30-65 30z" fill="#C39A45"/><text x="250" y="775" text-anchor="middle" font-family="Arial" font-size="42" fill="#11172B">A</text><text x="770" y="775" text-anchor="middle" font-family="Arial" font-size="42" fill="#F3EBD8">B</text><text x="512" y="1180" text-anchor="middle" font-family="Georgia" font-size="34" fill="#11172B">x ∈ A ⇔ f(x) ∈ B</text></svg>