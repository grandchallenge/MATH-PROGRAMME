<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" role="img" aria-labelledby="title desc"><title id="title">Controlled cyclotomic enlargement</title><desc id="desc">Restriction injects the original Sha module into the enlarged one. The extension degree is bounded polynomially, root order and complex places exceed the required threshold, and the relative different controls the discriminant.</desc><rect width="760" height="335" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#20262b" text-anchor="middle"><text x="380" y="34" font-size="23" font-weight="700">Controlled cyclotomic enlargement</text><path d="M28 49 H732" stroke="#d8dde0"/><rect x="32" y="72" width="255" height="79" rx="6" fill="#f5f6f7" stroke="#a5afb4"/><text x="159" y="96" font-size="17" font-weight="700">Original field L</text><text x="159" y="121" font-size="14">Degree n, discriminant D</text><rect x="473" y="72" width="255" height="79" rx="6" fill="#eaf1f3" stroke="#35647a"/><text x="600" y="96" font-size="17" font-weight="700">Enlarged field L′</text><text x="600" y="121" font-size="14">Degree n′ = dn</text><path d="M287 111 H473 M465 105 L473 111 L465 117" stroke="#35647a" stroke-width="2" fill="none"/><text x="380" y="96" font-size="13">Restriction injective</text><text x="380" y="141" font-size="12">d = ℓᵐ</text><rect x="32" y="174" width="696" height="112" rx="6" fill="#f5f6f7" stroke="#d8dde0"/><text x="380" y="196" font-size="15" font-weight="700">Simultaneous controls</text><text x="380" y="222" font-size="16">4E+4 ≤ d ≤ (n+1)(4E+4)</text><text x="380" y="246" font-size="16">2E+1 &lt; w ≤ 2n′;  2E+1 &lt; r₂(L′)</text><text x="380" y="270" font-size="16">D′ ≤ Dᵈ wⁿ′</text><text x="380" y="312" font-size="13" fill="#56616a">The enlarged field meets the homological hypotheses at a controlled cost.</text></g></svg>
