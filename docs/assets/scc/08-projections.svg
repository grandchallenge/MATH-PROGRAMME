<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title description"><title id="title">Plate 08 — Complementary projections</title><desc id="description">Exact assignment sets for ac=1 and ac=0 on three variables (two and six respectively). Arrows schematically indicate that the cohomology projections admit representatives supported in these sets; no equality of set size and dimension is claimed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="450" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  08     COMPLEMENTARY PROJECTIONS</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="start">Complementary support regions</text><text x="28" y="103" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="start">Example: g = ac on three input bits.</text><rect x="28" y="130" width="220" height="161" rx="4" fill="#d6e5df" stroke="#276c70"/><text x="48" y="160" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#276c70" text-anchor="start">g = 1</text><rect x="48" y="180" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="81" y="202" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">101</text><rect x="125" y="180" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="158" y="202" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">111</text><text x="48" y="272" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">2 input assignments</text><rect x="270" y="130" width="462" height="161" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="290" y="160" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142941" text-anchor="start">g = 0</text><rect x="290" y="180" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="323" y="202" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">000</text><rect x="367" y="180" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="400" y="202" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">001</text><rect x="444" y="180" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="477" y="202" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">010</text><rect x="290" y="222" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="323" y="244" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">011</text><rect x="367" y="222" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="400" y="244" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">100</text><rect x="444" y="222" width="66" height="32" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="477" y="244" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">110</text><text x="290" y="272" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">6 input assignments</text><path d="M138 291 L138 325" fill="none" stroke="#276c70" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M501 291 L501 325" fill="none" stroke="#276c70" stroke-width="1.8" marker-end="url(#arrow)"/><text x="138" y="352" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#276c70" text-anchor="middle">im P</text><text x="501" y="352" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#142941" text-anchor="middle">im (1+P)</text><text x="380" y="398" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="middle">L = im P  ⊕  im (1+P)</text><text x="380" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="middle">Cell sizes are literal; the cohomology dimensions are not depicted.</text></svg>
