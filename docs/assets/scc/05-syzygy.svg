<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" role="img" aria-labelledby="title description"><title id="title">Plate 05 — The relation between relationships</title><desc id="description">The exact Boolean products y=ab and t=ac obey cy=bt=abc. The geometry and edge placement are schematic, while the equations are literal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="475" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  05     THE RELATION BETWEEN RELATIONSHIPS</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="start">Two ways to compute the same product</text><text x="28" y="104" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="start">Work over the binary field. One old gate, one new gate.</text><circle cx="172" cy="144" r="22" fill="#fffdf7" stroke="#4d6072"/><text x="172" y="152" font-family="Georgia, serif" font-size="25" font-weight="400" fill="#142941" text-anchor="middle">a</text><circle cx="380" cy="144" r="22" fill="#fffdf7" stroke="#4d6072"/><text x="380" y="152" font-family="Georgia, serif" font-size="25" font-weight="400" fill="#142941" text-anchor="middle">b</text><circle cx="588" cy="144" r="22" fill="#fffdf7" stroke="#4d6072"/><text x="588" y="152" font-family="Georgia, serif" font-size="25" font-weight="400" fill="#142941" text-anchor="middle">c</text><path d="M172 166 L205 207" fill="none" stroke="#4d6072" stroke-width="1.6"/><path d="M380 166 L295 207" fill="none" stroke="#4d6072" stroke-width="1.6"/><rect x="183" y="207" width="134" height="45" rx="4" fill="#fffdf7" stroke="#4d6072"/><text x="250" y="236" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#4d6072" text-anchor="middle">y = ab</text><path d="M172 166 L465 207" fill="none" stroke="#276c70" stroke-width="1.6"/><path d="M588 166 L555 207" fill="none" stroke="#276c70" stroke-width="1.6"/><rect x="443" y="207" width="134" height="45" rx="4" fill="#d6e5df" stroke="#276c70"/><text x="510" y="236" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#276c70" text-anchor="middle">t = ac</text><path d="M250 252 L250 292" fill="none" stroke="#4d6072" stroke-width="2" marker-end="url(#arrow)"/><path d="M510 252 L510 292" fill="none" stroke="#276c70" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="321" font-family="Georgia, serif" font-size="30" font-weight="400" fill="#142941" text-anchor="middle">cy</text><text x="510" y="321" font-family="Georgia, serif" font-size="30" font-weight="400" fill="#276c70" text-anchor="middle">bt</text><text x="380" y="321" font-family="Georgia, serif" font-size="32" font-weight="400" fill="#142941" text-anchor="middle">=</text><path d="M250 334 L380 369" fill="none" stroke="#4d6072" stroke-width="1.8"/><path d="M510 334 L380 369" fill="none" stroke="#276c70" stroke-width="1.8"/><rect x="296" y="369" width="168" height="51" rx="4" fill="#f1e4cc" stroke="#966a28"/><text x="380" y="401" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#142941" text-anchor="middle">abc</text><text x="380" y="449" font-family="Georgia, serif" font-size="21" font-weight="400" fill="#142941" text-anchor="middle">A new symbol; an old dependency.</text></svg>
