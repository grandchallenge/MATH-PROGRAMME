<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-labelledby="title description"><title id="title">Plate 03 — The graded promotion law</title><desc id="description">Exact graded dimensions on four input bits before and after computing ab: before 1,4,6,4,1; after 1,5,7,3,0. The four directions ab, abc, abd, abcd drop one degree.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="512" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  03     THE GRADED PROMOTION LAW</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="start">Before: affine primitives</text><text x="28" y="104" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#276c70" text-anchor="start">After: one new primitive y = ab</text><text x="45" y="142" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4d6072" text-anchor="start">Degree</text><text x="151" y="142" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4d6072" text-anchor="start">Before</text><text x="385" y="142" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#276c70" text-anchor="start">After</text><text x="74" y="182" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">0</text><path d="M29 197 L731 197" fill="none" stroke="#c7c6b9" stroke-width="1"/><rect x="153" y="161" width="22" height="27" rx="2" fill="#fffdf7" stroke="#4d6072"/><rect x="385" y="161" width="22" height="27" rx="2" fill="#d6e5df" stroke="#276c70"/><text x="347" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="40