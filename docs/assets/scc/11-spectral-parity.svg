<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title description"><title id="title">Plate 11 — Joint spectral coherence</title><desc id="description">Exact three-coordinate slice of odd Walsh numerator support for the constructed target, contrasted with an affine reference of equal size. The actual marked frequencies are 000,001,010,100 and lack 011; the affine reference contains 000,001,010,011. All other u coordinates are zero and v is fixed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="510" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  11     JOINT SPECTRAL COHERENCE</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="25" font-weight="400" fill="#142941" text-anchor="start">Same number of odd coefficients; different geometry</text><text x="28" y="106" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">A slice at any fixed v, using three binary coordinates of u.</text><rect x="30" y="130" width="332" height="247" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="196" y="161" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="middle">Affine reference</text><rect x="59" y="181" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="90" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">000</text><rect x="131" y="181" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="162" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">001</text><rect x="203" y="181" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="234" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">010</text><rect x="275" y="181" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="306" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">011</text><rect x="59" y="253" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="90" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">100</text><rect x="131" y="253" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="162" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">101</text><rect x="203" y="253" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="234" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">110</text><rect x="275" y="253" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="306" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">111</text><text x="196" y="347" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">000 + 001 + 010 = 011</text><text x="196" y="368" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#276c70" text-anchor="middle">011 is present</text><rect x="398" y="130" width="332" height="247" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="564" y="161" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="middle">Actual target</text><rect x="427" y="181" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="458" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">000</text><rect x="499" y="181" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="530" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">001</text><rect x="571" y="181" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="602" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">010</text><rect x="643" y="181" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="674" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">011</text><rect x="427" y="253" width="62" height="55" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="458" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#276c70" text-anchor="middle">100</text><rect x="499" y="253" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="530" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">101</text><rect x="571" y="253" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="602" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">110</text><rect x="643" y="253" width="62" height="55" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="674" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4d6072" text-anchor="middle">111</text><text x="564" y="347" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142941" text-anchor="middle">000 + 001 + 010 = 011</text><text x="564" y="368" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#966a28" text-anchor="middle">011 is absent</text><path d="M24 394 L736 394" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="380" y="427" font-family="Georgia, serif" font-size="21" font-weight="400" fill="#142941" text-anchor="middle">Both patterns have four points.</text><text x="380" y="455" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">Only the reference is closed under affine combinations.</text><text x="380" y="485" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#276c70" text-anchor="middle">The actual target cannot attain zero spectral slack.</text></svg>
