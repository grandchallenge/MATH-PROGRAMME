<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title description"><title id="title">Plate 04 — A sharp one-gate ceiling</title><desc id="description">Exact four-cell partition of the sixteen assignments of a,b,c,d. The indicator ab is one on four assignments. Complementing operands keeps the degree-two symbol unchanged, so the smallest cell bounds the graded rank.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="470" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  04     A SHARP ONE-GATE CEILING</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="79" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#142941" text-anchor="start">Four possible joint values</text><text x="28" y="104" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="start">Each cell has four assignments of the remaining bits c,d.</text><rect x="30" y="132" width="166" height="164" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="113" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#142941" text-anchor="middle">a=0    b=0</text><text x="113" y="184" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="middle">g = 0</text><rect x="55" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="80.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0000</text><rect x="120" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="145.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0001</text><rect x="55" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="80.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0010</text><rect x="120" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="145.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0011</text><rect x="209" y="132" width="166" height="164" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="292" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#142941" text-anchor="middle">a=0    b=1</text><text x="292" y="184" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="middle">g = 0</text><rect x="234" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="259.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0100</text><rect x="299" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="324.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0101</text><rect x="234" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="259.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0110</text><rect x="299" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="324.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">0111</text><rect x="388" y="132" width="166" height="164" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="471" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#142941" text-anchor="middle">a=1    b=0</text><text x="471" y="184" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="middle">g = 0</text><rect x="413" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="438.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1000</text><rect x="478" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="503.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1001</text><rect x="413" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="438.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1010</text><rect x="478" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="503.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1011</text><rect x="567" y="132" width="166" height="164" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="650" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#142941" text-anchor="middle">a=1    b=1</text><text x="650" y="184" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#276c70" text-anchor="middle">g = 1</text><rect x="592" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="617.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1100</text><rect x="657" y="199" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="682.5" y="218" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1101</text><rect x="592" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="617.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1110</text><rect x="657" y="239" width="51" height="28" rx="3" fill="#faf7ee" stroke="#c7c6b9"/><text x="682.5" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142941" text-anchor="middle">1111</text><path d="M24 317 L736 317" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="349" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#142941" text-anchor="start">Why the smallest cell controls the rank</text><text x="28" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">Complement either operand: the old degree-two symbol stays the same.</text><text x="28" y="404" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">Its rank is bounded by the support of each of the four indicators.</text><text x="28" y="447" font-family="Georgia, serif" font-size="25" font-weight="400" fill="#276c70" text-anchor="start">Four cells  →  capacity at most 2ⁿ⁻²</text></svg>
