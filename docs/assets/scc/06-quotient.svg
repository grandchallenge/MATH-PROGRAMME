<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title description"><title id="title">Plate 06 — Quotient, primitive, cross-relations</title><desc id="description">Schematic dependency sequence for the exact presentation of the successor algebra: quotient A by q, adjoin the square-zero t, and impose ta=delta(a) for every residual relation a.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="510" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  06     QUOTIENT, PRIMITIVE, CROSS-RELATIONS</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="start">A complete one-step presentation</text><text x="28" y="104" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="start">Three mathematical operations, not three computational gates.</text><rect x="28" y="132" width="704" height="76" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="46" y="157" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#966a28" text-anchor="start">I. Inherit</text><text x="214" y="165" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#142941" text-anchor="start">C = A/(q)</text><text x="214" y="191" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">Forget the old grade-two symbol.</text><path d="M380 208 L380 226" fill="none" stroke="#276c70" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="28" y="229" width="704" height="76" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="46" y="254" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#966a28" text-anchor="start">II. Adjoin</text><text x="214" y="262" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#142941" text-anchor="start">C[t]/(t²)</text><text x="214" y="288" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">Introduce its new grade-one symbol.</text><path d="M380 305 L380 323" fill="none" stroke="#276c70" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="28" y="326" width="704" height="76" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="46" y="351" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#966a28" text-anchor="start">III. Relate</text><text x="214" y="359" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#142941" text-anchor="start">ta = δ(a)</text><text x="214" y="385" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">For each a in the residual module H.</text><path d="M24 427 L736 427" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="380" y="459" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="middle">A′ = C[t] / (t², ta + δ(a) : a ∈ H)</text><text x="380" y="486" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="middle">The inherited quotient alone does not determine the correction.</text></svg>
