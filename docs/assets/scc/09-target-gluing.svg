<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title description"><title id="title">Plate 09 — The target-relative gluing obstruction</title><desc id="description">Exact dimensions of the two target-region restrictions and the joint degree-one space for target a, before and after computing bc. The gluing quotient dimensions are 3+3-4=2 and 4+4-5=3. In each panel the named classes form a basis of the quotient. The target a is an input and costs zero multiplications.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="480" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  09     THE TARGET-RELATIVE GLUING OBSTRUCTION</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="start">The target is already known: f = a</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="start">Three input bits; compare independent and joint expressions.</text><rect x="28" y="126" width="336" height="268" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="44" y="155" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="start">Before the gate</text><text x="44" y="193" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">On a = 0</text><text x="333" y="193" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142941" text-anchor="end">3</text><rect x="195" y="175" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="215" y="175" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="235" y="175" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><text x="44" y="231" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">On a = 1</text><text x="333" y="231" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142941" text-anchor="end">3</text><rect x="195" y="213" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="215" y="213" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="235" y="213" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><text x="44" y="269" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">Joint space</text><text x="333" y="269" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142941" text-anchor="end">4</text><rect x="195" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="215" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="235" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="255" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><text x="44" y="307" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">Gluing gap</text><text x="333" y="307" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#276c70" text-anchor="end">2</text><rect x="195" y="289" width="16" height="19" rx="2" fill="#d6e5df" stroke="#276c70"/><rect x="215" y="289" width="16" height="19" rx="2" fill="#d6e5df" stroke="#276c70"/><path d="M44 321 L348 321" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="44" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4d6072" text-anchor="start">Independent gap classes</text><text x="44" y="377" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="start">ab, ac</text><rect x="396" y="126" width="336" height="268" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="412" y="155" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="start">After computing bc</text><text x="412" y="193" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">On a = 0</text><text x="701" y="193" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142941" text-anchor="end">4</text><rect x="563" y="175" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="583" y="175" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="603" y="175" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="623" y="175" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><text x="412" y="231" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">On a = 1</text><text x="701" y="231" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142941" text-anchor="end">4</text><rect x="563" y="213" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="583" y="213" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="603" y="213" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="623" y="213" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><text x="412" y="269" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">Joint space</text><text x="701" y="269" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142941" text-anchor="end">5</text><rect x="563" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="583" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="603" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="623" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><rect x="643" y="251" width="16" height="19" rx="2" fill="#faf7ee" stroke="#c7c6b9"/><text x="412" y="307" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142941" text-anchor="start">Gluing gap</text><text x="701" y="307" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#276c70" text-anchor="end">3</text><rect x="563" y="289" width="16" height="19" rx="2" fill="#d6e5df" stroke="#276c70"/><rect x="583" y="289" width="16" height="19" rx="2" fill="#d6e5df" stroke="#276c70"/><rect x="603" y="289" width="16" height="19" rx="2" fill="#d6e5df" stroke="#276c70"/><path d="M412 321 L716 321" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="412" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4d6072" text-anchor="start">Independent gap classes</text><text x="412" y="377" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="start">ab, ac, abc</text><text x="380" y="425" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#276c70" text-anchor="middle">Gluing dimension rises from 2 to 3.</text><text x="380" y="453" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="middle">The cost of computing a is still zero multiplications.</text></svg>
