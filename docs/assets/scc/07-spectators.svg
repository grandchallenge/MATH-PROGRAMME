<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 479" role="img" aria-labelledby="title description"><title id="title">Plate 07 — The spectator obstruction</title><desc id="description">Four spectator coordinates yield sixteen square-free monomials, listed literally. Tensoring the one correction direction with these monomials amplifies its rank to sixteen without further multiplication gates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="479" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  07     THE SPECTATOR OBSTRUCTION</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="start">One correction direction, many consequences</text><text x="28" y="104" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4d6072" text-anchor="start">Append four unused independent switches p,q,r,s.</text><rect x="28" y="208" width="181" height="90" rx="4" fill="#d6e5df" stroke="#276c70"/><text x="118.5" y="239" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#276c70" text-anchor="middle">One direction</text><text x="118.5" y="274" font-family="Georgia, serif" font-size="29" font-weight="400" fill="#142941" text-anchor="middle">b → cy</text><path d="M209 253 L306 167" fill="none" stroke="#276c70" stroke-width="0.9"/><path d="M209 253 L411 167" fill="none" stroke="#276c70" stroke-width="0.9"/><path d="M209 253 L516 167" fill="none" stroke="#276c70" stroke-width="0.9"/><path d="M209 253 L621 167" fill="none" stroke="#276c70" stroke-width="0.9"/><path d="M209 253 L306 228" fill="none" stroke="#276c70" stroke-width="0.9"/><path d="M209 253 L411 228" f