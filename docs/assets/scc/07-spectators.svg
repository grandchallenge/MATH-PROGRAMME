ly="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">pr</text><rect x="516" y="206" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="563" y="234" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">qr</text><rect x="621" y="206" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="668" y="234" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">pqr</text><rect x="306" y="267" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="353" y="295" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">s</text><rect x="411" y="267" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="458" y="295" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">ps</text><rect x="516" y="267" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="563" y="295" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">qs</text><rect x="621" y="267" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="668" y="295" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">pqs</text><rect x="306" y="328" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="353" y="356" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">rs</text><rect x="411" y="328" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="458" y="356" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">prs</text><rect x="516" y="328" width="94" height="45" rx="3" fill="#fffdf7" stroke="#276c70"/><text x="563" y="356" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text