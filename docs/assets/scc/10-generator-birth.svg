<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title description"><title id="title">Plate 10 — Minimality is not computational independence</title><desc id="description">Exact basis indexing for m=3: eight products of z and one of U_i or V_i from each of three essential pairs. There is also one degree-one generator t+z. The target requires exactly seven multiplication gates. The boxes show tensor choices, not a circuit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="510" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  10     MINIMALITY IS NOT COMPUTATIONAL INDEPENDENCE</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="78" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="start">One gate, eight high-grade generators</text><text x="28" y="105" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">Three relevant pairs; f = ab(1+x₁y₁)(1+x₂y₂)(1+x₃y₃).</text><rect x="32" y="128" width="216" height="88" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="140" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4d6072" text-anchor="middle">Pair 1</text><text x="140" y="182" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#142941" text-anchor="middle">U1  or  V1</text><text x="140" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#276c70" text-anchor="middle">Two choices</text><rect x="272" y="128" width="216" height="88" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="380" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4d6072" text-anchor="middle">Pair 2</text><text x="380" y="182" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#142941" text-anchor="middle">U2  or  V2</text><text x="380" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#276c70" text-anchor="middle">Two choices</text><rect x="512" y="128" width="216" height="88" rx="4" fill="#fffdf7" stroke="#c7c6b9"/><text x="620" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4d6072" text-anchor="middle">Pair 3</text><text x="620" y="182" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#142941" text-anchor="middle">U3  or  V3</text><text x="620" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#276c70" text-anchor="middle">Two choices</text><text x="380" y="245" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#276c70" text-anchor="middle">Tensor all choices</text><path d="M380 252 L380 270" fill="none" stroke="#276c70" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="280" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="115" y="305" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z U1 U2 U3</text><rect x="210" y="280" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="295" y="305" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z U1 U2 V3</text><rect x="390" y="280" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="475" y="305" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z U1 V2 U3</text><rect x="570" y="280" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="655" y="305" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z U1 V2 V3</text><rect x="30" y="330" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="115" y="355" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z V1 U2 U3</text><rect x="210" y="330" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="295" y="355" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z V1 U2 V3</text><rect x="390" y="330" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="475" y="355" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z V1 V2 U3</text><rect x="570" y="330" width="170" height="38" rx="3" fill="#d6e5df" stroke="#276c70"/><text x="655" y="355" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#142941" text-anchor="middle">z V1 V2 V3</text><path d="M24 388 L736 388" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="28" y="421" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">Grade 1</text><text x="28" y="451" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="start">1 generator: t+z</text><text x="390" y="421" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">Grade 4</text><text x="390" y="451" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#276c70" text-anchor="start">8 independent generators</text><text x="380" y="487" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#142941" text-anchor="middle">The target itself needs just seven multiplications.</text></svg>
