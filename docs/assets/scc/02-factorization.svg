<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="title description"><title id="title">Plate 02 — Compression through composition</title><desc id="description">All sixteen terms of (a+b)(c+d)(e+f)(g+h), and a binary multiplication tree using exactly three products.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276c70"/></marker></defs><rect width="760" height="416" fill="#faf7ee"/><text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#966a28" text-anchor="start">SCC  /  02     COMPRESSION THROUGH COMPOSITION</text><path d="M24 44 L736 44" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="32" y="77" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#142941" text-anchor="start">Four pairs, sixteen terms</text><text x="32" y="101" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4d6072" text-anchor="start">Choose one symbol from each pair.</text><rect x="32" y="126" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="70" y="148" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">aceg</text><rect x="120" y="126" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="158" y="148" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">aceh</text><rect x="208" y="126" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="246" y="148" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">acfg</text><rect x="296" y="126" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="334" y="148" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">acfh</text><rect x="32" y="168" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="70" y="190" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">adeg</text><rect x="120" y="168" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="158" y="190" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">adeh</text><rect x="208" y="168" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="246" y="190" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">adfg</text><rect x="296" y="168" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="334" y="190" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">adfh</text><rect x="32" y="210" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="70" y="232" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">bceg</text><rect x="120" y="210" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="158" y="232" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">bceh</text><rect x="208" y="210" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="246" y="232" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">bcfg</text><rect x="296" y="210" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="334" y="232" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">bcfh</text><rect x="32" y="252" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="70" y="274" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">bdeg</text><rect x="120" y="252" width="76" height="32" rx="3" fill="#fffdf7" stroke="#c7c6b9"/><text x="158" y="27