</text><path d="M695 163 L654 204" fill="none" stroke="#276c70" stroke-width="1.6"/><circle cx="492" cy="218" r="17" fill="#d6e5df" stroke="#276c70"/><text x="492" y="224" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#276c70" text-anchor="middle">×</text><path d="M492 235 L573 265" fill="none" stroke="#276c70" stroke-width="1.6"/><circle cx="654" cy="218" r="17" fill="#d6e5df" stroke="#276c70"/><text x="654" y="224" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#276c70" text-anchor="middle">×</text><path d="M654 235 L573 265" fill="none" stroke="#276c70" stroke-width="1.6"/><circle cx="573" cy="280" r="17" fill="#d6e5df" stroke="#276c70"/><text x="573" y="286" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#276c70" text-anchor="middle">×</text><path d="M573 298 L573 322" fill="none" stroke="#276c70" stroke-width="1.6" marker-end="url(#arrow)"/><text x="573" y="345" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="middle">F</text><text x="32" y="323" font-family="Georgia, serif" font-size="23" font-weight="400" fill="#142941" text-anchor="start">2⁴ terms</text><path d="M24 363 L736 363" fill="none" stroke="#c7c6b9" stroke-width="1"/><text x="380" y="393" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#142941" text-anchor="middle">The expanded expression and the small circuit compute the same function.</text></svg>
