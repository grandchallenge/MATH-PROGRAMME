<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Compactness and finite-layer detection</title><desc id="desc">Nested Galois subgroups shrink toward the cyclotomic kernel. A character extends at an initial finite layer, local defects disappear at a deeper layer, equivariance defects disappear at a further layer. Its restriction to the kernel is unchanged.</desc><rect width="760" height="360" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#20262b"><text x="28" y="34" font-size="23" font-weight="700">Compactness and finite-layer detection</text><path d="M28 49 H732" stroke="#d8dde0"/><rect x="28" y="66" width="704" height="243" rx="8" fill="#f5f6f7" stroke="#a5afb4"/><text x="46" y="87" font-size="15" font-weight="700">Initial finite layer: extend the character</text><rect x="69" y="99" width="622" height="191" rx="8" fill="white" stroke="#a5afb4"/><text x="87" y="121" font-size="15" font-weight="700">Deeper layer: restore local vanishing</text><rect x="110" y="134" width="540" height="138" rx="8" fill="#eaf1f3" stroke="#35647a"/><text x="128" y="156" font-size="15" font-weight="700">Further layer: restore equivariance</text><rect x="195" y="174" width="370" height="76" rx="6" fill="white" stroke="#35647a"/><text x="380" y="201" text-anchor="middle" font-size="19" font-weight="700" fill="#35647a">Cyclotomic kernel</text><text x="380" y="227" text-anchor="middle" font-size="14">Original character, unchanged</text><text x="380" y="335" text-anchor="middle" font-size="14">Larger fields correspond to smaller Galois subgroups.</text></g></svg>
