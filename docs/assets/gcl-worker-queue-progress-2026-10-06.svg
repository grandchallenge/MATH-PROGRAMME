<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">GCL Worker Queue progress snapshot, 6 October 2026</title>
  <desc id="desc">Snapshot showing 24 pilot jobs, 5 returned, 19 available, no active reservations, equal role distribution across reconnaissance, source audit, and adversarial lanes, and completion of the queue infrastructure milestones.</desc>
  <defs>
    <style>
      .bg{fill:#f8f7f2}.ink{fill:#172033}.muted{fill:#5d6678}.card{fill:#fff;stroke:#c8ced8;stroke-width:2}.green{fill:#3f8064}.greenStroke{stroke:#3f8064}.orange{fill:#b8792f}.orangeStroke{stroke:#b8792f}.blue{fill:#4773b8}.purple{fill:#795aa8}.gray{fill:#d9dde4}.h1{font:700 34px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.big{font:800 50px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.h2{font:700 20px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.body{font:500 16px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.small{font:500 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.tag{font:700 12px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.08em}.line{stroke:#aeb6c3;stroke-width:3}.tick{fill:#3f8064}.done{fill:#eef8f3;stroke:#3f8064;stroke-width:2}.statusA{fill:#e8f3ed;stroke:#3f8064;stroke-width:1.5}.statusR{fill:#fff2df;stroke:#b8792f;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1440" height="760" rx="22"/>
  <text x="70" y="72" class="h1 ink">Worker Queue · progress snapshot</text>
  <text x="70" y="105" class="body muted">Observed 6 October 2026 · operational state only · RETURNED does not mean certified</text>

  <rect x="70" y="145" width="300" height="155" rx="18" class="card"/>
  <text x="95" y="180" class="tag muted">PILOT JOBS</text>
  <text x="95" y="245" class="big ink">24</text>
  <text x="180" y="222" class="h2 ink">8 recon</text>
  <text x="180" y="248" class="h2 ink">8 source</text>
  <text x="180" y="274" class="h2 ink">8 adversarial</text>

  <rect x="405" y="145" width="300" height="155" rx="18" class="card"/>
  <text x="430" y="180" class="tag green">AVAILABLE</text>
  <text x="430" y="245" class="big green">19</text>
  <text x="525" y="245" class="body muted">open for claim</text>

  <rect x="740" y="145" width="300" height="155" rx="18" class="card"/>
  <text x="765" y="180" class="tag orange">RETURNED</text>
  <text x="765" y="245" class="big orange">5</text>
  <text x="835" y="224" class="small muted">evidence received</text>
  <text x="835" y="248" class="small muted">not adjudicated here</text>
  <text x="835" y="272" class="small muted">not certified here</text>

  <rect x="1075" y="145" width="295" height="155" rx="18" class="card"/>
  <text x="1100" y="180" class="tag muted">ACTIVE RESERVATIONS</text>
  <text x="1100" y="245" class="big ink">0</text>
  <text x="1170" y="245" class="body muted">at snapshot</text>

  <text x="70" y="350" class="h2 ink">Twenty-four bounded assignments</text>
  <text x="70" y="377" class="small muted">Five returned items are highlighted. The remaining nineteen were AVAILABLE at the observation point.</text>

  <g transform="translate(70,405)">
    <rect x="0" y="0" width="48" height="48" rx="8" class="statusR"/><rect x="58" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="116" y="0" width="48" height="48" rx="8" class="statusA"/>
    <rect x="174" y="0" width="48" height="48" rx="8" class="statusR"/><rect x="232" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="290" y="0" width="48" height="48" rx="8" class="statusA"/>
    <rect x="348" y="0" width="48" height="48" rx="8" class="statusR"/><rect x="406" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="464" y="0" width="48" height="48" rx="8" class="statusR"/>
    <rect x="522" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="580" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="638" y="0" width="48" height="48" rx="8" class="statusA"/>
    <rect x="696" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="754" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="812" y="0" width="48" height="48" rx="8" class="statusA"/>
    <rect x="870" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="928" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="986" y="0" width="48" height="48" rx="8" class="statusA"/>
    <rect x="1044" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="1102" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="1160" y="0" width="48" height="48" rx="8" class="statusA"/>
    <rect x="1218" y="0" width="48" height="48" rx="8" class="statusR"/><rect x="1276" y="0" width="48" height="48" rx="8" class="statusA"/><rect x="1334" y="0" width="36" height="48" rx="8" class="statusA"/>
  </g>
  <rect x="70" y="475" width="18" height="18" rx="4" class="statusR"/><text x="98" y="489" class="small muted">RETURNED</text>
  <rect x="195" y="475" width="18" height="18" rx="4" class="statusA"/><text x="223" y="489" class="small muted">AVAILABLE</text>

  <text x="70" y="555" class="h2 ink">Infrastructure milestone path</text>
  <line x1="105" y1="615" x2="1335" y2="615" class="line"/>
  <g>
    <circle cx="120" cy="615" r="15" class="tick"/><text x="120" y="620" text-anchor="middle" class="small" fill="#fff">✓</text><text x="120" y="650" text-anchor="middle" class="small muted">Policy</text>
    <circle cx="360" cy="615" r="15" class="tick"/><text x="360" y="620" text-anchor="middle" class="small" fill="#fff">✓</text><text x="360" y="650" text-anchor="middle" class="small muted">Controller</text>
    <circle cx="600" cy="615" r="15" class="tick"/><text x="600" y="620" text-anchor="middle" class="small" fill="#fff">✓</text><text x="600" y="650" text-anchor="middle" class="small muted">Project UI</text>
    <circle cx="840" cy="615" r="15" class="tick"/><text x="840" y="620" text-anchor="middle" class="small" fill="#fff">✓</text><text x="840" y="650" text-anchor="middle" class="small muted">Issue Fields</text>
    <circle cx="1080" cy="615" r="15" class="tick"/><text x="1080" y="620" text-anchor="middle" class="small" fill="#fff">✓</text><text x="1080" y="650" text-anchor="middle" class="small muted">Zero-context bootstrap</text>
    <circle cx="1320" cy="615" r="15" class="tick"/><text x="1320" y="620" text-anchor="middle" class="small" fill="#fff">✓</text><text x="1320" y="650" text-anchor="middle" class="small muted">First returns</text>
  </g>

  <text x="70" y="715" class="small muted">Snapshot source: public Project #2 and organization Issue Fields. Exact returned issues at observation: #842, #845, #848, #850, #863.</text>
</svg>
