<text x="945" y="219" font-size="24">Exact local data at p = 13</text><text x="975" y="315" font-size="18" fill="#6e6250">Affine solutions</text><text x="975" y="351" font-size="25">19</text><text x="975" y="415" font-size="18" fill="#6e6250">#E5(F_13)</text><text x="975" y="451" font-size="25">20</text><text x="975" y="515" font-size="18" fill="#6e6250">a_13 = 13 + 1 - #E5(F_13)</text><text x="975" y="551" font-size="25">-6</text><text x="975" y="615" font-size="18" fill="#6e6250">Local factor</text><text x="975" y="651" font-size="25">(1 + 6·13^(-s) + 13^(1-2s))^(-1)</text><rect x="55" y="795" width="1425" height="130" rx="2" fill="none" stroke="#081a2e" stroke-width="1.5"/>
