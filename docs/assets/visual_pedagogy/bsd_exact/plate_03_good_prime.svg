="915" text-anchor="middle" font-size="13">31</text><path d="M48 946H1488M48 985H1488" stroke="#c29a48" stroke-width="2"/>
<text x="768" y="972" text-anchor="middle" font-size="16">Each good prime contributes a local Euler factor. No single prime, and no finite sample, determines rank.</text>
