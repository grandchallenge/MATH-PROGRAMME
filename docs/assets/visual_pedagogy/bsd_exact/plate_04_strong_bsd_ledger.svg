<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">PLATE IV · The strong BSD leading-term ledger</title>
<desc id="desc">BSD documentary exact-object plate. Mathematical semantics are governed by tools/bsd_wolfram_semantic_master.wl; this static delivery derivative preserves the reviewed claim boundary.</desc>
<rect width="1536" height="1024" fill="#f3ead5"/>
<style>
.serif{font-family:Georgia,"Times New Roman",serif;fill:#081a2e}
.sans{font-family:Arial,Helvetica,sans-serif;fill:#081a2e}
.muted{fill:#655f55}
.rule{stroke:#c29a48;stroke-width:2}
.panel{fill:#f3ead5;stroke:#081a2e;stroke-opacity:.5;stroke-width:1.4}
.soft{fill:#f7f0df;stroke:#c29a48;stroke-opacity:.72;stroke-width:1.4}
.pale{fill:#e8edf0;stroke:#081a2e;stroke-opacity:.46;stroke-width:1.2}
</style>
<text x="768" y="86" text-anchor="middle" class="serif" font-size="40" font-weight="700">PLATE IV · The strong BSD leading-term ledger</text>
<text x="768" y="118" text-anchor="middle" class="sans muted" font-size="16">Quantified dependency structure · three logically distinct obligations</text>
<path d="M44 140H1492" class="rule"/>
<rect x="48" y="168" width="1440" height="220" rx="5" class="soft"/>
<text x="68" y="202" class="sans" font-size="23" font-weight="700">The leading-term identity</text>
<text x="768" y="275" text-anchor="middle" class="serif" font-size="31" font-weight="700">
<tspan x="768" dy="0">L_E^(r)(1) / r!</tspan>
</text>
<text x="768" y="325" text-anchor="middle" class="serif" font-size="27">
<tspan x="768" dy="0">=  Ω_E · Reg(E/Q) · #Sha(E/Q) · product_p c_p  /  #E(Q)_tors^2</tspan>
</text>
<text x="90" y="430" text-anchor="start" class="sans" font-size="23" font-weight="700"><tspan x="90" dy="0">Arithmetic factor ledger</tspan></text>
<rect x="78" y="455" width="270" height="140" rx="5" class="panel"/>
<text x="96" y="493" text-anchor="start" class="sans" font-size="17" font-weight="700"><tspan x="96" dy="0">Real period</tspan></text>
<text x="96" y="550" text-anchor="start" class="serif" font-size="23"><tspan x="96" dy="0">Ω_E</tspan></text>
<rect x="362" y="455" width="270" height="140" rx="5" class="panel"/>
<text x="380" y="493" text-anchor="start" class="sans" font-size="17" font-weight="700"><tspan x="380" dy="0">Regulator</tspan></text>
<text x="380" y="550" text-anchor="start" class="serif" font-size="23"><tspan x="380" dy="0">Reg(E/Q)</tspan></text>
<rect x="646" y="455" width="270" height="140" rx="5" class="panel"/>
<text x="664" y="493" text-anchor="start" class="sans" font-size="17" font-weight="700"><tspan x="664" dy="0">Tate–Shafarevich</tspan></text>
<text x="664" y="550" text-anchor="start" class="serif" font-size="23"><tspan x="664" dy="0">#Sha(E/Q)</tspan></text>
<rect x="930" y="455" width="270" height="140" rx="5" class="panel"/>
<text x="948" y="493" text-anchor="start" class="sans" font-size="17" font-weight="700"><tspan x="948" dy="0">Local components</tspan></text>
<text x="948" y="550" text-anchor="start" class="serif" font-size="23"><tspan x="948" dy="0">product_p c_p</tspan></text>
<rect x="1214" y="455" width="270" height="140" rx="5" class="panel"/>
<text x="1232" y="493" text-anchor="start" class="sans" font-size="17" font-weight="700"><tspan x="1232" dy="0">Torsion denominator</tspan></text>
<text x="1232" y="550" text-anchor="start" class="serif" font-size="23"><tspan x="1232" dy="0">#E(Q)_tors^2</tspan></text>
<rect x="160" y="640" width="1216" height="230" rx="5" class="panel"/>
<text x="180" y="674" class="sans" font-size="23" font-weight="700">Three obligations, not one slogan</text>
<text x="200" y="706" text-anchor="start" class="sans" font-size="18" font-weight="700"><tspan x="200" dy="0">1</tspan></text>
<text x="245" y="706" text-anchor="start" class="sans" font-size="20" font-weight="700"><tspan x="245" dy="0">Rank equality</tspan></text>
<text x="475" y="706" text-anchor="start" class="serif" font-size="18"><tspan x="475" dy="0">rank E(Q) = ord at s = 1 of L(E,s)</tspan></text>
<text x="200" y="766" text-anchor="start" class="sans" font-size="18" font-weight="700"><tspan x="200" dy="0">2</tspan></text>
<text x="245" y="766" text-anchor="start" class="sans" font-size="20" font-weight="700"><tspan x="245" dy="0">Sha finiteness</tspan></text>
<text x="475" y="766" text-anchor="start" class="serif" font-size="18"><tspan x="475" dy="0">#Sha(E/Q) is finite</tspan></text>
<text x="200" y="826" text-anchor="start" class="sans" font-size="18" font-weight="700"><tspan x="200" dy="0">3</tspan></text>
<text x="245" y="826" text-anchor="start" class="sans" font-size="20" font-weight="700"><tspan x="245" dy="0">Leading term</tspan></text>
<text x="475" y="826" text-anchor="start" class="serif" font-size="18"><tspan x="475" dy="0">the normalized leading coefficient equals the complete arithmetic factor</tspan><tspan x="475" dy="24">ledger</tspan></text>
<path d="M44 955H1492" class="rule"/>
<text x="768" y="988" text-anchor="middle" class="serif" font-size="16">Rank equality, Sha finiteness, and the normalized leading-term identity are separate obligations.</text>
</svg>
