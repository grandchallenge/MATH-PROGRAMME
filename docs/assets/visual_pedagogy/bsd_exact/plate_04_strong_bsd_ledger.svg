<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img"><rect width="1024" height="1536" fill="#f3ead5"/><g fill="#081a2e" font-family="Georgia,Times New Roman,serif"><path d="M34 58H990M34 178H990" stroke="#c29a48" stroke-width="2"/><text x="512" y="130" text-anchor="middle" font-size="45">PLATE IV · The strong BSD leading-term ledger</text><rect x="35" y="215" width="954" height="250" fill="none" stroke="#081a2e" stroke-width="1.5"/><path d="M35 285H989" stroke="#081a2e"/><text x="55" y="261" font-size="22">The BSD leading-term formula</text><text x="175" y="345" font-size="28">L^(r)(E,1)/r! =</text><text x="650" y="325" text-anchor="middle" font-size="24">Omega_E * Reg(E/Q) * #Sha(E/Q) * product_p c_p</text><path d="M380 345H920" stroke="#081a2e" stroke-width="1.5"/><text x="650" y="390" text-anchor="middle" font-size="24">#E(Q)_tors^2</text><rect x="35" y="505" width="954" height="570" fill="none" stroke="#081a2e" stroke-width="1.5"/><path d="M35 575H989" stroke="#081a2e"/><text x="55" y="551" font-size="22">Dependency ledger</text><rect x="75" y="620" width="190" height="150" fill="none" stroke="#081a2e"/><text x="170" y="680" text-anchor="middle" font-size="23">Omega_E</text><text x="170" y="730" text-anchor="middle" font-size="13">Real period</text><path d="M170 770L512 835" stroke="#081a2e" stroke-width="1.7"/><rect x="305" y="620" width="190" height="150" fill="none" stroke="#081a2e"/><text x="400" y="680" text-anchor="middle" font-size="23">Reg(E/Q)</text><text x="400" y="730" text-anchor="middle" font-size="13">Neron-Tate regulator</text><path d="M400 770L512 835" stroke="#081a2e" stroke-width="1.7"/><rect x="535" y="620" width="190" height="150" fill="none" stroke="#081a2e"/><text x="630" y="680" text-anchor="middle" font-size="23">#Sha(E/Q)</text><text x="630" y="730" text-anchor="middle" font-size="13">Tate-Shafarevich group</text><path d="M630 770L512 835" stroke="#081a2e" stroke-width="1.7"/><rect x="765" y="620" width="190" height="150" fill="none" stroke="#081a2e"/><text x="860" y="680" text-anchor="middle" font-size="23">product_p c_p</text><text x="860" y="730" text-anchor="middle" font-size="13">Local Tamagawa product</text><path d="M860 770L512 835" stroke="#081a2e" stroke-width="1.7"/><rect x="380" y="825" width="264" height="105" fill="#f2dfaa" stroke="#081a2e"/><text x="512" y="890" text-anchor="middle" font-size="30">L^(r)(E,1)/r!</text><path d="M512 930V960" stroke="#081a2e"/><rect x="355" y="960" width="314" height="80" fill="none" stroke="#081a2e"/><text x="512" y="1010" text-anchor="middle" font-size="26">#E(Q)_tors^2</text><rect x="35" y="1115" width="954" height="230" fill="none" stroke="#081a2e" stroke-width="1.5"/><path d="M35 1185H989" stroke="#081a2e"/><text x="55" y="1161" font-size="22">The BSD obligations</text><text x="80" y="1205" font-size="21" fill="#c29a48">1.</text><text x="145" y="1205" font-size="20">Rank equality: rank E(Q) = ord_(s=1) L(E,s)</text><text x="80" y="1260" font-size="21" fill="#c29a48">2.</text><text x="145" y="1260" font-size="20">Sha finiteness: #Sha(E/Q) must be finite</text><text x="80" y="1315" font-size="21" fill="#c29a48">3.</text><text x="145" y="1315" font-size="20">Leading term: normalized coefficient = arithmetic factor ledger</text><path d="M34 1425H990M34 1505H990" stroke="#c29a48" stroke-width="2"/><text x="512" y="1470" text-anchor="middle" font-size="17">These are separate obligations. A theorem about one does not silently establish the others.</text></g></svg>