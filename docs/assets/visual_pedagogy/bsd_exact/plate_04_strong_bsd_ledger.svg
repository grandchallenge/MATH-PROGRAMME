<circle cx="206" cy="711" r="17" fill="#e8edf0"/><text x="206" y="717" text-anchor="middle" class="sans" font-size="15" font-weight="700">1</text><text x="250" y="717" class="sans" font-size="20" font-weight="700">Rank equality</text><text x="480" y="717" class="math" font-size="21">rank E(ℚ) = ord<tspan baseline-shift="sub" font-size="14">s=1</tspan> L(E,s)</text>
