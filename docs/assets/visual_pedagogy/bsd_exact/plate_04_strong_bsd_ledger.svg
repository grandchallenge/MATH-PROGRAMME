<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">PLATE IV · The strong BSD leading-term ledger</title>
<desc id="desc">BSD documentary exact-object plate. Mathematical semantics are governed by tools/bsd_wolfram_semantic_master.wl; this static delivery derivative preserves the reviewed claim boundary.</desc>
<rect width="1536" height="1024" fill="#f3ead5"/>

<style>
.serif{font-family:Georgia,"Times New Roman",serif;fill:#081a2e}
.sans{font-family:Arial,Helvetica,sans-serif;fill:#081a2e}
.math{font-family:"Cambria Math","DejaVu Serif","Times New Roman",serif;fill:#081a2e}
.muted{fill:#655f55}
.rule{stroke:#c29a48;stroke-width:2}
.panel{fill:#f3ead5;stroke:#081a2e;stroke-opacity:.42;stroke-width:1.35}
.soft{fill:#f7f0df;stroke:#c29a48;stroke-opacity:.72;stroke-width:1.35}
.pale{fill:#e8edf0;stroke:#081a2e;stroke-opacity:.42;stroke-width:1.1}
</style>
<text x="768" y="82" text-anchor="middle" class="serif" font-size="40" font-weight="700">PLATE IV · The strong BSD leading-term ledger</text>
<text x="768" y="116" text-anchor="middle" class="sans muted" font-size="18">Quantified dependency structure · three logically distinct obligations</text>
<path d="M44 142H1492" class="rule"/>
<rect x="48" y="170" width="1440" height="220" rx="10" class="soft"/>
<text x="70" y="207" text-anchor="start" class="sans" font-size="24" font-weight="700">The leading-term identity</text>

<g class="math" font-weight="700" aria-label="L sub E superscript r evaluated at 1, divided by r factorial">
  <text x="647" y="280" font-size="36">L</text>
  <text x="671" y="292" font-size="19">E</text>
  <text x="672" y="258" font-size="19">(r)</text>
  <text x="711" y="280" font-size="36">(1) / r!</text>
</g>

<g class="math" aria-label="Omega sub E times regulator times Tate-Shafarevich order times the product of local components, divided by the square of the torsion order">
  <text x="430" y="330" font-size="28">= Ω</text>
  <text x="486" y="340" font-size="16">E</text>
  <text x="507" y="330" font-size="28">· Reg(E/ℚ) · #Sha(E/ℚ) · ∏ₚ cₚ / #E(ℚ)ₜₒᵣₛ²</text>
</g>

<text x="90" y="433" text-anchor="start" class="sans" font-size="24" font-weight="700">Arithmetic factor ledger</text>
<rect x="78" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="96" y="497" text-anchor="start" class="sans" font-size="17" font-weight="700">Real period</text>
<g class="math" aria-label="Omega sub E">
  <text x="96" y="555" font-size="24">Ω</text>
  <text x="118" y="564" font-size="14">E</text>
</g>
<rect x="362" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="380" y="497" text-anchor="start" class="sans" font-size="17" font-weight="700">Regulator</text>
<text x="380" y="555" text-anchor="start" class="math" font-size="24">Reg(E/ℚ)</text>
<rect x="646" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="664" y="497" text-anchor="start" class="sans" font-size="17" font-weight="700">Tate–Shafarevich</text>
<text x="664" y="555" text-anchor="start" class="math" font-size="24">#Sha(E/ℚ)</text>
<rect x="930" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="948" y="497" text-anchor="start" class="sans" font-size="17" font-weight="700">Local components</text>
<text x="948" y="555" text-anchor="start" class="math" font-size="24">∏ₚ cₚ</text>
<rect x="1214" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="1232" y="497" text-anchor="start" class="sans" font-size="17" font-weight="700">Torsion denominator</text>
<text x="1232" y="555" text-anchor="start" class="math" font-size="24">#E(ℚ)ₜₒᵣₛ²</text>
<rect x="160" y="642" width="1216" height="232" rx="10" class="panel"/>
<text x="182" y="678" text-anchor="start" class="sans" font-size="24" font-weight="700">Three obligations, not one slogan</text>
<circle cx="206" cy="711" r="17" fill="#e8edf0"/>
<text x="206" y="717" text-anchor="middle" class="sans" font-size="15" font-weight="700">1</text>
<text x="250" y="717" text-anchor="start" class="sans" font-size="20" font-weight="700">Rank equality</text>
<text x="480" y="717" text-anchor="start" class="math" font-size="19">rank E(ℚ) = ordₛ₌₁ L(E,s)</text>
<circle cx="206" cy="772" r="17" fill="#e8edf0"/>
<text x="206" y="778" text-anchor="middle" class="sans" font-size="15" font-weight="700">2</text>
<text x="250" y="778" text-anchor="start" class="sans" font-size="20" font-weight="700">Sha finiteness</text>
<text x="480" y="778" text-anchor="start" class="math" font-size="19">#Sha(E/ℚ) is finite</text>
<circle cx="206" cy="833" r="17" fill="#e8edf0"/>
<text x="206" y="839" text-anchor="middle" class="sans" font-size="15" font-weight="700">3</text>
<text x="250" y="839" text-anchor="start" class="sans" font-size="20" font-weight="700">Leading term</text>
<text x="480" y="830" text-anchor="start" class="serif" font-size="19"><tspan x="480" dy="0">the normalized leading coefficient equals the complete</tspan><tspan x="480" dy="25">arithmetic factor ledger</tspan></text>
<path d="M44 952H1492" class="rule"/>
<text x="768" y="986" text-anchor="middle" class="serif" font-size="17">Rank equality, Sha finiteness, and the normalized leading-term identity are separate obligations.</text>
</svg>
