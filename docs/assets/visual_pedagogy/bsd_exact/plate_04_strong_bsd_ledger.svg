<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" data-bsd-math-rendering="native-svg-typeset-v4">
<title id="title">PLATE IV · The strong BSD leading-term ledger</title>
<desc id="desc">BSD documentary exact-object plate. Mathematical semantics are governed by tools/bsd_wolfram_semantic_master.wl. The leading-term identity is typeset as explicit stacked fractions with mathematical subscripts and superscripts.</desc>
<rect width="1536" height="1024" fill="#f3ead5"/>
<style>
.serif{font-family:Georgia,"Times New Roman",serif;fill:#081a2e}.sans{font-family:Arial,Helvetica,sans-serif;fill:#081a2e}.math{font-family:"STIX Two Math","Cambria Math","DejaVu Serif","Times New Roman",serif;fill:#081a2e}.muted{fill:#655f55}.rule{stroke:#c29a48;stroke-width:2}.panel{fill:#f3ead5;stroke:#081a2e;stroke-opacity:.42;stroke-width:1.35}.soft{fill:#f7f0df;stroke:#c29a48;stroke-opacity:.72;stroke-width:1.35}.frac{stroke:#081a2e;stroke-width:2.1}
</style>
<text x="768" y="82" text-anchor="middle" class="serif" font-size="40" font-weight="700">PLATE IV · The strong BSD leading-term ledger</text>
<text x="768" y="116" text-anchor="middle" class="sans muted" font-size="18">Quantified dependency structure · three logically distinct obligations</text>
<path d="M44 142H1492" class="rule"/>

<rect x="48" y="170" width="1440" height="220" rx="10" class="soft"/>
<text x="70" y="207" class="sans" font-size="24" font-weight="700">The leading-term identity</text>
<g class="math" aria-label="L sub E superscript r at one over r factorial equals Omega sub E times regulator times the order of Sha times the product of local components over the square of the torsion order">
  <text x="445" y="274" font-size="38" font-style="italic" font-weight="600">L</text>
  <text x="470" y="286" font-size="19">E</text>
  <text x="473" y="250" font-size="19">(r)</text>
  <text x="512" y="274" font-size="38">(1)</text>
  <path d="M398 292H580" class="frac"/>
  <text x="489" y="333" text-anchor="middle" font-size="29"><tspan font-style="italic">r</tspan>!</text>
  <text x="646" y="308" text-anchor="middle" font-size="37">=</text>
  <text x="712" y="270" font-size="29">Ω</text><text x="740" y="281" font-size="17">E</text>
  <text x="765" y="270" font-size="29">· Reg(E/ℚ) · #Sha(E/ℚ) · ∏</text>
  <text x="1198" y="281" font-size="17">p</text><text x="1219" y="270" font-size="29"> c</text><text x="1243" y="281" font-size="17">p</text>
  <path d="M690 292H1282" class="frac"/>
  <text x="924" y="337" font-size="29">#E(ℚ)</text><text x="1033" y="348" font-size="17">tors</text><text x="1071" y="321" font-size="17">2</text>
</g>

<text x="90" y="433" class="sans" font-size="24" font-weight="700">Arithmetic factor ledger</text>
<rect x="78" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="96" y="497" class="sans" font-size="17" font-weight="700">Real period</text>
<g class="math"><text x="96" y="555" font-size="25">Ω</text><text x="121" y="565" font-size="15">E</text></g>
<rect x="362" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="380" y="497" class="sans" font-size="17" font-weight="700">Regulator</text>
<text x="380" y="555" class="math" font-size="24">Reg(E/ℚ)</text>
<rect x="646" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="664" y="497" class="sans" font-size="17" font-weight="700">Tate–Shafarevich</text>
<text x="664" y="555" class="math" font-size="24">#Sha(E/ℚ)</text>
<rect x="930" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="948" y="497" class="sans" font-size="17" font-weight="700">Local components</text>
<g class="math"><text x="948" y="555" font-size="25">∏</text><text x="972" y="565" font-size="15">p</text><text x="990" y="555" font-size="25">c</text><text x="1010" y="565" font-size="15">p</text></g>
<rect x="1214" y="458" width="270" height="140" rx="10" class="panel"/>
<text x="1232" y="497" class="sans" font-size="17" font-weight="700">Torsion denominator</text>
<g class="math"><text x="1232" y="555" font-size="24">#E(ℚ)</text><text x="1322" y="565" font-size="14">tors</text><text x="1353" y="540" font-size="14">2</text></g>

<rect x="160" y="642" width="1216" height="232" rx="10" class="panel"/>
<text x="182" y="678" class="sans" font-size="24" font-weight="700">Three obligations, not one slogan</text>
<circle cx="206" cy="711" r="17" fill="#e8edf0"/><text x="206" y="717" text-anchor="middle" class="sans" font-size="15" font-weight="700">1</text>
<text x="250" y="717" class="sans" font-size="20" font-weight="700">Rank equality</text>
<g class="math"><text x="480" y="717" font-size="20">rank E(ℚ) = ord</text><text x="632" y="726" font-size="13">s=1</text><text x="662" y="717" font-size="20"> L(E,s)</text></g>
<circle cx="206" cy="772" r="17" fill="#e8edf0"/><text x="206" y="778" text-anchor="middle" class="sans" font-size="15" font-weight="700">2</text>
<text x="250" y="778" class="sans" font-size="20" font-weight="700">Sha finiteness</text>
<text x="480" y="778" class="math" font-size="20">#Sha(E/ℚ) is finite</text>
<circle cx="206" cy="833" r="17" fill="#e8edf0"/><text x="206" y="839" text-anchor="middle" class="sans" font-size="15" font-weight="700">3</text>
<text x="250" y="839" class="sans" font-size="20" font-weight="700">Leading term</text>
<text x="480" y="830" class="serif" font-size="19"><tspan x="480" dy="0">the normalized leading coefficient equals the complete</tspan><tspan x="480" dy="25">arithmetic factor ledger</tspan></text>
<path d="M44 952H1492" class="rule"/>
<text x="768" y="986" text-anchor="middle" class="serif" font-size="17">Rank equality, Sha finiteness, and the normalized leading-term identity are separate obligations.</text>
</svg>
