<text x="768" y="82" text-anchor="middle" class="serif" font-size="40" font-weight="700">PLATE IV · The strong BSD leading-term ledger</text>
<text x="768" y="116" text-anchor="middle" class="sans muted" font-size="18">Quantified dependency structure · three logically distinct obligations</text><path d="M44 142H1492" class="rule"/>
<rect x="48" y="170" width="1440" height="220" rx="10" class="soft"/><text x="70" y="207" class="sans" font-size="24" font-weight="700">The leading-term identity</text>
<foreignObject x="170" y="216" width="1196" height="150">
  <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#081a2e;font-size:31px;font-family:'STIX Two Math','Cambria Math','Times New Roman',serif;">
    <math xmlns="http://www.w3.org/1998/Math/MathML" display="block" aria-label="Strong BSD normalized leading-term identity">
      <mfrac><mrow><msubsup><mi>L</mi><mi>E</mi><mrow><mo>(</mo><mi>r</mi><mo>)</mo></mrow></msubsup><mo>(</mo><mn>1</mn><mo>)</mo></mrow><mrow><mi>r</mi><mo>!</mo></mrow></mfrac>
      <mo>=</mo>
      <mfrac><mrow><msub><mi>Ω</mi><mi>E</mi></msub><mo>·</mo><mi mathvariant="normal">Reg</mi><mo>(</mo><mi>E</mi><mo>/</mo><mi>ℚ</mi><mo>)</mo><mo>·</mo><mo>#</mo><mi mathvariant="normal">Sha</mi><mo>(</mo><mi>E</mi><mo>/</mo><mi>ℚ</mi><mo>)</mo><mo>·</mo><munder><mo>∏</mo><mi>p</mi></munder><msub><mi>c</mi><mi>p</mi></msub></mrow><mrow><mo>#</mo><msubsup><mrow><mi>E</mi><mo>(</mo><mi>ℚ</mi><mo>)</mo></mrow><mtext>tors</mtext><mn>2</mn></msubsup></mrow></mfrac>
    </math>
  </div>
</foreignObject>
<text x="90" y="433" class="sans" font-size="24" font-weight="700">Arithmetic factor ledger</text>
