<circle cx="206" cy="711" r="17" fill="#e8edf0"/><text x="206" y="717" text-anchor="middle" class="sans" font-size="15" font-weight="700">1</text><text x="250" y="717" class="sans" font-size="20" font-weight="700">Rank equality</text><foreignObject x="476" y="688" width="520" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px;color:#081a2e"><math xmlns="http://www.w3.org/1998/Math/MathML"><mi mathvariant="normal">rank</mi><mi>E</mi><mo>(</mo><mi>ℚ</mi><mo>)</mo><mo>=</mo><msub><mi mathvariant="normal">ord</mi><mrow><mi>s</mi><mo>=</mo><mn>1</mn></mrow></msub><mi>L</mi><mo>(</mo><mi>E</mi><mo>,</mo><mi>s</mi><mo>)</mo></math></div></foreignObject>
<circle cx="206" cy="772" r="17" fill="#e8edf0"/><text x="206" y="778" text-anchor="middle" class="sans" font-size="15" font-weight="700">2</text><text x="250" y="778" class="sans" font-size="20" font-weight="700">Sha finiteness</text><foreignObject x="476" y="748" width="440" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px;color:#081a2e"><math xmlns="http://www.w3.org/1998/Math/MathML"><mo>#</mo><mi mathvariant="normal">Sha</mi><mo>(</mo><mi>E</mi><mo>/</mo><mi>ℚ</mi><mo>)</mo><mtext> is finite</mtext></math></div></foreignObject>
<circle cx="206" cy="833" r="17" fill="#e8edf0"/><text x="206" y="839" text-anchor="middle" class="sans" font-size="15" font-weight="700">3</text><text x="250" y="839" class="sans" font-size="20" font-weight="700">Leading term</text><text x="480" y="830" class="serif" font-size="19"><tspan x="480" dy="0">the normalized leading coefficient equals the complete</tspan><tspan x="480" dy="25">arithmetic factor ledger</tspan></text>
<path d="M44 952H1492" class="rule"/><text x="768" y="986" text-anchor="middle" class="serif" font-size="17">Rank equality, Sha finiteness, and the normalized leading-term identity are separate obligations.</text>
