<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img">
<rect width="1536" height="1024" fill="#f3ead5"/>
<g fill="#081a2e" font-family="Georgia,Times New Roman,serif">
<path d="M48 46H1488M48 142H1488" stroke="#c29a48" stroke-width="2"/>
<text x="768" y="105" text-anchor="middle" font-size="42">PLATE IV · The strong BSD leading-term ledger</text><text x="768" y="132" text-anchor="middle" font-size="15" fill="#6e6250">Quantified dependency structure · three logically distinct obligations</text><rect x="55" y="180" width="1425" height="175" rx="2" fill="#f7f0df" stroke="#081a2e" stroke-width="1.5"/>
<path d="M55 238H1480" stroke="#081a2e" stroke-width="1"/>
<text x="75" y="219" font-size="24">The leading-term identity</text><text x="180" y="285" font-size="31">L^(r)(E,1)/r!  =</text><text x="890" y="260" text-anchor="middle" font-size="25">Omega_E · Reg(E/Q) · #Sha(E/Q) · product_p c_p</text><path d="M500 282H1320" stroke="#081a2e" stroke-width="1.5"/><text x="910" y="322" text-anchor="middle" font-size="25">#E(Q)_tors^2</text><rect x="55" y="390" width="1425" height="285" rx="2" fill="none" stroke="#081a2e" stroke-width="1.5"/>
<path d="M55 448H1480" stroke="#081a2e" stroke-width="1"/>
<text x="75" y="429" font-size="24">Arithmetic factor ledger</text><rect x="85" y="485" width="252" height="125" fill="#e8edf0" stroke="#081a2e"/><text x="211" y="535" text-anchor="middle" font-size="24">Omega_E</text><text x="211" y="575" text-anchor="middle" font-size="15" fill="#6e6250">archimedean period</text><rect x="362" y="485" width="252" height="125" fill="#e8edf0" stroke="#081a2e"/><text x="488" y="535" text-anchor="middle" font-size="24">Reg(E/Q)</text><text x="488" y="575" text-anchor="middle" font-size="15" fill="#6e6250">Mordell–Weil lattice</text><rect x="639" y="485" width="252" height="125" fill="#e8edf0" stroke="#081a2e"/><text x="765" y="535" text-anchor="middle" font-size="24">#Sha(E/Q)</text><text x="765" y="575" text-anchor="middle" font-size="15" fill="#6e6250">local-global obstruction</text><rect x="916" y="485" width="252" height="125" fill="#e8edf0" stroke="#081a2e"/><text x="1042" y="535" text-anchor="middle" font-size="24">product_p c_p</text><text x="1042" y="575" text-anchor="middle" font-size="15" fill="#6e6250">bad-prime components</text><rect x="1193" y="485" width="252" height="125" fill="#e8edf0" stroke="#081a2e"/><text x="1319" y="535" text-anchor="middle" font-size="24">#E(Q)_tors^2</text><text x="1319" y="575" text-anchor="middle" font-size="15" fill="#6e6250">torsion denominator</text><rect x="55" y="710" width="1425" height="215" rx="2" fill="none" stroke="#081a2e" stroke-width="1.5"/>
<path d="M55 768H1480" stroke="#081a2e" stroke-width="1"/>
<text x="75" y="749" font-size="24">Three obligations, not one slogan</text><circle cx="95" cy="782" r="18" fill="#c29a48"/><text x="95" y="788" text-anchor="middle" font-size="16" fill="#081a2e">1</text><text x="130" y="790" font-size="22">Rank equality</text><text x="380" y="790" font-size="20" fill="#6e6250">rank E(Q) = ord_(s=1) L(E,s)</text><circle cx="95" cy="837" r="18" fill="#c29a48"/><text x="95" y="843" text-anchor="middle" font-size="16" fill="#081a2e">2</text><text x="130" y="845" font-size="22">Sha finiteness</text><text x="380" y="845" font-size="20" fill="#6e6250">#Sha(E/Q) is finite</text><circle cx="95" cy="892" r="18" fill="#c29a48"/><text x="95" y="898" text-anchor="middle" font-size="16" fill="#081a2e">3</text><text x="130" y="900" font-size="22">Leading term</text><text x="380" y="900" font-size="20" fill="#6e6250">normalized coefficient equals the arithmetic ledger</text><path d="M48 946H1488M48 985H1488" stroke="#c29a48" stroke-width="2"/>
<text x="768" y="972" text-anchor="middle" font-size="16">Rank equality, Sha finiteness, and the normalized leading-term identity are separate obligations.</text>
</g></svg>