<rect x="1214" y="458" width="270" height="140" rx="10" class="panel"/><text x="1232" y="497" class="sans" font-size="17" font-weight="700">Torsion denominator</text><foreignObject x="1228" y="515" width="240" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:23px;color:#081a2e"><math xmlns="http://www.w3.org/1998/Math/MathML"><mo>#</mo><msubsup><mrow><mi>E</mi><mo>(</mo><mi>ℚ</mi><mo>)</mo></mrow><mtext>tors</mtext><mn>2</mn></msubsup></math></div></foreignObject>
