<rect x="646" y="458" width="270" height="140" rx="10" class="panel"/><text x="664" y="497" class="sans" font-size="17" font-weight="700">Tate–Shafarevich</text><foreignObject x="660" y="515" width="235" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:23px;color:#081a2e"><math xmlns="http://www.w3.org/1998/Math/MathML"><mo>#</mo><mi mathvariant="normal">Sha</mi><mo>(</mo><mi>E</mi><mo>/</mo><mi>ℚ</mi><mo>)</mo></math></div></foreignObject>
