<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img"><rect width="1024" height="1536" fill="#f3ead5"/><g fill="#081a2e" font-family="Georgia,Times New Roman,serif"><path d="M34 58H990M34 178H990" stroke="#c29a48" stroke-width="2"/><text x="512" y="130" text-anchor="middle" font-size="45">PLATE V · The exact BSD theorem frontier</text><rect x="35" y="230" width="430" height="90" fill="none" stroke="#081a2e"/><text x="250.0" y="288" text-anchor="middle" font-size="27">Statement</text><rect x="465" y="230" width="290" height="90" fill="none" stroke="#081a2e"/><text x="610.0" y="288" text-anchor="middle" font-size="27">Scope</text><rect x="755" y="230" width="234" height="90" fill="none" stroke="#081a2e"/><text x="872.0" y="288" text-anchor="middle" font-size="27">Status</text><rect x="35" y="320" width="430" height="125" fill="none" stroke="#081a2e"/><text x="55" y="392" text-anchor="start" font-size="20" fill="#081a2e">Mordell–Weil finite generation</text><rect x="465" y="320" width="290" height="125" fill="none" stroke="#081a2e"/><text x="610.0" y="392" text-anchor="middle" font-size="21" fill="#081a2e">all E/Q</text><rect x="755" y="320" width="234" height="125" fill="#e7ecd6" stroke="#081a2e"/><text x="872.0" y="392" text-anchor="middle" font-size="21" fill="#4f4b1d">ESTABLISHED</text><rect x="35" y="445" width="430" height="125" fill="none" stroke="#081a2e"/><text x="55" y="517" text-anchor="start" font-size="20" fill="#081a2e">Modularity</text><rect x="465" y="445" width="290" height="125" fill="none" stroke="#081a2e"/><text x="610.0" y="517" text-anchor="middle" font-size="21" fill="#081a2e">all E/Q</text><rect x="755" y="445" width="234" height="125" fill="#e7ecd6" stroke="#081a2e"/><text x="872.0" y="517" text-anchor="middle" font-size="21" fill="#4f4b1d">ESTABLISHED</text><rect x="35" y="570" width="430" height="125" fill="none" stroke="#081a2e"/><text x="55" y="642" text-anchor="start" font-size="20" fill="#081a2e">rank equality + finite Sha</text><rect x="465" y="570" width="290" height="125" fill="none" stroke="#081a2e"/><text x="610.0" y="642" text-anchor="middle" font-size="21" fill="#081a2e">analytic rank 0 or 1</text><rect x="755" y="570" width="234" height="125" fill="#e7ecd6" stroke="#081a2e"/><text x="872.0" y="642" text-anchor="middle" font-size="21" fill="#4f4b1d">ESTABLISHED</text><rect x="35" y="695" width="430" height="125" fill="none" stroke="#081a2e"/><text x="55" y="767" text-anchor="start" font-size="20" fill="#081a2e">rank E(Q) = ord at s = 1</text><rect x="465" y="695" width="290" height="125" fill="none" stroke="#081a2e"/><text x="610.0" y="767" text-anchor="middle" font-size="21" fill="#081a2e">all E/Q</text><rect x="755" y="695" width="234" height="125" fill="#f4ddd7" stroke="#081a2e"/><text x="872.0" y="767" text-anchor="middle" font-size="21" fill="#8b1e1e">OPEN</text><rect x="35" y="820" width="430" height="125" fill="none" stroke="#081a2e"/><text x="55" y="892" text-anchor="start" font-size="20" fill="#081a2e">Sha(E/Q) finite</text><rect x="465" y="820" width="290" height="125" fill="none" stroke="#081a2e"/><text x="610.0" y="892" text-anchor="middle" font-size="21" fill="#081a2e">all E/Q</text><rect x="755" y="820" width="234" height="125" fill="#f4ddd7" stroke="#081a2e"/><text x="872.0" y="892" text-anchor="middle" font-size="21" fill="#8b1e1e">OPEN</text><rect x="35" y="945" width="430" height="125" fill="none" stroke="#081a2e"/><text x="55" y="1017" text-anchor="start" font-size="20" fill="#081a2e">complete normalized leading term</text><rect x="465" y="945" width="290" height="125" fill="none" stroke="#081a2e"/><text x="610.0" y="1017" text-anchor="middle" font-size="21" fill="#081a2e">all E/Q</text><rect x="755" y="945" width="234" height="125" fill="#f4ddd7" stroke="#081a2e"/><text x="872.0" y="1017" text-anchor="middle" font-size="21" fill="#8b1e1e">OPEN</text><rect x="35" y="1110" width="954" height="235" fill="none" stroke="#081a2e"/><text x="512" y="1190" text-anchor="middle" font-size="30">Established low-rank terrain is not the universal conjecture.</text><path d="M70 1225H954" stroke="#c29a48"/><text x="512" y="1280" text-anchor="middle" font-size="20">Finite computation, parity, Selmer bounds, family averages, p-adic formulas,</text><text x="512" y="1320" text-anchor="middle" font-size="20">and one-prime results do not remove the universal quantifier.</text><path d="M34 1425H990M34 1505H990" stroke="#c29a48" stroke-width="2"/><text x="512" y="1470" text-anchor="middle" font-size="17">Scope is part of theorem status. Established special cases do not erase the universal quantifier.</text></g></svg>