<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">The Garden That Closes — exact review candidate</title>
<desc id="desc">A six-set union-closed family is arranged by inclusion, with exact frequencies a equals four, b equals three, c equals two, and the half threshold equal to three.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}
.h1{font-size:34px;font-weight:700} .h2{font-size:22px;font-weight:700}
.body{font-size:19px} .small{font-size:16px} .mono{font-family:monospace;font-size:18px}
.box{fill:white;stroke:#222;stroke-width:2} .soft{fill:#f4f4f4;stroke:#444;stroke-width:2}
.line{stroke:#222;stroke-width:2;fill:none} .dash{stroke:#444;stroke-width:2;stroke-dasharray:8 7;fill:none}
</style>
<rect width="1200" height="900" fill="white"/>

<text x="40" y="55" class="h1">An exact union-closed family</text>
<text x="40" y="92" class="body">F = {∅, {a}, {b}, {a,b}, {a,c}, {a,b,c}}</text>
<path d="M175 680 L375 598" class="line"/>
<path d="M175 680 L675 598" class="line"/>
<path d="M375 560 L505 428" class="line"/>
<path d="M675 560 L505 428" class="line"/>
<path d="M375 560 L855 428" class="line"/>
<path d="M505 390 L675 248" class="line"/>
<path d="M855 390 L675 248" class="line"/>
<path d="M675 560 L675 248" class="line"/>
<rect x="110" y="680" width="130" height="58" rx="8" class="box"/><text x="175" y="716" text-anchor="middle" class="body">∅</text>
<rect x="310" y="560" width="130" height="58" rx="8" class="box"/><text x="375" y="596" text-anchor="middle" class="body">{a}</text>
<rect x="610" y="560" width="130" height="58" rx="8" class="box"/><text x="675" y="596" text-anchor="middle" class="body">{b}</text>
<rect x="440" y="390" width="130" height="58" rx="8" class="box"/><text x="505" y="426" text-anchor="middle" class="body">{a,b}</text>
<rect x="790" y="390" width="130" height="58" rx="8" class="box"/><text x="855" y="426" text-anchor="middle" class="body">{a,c}</text>
<rect x="610" y="210" width="130" height="58" rx="8" class="box"/><text x="675" y="246" text-anchor="middle" class="body">{a,b,c}</text>
<rect x="950" y="150" width="210" height="300" rx="12" class="soft"/>
<text x="970" y="190" class="h2">Frequency ledger</text>
<text x="970" y="235" class="body">freq(a) = 4</text>
<text x="970" y="275" class="body">freq(b) = 3</text>
<text x="970" y="315" class="body">freq(c) = 2</text>
<text x="970" y="370" class="body">|F| / 2 = 3</text>
<text x="970" y="410" class="small">a and b meet</text><text x="970" y="435" class="small">the half threshold.</text>
<text x="55" y="785" class="body">{a} ∪ {b} = {a,b};  {b} ∪ {a,c} = {a,b,c}.</text>
<text x="55" y="820" class="small">This exact example illustrates closure; Frankl asks for an abundant element in every finite nonempty union-closed family.</text>

<text x="40" y="872" class="small">Review candidate · documentary exposition only · visual_is_evidence: false</text>
</svg>
