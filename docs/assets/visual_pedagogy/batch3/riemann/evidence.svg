<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Riemann-hypothesis evidence hierarchy — Batch-3 review candidate</title>
<desc id="desc">Four panels distinguish finite zero verification, partial critical-line results, heuristic or random-matrix evidence, and the universal Riemann hypothesis. The universal panel remains open and the plate states that no amount of bounded evidence automatically becomes proof.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111} .h1{font-size:34px;font-weight:700} .h2{font-size:22px;font-weight:700} .body{font-size:19px} .small{font-size:16px} .tiny{font-size:14px} .mono{font-family:"DejaVu Sans Mono",monospace;font-size:17px} .box{fill:white;stroke:#222;stroke-width:2} .soft{fill:#f2f2f2;stroke:#444;stroke-width:2} .open{fill:white;stroke:#222;stroke-width:2;stroke-dasharray:9 7} .line{stroke:#222;stroke-width:2;fill:none} .arrow{stroke:#222;stroke-width:2.4;fill:none;marker-end:url(#arrow)} .sep{stroke:#777;stroke-width:1.5} .label{font-size:15px;font-weight:700;letter-spacing:1px}
</style><rect width="1200" height="900" fill="white"/>
<text x="40" y="55" class="h1">Evidence for RH has several strengths; none equals the universal quantifier</text>
<text x="40" y="92" class="body">Finite certification, density results, and heuristics are informative only when their scopes remain visibly distinct.</text>

<rect x="55" y="155" width="250" height="330" rx="12" class="box"/>
<text x="80" y="195" class="label">FINITE VERIFICATION</text>
<text x="80" y="240" class="body">Certified zeros up to</text><text x="80" y="270" class="body">a finite height T</text>
<text x="80" y="325" class="small">Strong evidence on a bounded</text><text x="80" y="350" class="small">interval; says nothing directly</text><text x="80" y="375" class="small">about every larger height.</text>
<text x="80" y="440" class="label">SCOPE: FINITE</text>

<rect x="335" y="155" width="250" height="330" rx="12" class="box"/>
<text x="360" y="195" class="label">CRITICAL-LINE RESULTS</text>
<text x="360" y="240" class="body">Many zeros are known</text><text x="360" y="270" class="body">to lie on Re(s)=1/2</text>
<text x="360" y="325" class="small">Positive-proportion or density</text><text x="360" y="350" class="small">statements do not turn "many"</text><text x="360" y="375" class="small">into "all".</text>
<text x="360" y="440" class="label">SCOPE: PARTIAL</text>

<rect x="615" y="155" width="250" height="330" rx="12" class="soft"/>
<text x="640" y="195" class="label">HEURISTICS / MODELS</text>
<text x="640" y="240" class="body">Random-matrix statistics</text><text x="640" y="270" class="body">and spectral analogies</text>
<text x="640" y="325" class="small">They organize expectation and</text><text x="640" y="350" class="small">predict fine statistics, but are</text><text x="640" y="375" class="small">not a proof of RH.</text>
<text x="640" y="440" class="label">SCOPE: HEURISTIC</text>

<rect x="895" y="155" width="250" height="330" rx="12" class="open"/>
<text x="920" y="195" class="label">RIEMANN HYPOTHESIS</text>
<text x="920" y="240" class="body">For every nontrivial zero rho:</text>
<text x="920" y="280" class="mono">Re(rho) = 1/2</text>
<text x="920" y="325" class="small">The quantifier ranges over the</text><text x="920" y="350" class="small">entire infinite zero set.</text>
<text x="920" y="440" class="label">STATUS: OPEN</text>

<path d="M180 535 L1020 535" class="line"/>
<text x="55" y="580" class="h2">No evidentiary arrow crosses the final gap automatically</text>
<text x="55" y="620" class="body">More computation can extend the verified range; stronger theorems can enlarge the proved subset; better heuristics can sharpen predictions.</text>
<text x="55" y="660" class="body">None of those operations changes a bounded or partial statement into the universal statement without a proof.</text>
<rect x="55" y="715" width="1090" height="80" rx="10" class="box"/>
<text x="80" y="750" class="small">Claim boundary: this plate classifies evidence by logical scope. It reports no verification height, proportion, or new theorem and makes no RH proof claim.</text>

<text x="40" y="872" class="small">Review candidate · documentary exposition only · visual_is_evidence: false</text>
</svg>
