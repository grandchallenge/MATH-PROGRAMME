<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Euler product and convergence boundary — Batch-3 review candidate</title>
<desc id="desc">Prime-indexed local factors for p equals 2, 3, 5, and all primes feed into the exact Euler-product formula for zeta. The plate explicitly marks Re(s) greater than 1 as the domain of absolute convergence and warns against termwise use inside the critical strip.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111} .h1{font-size:34px;font-weight:700} .h2{font-size:22px;font-weight:700} .body{font-size:19px} .small{font-size:16px} .tiny{font-size:14px} .mono{font-family:"DejaVu Sans Mono",monospace;font-size:17px} .box{fill:white;stroke:#222;stroke-width:2} .soft{fill:#f2f2f2;stroke:#444;stroke-width:2} .open{fill:white;stroke:#222;stroke-width:2;stroke-dasharray:9 7} .line{stroke:#222;stroke-width:2;fill:none} .arrow{stroke:#222;stroke-width:2.4;fill:none;marker-end:url(#arrow)} .sep{stroke:#777;stroke-width:1.5} .label{font-size:15px;font-weight:700;letter-spacing:1px}
</style><rect width="1200" height="900" fill="white"/>
<text x="40" y="55" class="h1">The Euler product assembles one local factor for every prime</text>
<text x="40" y="92" class="body">The identity is exact in its half-plane of absolute convergence; the convergence boundary is part of the mathematics.</text>

<rect x="55" y="145" width="250" height="105" rx="10" class="box"/>
<text x="80" y="180" class="label">p = 2</text><text x="80" y="218" class="mono">(1 - 2^(-s))^(-1)</text>
<rect x="335" y="145" width="250" height="105" rx="10" class="box"/>
<text x="360" y="180" class="label">p = 3</text><text x="360" y="218" class="mono">(1 - 3^(-s))^(-1)</text>
<rect x="615" y="145" width="250" height="105" rx="10" class="box"/>
<text x="640" y="180" class="label">p = 5</text><text x="640" y="218" class="mono">(1 - 5^(-s))^(-1)</text>
<rect x="895" y="145" width="250" height="105" rx="10" class="box"/>
<text x="920" y="180" class="label">all primes</text><text x="920" y="218" class="mono">... p = 7,11,13,...</text>

<path d="M600 290 L600 370" class="arrow"/>
<rect x="150" y="385" width="900" height="135" rx="14" class="soft"/>
<text x="600" y="430" text-anchor="middle" class="mono">zeta(s) = sum_(n>=1) n^(-s) = product_p (1-p^(-s))^(-1)</text>
<text x="600" y="472" text-anchor="middle" class="h2">valid as an absolutely convergent product for Re(s) &gt; 1</text>

<rect x="55" y="575" width="520" height="155" rx="12" class="box"/>
<text x="80" y="615" class="label">WHAT THE PRODUCT GIVES THERE</text>
<text x="80" y="655" class="body">Unique prime factorization becomes an analytic product.</text>
<text x="80" y="692" class="small">In particular, the product has no zero in Re(s)&gt;1.</text>

<rect x="625" y="575" width="520" height="155" rx="12" class="open"/>
<text x="650" y="615" class="label">WHAT IT DOES NOT LICENSE</text>
<text x="650" y="655" class="body">Do not manipulate the Euler product term-by-term inside the critical strip.</text>
<text x="650" y="692" class="small">Analytic continuation is a separate construction beyond the product's convergence domain.</text>

<text x="55" y="785" class="small">This plate states the local-to-global product and its domain; it does not assert the Riemann hypothesis.</text>

<text x="40" y="872" class="small">Review candidate · documentary exposition only · visual_is_evidence: false</text>
</svg>
