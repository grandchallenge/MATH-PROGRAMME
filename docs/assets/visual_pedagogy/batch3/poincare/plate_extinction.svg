<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Finite extinction event graph — Batch-3 review candidate</title>
<desc id="desc">A four-stage event graph shows an initial closed three-manifold, Ricci flow with surgery, a finite-extinction event under theorem hypotheses, and reverse topological bookkeeping. The claim boundary states that the diagram itself is not proof.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111} .h1{font-size:34px;font-weight:700} .h2{font-size:22px;font-weight:700} .body{font-size:19px} .small{font-size:16px} .tiny{font-size:14px} .mono{font-family:"DejaVu Sans Mono",monospace;font-size:17px} .box{fill:white;stroke:#222;stroke-width:2} .soft{fill:#f2f2f2;stroke:#444;stroke-width:2} .open{fill:white;stroke:#222;stroke-width:2;stroke-dasharray:9 7} .line{stroke:#222;stroke-width:2;fill:none} .arrow{stroke:#222;stroke-width:2.4;fill:none;marker-end:url(#arrow)} .sep{stroke:#777;stroke-width:1.5} .label{font-size:15px;font-weight:700;letter-spacing:1px}
</style><rect width="1200" height="900" fill="white"/>
<text x="40" y="55" class="h1">Finite extinction and reverse topological bookkeeping</text>
<text x="40" y="92" class="body">The event graph separates geometric evolution from the later inference about which topological factors could have been present.</text>

<rect x="55" y="150" width="250" height="180" rx="12" class="box"/>
<text x="80" y="190" class="label">1 · INITIAL STATE</text>
<text x="80" y="232" class="body">Closed 3-manifold</text>
<text x="80" y="270" class="small">decomposed conceptually into</text>
<text x="80" y="296" class="small">geometric/topological pieces</text>

<path d="M320 240 L435 240" class="arrow"/><text x="345" y="215" class="small">Ricci flow</text><text x="342" y="235" class="small">with surgery</text>

<rect x="450" y="150" width="300" height="180" rx="12" class="soft"/>
<text x="475" y="190" class="label">2 · STAGED EVOLUTION</text>
<text x="475" y="232" class="body">Flow changes metric geometry</text>
<text x="475" y="270" class="small">controlled surgeries alter the</text>
<text x="475" y="296" class="small">description at selected necks</text>

<path d="M765 240 L880 240" class="arrow"/><text x="790" y="215" class="small">track components</text>

<rect x="895" y="150" width="250" height="180" rx="12" class="box"/>
<text x="920" y="190" class="label">3 · EXTINCTION EVENT</text>
<text x="920" y="232" class="body">Relevant components vanish</text>
<text x="920" y="270" class="small">after finite geometric time</text>
<text x="920" y="296" class="small">under the theorem hypotheses</text>

<path d="M1020 345 L1020 430 L600 430 L600 495" class="arrow"/>
<rect x="300" y="510" width="600" height="155" rx="12" class="soft"/>
<text x="330" y="550" class="label">4 · REVERSE BOOKKEEPING</text>
<text x="330" y="590" class="body">Use the controlled event history to restrict the original topology.</text>
<text x="330" y="625" class="small">This logical reconstruction depends on imported Ricci-flow/surgery theorems; the diagram is only their expository map.</text>

<rect x="55" y="715" width="1090" height="80" rx="10" class="open"/>
<text x="80" y="748" class="h2">Claim boundary</text>
<text x="80" y="777" class="small">A box disappearing in this schematic is not a proof of extinction, geometrization, or the Poincare theorem. The theorem record supplies those implications.</text>

<text x="40" y="872" class="small">Review candidate · documentary exposition only · visual_is_evidence: false</text>
</svg>
