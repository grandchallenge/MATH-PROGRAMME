<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
<title id="title">Two scaling laws force vanishing</title><desc id="desc">Two identical diagonal blocks give twice the original primitive homology class, but a trace product with j factors scales by two to the power j. The incompatible scaling forces zero for j at least two.</desc>
<rect width="760" height="370" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20262b">
<text x="28" y="35" font-size="23" font-weight="700">Two scaling laws force vanishing</text><path d="M28 50 H732" stroke="#d8dde0"/>
<rect x="238" y="72" width="58" height="58" rx="3" fill="#eaf1f3" stroke="#35647a"/><text x="267" y="108" text-anchor="middle" font-size="20">X</text>
<path d="M310 101 H361 l-9 -5 m9 5 l-9 5" fill="none" stroke="#56616a" stroke-width="2"/>
<rect x="377" y="64" width="76" height="76" fill="white" stroke="#56616a"/><rect x="380" y="67" width="34" height="34" fill="#eaf1f3"/><rect x="416" y="103" width="34" height="34" fill="#eaf1f3"/><text x="397" y="89" text-anchor="middle" font-size="15">X</text><text x="433" y="125" text-anchor="middle" font-size="15">X</text>
<path d="M415 140 V160 H192 V179 M415 160 H568 V179" fill="none" stroke="#56616a" stroke-width="2"/>
<rect x="32" y="179" width="320" height="83" rx="6" fill="#f5f6f7" stroke="#d8dde0"/><rect x="408" y="179" width="320" height="83" rx="6" fill="#eaf1f3" stroke="#35647a"/>
<text x="192" y="205" text-anchor="middle" font-size="16">Primitive homology</text><text x="192" y="239" text-anchor="middle" font-size="25" font-weight="700">2 aⱼ(z)</text>
<text x="568" y="205" text-anchor="middle" font-size="16">Product of j traces</text><text x="568" y="239" text-anchor="middle" font-size="25" font-weight="700">2ʲ aⱼ(z)</text>
<path d="M192 262 V285 H380 M568 262 V285 H380" fill="none" stroke="#56616a" stroke-width="2"/>
<text x="380" y="314" text-anchor="middle" font-size="23" font-weight="700" fill="#35647a">aⱼ(z) = 0 for j ≥ 2</text>
<text x="380" y="345" text-anchor="middle" font-size="14" fill="#56616a">Weight one vanishes separately by even-degree trace alternation.</text>
</g></svg>
