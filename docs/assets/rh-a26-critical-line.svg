<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 420' role='img' aria-labelledby='rhstrip-t rhstrip-d'><title id='rhstrip-t'>A. What RH says</title><desc id='rhstrip-d'>Five known upper-half-plane zeta zeros, at heights 14.13 through 32.94, plotted on the line real part one-half. No claim of exhaustive search.</desc><g font-family='Arial, Helvetica, sans-serif'><rect x='0' y='0' width='760' height='420' fill='#ffffff' stroke='#ffffff' rx='0'/><text x='28' y='34' font-size='23' fill='#20262b' text-anchor='start' font-weight='700'>A. What RH says</text><text x='732' y='58' font-size='12' fill='#56616a' text-anchor='end' font-weight='600'>NUMERICAL SAMPLE</text><line x1='28' y1='70' x2='732' y2='70' stroke='#d8dde0' stroke-width='1'/><rect x='120' y='94' width='440' height='252' fill='#eaf1f3' stroke='#eaf1f3' rx='0'/><line x1='120' y1='94' x2='120' y2='346' stroke='#56616a' stroke-width='1'/><line x1='560' y1='94' x2='560' y2='346' stroke='#56616a' stroke-width='1'/><line x1='340' y1='94' x2='340' y2='346' stroke='#35647a' stroke-width='2' stroke-dasharray='6 5'/><line x1='120' y1='346' x2='560' y2='346' stroke='#20262b' stroke-width='1'/><line x1='120' y1='346' x2='560' y2='346' stroke='#d8dde0' stroke-width='1'/><text x='108' y='351' font-size='13' fill='#56616a' text-anchor='end' font-weight='400'>0</text><line x1='120' y1='276' x2='560' y2='276' stroke='#d8dde0' stroke-width='1'/><text x='108' y='281' font-size='13' fill='#56616a' text-anchor='end' font-weight='400'>10</text><line x1='120' y1='206' x2='560' y2='206' stroke='#d8dde0' stroke-width='1'/><text x='108' y='211' font-size='13' fill='#56616a' text-anchor='end' font-weight='400'>20</text><line x1='120' y1='136' x2='560' y2='136' stroke='#d8dde0' stroke-width='1'/><text x='108' y='141' font-size='13' fill='#56616a' text-anchor='end' font-weight='400'>30</text><circle cx='340' cy='247' r='6' fill='#35647a'/><text x='354' y='251' font-size='12' fill='#20262b' text-anchor='start' font-weight='400'>zero 1</text><circle cx='340' cy='199' r='6' fill='#35647a'/><text x='354' y='203' font-size='12' fill='#20262b' text-anchor='start' font-weight='400'>zero 2</text><circle cx='340' cy='171' r='6' fill='#35647a'/><text x='354' y='175' font-size='12' fill='#20262b' text-anchor='start' font-weight='400'>zero 3</text><circle cx='340' cy='133' r='6' fill='#35647a'/><text x='354' y='137' font-size='12' fill='#20262b' text-anchor='start' font-weight='400'>zero 4</text><circle cx='340' cy='115' r='6' fill='#35647a'/><text x='354' y='119' font-size='12' fill='#20262b' text-anchor='start' font-weight='400'>zero 5</text><text x='120' y='368' font-size='14' fill='#20262b' text-anchor='middle' font-weight='400'>0</text><text x='340' y='368' font-size='14' fill='#20262b' text-anchor='middle' font-weight='700'>1/2</text><text x='560' y='368' font-size='14' fill='#20262b' text-anchor='middle' font-weight='400'>1</text><text x='340' y='395' font-size='15' fill='#56616a' text-anchor='middle' font-weight='400'>real part</text><text x='28' y='89' font-size='13' fill='#56616a' text-anchor='start' font-weight='400'>imaginary</text><text x='28' y='104' font-size='13' fill='#56616a' text-anchor='start' font-weight='400'>height</text><text x='578' y='124' font-size='16' fill='#35647a' text-anchor='start' font-weight='700'>Critical line</text><text x='578' y='147' font-size='14' fill='#20262b' text-anchor='start' font-weight='400'>RH concerns every</text><text x='578' y='167' font-size='14' fill='#20262b' text-anchor='start' font-weight='400'>nontrivial zero,</text><text x='578' y='187' font-size='14' fill='#20262b' text-anchor='start' font-weight='400'>not just these five.</text></g></svg>
