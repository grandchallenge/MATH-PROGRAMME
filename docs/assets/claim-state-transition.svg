<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
<title id="title">How a claim moves through the Mathematics Programme</title>
<desc id="desc">A five-stage state transition from question or source signal through MATHFORGE, MATHSOLVE, and MATHCERT to a checked claim, with fail-closed exits that record obstruction, proof debt, or non-promotion.</desc>
<style>
  .bg{fill:#fbfbf8}.ink{fill:#14213d}.muted{fill:#56616f}.line{stroke:#6b7785;stroke-width:3;fill:none}.dash{stroke:#8a3b46;stroke-width:3;stroke-dasharray:10 8;fill:none}.box{fill:#fff;stroke:#c8ced6;stroke-width:2}.fail{fill:#fff8f8;stroke:#c78189;stroke-width:2}.h1{font:700 40px Georgia,serif}.h2{font:700 28px Arial,sans-serif}.small{font:20px Arial,sans-serif}.tag{font:700 18px Arial,sans-serif;letter-spacing:1px}.pill{fill:#eef2f6;stroke:#c8ced6}.arrowFail{fill:#8a3b46}
</style>
<rect class="bg" width="1700" height="980"/>
<text x="80" y="72" class="h1 ink">How a claim moves through the programme</text>
<text x="80" y="110" class="small muted">Each stage changes the status of the work. Failure states remain explicit.</text>
<line x1="540" y1="215" x2="540" y2="780" class="line"/>
<rect x="190" y="150" rx="18" ry="18" width="700" height="120" class="box"/>
<circle cx="250" cy="210" r="32" fill="#eef2f6"/>
<text x="237" y="220" class="h2 ink">?</text>
<text x="305" y="196" class="h2 ink">Question or source signal</text>
<text x="305" y="232" class="small muted">Candidate question, source, observation, or pattern.</text>
<rect x="190" y="310" rx="18" ry="18" width="700" height="125" class="box"/>
<rect x="225" y="347" width="76" height="42" rx="8" class="pill"/>
<text x="244" y="375" class="tag ink">01</text>
<text x="330" y="352" class="h2 ink">MATHFORGE</text>
<text x="330" y="388" class="small muted">Identify the object, source, pattern, obstruction,</text>
<text x="330" y="416" class="small muted">or candidate route.</text>
<rect x="190" y="480" rx="18" ry="18" width="700" height="125" class="box"/>
<rect x="225" y="517" width="76" height="42" rx="8" class="pill"/>
<text x="244" y="545" class="tag ink">02</text>
<text x="330" y="522" class="h2 ink">MATHSOLVE</text>
<text x="330" y="558" class="small muted">Define proof obligations, work packages, routes,</text>
<text x="330" y="586" class="small muted">and handoffs.</text>
<rect x="190" y="650" rx="18" ry="18" width="700" height="125" class="box"/>
<rect x="225" y="687" width="76" height="42" rx="8" class="pill"/>
<text x="244" y="715" class="tag ink">03</text>
<text x="330" y="692" class="h2 ink">MATHCERT</text>
<text x="330" y="728" class="small muted">Replay the exact claim, check the applicable evidence,</text>
<text x="330" y="756" class="small muted">and record the disposition.</text>
<rect x="190" y="820" rx="18" ry="18" width="700" height="120" class="box"/>
<text x="245" y="864" class="h2 ink">Checked claim</text>
<text x="245" y="900" class="small muted">Status, scope, assumptions, limitations, and boundary</text>
<text x="245" y="928" class="small muted">are explicit.</text>
<line x1="890" y1="372" x2="1040" y2="372" class="dash"/>
<polygon points="1040,372 1022,362 1022,382" class="arrowFail"/>
<rect x="1060" y="315" rx="16" ry="16" width="540" height="120" class="fail"/>
<text x="1100" y="357" class="h2" fill="#6f2531">Record obstruction</text>
<text x="1100" y="393" class="small muted">The discovery route stops here.</text>
<text x="1100" y="421" class="small muted">The obstruction remains part of the record.</text>
<line x1="890" y1="542" x2="1040" y2="542" class="dash"/>
<polygon points="1040,542 1022,532 1022,552" class="arrowFail"/>
<rect x="1060" y="485" rx="16" ry="16" width="540" height="120" class="fail"/>
<text x="1100" y="527" class="h2" fill="#6f2531">Record proof debt</text>
<text x="1100" y="563" class="small muted">The unresolved obligation remains explicit.</text>
<text x="1100" y="591" class="small muted">The campaign does not become a completed result.</text>
<line x1="890" y1="712" x2="1040" y2="712" class="dash"/>
<polygon points="1040,712 1022,702 1022,722" class="arrowFail"/>
<rect x="1060" y="655" rx="16" ry="16" width="540" height="120" class="fail"/>
<text x="1100" y="697" class="h2" fill="#6f2531">Do not promote</text>
<text x="1100" y="733" class="small muted">Failed certification does not promote the claim.</text>
<text x="1100" y="761" class="small muted">Any weaker positive claim requires separate support.</text>
</svg>