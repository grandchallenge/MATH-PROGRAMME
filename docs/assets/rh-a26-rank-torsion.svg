<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Three factors in the modular count</title><desc id="desc">Free rank gives Q to the power r. Integral torsion in degree k plus one gives the first multiplier. Bockstein obstruction values in degree k give the second multiplier. Their product bounds the finite set of evaluated values.</desc><rect width="760" height="340" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#20262b"><text x="28" y="35" font-size="23" font-weight="700">Three factors in the modular count</text><path d="M28 50 H732" stroke="#d8dde0"/>
<rect x="26" y="77" width="224" height="132" rx="6" fill="#eaf1f3" stroke="#35647a"/><rect x="268" y="77" width="224" height="132" rx="6" fill="#f5f6f7" stroke="#d8dde0"/><rect x="510" y="77" width="224" height="132" rx="6" fill="#f5f6f7" stroke="#d8dde0"/>
<text x="138" y="104" text-anchor="middle" font-size="15" font-weight="700">Free coordinates</text><text x="138" y="147" text-anchor="middle" font-size="32" fill="#35647a">Qʳ</text><text x="138" y="183" text-anchor="middle" font-size="13">r = number of complex places</text>
<text x="380" y="104" text-anchor="middle" font-size="15" font-weight="700">Integral torsion</text><text x="380" y="147" text-anchor="middle" font-size="32">tₖ₊₁</text><text x="380" y="183" text-anchor="middle" font-size="13">Possible torsion evaluations</text>
<text x="622" y="104" text-anchor="middle" font-size="15" font-weight="700">Lifting obstruction</text><text x="622" y="147" text-anchor="middle" font-size="32">tₖ</text><text x="622" y="183" text-anchor="middle" font-size="13">Possible Bockstein fibers</text>
<path d="M138 209 V232 H622 V209 M380 209 V253" stroke="#56616a" stroke-width="2" fill="none"/><rect x="156" y="253" width="448" height="53" rx="5" fill="#eaf1f3" stroke="#35647a"/><text x="380" y="285" font-size="21" font-weight="700" text-anchor="middle">|S| ≤ Qʳ × tₖ₊₁ × tₖ</text><text x="380" y="327" text-anchor="middle" font-size="13" fill="#56616a">Real rank controls only the first factor.</text></g></svg>
