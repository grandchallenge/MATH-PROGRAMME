<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">Order-7 residual kernel geometry</title>
<desc id="desc">Comparison of the exploratory and boundary-forced order-7 E1 ansatz regimes. Both have a 576-dimensional homogeneous kernel, identified with a discrete-curl image parameterized by a bidegree at most 23 by 23 polynomial H. The invalid cross-regime subtraction 1624 minus 1106 equals 518 is rejected.</desc>
<style>
.bg{fill:#fbfbf8}.ink{fill:#14213d}.muted{fill:#56616f}.accent{fill:#8b5e1a}.bad{fill:#8a3b46}.line{stroke:#6b7785;stroke-width:3;fill:none}.box{fill:#fff;stroke:#c8ced6;stroke-width:2}.good{fill:#f4faf6;stroke:#86a88c;stroke-width:2}.warn{fill:#fff8f8;stroke:#c78189;stroke-width:2}.h1{font:700 40px Georgia,serif}.h2{font:700 27px Arial,sans-serif}.small{font:20px Arial,sans-serif}.mono{font:20px 'Courier New',monospace}.big{font:700 46px Arial,sans-serif}.num{font:700 32px Arial,sans-serif}
</style>
<rect class="bg" width="1800" height="1080"/>
<text x="80" y="72" class="h1 ink">Order-7 residual kernel geometry</text>
<text x="80" y="110" class="small muted">The two ansatz regimes have different sizes and ranks, but the same 576-dimensional homogeneous kernel.</text>
<rect x="90" y="160" rx="18" width="750" height="300" class="box"/>
<text x="135" y="212" class="h2 ink">Exploratory scan</text>
<text x="135" y="252" class="small muted">o_scan.run()</text>
<text x="135" y="282" class="small muted">force_k = 0, force_l = 0</text>
<text x="135" y="350" class="num ink">1682 columns</text>
<text x="465" y="350" class="num ink">rank 1106</text>
<line x1="150" y1="382" x2="780" y2="382" class="line"/>
<text x="135" y="438" class="big accent">nullity 576</text>
<rect x="960" y="160" rx="18" width="750" height="300" class="box"/>
<text x="1005" y="212" class="h2 ink">Boundary-forced certificate ansatz</text>
<text x="1005" y="252" class="small muted">o_final.build()</text>
<text x="1005" y="282" class="small muted">force = (1,1)</text>
<text x="1005" y="350" class="num ink">1624 columns</text>
<text x="1335" y="350" class="num ink">rank 1048</text>
<line x1="1020" y1="382" x2="1650" y2="382" class="line"/>
<text x="1005" y="438" class="big accent">nullity 576</text>
<path d="M465 460 C465 515,720 515,720 550" class="line"/>
<path d="M1335 460 C1335 515,1080 515,1080 550" class="line"/>
<rect x="190" y="550" rx="20" width="1420" height="315" class="good"/>
<text x="240" y="602" class="h2 ink">Common homogeneous kernel = discrete-curl image</text>
<text x="240" y="652" class="mono ink">h = k² l² H(k,l)</text>
<text x="240" y="682" class="mono ink">    / ((k+l+1) · ∏_{j=1..6}(n+k+j)(n+l+j))</text>
<text x="240" y="730" class="mono ink">bideg(H) ≤ (23,23)  ⇒  24 × 24 = 576 parameters</text>
<text x="240" y="780" class="mono ink">r = g_l · h(k,l+1) − h</text>
<text x="240" y="812" class="mono ink">s = −(g_k · h(k+1,l) − h)</text>
<text x="240" y="846" class="small muted">Exact denominator clearing keeps this family inside the boundary-forced E1 degree and boundary constraints.</text>
<rect x="190" y="910" rx="18" width="1420" height="125" class="warn"/>
<text x="240" y="956" class="h2 bad">Do not mix regimes: 1624 − 1106 = 518 is not a kernel dimension.</text>
<text x="240" y="992" class="small muted">That subtraction combines the boundary-forced column count with the exploratory rank.</text>
<text x="240" y="1022" class="small muted">Within either coherent regime, the nullity is 576.</text>
</svg>