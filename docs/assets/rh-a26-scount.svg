<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-labelledby="t d"><title id="t">Two counts, one cancellation</title><desc id="d">The unit determinant supplies the growing modulus factor, and the weighted norm has bounded image and bounded primary kernel. The two counts of W cancel the factor to bound the equivariant character group uniformly in the cyclotomic layer.</desc><rect width="760" height="365" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#20262b" text-anchor="middle"><text x="380" y="35" font-size="23" font-weight="700">Two counts, one cancellation</text><path d="M28 50 H732" stroke="#d8dde0"/><rect x="200" y="66" width="360" height="52" rx="5" fill="#f5f6f7" stroke="#d8dde0"/><text x="380" y="87" font-size="16" font-weight="700">Intermediate finite group W</text><text x="380" y="105" font-size="13">Divisor relations modulo twisted differences</text><path d="M380 118 V133 H190 V145 M380 133 H570 V145" stroke="#56616a" fill="none" stroke-width="1.6"/><rect x="28" y="145" width="324" height="94" rx="5" fill="#eaf1f3" stroke="#35647a"/><text x="190" y="167" font-size="16" font-weight="700">Exact arithmetic count</text><text x="190" y="190" font-size="18">|W| = |EQ| · |ClQ|</text><text x="190" y="214" font-size="13">Unit determinant supplies Qʳ</text><rect x="408" y="145" width="324" height="94" rx="5" fill="#f5f6f7" stroke="#d8dde0"/><text x="570" y="167" font-size="16" font-weight="700">Weighted norm count</text><text x="570" y="190" font-size="15">Image ≤ B; primary kernel bounded</text><text x="570" y="214" font-size="13">Kernel bound independent of layer</text><path d="M190 239 V253 H570 V239 M380 253 V267" stroke="#56616a" fill="none" stroke-width="1.6"/><rect x="72" y="267" width="616" height="70" rx="5" fill="#eaf1f3" stroke="#35647a"/><text x="380" y="289" font-size="14">Substitute SFew and cancel the positive factor Qʳ</text><text x="380" y="315" font-size="21" fill="#35647a" font-weight="700">|EqHom| ≤ t₂ᴇ₊₁ · t₂ᴇ · ℓ^Δ</text><text x="380" y="353" font-size="12" fill="#56616a">Δ = (b + v)G + c + v; independent of ν.</text></g></svg>
