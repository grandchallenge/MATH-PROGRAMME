name: Erdős catalogue operational queue projection

on:
  push:
    branches: [main]
    paths:
      - 'ci/erdos_rolling_review_queue.py'
      - 'ci/gcl_queue_class_cutover.py'
      - 'ci/test_gcl_queue_class_cutover.py'
      - 'ci/erdos_forge_copilot_pilot.py'
      - 'tests/test_erdos_forge_copilot_pilot.py'
      - 'governance/erdos_catalogue/ROLLING_RESEARCH_024.json'
      - '.github/workflows/erdos-catalogue-queue-projection.yml'
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read

concurrency:
  group: erdos-catalogue-queue-projection
  cancel-in-progress: false

jobs:
  reconcile:
    permissions:
      contents: read
      issues: write
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.issue.title, '[GCL-ERDOS] ERDOS-CATALOGUE-') &&
       startsWith(github.event.comment.body, 'RESULT/1'))
    runs-on: ubuntu-24.04
    environment: release-trust
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild unadjudicated catalogue custody snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ci/erdos_catalogue_programme_intake.py --live-snapshot --output catalogue-intake
      - name: Mint bounded Council Clerk Project projection token
        id: queue-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-issues: write
          permission-organization-projects: write
      - name: Reconcile Project state and labels from verified receipts
        env:
          GH_TOKEN: ${{ steps.queue-token.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing short-lived Project write token"; exit 1; }
          python ci/erdos_catalogue_queue_projection.py --report catalogue-intake/REPORT.json --all
      - name: Publish bound Erdős-024 source critic dockets in Project #2
        env:
          GH_TOKEN: ${{ steps.queue-token.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing short-lived Project write token"; exit 1; }
          python ci/erdos_rolling_review_queue.py --apply

  semantic-queue-cutover:
    name: Protected Editorial/Mathematics semantic Project reconciliation
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    needs: [reconcile]
    runs-on: ubuntu-24.04
    environment: release-trust
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Positive/hostile pure queue cutover tests
        run: python -m unittest discover -s ci -p 'test_gcl_queue_class_cutover.py' -v
      - name: Mint short-lived Council Clerk Project administration token
        id: project-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-organization-projects: write
      - name: Reconcile exact Queue Class and create/read back both saved views
        env:
          GH_TOKEN: ${{ steps.project-token.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "No authorized organization Projects write token"; exit 1; }
          python ci/gcl_queue_class_cutover.py --apply --receipt queue-cutover/receipt.json
      - name: Preserve complete class/readback receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gcl-queue-semantic-cutover-${{ github.run_id }}-${{ github.run_attempt }}
          path: queue-cutover/receipt.json
          retention-days: 90
          if-no-files-found: warn

  ledger:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GCL-ERDOS] ERDOS-CATALOGUE-') &&
      (github.event.action != 'created' || startsWith(github.event.comment.body, 'RESULT/1'))
    runs-on: ubuntu-24.04
    environment: release-trust
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Mint operational revision-custody token
        id: ledger-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-issues: write
      - name: Preserve exact historical comment-event payload in operational ledger
        env:
          GH_TOKEN: ${{ steps.ledger-token.outputs.token }}
        run: |
          PYTHONPATH=. python ci/erdos_event_custody.py --mode ledger --event "$GITHUB_EVENT_PATH"

  canary:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 2500 &&
      github.event.issue.title == '[GCL-CANARY] RESULT/1 intake event acceptance' &&
      startsWith(github.event.comment.body, 'RESULT/1')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Replay real GitHub canary comment through the production parser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=. python ci/erdos_event_custody.py --mode canary --event "$GITHUB_EVENT_PATH"

  forge-pilot-review:
    name: One bounded Forge mathematical critique (Copilot, evidence only)
    # Quarantined pending INTELLECT #118: a green queue repair never authorizes AI execution.
    if: github.event_name == 'push' && needs.reconcile.result == 'success' && false
    needs: [reconcile]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Preflight exact protected Forge candidate and queue state
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python ci/erdos_forge_copilot_pilot.py prepare --out forge-erdos-pilot
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("forge-erdos-pilot/status.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ready="+("true" if d["ready"] else "false")+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Forge critique canary: "+d["state"]+". No mathematical authority effect.\n")
          PY
      - name: Provision fixed Node runtime
        if: steps.prep.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install bounded Copilot CLI
        if: steps.prep.outputs.ready == 'true'
        run: npm install -g @github/copilot@1.0.66
      - name: Run non-authoring mathematical critique with no mutation tools
        if: steps.prep.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --version > forge-erdos-pilot/copilot-version.txt
          timeout 420s copilot -p "$(cat forge-erdos-pilot/prompt.txt)" -s \
            --model=gpt-5.4 --max-ai-credits=30 --no-auto-update --no-ask-user \
            --disable-builtin-mcps --available-tools=read \
            --deny-tool=shell --deny-tool=write --deny-tool=url \
            > forge-erdos-pilot/model-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          from ci.erdos_forge_copilot_pilot import validate_model_output
          d=Path("forge-erdos-pilot")
          validate_model_output(json.loads((d/"model-output.json").read_text()),
                                json.loads((d/"task.json").read_text()))
          PY
      - name: Preserve bounded pilot or exact blocker for readback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: erdos-forge-copilot-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: forge-erdos-pilot/
          retention-days: 90
          if-no-files-found: error

  forge-pilot-evidence:
    name: Publish unadjudicated Forge reviewer evidence (never an approval)
    # Quarantined with model worker: no model evidence publishing during governance review.
    if: github.event_name == 'push' && needs.forge-pilot-review.result == 'success' && false
    needs: [forge-pilot-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: erdos-forge-copilot-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: forge-erdos-pilot
      - name: Bind and publish nonauthoritative critical evidence or recorded blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ci/erdos_forge_copilot_pilot.py publish --out forge-erdos-pilot \
            | tee -a "$GITHUB_STEP_SUMMARY"
