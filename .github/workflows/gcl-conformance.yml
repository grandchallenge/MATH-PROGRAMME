name: GCL conformance
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
concurrency:
  group: gcl-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    uses: grandchallenge/.github/.github/workflows/gcl-policy.yml@6df9adc6fae6086eab11800dadd06af6dc0f3b5b
    with:
      profile: Programme
      standards_ref: c5604226b306a1b6fe104757a3852ded5cba2bb9
  security:
    permissions:
      contents: read
      security-events: write
    uses: grandchallenge/.github/.github/workflows/gcl-security.yml@6df9adc6fae6086eab11800dadd06af6dc0f3b5b
