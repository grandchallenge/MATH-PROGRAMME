name: GCL conformance
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
concurrency:
  group: gcl-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    timeout-minutes: 10
    uses: grandchallenge/.github/.github/workflows/gcl-policy.yml@fa540b9d00e389486e031268198199cd363ea175
    with:
      profile: Programme
      standards_ref: c5604226b306a1b6fe104757a3852ded5cba2bb9
