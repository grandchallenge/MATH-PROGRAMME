name: BSD WP03 substrate replay

on:
  pull_request:
    paths:
      - "campaigns/birch_swinnerton_dyer/WP02_THEOREM_LEDGER/02_THEOREM_LEDGER.json"
      - "campaigns/birch_swinnerton_dyer/WP03_COMPUTATIONAL_FORMAL_SUBSTRATE/**"
      - ".github/workflows/bsd-wp03-substrate.yml"
  push:
    branches: [main]
    paths:
      - "campaigns/birch_swinnerton_dyer/WP02_THEOREM_LEDGER/02_THEOREM_LEDGER.json"
      - "campaigns/birch_swinnerton_dyer/WP03_COMPUTATIONAL_FORMAL_SUBSTRATE/**"
      - ".github/workflows/bsd-wp03-substrate.yml"

permissions:
  contents: read

concurrency:
  group: bsd-wp03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Replay BSD-WP03 substrate contract
        run: python campaigns/birch_swinnerton_dyer/WP03_COMPUTATIONAL_FORMAL_SUBSTRATE/replay.py
