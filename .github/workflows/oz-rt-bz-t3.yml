name: OZ-RT-BZ-T3 blocker closure

on:
  pull_request:
    paths:
      - '.github/workflows/oz-rt-bz-t3.yml'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_001/**'
      - 'campaigns/odd_zeta/OZ_SOURCE_REVISION_DELTA_002/**'
      - 'tests/test_oz_rt_bz_t3.py'
      - 'tests/test_oz_source_revision_delta_002.py'
      - 'ci/campaign_replay_registry.json'
      - 'ci/validate_workflow_coverage.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oz-rt-bz-t3.yml'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_001/**'
      - 'campaigns/odd_zeta/OZ_SOURCE_REVISION_DELTA_002/**'
      - 'tests/test_oz_rt_bz_t3.py'
      - 'tests/test_oz_source_revision_delta_002.py'
      - 'ci/campaign_replay_registry.json'
      - 'ci/validate_workflow_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oz-rt-bz-t3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SRC1_REPO: https://github.com/rain-1/odd-zeta-values-autoformalization.git
  SRC1_SHA: 3046acf948896358f420e7a655e7a4235c92028a
  SRC2_REPO: https://github.com/rain-1/-odd-zeta-values-moremath.git
  SRC2_SHA: 968477ed7e406df6542f8da6fbe1cd6ca7273c47
  SRC2_DELTA_SHA: 790685b7ee4f642a8a88a1bd120636d1b8b39ea8
  SRC2_DELTA_TREE: 646ee73dd9066e059b043fad64fb20959f111cbf

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Validate blocker closure and mutation tests
        run: |
          python campaigns/odd_zeta/OZ_RT_BZ_T3_001/validate.py
          python -m unittest tests/test_oz_rt_bz_t3.py -v
          python -m json.tool campaigns/odd_zeta/OZ_RT_BZ_T3_001/OZ_RT_BZ_T3_001.json >/dev/null
          python -m json.tool campaigns/odd_zeta/OZ_RT_BZ_T3_001/OZ_RT_BZ_T3_001.schema.json >/dev/null
      - name: Acquire exact source revisions
        run: |
          git clone --filter=blob:none "$SRC1_REPO" src1
          git -C src1 checkout --detach "$SRC1_SHA"
          test "$(git -C src1 rev-parse HEAD)" = "$SRC1_SHA"
          git clone --filter=blob:none "$SRC2_REPO" src2
          git -C src2 checkout --detach "$SRC2_SHA"
          test "$(git -C src2 rev-parse HEAD)" = "$SRC2_SHA"
      - name: Verify source identities and blocker text
        run: |
          set -euo pipefail
          test "$(git -C src2 hash-object bz_compact_weights_proofs.tex)" = da46db62471fbed81d861772c1d2d03d80782e23
          test "$(git -C src2 hash-object work/Z5T3_BRIDGE.md)" = 002c96d28123e5949c38656f26677ae5a723ee93
          test "$(git -C src2 hash-object work/z5cf/verify_compact.py)" = be458d969e1f8c989c8007a2b181506f84fd7f48
          test "$(git -C src2 hash-object work/lb5/core.py)" = 9495275bc31e5a8f535c68f027f3b24d12c07ae1
          grep -Fq 'ONLY remaining gap' src2/work/Z5T3_BRIDGE.md
          grep -Fq 'FIXED letter coefficients' src2/work/Z5T3_BRIDGE.md
          grep -Fq 'PIVOT (the mapped next campaign)' src2/work/Z5T3_BRIDGE.md
          grep -Fq 'not attempted' src2/work/Z5T3_BRIDGE.md
      - name: Replay X007 finite evidence without promotion
        run: |
          sudo mkdir -p /home/ubuntu/fable-episode-2
          sudo ln -sfnT "$GITHUB_WORKSPACE/src1" /home/ubuntu/fable-episode-2/zeta-math
          sudo ln -sfnT "$GITHUB_WORKSPACE/src2" /home/ubuntu/fable-episode-2/zeta-math-2
          python3 -c "import runpy,sys; sys.path.insert(0,'src2/work/z5cf'); runpy.run_path('src2/work/z5cf/verify_compact.py', run_name='__main__')" | tee x007-compact.log
          grep -Fq 'w5: ALL PASS n=0..34' x007-compact.log
          grep -Fq 'L_BZ[sum T w5] = 0 for n = 0..31 : ALL ZERO' x007-compact.log
          echo 'Finite replay has theorem_effect=NONE.' >> "$GITHUB_STEP_SUMMARY"

  source-delta-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: |
          python -m pip install --requirement requirements/policy.txt
          python -m pip install sympy==1.14.0 mpmath==1.3.0
      - name: Validate intake package and adversarial mutations
        run: |
          python -c "from campaigns.odd_zeta.OZ_SOURCE_REVISION_DELTA_002.validate import main; raise SystemExit(main())"
          python -m unittest tests/test_oz_source_revision_delta_002.py -v
          python -m json.tool campaigns/odd_zeta/OZ_SOURCE_REVISION_DELTA_002/OZ_SOURCE_REVISION_DELTA_002.json >/dev/null
          python -m json.tool campaigns/odd_zeta/OZ_SOURCE_REVISION_DELTA_002/OZ_SOURCE_REVISION_DELTA_002.schema.json >/dev/null
      - name: Acquire and verify the exact seven-commit source delta
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$SRC2_REPO" source-delta
          git -C source-delta fetch origin "$SRC2_SHA" "$SRC2_DELTA_SHA"
          git -C source-delta checkout --detach "$SRC2_DELTA_SHA"
          test "$(git -C source-delta rev-parse HEAD)" = "$SRC2_DELTA_SHA"
          test "$(git -C source-delta rev-parse HEAD^{tree})" = "$SRC2_DELTA_TREE"
          test "$(git -C source-delta merge-base "$SRC2_SHA" "$SRC2_DELTA_SHA")" = "$SRC2_SHA"
          test "$(git -C source-delta rev-list --count "$SRC2_SHA..$SRC2_DELTA_SHA")" = 7
          git -C source-delta diff --name-status "$SRC2_SHA..$SRC2_DELTA_SHA" > source-delta-name-status.txt
          git -C source-delta archive --format=tar "$SRC2_DELTA_SHA" | sha256sum | tee source-delta-archive.sha256
          {
            echo '## Exact source delta identities'
            echo
            echo "- base: \`$SRC2_SHA\`"
            echo "- head: \`$SRC2_DELTA_SHA\`"
            echo "- tree: \`$SRC2_DELTA_TREE\`"
            echo '- commits: `7`'
            echo "- archive: \`$(cut -d' ' -f1 source-delta-archive.sha256)\`"
            echo "- changed paths: \`$(wc -l < source-delta-name-status.txt)\`"
            echo '- Python replay: `sympy==1.14.0`, `mpmath==1.3.0`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify admitted source loci and status boundaries
        run: |
          set -euo pipefail
          test "$(git -C source-delta hash-object PROGRAM_CLOSEOUT.md)" = e293c6610ba4c39c84799caddd4413233ee41001
          test "$(git -C source-delta hash-object lean/lean-toolchain)" = fd85b262bf1c734663aa8292b0101f672168788f
          test "$(git -C source-delta hash-object lean/lake-manifest.json)" = 8a3f441359ee64dfeb3d027a297d2a0ca98f5dce
          test "$(git -C source-delta hash-object lean/ZetaLucas.lean)" = feb40994f119e8729755350d7ab3283b2702227c
          test "$(git -C source-delta hash-object lean/ZetaLucas/FranelClosedForm.lean)" = fd34e447fd836310f3a3f56288a1704461ba83b8
          test "$(git -C source-delta hash-object lean/ZetaLucas/CatalanEndpoint.lean)" = d94131f40cadbd52e06da26afe1b6fc9c47efc83
          test "$(git -C source-delta hash-object lean/ZetaLucas/ZagierBEndpoint.lean)" = a05fd9ba43b58cd4009a3e7713af4067d115bf54
          grep -Fq 'exactly two inputs' source-delta/papers_out/sharp12/sharp12.tex
          grep -Fq '(T1-top)' source-delta/papers_out/sharp12/sharp12.tex
          grep -Fq '(DEPTH)' source-delta/papers_out/sharp12/sharp12.tex
          grep -Fq 'It does **not** yet formalize' source-delta/lean/ZetaLucas/ZagierBEndpoint.lean
          grep -Fq 'does *not* formalize the identification' source-delta/lean/ZetaLucas/CatalanEndpoint.lean
          grep -Fq 'No low-degree splitting' source-delta/work/Z5_MODULARITY_PROBE.md
          grep -Fq 'full order-9' source-delta/work/Z5_MODULARITY_PROBE.md
      - name: Replay bounded executable evidence
        working-directory: source-delta
        run: |
          set -euo pipefail
          sudo mkdir -p /home/ubuntu/fable-episode-2
          sudo ln -sfnT "$GITHUB_WORKSPACE/source-delta" /home/ubuntu/fable-episode-2/zeta-math-2
          python3 -c "import runpy; runpy.run_path('papers_out/expository_apery/verify.py', run_name='__main__')" | tee ../expository-apery-replay.log
          grep -Fq 'CHECK1 a_n sum==recurrence n<=25: True' ../expository-apery-replay.log
          grep -Fq 'CHECK2 b_n closed form satisfies recurrence 1<=n<=24: True' ../expository-apery-replay.log
          grep -Fq 'CHECK4 t(q)==q(eta1 eta6/eta2 eta3)^12' ../expository-apery-replay.log
          grep -Fq 'CHECK5 F(q)==(eta2 eta3)^7/(eta1 eta6)^5' ../expository-apery-replay.log
          grep -Fq 'CHECK6 companion formula == B(n)' ../expository-apery-replay.log
          grep -Fq 'CHECK7 b_n == 6 B(n) n<=25: True' ../expository-apery-replay.log
          python3 -m py_compile \
            work/z5eps/eps57_sym2_all.py \
            work/z5eps/eps58_denoms.py \
            work/z5eps/eps59_rowhunt.py \
            work/z5eps/eps60_density.py
          echo 'Expository Apéry checks replayed exactly. Heavy symbolic lanes remain pending exact bounded replay; compilation is not theorem evidence.' >> "$GITHUB_STEP_SUMMARY"

  source-delta-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Acquire exact candidate Lean source
        run: |
          git clone --filter=blob:none "$SRC2_REPO" source-delta
          git -C source-delta checkout --detach "$SRC2_DELTA_SHA"
          test "$(git -C source-delta rev-parse HEAD)" = "$SRC2_DELTA_SHA"
      - name: Install Lean
        run: |
          for attempt in 1 2 3; do
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y && break
            test "$attempt" -lt 3
            sleep $((attempt * 10))
          done
          test -x "$HOME/.elan/bin/lake"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build aggregate and audit selected declarations
        working-directory: source-delta/lean
        run: |
          set -euo pipefail
          lake exe cache get
          lake build ZetaLucas
          cat > GCLSourceDeltaAudit.lean <<'EOF'
          import ZetaLucas.FranelClosedForm
          import ZetaLucas.CatalanEndpoint
          import ZetaLucas.ZagierBEndpoint
          #check ZetaLucas.franel_closed_form
          #check ZetaLucas.franel_harmonic_closed_form
          #check ZetaLucas.s10_closed_form
          #check ZetaLucas.s10_harmonic_closed_form
          #check ZetaLucas.catalanB_sharp_denominator
          #check ZetaLucas.zagC_unique
          #check ZetaLucas.zagC6_forces_three_dvd
          #check ZetaLucas.zagC2_not_scaled_integral
          #print axioms ZetaLucas.franel_closed_form
          #print axioms ZetaLucas.franel_harmonic_closed_form
          #print axioms ZetaLucas.s10_closed_form
          #print axioms ZetaLucas.s10_harmonic_closed_form
          #print axioms ZetaLucas.catalanB_sharp_denominator
          #print axioms ZetaLucas.zagC_unique
          #print axioms ZetaLucas.zagC6_forces_three_dvd
          #print axioms ZetaLucas.zagC2_not_scaled_integral
          EOF
          lake env lean GCLSourceDeltaAudit.lean | tee gcl-source-delta-axioms.log
          ! grep -q 'sorryAx' gcl-source-delta-axioms.log
          grep -q 'ZetaLucas.catalanB_sharp_denominator' gcl-source-delta-axioms.log
          grep -q 'ZetaLucas.franel_closed_form' gcl-source-delta-axioms.log
          echo 'Aggregate Lean build and selected declaration-level axiom audit passed; no Programme promotion follows.' >> "$GITHUB_STEP_SUMMARY"
