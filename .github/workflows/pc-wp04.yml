name: PC-WP04 certificate checks

on:
  pull_request:
    paths:
      - "fixtures/formal/PC-WP04/**"
      - "campaigns/poincare_reconstruction/WP03_SURGERY_TOPOLOGY/**"
      - "campaigns/poincare_reconstruction/WP04_BOUNDED_CERTIFICATION/**"
      - "ci/*pc_wp04*"
      - "requirements/policy.txt"
      - ".github/workflows/pc-wp04.yml"
  push:
    branches: [main]
    paths:
      - "fixtures/formal/PC-WP04/**"
      - "campaigns/poincare_reconstruction/WP03_SURGERY_TOPOLOGY/**"
      - "campaigns/poincare_reconstruction/WP04_BOUNDED_CERTIFICATION/**"
      - "ci/*pc_wp04*"
      - "requirements/policy.txt"
      - ".github/workflows/pc-wp04.yml"

permissions:
  contents: read

concurrency:
  group: pc-wp04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pc-wp04-lean:
    name: Kernel-check PC-WP04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install fixture dependencies
        run: python -m pip install --requirement requirements/policy.txt

      - name: Validate PC-WP04 certificate policy
        run: python3 ci/validate_pc_wp04_fixture.py fixtures/formal/PC-WP04

      - name: Run adversarial PC-WP04 policy tests
        run: python3 ci/test_pc_wp04_fixture.py

      - name: Reject proof placeholders and opaque axioms
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|axiom)([^A-Za-z]|$)' fixtures/formal/PC-WP04/PCWP04 fixtures/formal/PC-WP04/PCWP04.lean; then
            echo "PC-WP04 must contain neither sorry nor local axioms."
            exit 1
          fi

      - name: Set up pinned Lean and mathlib cache
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/PC-WP04
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Resolve and build PC-WP04 fixture
        working-directory: fixtures/formal/PC-WP04
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set +e
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json || {
              echo "Pinned lake-manifest.json is required."
              exit 1
            }
            lake build
          } > pc-wp04-lean-build.log 2>&1
          status=$?
          cat pc-wp04-lean-build.log
          exit "$status"

      - name: Preserve PC-WP04 Lean failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pc-wp04-lean-failure
          path: fixtures/formal/PC-WP04/pc-wp04-lean-build.log
          if-no-files-found: warn
