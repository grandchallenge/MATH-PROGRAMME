name: PC-WP04 promotion replay

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-wp04-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: Replay PC-WP04 promotion contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected-main promotion source
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Set up exact PC-WP04 Lean environment
        uses: grandchallenge/lean-action@37f8471aecd2efbeab3b1e1a75ad18fb8f5c1b01
        with:
          lake-package-directory: fixtures/formal/PC-WP04
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Replay governed promotion closure
        run: python3 ci/formal_validation.py run --lane pc-wp04 --mode promotion --changed-paths-json '[]'
