name: GCL recurring queue heartbeat watchdog

on:
  schedule:
    # Two staggered opportunities; GitHub cron dispatches may be delayed or dropped.
    - cron: '17 * * * *'
    - cron: '43 * * * *'
  # A valid worker comment supplies an independent event-driven wakeup.
  # This does not replace the absence detector's scheduled checks.
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcl-queue-heartbeat-watch
  cancel-in-progress: false

jobs:
  watch:
    # Avoid a costly audit for unrelated issue/PR comments.
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.number == 2763 }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Replay hostile and positive tests
        run: python3 ci/test_recurring_heartbeat_watch.py
      - name: Audit the durable authenticated heartbeat stream
        shell: bash
        run: |
          set +e
          python3 ci/recurring_heartbeat_watch.py --output "$RUNNER_TEMP/heartbeat-watch.json"
          result=$?
          if [ -f "$RUNNER_TEMP/heartbeat-watch.json" ]; then
            cat "$RUNNER_TEMP/heartbeat-watch.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Retain independent observation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gcl-recurring-heartbeat-observation
          path: ${{ runner.temp }}/heartbeat-watch.json
          if-no-files-found: ignore
          retention-days: 30
