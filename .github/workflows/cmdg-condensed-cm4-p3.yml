name: CMDG condensed CM4 P3

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ci/*cmdg*.py"
      - "ci/validate_workflow_coverage*.py"
      - "ci/validate_rh_continuity.py"
      - "governance/cmdg_*.json"
      - "governance/policy_shard_registry.json"
      - "schemas/cmdg_*.json"
      - "schemas/cross_repository_evidence.schema.json"
      - "fixtures/cmdg/**"
      - "fixtures/formal/CMDG-NAT-CONCORDANCE-001/**"
      - "tests/test_cmdg*.py"
      - "tests/**/test_cmdg*.py"
      - "requirements/policy.txt"
      - "evidence/UC-WP02-MATHCERT.json"
      - "campaigns/riemann_hypothesis/RH_WP01_WP02_POST_MERGE_DISPOSITION.md"
      - "docs/domains/riemann_hypothesis.md"
      - "docs/domains/index.md"
      - "docs/AGENT_COUNCIL_ARTIFACT_LEDGER.md"
      - "docs/CAMPAIGN_PROMOTION_REGISTER.md"
      - "reviews/riemann_hypothesis/RH-WP01.agent_review.yaml"
      - "reviews/riemann_hypothesis/RH-WP02.agent_review.yaml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmdg-condensed-cm4-p3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate P3 exact-tree blocker certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Compile P3 validator
        run: python -m py_compile ci/validate_cmdg_condensed_cm4_p3.py
      - name: Validate P3 governed record and mutations
        run: python3 ci/validate_cmdg_condensed_cm4_p3.py
      - name: Run P3 unit tests
        run: python -m unittest tests.test_cmdg_condensed_cm4_p3
      - name: Revalidate workflow coverage
        run: python3 ci/validate_workflow_coverage_v2.py

  formal-audit:
    name: Replay P3 pinned-interface audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject proof placeholders and accidental P3 promotion
        run: |
          set -euo pipefail
          F=fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3Audit.lean
          C=fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3C.lean
          if grep -nE '^[[:space:]]*(sorry|axiom)([[:space:]]|$)' "$F" "$C"; then
            echo "P3 fixtures must contain neither sorry nor local axioms."
            exit 1
          fi
          if grep -niE 'theorem[[:space:]]+.*(p3|profinite.*vanish|issolid)' "$F"; then
            echo "P3 audit fixture must not assert the missing closure theorem."
            exit 1
          fi
          grep -Fq 'measurePrecomp_isIso_iff_solidPrecomp' "$C"
          grep -Fq 'isSolid_of_measurePrecomp_isIso' "$C"
          if grep -nE '(^|[[:space:]])instance[[:space:]].*IsSolid' "$C"; then
            echo "P3-C reduction fixture must not install an unconditional IsSolid instance."
            exit 1
          fi
      - name: Set up pinned Lean and mathlib cache
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Verify exact pinned dependencies
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        run: |
          set -euo pipefail
          ML=".lake/packages/mathlib"
          test "$(git -C "$ML" rev-parse HEAD)" = "79d0395a1825a6264ad5d269e35e60537518955e"
          test "$(git -C "$ML" rev-parse HEAD^{tree})" = "d76f5e09b832a08949f6d8ad4fb80ce30527da64"
          test "$(git -C "$ML" hash-object Mathlib/Algebra/Homology/DerivedCategory/Ext/Basic.lean)" = "2ee4d31030b25e6886bf6884046b33727385e0d3"
          test "$(git -C "$ML" hash-object Mathlib/Algebra/Homology/DerivedCategory/Ext/EnoughInjectives.lean)" = "d7b9f8c1a97059c57b9902e5e5e910310c863777"
          test "$(git -C "$ML" hash-object Mathlib/Algebra/Homology/DerivedCategory/Ext/EnoughProjectives.lean)" = "2dc52050bd2d7dc83315085de972962ca79522ed"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Sites/Abelian.lean)" = "d5250edfc56c2d79c7dae942fe0ab1e8a93ac707"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Sites/GlobalSections.lean)" = "9d1bb0ed58be3f99e96ba5ddaf8a33abdd9a72d7"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Sites/SheafCohomology/Basic.lean)" = "c2f49b4e071c5e5e30b7a7aaaa1fc2656d4ef7e5"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Sites/SheafCohomology/Cech.lean)" = "fa984791594387b9f3e2e435f88390e21e83ea1b"
          test "$(git -C "$ML" hash-object Mathlib/Condensed/Discrete/Module.lean)" = "b3ba358aa6b01b2de4cfedf6480ac22e863241d3"
          test "$(git -C "$ML" hash-object Mathlib/Condensed/Discrete/Characterization.lean)" = "50046d821d15f9eb651d6b1dc91a3df94f951c79"
          test "$(git -C "$ML" hash-object Mathlib/Condensed/Epi.lean)" = "566eb699008b5158d79c743317383b4b9de6455d"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Preadditive/Projective/Internal.lean)" = "ee04c3c01d315f763caca98563b19079c625fd76"
          test "$(git -C "$ML" hash-object Mathlib/Condensed/Light/InternallyProjective.lean)" = "91b0b495e708368b0d5f58bb2865490d18d90657"
          test "$(git -C "$ML" hash-object Mathlib/Topology/Category/Profinite/Projective.lean)" = "4a0091b41978cc737b5e7c3455570628a37ac361"
          test "$(git -C "$ML" hash-object Mathlib/Topology/Separation/Profinite.lean)" = "1bc259a4f9b82065f51d4c7f5d3c6fd7396ef122"
          test "$(git hash-object CMDGCondensedCM4P2D.lean)" = "7515583c1b56308bbd48c2c690addd3b432eba09"
          test "$(git hash-object CMDGCondensedCM4P2EE3.lean)" = "24913aa4c1b2616fea244e2d73d912f99aae5921"
      - name: Build and replay formal audit
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set -euo pipefail
          echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
          lake build CMDGCondensedCM4P3Audit
          lake env lean CMDGCondensedCM4P3Audit.lean
      - name: Materialize protected P2-E terminal module
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        run: |
          set -euo pipefail
          lake build CMDGCondensedCM4P2E CMDGCondensedCM4P2EAlgebraic CMDGCondensedCM4P2EInternalHom
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EPointProbe.olean CMDGCondensedCM4P2EPointProbe.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EPointProbeRecovery.olean CMDGCondensedCM4P2EPointProbeRecovery.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EReverseTriangle.olean CMDGCondensedCM4P2EReverseTriangle.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2ERankOneNaturalIso.olean CMDGCondensedCM4P2ERankOneNaturalIso.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteTransport.olean CMDGCondensedCM4P2EFiniteTransport.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteDualTransport.olean CMDGCondensedCM4P2EFiniteDualTransport.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteDualKronecker.olean CMDGCondensedCM4P2EFiniteDualKronecker.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteDualTriangles.olean CMDGCondensedCM4P2EFiniteDualTriangles.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteDualResolution.olean CMDGCondensedCM4P2EFiniteDualResolution.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteDualFamilyIso.olean CMDGCondensedCM4P2EFiniteDualFamilyIso.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteDualNaturality.olean CMDGCondensedCM4P2EFiniteDualNaturality.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteDualPushforward.olean CMDGCondensedCM4P2EFiniteDualPushforward.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteMeasureTransport.olean CMDGCondensedCM4P2EFiniteMeasureTransport.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EFiniteFreeTransport.olean CMDGCondensedCM4P2EFiniteFreeTransport.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EE1.olean CMDGCondensedCM4P2EE1.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EE2Core.olean CMDGCondensedCM4P2EE2Core.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EE2.olean CMDGCondensedCM4P2EE2.lean
          lake env lean -o .lake/build/lib/lean/CMDGCondensedCM4P2EE3.olean CMDGCondensedCM4P2EE3.lean
      - name: Build and replay P3-C underived reduction
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        run: |
          set -euo pipefail
          lake build CMDGCondensedCM4P3C
          lake env lean CMDGCondensedCM4P3C.lean
