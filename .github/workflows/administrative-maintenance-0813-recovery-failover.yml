name: Administrative maintenance Aug13 recovery failover

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: administrative-maintenance-0813-recovery-failover
  cancel-in-progress: false

jobs:
  recover:
    name: Recover exact Aug13 receipt after bounded control merge
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'control/mp-admin-0813-')
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: release-trust
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mint bounded Candidate and merge-executor token
        id: write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Mint bounded evidence and observability token
        id: evidence-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: |
            MATH-PROGRAMME
            MATHFORGE
            MATHSOLVE
            MATHCERT
            INTELLECT
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Mint bounded ruleset-readback token
        id: admin-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-administration: write

      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install governed policy dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements/policy.txt

      - name: Require bounded and separated recovery credentials
        env:
          WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
          EVIDENCE_TOKEN: ${{ steps.evidence-token.outputs.token }}
          ADMIN_TOKEN: ${{ steps.admin-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN}"
          test -n "${EVIDENCE_TOKEN}"
          test -n "${ADMIN_TOKEN}"
          test "${ADMIN_TOKEN}" != "${WRITE_TOKEN}"
          test "${EVIDENCE_TOKEN}" != "${WRITE_TOKEN}"

      - name: Recover exact Aug13 closure only
        env:
          CANDIDATE_TOKEN: ${{ steps.write-token.outputs.token }}
          EVIDENCE_TOKEN: ${{ steps.evidence-token.outputs.token }}
          OBSERVABILITY_TOKEN: ${{ steps.evidence-token.outputs.token }}
          REFEREE_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ steps.admin-token.outputs.token }}
          CANDIDATE_LOGIN: ${{ format('{0}[bot]', steps.write-token.outputs.app-slug) }}
          ADMIN_LOGIN: ${{ format('{0}[bot]', steps.write-token.outputs.app-slug) }}
          REFEREE_LOGIN: 'github-actions[bot]'
          CANDIDATE_APP_ID: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          REFEREE_APP_ID: '15368'
        run: |
          set -euo pipefail
          python ci/administrative_autonomy_0813_closure_preflight.py \
            --apply \
            --report administrative-autonomy-0813-pr-close-recovery.json

      - name: Preserve exact failover evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: administrative-autonomy-0813-pr-close-recovery
          path: administrative-autonomy-0813-pr-close-recovery.json
          if-no-files-found: warn
          retention-days: 90
