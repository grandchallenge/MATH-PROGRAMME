name: CMDG P3-M alias-normalization evidence capture

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004-diag-evidence-104209987608
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  proof-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Normalize local aliases before tail composition
        shell: bash
        run: |
          f=fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean
          sed -i '/simp only \[ConcreteCategory.comp_apply\] at hnatTail/a\  dsimp [Q, T, S] at hnatTail' "$f"
          sed -i '/have hbridgeTail\x27 := hnatTail.symm.trans hbridgeTail/a\  dsimp [Q, P, T, S] at hbridgeTail\x27' "$f"
          sed -i '/dsimp only \[Q\] at hbridgeTail\x27/d' "$f"
          git --no-pager diff --check
          git --no-pager diff -- "$f"
      - name: Set up pinned Lean environment
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Capture governed P3 formal lane
        env:
          FORMAL_CHANGED_PATHS: '["fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean"]'
        shell: bash
        run: |
          set +e
          python3 ci/formal_validation.py run \
            --lane "cmdg-cm4-p3" \
            --mode "development" \
            --changed-paths-json "$FORMAL_CHANGED_PATHS" \
            > cmdg-p3-residual.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > cmdg-p3-exit-code.txt
          cat cmdg-p3-residual.log
          exit 0
      - name: Upload governed-lane residual
        if: always()
        uses: actions/upload-artifact@043fb46c3abb44a0b8e8c3c5511492ef876e6ef2
        with:
          name: cmdg-p3-residual-104209987608
          path: |
            cmdg-p3-residual.log
            cmdg-p3-exit-code.txt
          if-no-files-found: error
      - name: Reassert governed lane outcome
        if: always()
        shell: bash
        run: |
          rc=$(cat cmdg-p3-exit-code.txt)
          exit "$rc"
