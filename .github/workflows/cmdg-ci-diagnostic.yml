name: CMDG CI diagnostic bridge

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

jobs:
  sealed-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish sealed formal diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_ID: "103937133223"
          PR_NUMBER: "966"
        shell: bash
        run: |
          set -euo pipefail

          check_id="$(gh api "repos/${REPO}/actions/jobs/${JOB_ID}" --jq '.check_run_url | split("/")[-1]')"
          annotations="$(gh api --allow-escape-sequences "repos/${REPO}/check-runs/${check_id}/annotations?per_page=100" --paginate --jq '.[] | [(.path // ""), (.start_line // 0), (.end_line // 0), (.annotation_level // ""), (.title // ""), (.message // "")] | @tsv')"

          gh api --allow-escape-sequences "repos/${REPO}/actions/jobs/${JOB_ID}/logs" > /tmp/cmdg-job.log
          excerpt="$(grep -n -C 16 -E 'error:|unsolved goals|type mismatch|application type mismatch|failed|CMDGCondensedCM4P3GPointFunctional' /tmp/cmdg-job.log | head -c 40000 || true)"

          body="$(printf '%s\n\n%s\n%s\n%s\n\n%s\n%s\n%s\n' \
            '<!-- cmdg-ci-diagnostic -->' \
            'Sealed formal diagnostic for job `103937133223`:' \
            '```text' \
            "${annotations}" \
            'Relevant job-log excerpt:' \
            '```text' \
            "${excerpt}")"
          body="${body}"$'\n```'

          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null
