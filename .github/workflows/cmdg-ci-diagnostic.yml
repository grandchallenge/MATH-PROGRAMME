name: CMDG P3-M small-free alias experiment

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  proof-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Type the transported section at the local aliases
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 -c 'import os,base64; from pathlib import Path; p=Path("fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean"); s=p.read_text(); old=base64.b64decode(os.environ["OLD_B64"]).decode(); new=base64.b64decode(os.environ["NEW_B64"]).decode(); assert old in s, "expected proof block not found"; p.write_text(s.replace(old,new,1))'
          git --no-pager diff --check
          git --no-pager diff -- fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean
      - name: Set up pinned Lean environment
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Execute governed P3 formal lane
        env:
          FORMAL_CHANGED_PATHS: '["fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean"]'
        shell: bash
        run: |
          set +e
          python3 ci/formal_validation.py run --lane "cmdg-cm4-p3" --mode "development" --changed-paths-json "$FORMAL_CHANGED_PATHS" 2>&1 | tee /tmp/formal.log
          status=${PIPESTATUS[0]}
          echo '::group::LEAN_RESULT'
          grep -n -C 24 -E 'error:|unsolved goals|type mismatch|application type mismatch|declaration uses|sorryAx|CMDGCondensedCM4P3GPointFunctional' /tmp/formal.log | tail -n 420 || true
          echo '::endgroup::'
          exit "$status"
