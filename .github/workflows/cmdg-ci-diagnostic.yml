name: CMDG P3-M committed-source replay

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004-diag-active
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  proof-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Verify committed proof source is unmodified
        shell: bash
        run: |
          test -z "$(git status --porcelain -- fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean)"
          git rev-parse HEAD
          git hash-object fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean
          nl -ba fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean | sed -n '185,260p'
      - name: Set up pinned Lean environment
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Execute governed P3 formal lane
        env:
          FORMAL_CHANGED_PATHS: '["fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean"]'
        run: >-
          python3 ci/formal_validation.py run
          --lane "cmdg-cm4-p3"
          --mode "development"
          --changed-paths-json "$FORMAL_CHANGED_PATHS"
