name: CMDG P3-M sandbox diagnostic

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004-diag-active
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  sealed-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit sandbox Lean diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_ID: "104174273914"
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences "repos/${REPO}/actions/jobs/${JOB_ID}/logs" > /tmp/cmdg-job.log
          echo '::group::LEAN_ERRORS'
          grep -n -C 50 -E 'error:|unsolved goals|type mismatch|application type mismatch|failed to synthesize|declaration has metavariables|CMDGCondensedCM4P3GPointFunctional' /tmp/cmdg-job.log | sed -n '1,480p' || true
          echo '::endgroup::'
          echo '::group::LEAN_TAIL'
          tail -n 220 /tmp/cmdg-job.log || true
          echo '::endgroup::'
