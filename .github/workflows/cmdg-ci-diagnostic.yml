name: CMDG P3-M proof sandbox

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004-diag-active
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  proof-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Apply explicit finite-object naturality experiment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean')
          s = p.read_text()
          old_tail = '''  let eTail :=\n    CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeCondensedDiscreteNatIso.hom.app Q ≫\n      CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeDiscreteULiftNatIso.hom.app Q\n'''
          new_tail = '''  let eTail :=\n    CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeCondensedDiscreteNatIso.hom.app\n        (CMDG.CondensedCM4P3G.FiniteBooleanMeasure.FiniteQuotientObject X j) ≫\n      CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeDiscreteULiftNatIso.hom.app\n        (CMDG.CondensedCM4P3G.FiniteBooleanMeasure.FiniteQuotientObject X j)\n'''
          if old_tail not in s:
              raise SystemExit('eTail block not found')
          s = s.replace(old_tail, new_tail, 1)
          old_hnat = '''  have hnatTail :=\n    ConcreteCategory.congr_hom\n      (((Condensed.forget CMDG.CondensedCM4P3G.R.{u}).map eTail).hom.naturality\n        ((profiniteToCompHaus).map\n          (basisBooleanPointProbe X (fun _ => true))).op)\n      ((ConcreteCategory.hom\n        ((CMDG.CondensedCM4P2E.FiniteDualTransport.finiteMeasureSmallFreePresheafNatIso.hom.app Q).app S))\n        (weightedFiniteBooleanMeasureSection X (integralBasisEvaluationWeight X x) j))\n'''
          new_hnat = '''  have hnatTail :=\n    ConcreteCategory.congr_hom\n      (((Condensed.forget CMDG.CondensedCM4P3G.R.{u}).map eTail).hom.naturality\n        ((profiniteToCompHaus).map\n          (basisBooleanPointProbe X (fun _ => true))).op)\n      ((ConcreteCategory.hom\n        ((CMDG.CondensedCM4P2E.FiniteDualTransport.finiteMeasureSmallFreePresheafNatIso.hom.app\n          (CMDG.CondensedCM4P3G.FiniteBooleanMeasure.FiniteQuotientObject X j)).app\n          (op ((profiniteToCompHaus).obj\n            (CMDG.CondensedCM4P3G.BooleanCube.basisBooleanCube X)))))\n        (weightedFiniteBooleanMeasureSection X (integralBasisEvaluationWeight X x) j))\n'''
          if old_hnat not in s:
              raise SystemExit('hnatTail block not found')
          s = s.replace(old_hnat, new_hnat, 1)
          start = s.index("  dsimp only [Q] at hbridgeTail'\n")
          end_marker = "    CategoryTheory.Adjunction.homEquiv_leftAdjointUniq_hom_app] at hbridgeTail'\n"
          end = s.index(end_marker, start) + len(end_marker)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
          git diff -- fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean
      - name: Set up pinned Lean environment
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Execute governed P3 formal lane
        env:
          FORMAL_CHANGED_PATHS: '["fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean"]'
        run: >-
          python3 ci/formal_validation.py run
          --lane "cmdg-cm4-p3"
          --mode "development"
          --changed-paths-json "$FORMAL_CHANGED_PATHS"
