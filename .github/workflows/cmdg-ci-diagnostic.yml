name: CMDG CI diagnostic bridge

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  sealed-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit sealed formal diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_ID: "103937133223"
        shell: bash
        run: |
          set -euo pipefail

          gh api --allow-escape-sequences "repos/${REPO}/actions/jobs/${JOB_ID}/logs" > /tmp/cmdg-job.log

          echo '::group::LEAN_FAILURE_BLOCK'
          sed -n '3190,3400p' /tmp/cmdg-job.log
          echo '::endgroup::'
