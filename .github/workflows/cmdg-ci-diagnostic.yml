name: CMDG P3-M sealed job diagnostic

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004-diag-active
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  sealed-job-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: grandchallenge/MATH-PROGRAMME
      TARGET_JOB: "104203344969"
      EXPECTED_TARGET_SHA: 5ef8ed18ec9a6db95ba1b9bcc832136fe7f4cc4f
    steps:
      - name: Verify target and expose exact diagnostics
        shell: bash
        run: |
          set -euo pipefail

          job_json="$(gh api "repos/$REPO/actions/jobs/$TARGET_JOB")"
          run_id="$(jq -r '.run_url | split("/")[-1]' <<<"$job_json")"
          target_sha="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.head_sha')"
          printf 'target job: %s\nrun id: %s\nrun head: %s\n' "$TARGET_JOB" "$run_id" "$target_sha"

          if [[ "$target_sha" != "$EXPECTED_TARGET_SHA" ]]; then
            printf 'SEALED-DIAGNOSTIC-ABORT: expected target SHA %s, got %s\n' \
              "$EXPECTED_TARGET_SHA" "$target_sha" >&2
            exit 2
          fi

          check_run_url="$(jq -r '.check_run_url // empty' <<<"$job_json")"
          if [[ -n "$check_run_url" ]]; then
            check_id="${check_run_url##*/}"
            printf '\n=== check annotations ===\n'
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/check-runs/$check_id/annotations?per_page=100" \
              --jq '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}' || true
          fi

          raw="$(mktemp)"
          clean="$(mktemp)"
          trap 'rm -f "$raw" "$clean"' EXIT

          gh api "repos/$REPO/actions/jobs/$TARGET_JOB/logs" >"$raw"
          sed $'s/\033\\[[0-9;]*[[:alpha:]]//g' "$raw" >"$clean"

          printf '\n=== compiler diagnostics ===\n'
          grep -n -A90 -B20 \
            -E 'error:|unsolved goals|case e\.|application type mismatch|type mismatch|failed to synthesize|declaration has metavariables|tactic.*failed|invalid field|unknown identifier' \
            "$clean" || true

          printf '\n=== final log tail ===\n'
          tail -n 240 "$clean" || true

          printf '\nSEALED-DIAGNOSTIC-COMPLETE\n'
