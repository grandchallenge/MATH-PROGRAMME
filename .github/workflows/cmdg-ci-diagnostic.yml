name: CMDG CI diagnostic bridge

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  sealed-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit sealed formal diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_ID: "103937133223"
        shell: bash
        run: |
          set -euo pipefail

          check_id="$(gh api "repos/${REPO}/actions/jobs/${JOB_ID}" --jq '.check_run_url | split("/")[-1]')"
          annotations="$(gh api --allow-escape-sequences "repos/${REPO}/check-runs/${check_id}/annotations?per_page=100" --paginate --jq '.[] | [(.path // ""), (.start_line // 0), (.end_line // 0), (.annotation_level // ""), (.title // ""), (.message // "")] | @tsv')"

          gh api --allow-escape-sequences "repos/${REPO}/actions/jobs/${JOB_ID}/logs" > /tmp/cmdg-job.log
          excerpt="$(grep -n -C 16 -E 'error:|unsolved goals|type mismatch|application type mismatch|failed|CMDGCondensedCM4P3GPointFunctional' /tmp/cmdg-job.log | sed -n '1,240p' || true)"

          echo '::group::SEALED_ANNOTATIONS'
          printf '%s\n' "${annotations}"
          echo '::endgroup::'
          echo '::group::SEALED_LOG_EXCERPT'
          printf '%s\n' "${excerpt}"
          echo '::endgroup::'
