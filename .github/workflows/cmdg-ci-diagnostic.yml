name: CMDG P3-M alias-normalization experiment

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004-diag-active
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  proof-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Apply bounded alias-normalization proof experiment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean')
          text = path.read_text()

          replacements = [
              (
                  '''  let eTail :=
    CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeCondensedDiscreteNatIso.hom.app Q ≫
      CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeDiscreteULiftNatIso.hom.app Q
''',
                  '''  let eTail :=
    CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeCondensedDiscreteNatIso.hom.app
        (CMDG.CondensedCM4P3G.FiniteBooleanMeasure.FiniteQuotientObject X j) ≫
      CMDG.CondensedCM4P2E.FiniteDualTransport.finiteSmallFreeDiscreteULiftNatIso.hom.app
        (CMDG.CondensedCM4P3G.FiniteBooleanMeasure.FiniteQuotientObject X j)
'''
              ),
              (
                  '''      ((ConcreteCategory.hom
        ((CMDG.CondensedCM4P2E.FiniteDualTransport.finiteMeasureSmallFreePresheafNatIso.hom.app Q).app S))
        (weightedFiniteBooleanMeasureSection X (integralBasisEvaluationWeight X x) j))
''',
                  '''      ((ConcreteCategory.hom
        ((CMDG.CondensedCM4P2E.FiniteDualTransport.finiteMeasureSmallFreePresheafNatIso.hom.app
          (CMDG.CondensedCM4P3G.FiniteBooleanMeasure.FiniteQuotientObject X j)).app
          (op ((profiniteToCompHaus).obj
            (CMDG.CondensedCM4P3G.BooleanCube.basisBooleanCube X)))))
        (weightedFiniteBooleanMeasureSection X (integralBasisEvaluationWeight X x) j))
'''
              ),
              (
                  '''          (op ((profiniteToCompHaus).obj P)))) t)
    hbridge
''',
                  '''          (op ((profiniteToCompHaus).obj (Profinite.of PUnit.{u + 1}))))) t)
    hbridge
'''
              ),
              (
                  '''  dsimp only [Q] at hbridgeTail'
''',
                  ''''''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          printf '%s\n' '=== bounded runtime diff ==='
          git --no-pager diff --check
          git --no-pager diff -- fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean
      - name: Set up pinned Lean environment
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Execute governed P3 formal lane
        env:
          FORMAL_CHANGED_PATHS: '["fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P3GPointFunctional.lean"]'
        run: >-
          python3 ci/formal_validation.py run
          --lane "cmdg-cm4-p3"
          --mode "development"
          --changed-paths-json "$FORMAL_CHANGED_PATHS"
