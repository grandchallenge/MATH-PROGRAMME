name: CMDG P3-M sandbox diagnostic

on:
  push:
    branches:
      - agent/cmdg-cm4-p3-m-kernel-point-004-diag-active
    paths:
      - .github/workflows/cmdg-ci-diagnostic.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  sealed-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit exact surviving Lean goals
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: grandchallenge/MATH-PROGRAMME
          JOB_ID: 104178018336
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences "repos/${REPO}/actions/jobs/${JOB_ID}/logs" > /tmp/cmdg-job.log
          echo '::group::NATURALITY_RESIDUAL'
          grep -n -A95 -B8 'CMDGCondensedCM4P3GPointFunctional.lean:221:4: error' /tmp/cmdg-job.log || true
          echo '::endgroup::'
          echo '::group::GENERATOR_RESIDUAL'
          grep -n -A180 -B4 "case e'_3" /tmp/cmdg-job.log || true
          echo '::endgroup::'
