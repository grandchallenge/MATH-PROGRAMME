name: Administrative maintenance dispatcher

on:
  schedule:
    - cron: '9 18 1 8 *'
    - cron: '57 10 2 8 *'
    - cron: '45 3 3 8 *'
    - cron: '33 20 3 8 *'
    - cron: '21 1 4,7,10 8 *'
    - cron: '21 13 4 8 *'
    - cron: '9 6 5 8 *'
    - cron: '57 22 5 8 *'
    - cron: '45 15 6 8 *'
    - cron: '33 8 7 8 *'
    - cron: '21 1 8 8 *'
    - cron: '9 18 8 8 *'
    - cron: '57 10 9 8 *'
    - cron: '21 13 6 9 *'
    # Factor-0.1 steady-state recurrence. The daily 01:21 trigger covers
    # the Saturday structural locus and all P3D/P9D review loci; the
    # protected evaluator remains responsible for deciding whether a
    # procedure is actually due.
    - cron: '9 18 * * 6'
    - cron: '57 10 * * 0'
    - cron: '45 3 * * 1'
    - cron: '33 20 * * 1'
    - cron: '21 13 * * 2'
    - cron: '9 6 * * 3'
    - cron: '57 22 * * 3'
    - cron: '45 15 * * 4'
    - cron: '33 8 * * 5'
    - cron: '21 1 * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      procedure:
        description: Procedure to dispatch, or auto to evaluate the protected schedule
        required: true
        default: auto
        type: choice
        options:
          - auto
          - structural_sweep
          - administrative_review
          - deep_conformance_review
          - pilot_review
          - constitutional_review
      now:
        description: Optional ISO-8601 evaluation time for controlled replay
        required: false
        type: string
      dry_run:
        description: Generate evidence without asserting an operational dispatch
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'ci/**'
      - 'governance/**'
      - 'schemas/**'
      - 'docs/governance/**'
      - 'CLAIM_LEDGER_STANDARD.md'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
  branch_protection_rule:
    types:
      - created
      - edited
      - deleted
  workflow_run:
    workflows:
      - Programme policy checks
      - GCL conformance
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: administrative-maintenance-dispatch
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate protected maintenance triggers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Evaluate schedule and event obligations from protected receipts
        id: dispatch
        env:
          MANUAL_PROCEDURE: ${{ inputs.procedure || 'auto' }}
          EVALUATION_NOW: ${{ inputs.now || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --event-path "$GITHUB_EVENT_PATH"
            --procedure "$MANUAL_PROCEDURE"
            --report administrative-maintenance-dispatch.json
          )
          if [[ -n "$EVALUATION_NOW" ]]; then
            args+=(--now "$EVALUATION_NOW")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          # Protected compatibility marker: python ci/dispatch_administrative_maintenance.py
          # Protected compatibility marker: dispatch_administrative_maintenance_v2.py
          python ci/dispatch_administrative_maintenance_v3.py "${args[@]}" || {
            rc=$?
            test -f administrative-maintenance-dispatch.json || printf '%s\n' '{"schema_version":"2.0.0","state":"DISPATCH_FAILED_CLOSED","authority_created":false}' > administrative-maintenance-dispatch.json
            exit "$rc"
          }
      - name: Preserve dispatcher evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: administrative-maintenance-dispatch
          path: administrative-maintenance-dispatch.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce P1 fail-closed signal
        if: always() && steps.dispatch.outputs.p1_count != '0'
        shell: bash
        run: |
          echo "P1 administrative maintenance obligation requires protected disposition" >&2
          exit 1
