name: BSD WP04 target scorecard

on:
  pull_request:
    paths:
      - "campaigns/birch_swinnerton_dyer/WP01_FALSE_PROOF_ATLAS/**"
      - "campaigns/birch_swinnerton_dyer/WP02_THEOREM_LEDGER/**"
      - "campaigns/birch_swinnerton_dyer/WP03_COMPUTATIONAL_FORMAL_SUBSTRATE/**"
      - "campaigns/birch_swinnerton_dyer/WP04_RESTRICTED_TARGET_SCORECARD/**"
      - ".github/workflows/bsd-wp04-target.yml"
  push:
    branches: [main]
    paths:
      - "campaigns/birch_swinnerton_dyer/WP01_FALSE_PROOF_ATLAS/**"
      - "campaigns/birch_swinnerton_dyer/WP02_THEOREM_LEDGER/**"
      - "campaigns/birch_swinnerton_dyer/WP03_COMPUTATIONAL_FORMAL_SUBSTRATE/**"
      - "campaigns/birch_swinnerton_dyer/WP04_RESTRICTED_TARGET_SCORECARD/**"
      - ".github/workflows/bsd-wp04-target.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Replay BSD-WP04 target scorecard
        run: python campaigns/birch_swinnerton_dyer/WP04_RESTRICTED_TARGET_SCORECARD/replay.py
