name: Candidate admission control

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-candidate-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'

      - name: Install validation dependency
        run: python -m pip install 'jsonschema==4.25.1'

      - name: Validate candidate campaign admission
        run: |
          python ci/campaign_admission_control.py
          python -m unittest tests.test_campaign_admission_control
