name: Erdős catalogue one-issue return fast path

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

# Different issues reconcile independently; retries on the same issue serialize.
concurrency:
  group: erdos-return-fastpath-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  project_one:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GCL-ERDOS] ERDOS-CATALOGUE-') &&
      (startsWith(github.event.comment.body, 'RESULT/1') ||
       startsWith(github.event.comment.body, 'GCL-RETURN-EXCEPTION/1'))
    runs-on: ubuntu-24.04
    environment: release-trust
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Capture and validate only the authenticated source issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ startsWith(github.event.comment.body, 'GCL-RETURN-EXCEPTION/1') }}" == "true" ]]; then
            python ci/erdos_catalogue_queue_projection.py --late-exception capture \
              --event "$GITHUB_EVENT_PATH" --out fastpath
          else
            python ci/erdos_return_fastpath.py capture \
              --event "$GITHUB_EVENT_PATH" --out fastpath
          fi
      - name: Mint bounded Council Clerk issue and Project token
        id: queue-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-issues: write
          permission-organization-projects: write
      - name: Reconcile exactly one return and read back Project/Issue Field/labels
        env:
          GH_TOKEN: ${{ steps.queue-token.outputs.token }}
          GCL_RETURN_FASTPATH_CONTROL: protected-main
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing Clerk credential"; exit 1; }
          if [[ "${{ startsWith(github.event.comment.body, 'GCL-RETURN-EXCEPTION/1') }}" == "true" ]]; then
            # The guarded Python controller performs gh api PATCH and Project item-edit;
            # preserve explicit WRITE_CAPABLE routing for this Clerk token.
            python ci/erdos_catalogue_queue_projection.py --late-exception restore \
              --event "$GITHUB_EVENT_PATH" --out fastpath
          else
            python ci/erdos_return_fastpath.py apply \
              --event "$GITHUB_EVENT_PATH" --out fastpath
          fi
      - name: Preserve exact verified return or fail-closed blocker
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gcl-return-fastpath-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fastpath/BINDING.json
            fastpath/REPORT.json
            fastpath/PROJECTION.json
            fastpath/BLOCKER.json
            fastpath/EXCEPTION_BINDING.json
            fastpath/EXCEPTION_CUSTODY.json
          retention-days: 90
          if-no-files-found: error
