name: Zensical browser search parity B02 (non-production)
on:
  pull_request:
    paths:
      - ci/renderer_browser_b02.py
      - tests/test_renderer_browser_b02.py
      - .github/workflows/zensical-browser-search.yml
  workflow_dispatch:
concurrency:
  group: zensical-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  search-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned renderer dependencies and browser
        run: python -m pip install --requirement requirements/docs.txt --requirement requirements/zensical-probe.txt --requirement requirements/browser-b01.txt
      - name: Validate search test contracts
        run: python -m unittest tests.test_renderer_browser_b02 -q
      - name: Build source-governed MkDocs
        run: mkdocs build --clean --site-dir .mkdocs-probe-site
      - name: Prepare source-governed compendia
        run: python ci/zensical_parity_probe.py prepare
      - name: Build isolated Zensical
        run: zensical build --config-file zensical-probe.yml --clean
      - name: Verify static page and search-index inclusion
        run: python ci/zensical_parity_probe.py verify
      - name: Install real Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser search matrix
        run: python ci/renderer_browser_b02.py --out renderer-b02-evidence
      - name: Preserve browser search evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renderer-b02-browser-search
          path: renderer-b02-evidence/
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve source and static parity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renderer-b02-static-source
          path: |
            zensical-parity-report.json
            zensical-probe.yml
          if-no-files-found: ignore
          retention-days: 30
