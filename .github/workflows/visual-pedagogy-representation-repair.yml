name: Visual pedagogy representation repair

on:
  pull_request:
    paths:
      - ".github/workflows/visual-pedagogy-representation-repair.yml"
      - "ci/verify_visual_pedagogy_raster_successors.py"
      - "ci/validate_workflow_coverage*.py"
      - "governance/visual_pedagogy/**"
      - "requirements/visual-pedagogy-render.txt"
      - "tools/render_visual_pedagogy_raster_successors.py"
      - "tests/test_documentary_visual_pedagogy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-pedagogy-representation-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic-representation-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/visual-pedagogy-render.txt
      - name: Install pinned rendering environment
        run: python -m pip install --requirement requirements/visual-pedagogy-render.txt
      - name: Rerender current review candidates into isolation
        run: python tools/render_visual_pedagogy_raster_successors.py --root "$RUNNER_TEMP/visual-pedagogy-rendered" --hashes
      - name: Verify exact committed and isolated candidate bytes
        run: python ci/verify_visual_pedagogy_raster_successors.py --repository-root . --rendered-root "$RUNNER_TEMP/visual-pedagogy-rendered"
      - name: Upload review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-pedagogy-representation-repair-review-bundle
          path: |
            governance/visual_pedagogy/review_candidates/contact_sheet.png
            governance/visual_pedagogy/review_candidates/**/*.png
          if-no-files-found: error
          retention-days: 30
