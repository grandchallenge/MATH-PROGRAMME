name: ERDOS post-protection lifecycle controller

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/erdos-open-postprotect-lifecycle.yml"
      - "ci/erdos_open_postprotect_controller.py"
      - "governance/erdos_open_postprotect_lifecycle_controller.json"
      - "tests/test_erdos_open_postprotect_controller.py"

permissions:
  contents: read

concurrency:
  group: erdos-open-postprotect-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-trust
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Mint bounded MATHSOLVE ERDOS lifecycle token
        id: solve-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATHSOLVE
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout protected MATHSOLVE ERDOS lifecycle substrate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: grandchallenge/MATHSOLVE
          ref: main
          path: solve-erdos
          token: ${{ steps.solve-token.outputs.token }}
          persist-credentials: false

      - name: Reconcile ERDOS post-protection lifecycle
        env:
          MATHSOLVE_ERDOS_LIFECYCLE_TOKEN: ${{ steps.solve-token.outputs.token }}
        run: |
          set -euo pipefail
          python ci/erdos_open_postprotect_controller.py \
            --solve-root "${{ github.workspace }}/solve-erdos" \
            --apply \
            --report erdos-open-postprotect-lifecycle-report.json

      - name: Preserve lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: erdos-open-postprotect-lifecycle-report
          path: erdos-open-postprotect-lifecycle-report.json
          if-no-files-found: error
          retention-days: 90
