name: Administrative maintenance protected synchronization

on:
  workflow_run:
    workflows:
      - Programme policy checks
      - GCL conformance
    types:
      - completed
  workflow_dispatch:
    inputs:
      head_sha:
        description: Protected main head to synchronize
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: administrative-maintenance-protected-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Derive protected completion and refresh mirrors
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          CROSS_REPOSITORY_MAINTENANCE_TOKEN: ${{ secrets.CROSS_REPOSITORY_MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          python ci/synchronize_administrative_completion_v2.py --apply --report administrative-maintenance-synchronization.json || {
            rc=$?
            test -f administrative-maintenance-synchronization.json || printf '%s\n' '{"schema_version":"1.0.0","state":"SYNCHRONIZATION_FAILED_CLOSED","authority_created":false}' > administrative-maintenance-synchronization.json
            exit "$rc"
          }
      - name: Preserve synchronization evidence and cross-repository patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: administrative-maintenance-synchronization
          path: |
            administrative-maintenance-synchronization.json
            administrative-maintenance-cross-repository-mirror.md
          if-no-files-found: warn
          retention-days: 30
