name: Erdős catalogue source intake

on:
  pull_request:
    paths:
      - '.github/workflows/erdos-catalogue-intake.yml'
      - 'ci/erdos_catalogue_programme_intake.py'
      - 'ci/erdos_catalogue_queue_projection.py'
      - 'tests/test_administrative_erdos_catalogue_intake.py'
      - 'governance/erdos_catalogue/**'
      - 'schemas/erdos_catalogue_registry.schema.json'
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'

permissions:
  contents: read

concurrency:
  group: erdos-catalogue-intake-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements/policy.txt
      - run: python -m unittest tests.test_administrative_erdos_catalogue_intake
      - run: python ci/erdos_catalogue_programme_intake.py --events governance/erdos_catalogue/EMPTY_EVENTS.json --output catalogue-validation

  capture:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request &&
        startsWith(github.event.issue.title, '[GCL-ERDOS] ERDOS-CATALOGUE-') &&
        (github.event.action != 'created' || startsWith(github.event.comment.body, 'RESULT/1'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Preserve exact comment event or reconcile current catalogue returns
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            python ci/erdos_catalogue_programme_intake.py --event "$GITHUB_EVENT_PATH" --output catalogue-intake
          else
            python ci/erdos_catalogue_programme_intake.py --live-snapshot --output catalogue-intake
          fi
          cat catalogue-intake/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile returned jobs out of AVAILABLE (operational only)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GCL_QUEUE_PROJECT_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            python ci/erdos_catalogue_queue_projection.py --report catalogue-intake/REPORT.json --issue "$ISSUE_NUMBER"
          else
            python ci/erdos_catalogue_queue_projection.py --report catalogue-intake/REPORT.json --all
          fi
          echo "Queue projection reconciled and read back; no mathematical certification performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain immutable captured versions and unadjudicated dispositions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: erdos-catalogue-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: catalogue-intake
          if-no-files-found: error
          retention-days: 90
