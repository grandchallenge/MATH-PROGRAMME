name: CMDG protected-main sentinel

on:
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmdg-sentinel-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve governed CMDG sentinel lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Validate registry and derive CMDG matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/formal_validation.py validate
          matrix="$(python - <<'PY'
          import json, sys
          sys.path.insert(0, 'ci')
          import formal_validation as fv
          r = fv.load_registry()
          lanes = [lane['id'] for lane in r['lanes'] if lane['family'] == 'CMDG']
          print(json.dumps({'include': [{'lane': lane} for lane in lanes]}, separators=(',', ':')))
          PY
          )"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  sentinel:
    name: ${{ matrix.lane }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Set up exact CMDG Lean environment
        uses: grandchallenge/lean-action@37f8471aecd2efbeab3b1e1a75ad18fb8f5c1b01
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Perform actual protected-main sentinel replay
        run: python3 ci/formal_validation.py run --lane "${{ matrix.lane }}" --mode sentinel --changed-paths-json '[]'

  readback:
    name: CMDG sentinel aggregate
    if: always()
    needs: [plan, sentinel]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete sentinel replay
        run: |
          test "${{ needs.plan.result }}" = "success"
          test "${{ needs.sentinel.result }}" = "success"
          echo "CMDG_PROTECTED_MAIN_SENTINEL_SUCCEEDED"
