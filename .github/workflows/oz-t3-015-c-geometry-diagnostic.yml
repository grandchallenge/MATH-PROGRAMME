name: OZ T3-015-C witness incidence diagnostic

on:
  push:
    branches:
      - "codex/oz-t3-015-c-geometry-diagnostic"

permissions:
  contents: read

jobs:
  witness-incidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact OZ symbolic dependencies
        run: python -m pip install --requirement requirements/oz_source_revision_delta.txt
      - name: Verify full incoming incidence of candidate witness
        run: |
          python -u - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path
          from sympy import Rational, cancel, symbols

          n,k,l=symbols('n k l')
          PINV_TAG=991337
          WITNESS=('H_k_2','H_nk_1','H_nkl_1')

          def factor_expr(f):
              v=tuple(map(int,f))
              if len(v)==5 and v[0]==PINV_TAG:
                  _,a,b,c,d=v
                  return a*n+b*k+c*l+d
              if len(v)==4:
                  a,b,c,d=v
                  return a*n+b*k+c*l+d
              raise AssertionError(v)

          def rat_expr(rows):
              out=0
              for num,den,factors in rows:
                  term=Rational(int(num),int(den))
                  for fac,e in factors:
                      term *= factor_expr(fac)**int(e)
                  out += term
              return cancel(out)

          root=Path('.').resolve()
          p=root/'campaigns'/'odd_zeta'/'OZ_RT_BZ_T3_015_A'/'producer.py'
          spec=importlib.util.spec_from_file_location('t315a_incidence',p)
          mod=importlib.util.module_from_spec(spec);sys.modules['t315a_incidence']=mod;spec.loader.exec_module(mod)
          ev=mod.build(); M=ev['module']
          assert ev['module_sha256']=='cdabf6d7873f3aa8e9d53b39fd7b15341dbee58ce9684911d015aee9aaae04da'

          incoming=[]
          for g in M['generators']:
              if tuple(g['base_term']['monomial'])==WITNESS:
                  incoming.append({'generator_index':g['index'],'channel':g['channel'],'scalar':g['scalar'],'side':'base','coefficient':str(rat_expr(g['base_term']['coefficient']))})
              for t in g['shifted_terms']:
                  if tuple(t['monomial'])==WITNESS:
                      incoming.append({'generator_index':g['index'],'channel':g['channel'],'scalar':g['scalar'],'side':'shifted','coefficient':str(rat_expr(t['coefficient']))})
          targets=[]
          for r in M['target_records']:
              if tuple(r['monomial'])==WITNESS:
                  targets.append({'scalar':r['scalar'],'coefficient':str(rat_expr(r['coefficient']))})
          rec={'module_sha256':ev['module_sha256'],'witness':list(WITNESS),'incoming':incoming,'targets':targets}
          print('T3_015_C_WITNESS_INCIDENCE '+json.dumps(rec,sort_keys=True,separators=(',',':')),flush=True)
          assert incoming==[
              {'generator_index':59,'channel':'k1','scalar':'SK','side':'base','coefficient':'-1'},
              {'generator_index':59,'channel':'k1','scalar':'SK','side':'shifted','coefficient':'1'},
          ]
          assert targets==[{'scalar':'SK','coefficient':'1/(k + l + 1)'}]
          PY
