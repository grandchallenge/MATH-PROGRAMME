name: OZ T3-015-C maximal singleton diagnostic

on:
  push:
    branches:
      - "codex/oz-t3-015-c-geometry-diagnostic"

permissions:
  contents: read

jobs:
  singleton-summability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact OZ symbolic dependencies
        run: python -m pip install --requirement requirements/oz_source_revision_delta.txt
      - name: Decide exact rational summability of maximal singleton blocks
        run: |
          python -u - <<'PY'
          import importlib.util
          import json
          import sys
          from collections import defaultdict
          from pathlib import Path
          from sympy import Rational, cancel, expand, symbols
          from sympy.concrete.gosper import gosper_sum

          n,k,l,z = symbols('n k l _z')
          PINV_TAG=991337

          def factor_expr(f):
              v=tuple(map(int,f))
              if len(v)==5 and v[0]==PINV_TAG:
                  _,a,b,c,d=v
                  return a*n+b*k+c*l+d
              if len(v)==4:
                  a,b,c,d=v
                  return a*n+b*k+c*l+d
              raise AssertionError(v)

          def rat_expr(rows):
              out=0
              for num,den,factors in rows:
                  term=Rational(int(num),int(den))
                  for fac,e in factors:
                      term *= factor_expr(fac)**int(e)
                  out += term
              return cancel(out)

          root=Path('.').resolve()
          p=root/'campaigns'/'odd_zeta'/'OZ_RT_BZ_T3_015_A'/'producer.py'
          spec=importlib.util.spec_from_file_location('t315a_singleton',p)
          mod=importlib.util.module_from_spec(spec);sys.modules['t315a_singleton']=mod;spec.loader.exec_module(mod)
          ev=mod.build(); M=ev['module']
          assert ev['module_sha256']=='cdabf6d7873f3aa8e9d53b39fd7b15341dbee58ce9684911d015aee9aaae04da'

          gs=defaultdict(list); ts=defaultdict(list)
          for g in M['generators']: gs[tuple(g['support_monomial'])].append(g)
          for r in M['target_records']: ts[tuple(r['monomial'])].append(r)
          maxdeg=max(map(len,gs))
          singletons=[]
          for mon, gens in gs.items():
              rows=ts.get(mon,[])
              if len(mon)==maxdeg and len(gens)==1:
                  g=gens[0]
                  assert g['channel']=='k1' and g['scalar']=='SK'
                  assert len(rows)==1 and rows[0]['scalar']=='SK'
                  same=[t for t in g['shifted_terms'] if tuple(t['monomial'])==mon]
                  assert len(same)==1 and cancel(rat_expr(same[0]['coefficient'])-1)==0
                  f=rat_expr(rows[0]['coefficient'])
                  q=gosper_sum(f,k)
                  replay=None if q is None else cancel(q.subs(k,k+1)-q-f)
                  rec={
                    'generator_index':g['index'],'monomial':list(mon),
                    'target_numerator':str(expand(f.as_numer_denom()[0])),
                    'target_denominator':str(expand(f.as_numer_denom()[1])),
                    'gosper_result':'NONE' if q is None else 'RATIONAL',
                    'exact_replay_zero': None if q is None else replay==0,
                  }
                  singletons.append(rec)
                  print('T3_015_C_MAXIMAL_SINGLETON '+json.dumps(rec,sort_keys=True,separators=(',',':')),flush=True)
          print('T3_015_C_MAXIMAL_SINGLETON_SUMMARY '+json.dumps({
              'module_sha256':ev['module_sha256'],'max_degree':maxdeg,
              'singleton_count':len(singletons),
              'nonsummable_count':sum(r['gosper_result']=='NONE' for r in singletons),
              'summable_count':sum(r['gosper_result']=='RATIONAL' for r in singletons),
          },sort_keys=True,separators=(',',':')),flush=True)
          PY
