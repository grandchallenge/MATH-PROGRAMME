name: Type Theory Volume III RC build

on:
  pull_request:
    branches: [main]
    paths:
      - 'monographs/type-theory/volume-iii-proof-program/**'
      - '.github/workflows/type-theory-volume-iii-rc-build.yml'

permissions:
  contents: read

concurrency:
  group: type-theory-volume-iii-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate7-build:
    name: Gate 7 exact-source build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-fonts-extra texlive-pictures \
            poppler-utils

      - name: Record exact environment and source identity
        working-directory: monographs/type-theory/volume-iii-proof-program
        run: |
          mkdir -p evidence/gate7
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "head_sha=${GITHUB_SHA}"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
            lualatex --version | head -n 2
            (makeindex 2>&1 | head -n 2) || true
            python3 --version
          } > evidence/gate7/environment.txt
          git ls-files . | LC_ALL=C sort > evidence/gate7/source-files.txt
          while IFS= read -r path; do sha256sum "$path"; done < evidence/gate7/source-files.txt > evidence/gate7/source-sha256.txt

      - name: Run canonical series validator
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/monographs/type-theory-series/validate_volume.py \
            monographs/type-theory/volume-iii-proof-program --rc --compile \
            > monographs/type-theory/volume-iii-proof-program/evidence/gate7/series-validator.txt 2>&1 || {
              cat monographs/type-theory/volume-iii-proof-program/evidence/gate7/series-validator.txt >&2
              exit 1
            }
          cat monographs/type-theory/volume-iii-proof-program/evidence/gate7/series-validator.txt

      - name: Clean and build publication targets
        working-directory: monographs/type-theory/volume-iii-proof-program
        shell: bash
        run: |
          set -euo pipefail
          rm -f *.aux *.bbl *.blg *.idx *.ilg *.ind *.log *.out *.toc *.lof *.lot *.pdf
          latex_pass() {
            local target="$1"
            local stem="$2"
            local pass="$3"
            local report="evidence/gate7/${stem}-pass${pass}.txt"
            if ! lualatex -interaction=nonstopmode -halt-on-error "$target" > "$report" 2>&1; then
              echo "=== ${target} pass ${pass} failed ===" >&2
              tail -n 160 "$report" >&2 || true
              return 1
            fi
          }
          build_target() {
            local target="$1"
            local stem="${target%.tex}"
            latex_pass "$target" "$stem" 1
            if [[ -s "${stem}.idx" ]]; then
              if ! makeindex "${stem}.idx" > "evidence/gate7/${stem}-makeindex.txt" 2>&1; then
                echo "=== makeindex ${stem}.idx failed ===" >&2
                tail -n 160 "evidence/gate7/${stem}-makeindex.txt" >&2 || true
                return 1
              fi
            fi
            latex_pass "$target" "$stem" 2
            latex_pass "$target" "$stem" 3
          }
          build_target main.tex
          build_target solutions_companion.tex
          build_target plates_folio.tex

      - name: Replay all retained laboratories
        working-directory: monographs/type-theory/volume-iii-proof-program
        shell: bash
        run: |
          set -euo pipefail
          : > evidence/gate7/lab-replay.txt
          count=0
          for lab in labs/lab*.py; do
            count=$((count + 1))
            echo "===== ${lab} =====" | tee -a evidence/gate7/lab-replay.txt
            python3 "$lab" 2>&1 | tee -a evidence/gate7/lab-replay.txt
          done
          echo "lab_count=${count}" | tee -a evidence/gate7/lab-replay.txt
          test "$count" -eq 14

      - name: Build deterministic exact-source archive
        working-directory: monographs/type-theory/volume-iii-proof-program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          root = Path('.')
          files = [line.strip() for line in (root/'evidence/gate7/source-files.txt').read_text().splitlines() if line.strip()]
          out = root/'evidence/gate7/source.zip'
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in files:
                  p = root/rel
                  info = zipfile.ZipInfo(rel, date_time=(1980,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  mode = 0o755 if os.access(p, os.X_OK) else 0o644
                  info.external_attr = mode << 16
                  z.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          sha256sum evidence/gate7/source.zip > evidence/gate7/source-archive-sha256.txt
          wc -c evidence/gate7/source.zip > evidence/gate7/source-archive-size.txt

      - name: Audit logs, references, glyphs and output geometry
        working-directory: monographs/type-theory/volume-iii-proof-program
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo main.pdf > evidence/gate7/main-pdfinfo.txt
          pdfinfo solutions_companion.pdf > evidence/gate7/solutions-pdfinfo.txt
          pdfinfo plates_folio.pdf > evidence/gate7/plates-pdfinfo.txt
          sha256sum main.pdf solutions_companion.pdf plates_folio.pdf > evidence/gate7/output-sha256.txt
          grep -HnE 'Overfull|Underfull|undefined references|There were undefined references|Missing character|LaTeX Error|Fatal error' \
            main.log solutions_companion.log plates_folio.log > evidence/gate7/log-findings.txt || true
          if grep -HnE 'undefined references|There were undefined references|Missing character|LaTeX Error|Fatal error' \
            main.log solutions_companion.log plates_folio.log; then
            echo 'fatal publication-log finding' >&2
            exit 1
          fi
          pdftotext main.pdf evidence/gate7/main.txt
          pdftotext solutions_companion.pdf evidence/gate7/solutions.txt
          pdftotext plates_folio.pdf evidence/gate7/plates.txt
          test "$(grep -o 'Plate [0-9]\+' evidence/gate7/plates.txt | sort -u -V | wc -l)" -eq 42

      - name: Upload Gate 7 evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: type-theory-volume-iii-gate7-evidence
          path: |
            monographs/type-theory/volume-iii-proof-program/main.pdf
            monographs/type-theory/volume-iii-proof-program/main.log
            monographs/type-theory/volume-iii-proof-program/solutions_companion.pdf
            monographs/type-theory/volume-iii-proof-program/solutions_companion.log
            monographs/type-theory/volume-iii-proof-program/plates_folio.pdf
            monographs/type-theory/volume-iii-proof-program/plates_folio.log
            monographs/type-theory/volume-iii-proof-program/evidence/gate7/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
