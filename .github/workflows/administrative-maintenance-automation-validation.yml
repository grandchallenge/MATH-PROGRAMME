name: Administrative maintenance automation validation

on:
  pull_request:
    paths:
      - '.github/workflows/administrative-maintenance-*.yml'
      - '.github/workflows/administrative-autonomy-activation.yml'
      - 'ci/administrative_automation.py'
      - 'ci/administrative_autonomy.py'
      - 'ci/autonomy_github.py'
      - 'ci/administrative_receipts.py'
      - 'ci/prepare_administrative_candidate*.py'
      - 'ci/synchronize_administrative_completion*.py'
      - 'ci/dispatch_administrative_maintenance_v*.py'
      - 'ci/validate_administrative_automation*.py'
      - 'ci/validate_workflow_coverage_v2.py'
      - 'ci/test_workflow_coverage_v2.py'
      - 'governance/administrative_maintenance_automation*.json'
      - 'governance/administrative_maintenance_completion_state.json'
      - 'governance/administrative_autonomy_*.json'
      - 'schemas/administrative_maintenance_automation*.schema.json'
      - 'schemas/administrative_maintenance_completion_state.schema.json'
      - 'schemas/administrative_autonomy_*.schema.json'
      - 'tests/test_administrative_automation*.py'
      - 'tests/test_administrative_autonomy.py'
      - 'tests/test_administrative_receipts.py'
      - 'tests/test_administrative_synchronization_wait.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/administrative-maintenance-*.yml'
      - '.github/workflows/administrative-autonomy-activation.yml'
      - 'ci/administrative_automation.py'
      - 'ci/administrative_autonomy.py'
      - 'ci/autonomy_github.py'
      - 'ci/administrative_receipts.py'
      - 'ci/prepare_administrative_candidate*.py'
      - 'ci/synchronize_administrative_completion*.py'
      - 'ci/dispatch_administrative_maintenance_v*.py'
      - 'ci/validate_administrative_automation*.py'
      - 'ci/validate_workflow_coverage_v2.py'
      - 'ci/test_workflow_coverage_v2.py'
      - 'governance/administrative_maintenance_automation*.json'
      - 'governance/administrative_maintenance_completion_state.json'
      - 'governance/administrative_autonomy_*.json'
      - 'schemas/administrative_maintenance_automation*.schema.json'
      - 'schemas/administrative_maintenance_completion_state.schema.json'
      - 'schemas/administrative_autonomy_*.schema.json'
      - 'tests/test_administrative_automation*.py'
      - 'tests/test_administrative_autonomy.py'
      - 'tests/test_administrative_receipts.py'
      - 'tests/test_administrative_synchronization_wait.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: administrative-maintenance-automation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install governed policy dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements/policy.txt
      - name: Validate automation contracts
        run: |
          set -euo pipefail
          # Compatibility reachability: validate_administrative_automation.py
          # Compatibility reachability: validate_administrative_automation_v2.py
          # Compatibility reachability: python ci/prepare_administrative_candidate_v2.py
          # Compatibility reachability: python ci/synchronize_administrative_completion_v2.py
          python ci/validate_administrative_automation_v3.py
          python ci/administrative_autonomy.py validate
          python ci/validate_workflow_coverage_v2.py
          python ci/test_workflow_coverage_v2.py
          python -m unittest \
            tests.test_administrative_automation \
            tests.test_administrative_automation_remediation \
            tests.test_administrative_autonomy \
            tests.test_administrative_receipts \
            tests.test_administrative_synchronization_wait
