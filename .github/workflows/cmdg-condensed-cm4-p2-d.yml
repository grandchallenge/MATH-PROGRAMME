name: CMDG condensed CM4 P2-D

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmdg-condensed-cm4-p2-d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate canonical measure-dual candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Compile P2-D validator
        run: python -m py_compile ci/validate_cmdg_condensed_cm4_p2_d.py
      - name: Validate P2-D governed record
        run: python3 ci/validate_cmdg_condensed_cm4_p2_d.py
      - name: Run P2-D adversarial mutations
        run: python -m unittest tests.test_cmdg_condensed_cm4_p2_d
      - name: Revalidate parent P2 blocker
        run: python3 ci/validate_cmdg_condensed_cm4_p2.py
      - name: Revalidate workflow coverage
        run: python3 ci/validate_workflow_coverage_v2.py

  formal-audit:
    name: Replay canonical measure-dual model
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject placeholders and P2-E authority
        run: |
          set -euo pipefail
          F=fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM4P2D.lean
          if grep -nE '^[[:space:]]*(sorry|axiom)([[:space:]]|$)' "$F"; then
            echo "P2-D fixture must contain neither sorry nor local axioms."
            exit 1
          fi
          if grep -nE '^[[:space:]]*((noncomputable[[:space:]]+)?def|theorem)[[:space:]].*(profiniteSolid.*(≅|Iso)|(≅|Iso).*profiniteSolid)' "$F"; then
            echo "P2-D must not assert the separately governed P2-E equivalence."
            exit 1
          fi
          if grep -nE 'LocallyConstant\.freeOfProfinite|(^|[^[:alnum:]_])Pi\.obj|∏' "$F"; then
            echo "P2-D formal construction must not use a chosen-basis/product substitute."
            exit 1
          fi
      - name: Set up pinned Lean and mathlib cache
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Verify exact pinned dependencies
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        run: |
          set -euo pipefail
          ML=".lake/packages/mathlib"
          test "$(git -C "$ML" rev-parse HEAD)" = "79d0395a1825a6264ad5d269e35e60537518955e"
          test "$(git -C "$ML" rev-parse HEAD^{tree})" = "d76f5e09b832a08949f6d8ad4fb80ce30527da64"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Sites/Monoidal.lean)" = "64b111b39f9f44dcab88a7fbe60411ef5008532c"
          test "$(git -C "$ML" hash-object Mathlib/Algebra/Category/ModuleCat/Monoidal/Closed.lean)" = "119610224bb253a976b03764f4e24fd3f662dc6c"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Monoidal/Closed/FunctorCategory/Basic.lean)" = "6f3c9a844bc5f98ef1754263de2e2c54496356ea"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Monoidal/Closed/Basic.lean)" = "57dd533860e4be3957c13211f275b6f75441787c"
          test "$(git -C "$ML" hash-object Mathlib/Condensed/Discrete/Module.lean)" = "b3ba358aa6b01b2de4cfedf6480ac22e863241d3"
          grep -Fq 'lemma isSheaf_functorEnrichedHom' "$ML/Mathlib/CategoryTheory/Sites/Monoidal.lean"
          grep -Fq 'noncomputable scoped instance monoidalClosed' "$ML/Mathlib/CategoryTheory/Monoidal/Closed/FunctorCategory/Basic.lean"
          grep -Fq 'def internalHom [MonoidalClosed C]' "$ML/Mathlib/CategoryTheory/Monoidal/Closed/Basic.lean"
          grep -Fq 'def pre (f : B ⟶ A)' "$ML/Mathlib/CategoryTheory/Monoidal/Closed/Basic.lean"
          grep -Fq 'instance : MonoidalClosed (ModuleCat' "$ML/Mathlib/Algebra/Category/ModuleCat/Monoidal/Closed.lean"
          test ! -e "$ML/Mathlib/Condensed/Measure"
      - name: Build, replay, and print declaration axioms
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set -euo pipefail
          echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
          lake build CMDGCondensedCM4P2D
          lake env lean CMDGCondensedCM4P2D.lean
