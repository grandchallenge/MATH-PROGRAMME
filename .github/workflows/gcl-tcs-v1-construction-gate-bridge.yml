name: GCL-TCS v1 Construction Gate bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

concurrency:
  group: gcl-tcs-v1-construction-gate-bridge
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch exact GCL-TCS Construction Gate operation
    if: >-
      github.event.issue.number == 831 &&
      github.event.comment.user.login == 'fyremael' &&
      startsWith(github.event.comment.body, '/construction-gate GCL-TCS-V1-PROMOTION-001 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Constrain request and dispatch admitted Gate runtime
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          read -r command target operation proposed_head expect extra <<<"$COMMENT_BODY"
          [[ "$command" == "/construction-gate" ]] || { echo "invalid command" >&2; exit 2; }
          [[ "$target" == "GCL-TCS-V1-PROMOTION-001" ]] || { echo "unexpected target" >&2; exit 2; }
          [[ -z "${extra:-}" ]] || { echo "unexpected trailing input" >&2; exit 2; }
          [[ "$expect" == "allow" ]] || { echo "bridge accepts only allow disposition" >&2; exit 2; }
          [[ "$proposed_head" == "8833253f620c6c05930740bda983d6f43bee6612" ]] || {
            echo "candidate operation is pinned to the protected readiness revision" >&2
            exit 2
          }
          case "$operation" in
            CREATE_DEVELOPMENT|FREEZE_CANDIDATE) ;;
            *) echo "bridge permits only CREATE_DEVELOPMENT or FREEZE_CANDIDATE" >&2; exit 2 ;;
          esac

          issue_state="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$REPOSITORY/issues/831" --jq .state)"
          [[ "$issue_state" == "open" ]] || { echo "promotion tracker #831 is not open" >&2; exit 2; }

          jq -n \
            --arg target "$target" \
            --arg operation "$operation" \
            --arg proposed_head "$proposed_head" \
            --arg expect "$expect" \
            '{ref:"main",inputs:{target:$target,operation:$operation,proposed_head:$proposed_head,expect:$expect}}' \
            > dispatch.json

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/actions/workflows/construction-gate-runtime.yml/dispatches" \
            --input dispatch.json
