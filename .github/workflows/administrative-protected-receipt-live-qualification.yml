name: Administrative protected-receipt remediation and qualification

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: administrative-protected-receipt-${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'closed') && 'qualification' || 'admission' }}
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action != 'closed' &&
       github.event.pull_request.draft == false &&
       startsWith(github.event.pull_request.head.ref, 'remediation/mp-admin-')) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request != null &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, 'DELEGATED_REMEDIATION_ADMIT '))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-trust
    permissions:
      checks: read
      contents: read
      issues: write
    steps:
      - name: Mint read-only Administration ruleset token
        id: admin-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-administration: read

      - name: Mint bounded Candidate merge-executor token
        id: candidate-merge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-contents: write
          permission-pull-requests: write

      - name: Check out trusted protected implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install governed policy dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements/policy.txt

      - name: Validate delegated remediation envelope
        run: |
          set -euo pipefail
          python ci/administrative_remediation_envelope.py validate

      - name: Resolve exact admission target
        id: target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "pull_request_target":
              pull = event.get("pull_request") or {}
              pr_number = int(pull.get("number") or 0)
              expected_head = str((pull.get("head") or {}).get("sha") or "")
          elif event_name == "issue_comment":
              comment = event.get("comment") or {}
              issue = event.get("issue") or {}
              association = str(comment.get("author_association") or "")
              if association not in {"OWNER", "MEMBER", "COLLABORATOR"}:
                  raise SystemExit("untrusted admission trigger association")
              if not issue.get("pull_request"):
                  raise SystemExit("admission trigger is not attached to a pull request")
              body = str(comment.get("body") or "")
              match = re.fullmatch(r"DELEGATED_REMEDIATION_ADMIT ([0-9a-f]{40})", body)
              if match is None:
                  raise SystemExit("malformed delegated remediation admission trigger")
              pr_number = int(issue.get("number") or 0)
              expected_head = match.group(1)
          else:
              raise SystemExit(f"unsupported admission event: {event_name}")

          if pr_number <= 0 or re.fullmatch(r"[0-9a-f]{40}", expected_head) is None:
              raise SystemExit("invalid exact admission target")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"pr_number={pr_number}\n")
              handle.write(f"expected_head={expected_head}\n")
          PY

      - name: Referee exact-head admission and Candidate expected-head merge
        env:
          REFEREE_TOKEN: ${{ github.token }}
          ADMIN_READ_TOKEN: ${{ steps.admin-read-token.outputs.token }}
          CANDIDATE_MERGE_TOKEN: ${{ steps.candidate-merge-token.outputs.token }}
          CANDIDATE_LOGIN: ${{ format('{0}[bot]', steps.candidate-merge-token.outputs.app-slug) }}
        run: |
          set -euo pipefail
          python ci/administrative_remediation_envelope.py admit-pull-request \
            --pr "${{ steps.target.outputs.pr_number }}" \
            --head "${{ steps.target.outputs.expected_head }}" \
            --report administrative-remediation-admission.json

      - name: Publish durable admission result
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "pull_request_target":
              pull = event.get("pull_request") or {}
              pr_number = int(pull.get("number") or 0)
              event_head = str((pull.get("head") or {}).get("sha") or "")
          elif event_name == "issue_comment":
              issue = event.get("issue") or {}
              pr_number = int(issue.get("number") or 0)
              body = str((event.get("comment") or {}).get("body") or "")
              match = re.fullmatch(r"DELEGATED_REMEDIATION_ADMIT ([0-9a-f]{40})", body)
              event_head = match.group(1) if match else ""
          else:
              raise SystemExit(0)
          if pr_number <= 0:
              raise SystemExit(0)

          path = Path("administrative-remediation-admission.json")
          report = {}
          if path.is_file():
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  report = {}
          state = str(report.get("state") or "ADMISSION_RESULT_UNAVAILABLE")
          exact_head = str(report.get("exact_head") or event_head)
          error = str(report.get("error") or "")
          error_text = f"\nFailure: `{error}`." if error else ""
          body = (
              "DELEGATED REMEDIATION ADMISSION RESULT — MP-ADMIN-REMEDIATION-ENVELOPE-001\n\n"
              f"Event: `{event_name}`.\n"
              f"Run: `{os.environ.get('GITHUB_RUN_ID', '')}` attempt "
              f"`{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`.\n"
              f"Exact head: `{exact_head}`.\n"
              f"Admission state: `{state}`."
              f"{error_text}\n\n"
              "The trigger creates no Human Steward, review, merge, bypass, receipt, ledger, mirror, "
              "reactivation, or substantive-claim authority; the protected controller independently "
              "revalidates the existing #615 envelope, exact head, path scope, live ruleset checks, and identities."
          )
          payload = json.dumps({"body": body}).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/grandchallenge/MATH-PROGRAMME/issues/{pr_number}/comments",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          print(json.dumps({"status_comment_id": result.get("id")}, sort_keys=True))
          PY

      - name: Preserve exact-head admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: administrative-remediation-admission
          path: administrative-remediation-admission.json
          if-no-files-found: warn
          retention-days: 90

  qualify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'remediation/mp-admin-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-trust
    permissions:
      contents: read
      issues: write
    steps:
      - name: Mint read-only Candidate observation token
        id: candidate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-contents: read
          permission-pull-requests: read

      - name: Mint read-only evidence token
        id: evidence-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: |
            MATH-PROGRAMME
            INTELLECT
          permission-issues: read

      - name: Mint bounded Administration reconciliation token
        id: admin-write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-administration: write

      - name: Mint read-only Administration observation token
        id: admin-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-administration: read

      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install governed policy dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements/policy.txt

      - name: Validate delegated remediation envelope
        run: |
          set -euo pipefail
          python ci/administrative_remediation_envelope.py validate

      - name: Reconcile exact PR-only Administration actor
        env:
          ADMIN_WRITE_TOKEN: ${{ steps.admin-write-token.outputs.token }}
        run: |
          set -euo pipefail
          python ci/administrative_remediation_envelope.py reconcile-actor \
            --report administrative-remediation-ruleset-reconciliation.json

      - name: Execute canonical read-only qualification
        env:
          CANDIDATE_TOKEN: ${{ steps.candidate-token.outputs.token }}
          EVIDENCE_TOKEN: ${{ steps.evidence-token.outputs.token }}
          ADMIN_TOKEN: ${{ steps.admin-read-token.outputs.token }}
          GCL_PROTECTED_RECEIPT_CONFIG_EVIDENCE: administrative-remediation-ruleset-reconciliation.json
          GCL_PROTECTED_RECEIPT_DIAGNOSTIC: administrative-protected-receipt-diagnostic.json
        run: |
          set -euo pipefail
          python ci/administrative_protected_receipt_live.py qualify \
            --report administrative-protected-receipt-qualification.json \
            --control-id MP-ADMIN-REMEDIATION-ENVELOPE-001 \
            --control-issue 615 \
            --authorization-comment-id 5349149366 \
            --receipt-pr 596 \
            --integration-merge 8ff752b4f2ac28d87575d4f4ef48f564fb18837b

      - name: Publish durable remediation result
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          def read_json(path):
              p = Path(path)
              if not p.is_file():
                  return {}
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          reconciliation = read_json("administrative-remediation-ruleset-reconciliation.json")
          qualification = read_json("administrative-protected-receipt-qualification.json")
          diagnostic = read_json("administrative-protected-receipt-diagnostic.json")

          actor_state = (
              reconciliation.get("terminal_state")
              or reconciliation.get("state")
              or "ACTOR_RECONCILIATION_RESULT_UNAVAILABLE"
          )
          qualification_state = (
              qualification.get("state")
              or diagnostic.get("state")
              or diagnostic.get("failure_code")
              or "QUALIFICATION_RESULT_UNAVAILABLE"
          )
          protected_head = (
              qualification.get("protected_head_end")
              or qualification.get("protected_head_start")
              or os.environ.get("GITHUB_SHA", "")
          )
          failure = qualification.get("failure") or {}
          failure_text = ""
          if failure:
              failure_text = (
                  f"\nFailure: `{failure.get('code', 'UNKNOWN')}` — "
                  f"{failure.get('detail', '')}"
              )

          body = (
              "DELEGATED REMEDIATION RUN RESULT — MP-ADMIN-REMEDIATION-ENVELOPE-001\n\n"
              f"Run: `{os.environ.get('GITHUB_RUN_ID', '')}` attempt "
              f"`{os.environ.get('GITHUB_RUN_ATTEMPT', '')}`.\n"
              f"Ruleset actor: `{actor_state}`.\n"
              f"Canonical qualification: `{qualification_state}`.\n"
              f"Protected head: `{protected_head}`."
              f"{failure_text}\n\n"
              "Safety readback: no #596 mutation, receipt execution, ledger or mirror mutation, "
              "direct protected push, bypass exercise, or administrative-review reactivation is authorized."
          )

          payload = json.dumps({"body": body}).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/repos/grandchallenge/MATH-PROGRAMME/issues/615/comments",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          print(json.dumps({"status_comment_id": result.get("id")}, sort_keys=True))
          PY

      - name: Preserve remediation and qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: administrative-protected-receipt-remediation
          path: |
            administrative-remediation-ruleset-reconciliation.json
            administrative-protected-receipt-qualification.json
            administrative-protected-receipt-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
