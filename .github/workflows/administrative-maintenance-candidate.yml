name: Administrative maintenance candidate preparation

on:
  schedule:
    - cron: '57 16 5 8 *'
    - cron: '45 9 6 8 *'
    - cron: '21 13 6 8 *'
    - cron: '33 2 7 8 *'
    - cron: '21 19 7 8 *'
    - cron: '9 12 8 8 *'
    - cron: '57 4 9 8 *'
    - cron: '21 1 9 8 *'
    - cron: '21 13 3 9 *'
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: administrative-maintenance-candidate-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint bounded MATH-PROGRAMME write token
        id: write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Mint bounded evidence-read token
        id: evidence-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: |
            MATHFORGE
            MATHSOLVE
            MATHCERT
            INTELLECT
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require bounded automation credentials
        env:
          WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
          EVIDENCE_TOKEN: ${{ steps.evidence-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN}"
          test -n "${EVIDENCE_TOKEN}"
      - name: Prepare idempotent non-authoritative candidates
        env:
          GITHUB_TOKEN: ${{ steps.write-token.outputs.token }}
          EVIDENCE_GITHUB_TOKEN: ${{ steps.evidence-token.outputs.token }}
        run: |
          set -euo pipefail
          python ci/prepare_administrative_candidate_v3.py --apply --report administrative-maintenance-candidate.json || {
            rc=$?
            test -f administrative-maintenance-candidate.json || printf '%s\n' '{"schema_version":"1.0.0","state":"CANDIDATE_PREPARATION_FAILED_CLOSED","authority_created":false}' > administrative-maintenance-candidate.json
            exit "$rc"
          }
      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: administrative-maintenance-candidate
          path: administrative-maintenance-candidate.json
          if-no-files-found: error
          retention-days: 30
