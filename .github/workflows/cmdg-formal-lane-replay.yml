name: CMDG formal lane replay

on:
  workflow_call:
    inputs:
      lane:
        description: Governed CMDG lane id
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cmdg-formal-lane-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: Replay ${{ inputs.lane }} promotion contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected-main promotion source
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Set up exact CMDG Lean environment
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Replay governed promotion closure
        run: python3 ci/formal_validation.py run --lane "${{ inputs.lane }}" --mode promotion --changed-paths-json '[]'
