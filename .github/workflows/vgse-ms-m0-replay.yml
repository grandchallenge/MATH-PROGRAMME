name: VGSE MS M0 replay

on:
  pull_request:
    paths:
      - "research/vgse-ms-m0/**"
      - ".github/workflows/vgse-ms-m0-replay.yml"
  push:
    branches:
      - main
    paths:
      - "research/vgse-ms-m0/**"
      - ".github/workflows/vgse-ms-m0-replay.yml"

permissions:
  contents: read

concurrency:
  group: vgse-ms-m0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned M0 dependencies
        run: python -m pip install --requirement research/vgse-ms-m0/requirements.txt
      - name: Replay deterministic TE3 realization atlas
        run: |
          python research/vgse-ms-m0/analyze_m0.py --check
          python research/vgse-ms-m0/test_m0.py
