name: OZ T3-016-A affine sweep

on:
  pull_request:
    paths:
      - '.github/workflows/oz-t3-016-a-affine-sweep.yml'
      - '.ghos-routing/workflows.json'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/affine_sweep.py'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/AFFINE_SWEEP_REQUEST.json'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/lex_pivot_sweep.py'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/LEX_PIVOT_SWEEP_REQUEST.json'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/lex_pivot_multiprime.py'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/LEX_PIVOT_MULTIPRIME_REQUEST.json'
      - 'tests/test_oz_rt_bz_t3_016_a_affine_sweep.py'
      - 'tests/test_oz_rt_bz_t3_016_a_lex_pivot_sweep.py'
      - 'tests/test_oz_rt_bz_t3_016_a_lex_pivot_multiprime.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oz-t3-016-a-affine-sweep.yml'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/AFFINE_SWEEP_REQUEST.json'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/lex_pivot_sweep.py'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/LEX_PIVOT_SWEEP_REQUEST.json'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/lex_pivot_multiprime.py'
      - 'campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/LEX_PIVOT_MULTIPRIME_REQUEST.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oz-t3-016-a-affine-sweep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/rain-1/-odd-zeta-values-moremath.git
  SOURCE_COMMIT: 6cc0bf07137815ceeef0d9f340559f85352391e5
  CANONICAL_REQUEST_PATH: campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/AFFINE_SWEEP_REQUEST.json
  LEX_REQUEST_PATH: campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/LEX_PIVOT_SWEEP_REQUEST.json
  MULTIPRIME_REQUEST_PATH: campaigns/odd_zeta/OZ_RT_BZ_T3_016_A/LEX_PIVOT_MULTIPRIME_REQUEST.json
  MODULE_DIR: campaigns/odd_zeta/OZ_RT_BZ_T3_016_A
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  validate-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
      request_id: ${{ steps.request.outputs.request_id }}
      multiprime_enabled: ${{ steps.request.outputs.multiprime_enabled }}
      multiprime_request_id: ${{ steps.request.outputs.multiprime_request_id }}
      multiprime_primes_json: ${{ steps.request.outputs.multiprime_primes_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact Odd Zeta dependencies
        run: python -m pip install --requirement requirements/oz_source_revision_delta.txt
      - id: request
        name: Validate affine sweep requests
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import affine_sweep
          import lex_pivot_sweep
          import lex_pivot_multiprime

          canonical = affine_sweep.load_request(os.environ['CANONICAL_REQUEST_PATH'])
          lex = lex_pivot_sweep.load_request(os.environ['LEX_REQUEST_PATH'])
          multiprime = lex_pivot_multiprime.load_request(os.environ['MULTIPRIME_REQUEST_PATH'])
          if canonical['enabled']:
              raise AssertionError('completed canonical affine sweep must remain deactivated')
          if lex['enabled']:
              raise AssertionError('completed first-prime lex sweep must remain deactivated')

          anchor_path = module_dir / 'LEX_PIVOT_RATIONAL_PROFILE.json'
          anchor_blob = subprocess.run(
              ['git', 'rev-parse', f'HEAD:{anchor_path.as_posix()}'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if anchor_blob != multiprime['anchor_profile']['profile_blob_sha']:
              raise AssertionError(
                  f'anchor profile blob drift: {anchor_blob} != '
                  f"{multiprime['anchor_profile']['profile_blob_sha']}"
              )
          anchor = json.loads(anchor_path.read_text(encoding='utf-8'))
          if anchor['report_id'] != multiprime['anchor_profile']['report_id']:
              raise AssertionError('anchor report identity drift')
          if int(anchor['source_lock']['prime']) != int(multiprime['anchor_profile']['prime']):
              raise AssertionError('anchor prime drift')
          if anchor['normalized_pivot_dataset']['sha256'] != multiprime['anchor_profile']['normalized_dataset_sha256']:
              raise AssertionError('anchor normalized dataset drift')
          if anchor['sweep_contract']['expected_pivot_sha256'] != multiprime['expected_pivot_sha256']:
              raise AssertionError('anchor pivot digest drift')

          summary = {
              'canonical_request_id': canonical['request_id'],
              'canonical_enabled': canonical['enabled'],
              'lex_request_id': lex['request_id'],
              'lex_enabled': lex['enabled'],
              'lex_section_mode': lex['section_mode'],
              'expected_pivot_sha256': lex['expected_pivot_sha256'],
              'multiprime_request_id': multiprime['request_id'],
              'multiprime_enabled': multiprime['enabled'],
              'multiprime_replay_primes': multiprime['replay_primes'],
              'multiprime_anchor_profile': multiprime['anchor_profile'],
              'n_range': [multiprime['n_start'], multiprime['n_stop']],
              'chunks': lex_pivot_multiprime.chunk_ranges(multiprime),
              'reconstruction_fit_count': multiprime['reconstruction_fit_count'],
              'holdout_count': multiprime['holdout_count'],
              'rational_degree_test_bound': multiprime['rational_degree_test_bound'],
              'proof_effect': multiprime['proof_effect'],
              'promotion_effect': multiprime['promotion_effect'],
          }
          print(json.dumps(summary, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"enabled={'true' if lex['enabled'] else 'false'}\n")
              handle.write(f"request_id={lex['request_id']}\n")
              handle.write(f"multiprime_enabled={'true' if multiprime['enabled'] else 'false'}\n")
              handle.write(f"multiprime_request_id={multiprime['request_id']}\n")
              handle.write(
                  'multiprime_primes_json=' +
                  json.dumps(multiprime['replay_primes'], separators=(',', ':')) +
                  '\n'
              )
          PY
      - name: Replay affine sweep contract tests
        run: |
          python -m unittest \
            tests/test_oz_rt_bz_t3_016_a_affine_sweep.py \
            tests/test_oz_rt_bz_t3_016_a_lex_pivot_sweep.py \
            tests/test_oz_rt_bz_t3_016_a_lex_pivot_multiprime.py -v
      - name: Acquire exact locked upstream source for smoke replay
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$SOURCE_REPO" source-smoke
          git -C source-smoke checkout --detach "$SOURCE_COMMIT"
          test "$(git -C source-smoke rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source-smoke rev-parse HEAD^{tree})" = 'be780558454b704bdd016a3070d698c2e106e2b8'
      - name: Verify excluded low-n canonical specializations
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import affine_sweep

          request = affine_sweep.load_request(os.environ['CANONICAL_REQUEST_PATH'])
          p = int(request['prime'])
          fit_rows = affine_sweep.FREE_COORDINATES + int(request['fit_extra_rows'])
          fresh_rows = int(request['fresh_rows'])
          nb = int(request['solver_block_size'])
          expected_singular = {1: 991, 2: 999}

          with tempfile.TemporaryDirectory(prefix='oz-affine-low-n-') as tmp:
              cache = Path(tmp) / 'qrow_cache.pkl'
              affine_sweep._install_source_modules(Path('source-smoke'), cache, prewarm=True)
              for n, expected_rank in expected_singular.items():
                  try:
                      affine_sweep._shape(n, p, fit_rows, fresh_rows, nb)
                  except RuntimeError as exc:
                      expected = f'canonical affine solve failed: rank={expected_rank} piv={expected_rank} nbad=0'
                      if str(exc) != expected:
                          raise AssertionError(
                              f'unexpected excluded-fiber diagnostic at n={n}: {exc}'
                          ) from exc
                      print(f'OZ_AFFINE_LOW_N n={n} status=EXCLUDED rank={expected_rank}')
                  else:
                      raise AssertionError(f'excluded modular specialization unexpectedly usable at n={n}')

              for n in (3, 4):
                  _section, data = affine_sweep._shape(n, p, fit_rows, fresh_rows, nb)
                  record = data['record']
                  if record['free_rank'] != affine_sweep.FREE_COORDINATES:
                      raise AssertionError(f'usable low-n rank drift at n={n}: {record["free_rank"]}')
                  if record['solver_nbad'] != 0 or record['fresh_violations'] != 0:
                      raise AssertionError(f'usable low-n residual drift at n={n}: {record}')
                  print(f'OZ_AFFINE_LOW_N n={n} status=USABLE rank={record["free_rank"]}')
          PY
      - name: Discover and replay lex-pivot signature
        run: |
          cat > "$RUNNER_TEMP/lex-pivot-smoke-driver.py" <<'PY'
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import lex_pivot_sweep

          def main() -> None:
              request = lex_pivot_sweep.load_request(os.environ['LEX_REQUEST_PATH'])
              p = int(request['prime'])
              fit_rows = lex_pivot_sweep.EXPECTED_RANK + int(request['fit_extra_rows'])
              fresh_rows = int(request['fresh_rows'])
              nb = int(request['solver_block_size'])
              expected = request['expected_pivot_sha256']

              with tempfile.TemporaryDirectory(prefix='oz-lex-pivot-smoke-') as tmp:
                  root = Path(tmp)
                  cache = root / 'qrow_cache.pkl'
                  lex_pivot_sweep._install_source_modules(
                      Path('source-smoke'), cache, prewarm=True
                  )
                  digests = set()
                  for n in (3, 4, 5, 192, 384):
                      _section, data = lex_pivot_sweep._lex_shape(
                          n, p, fit_rows, fresh_rows, nb, expected
                      )
                      record = data['record']
                      digests.add(record['pivot_sha256'])
                      if record['rank'] != lex_pivot_sweep.EXPECTED_RANK:
                          raise AssertionError(f'lex-pivot rank drift at n={n}')
                      if record['solver_nbad'] != 0 or record['fresh_violations'] != 0:
                          raise AssertionError(f'lex-pivot residual drift at n={n}')
                      print(json.dumps({
                          'n': n,
                          'rank': record['rank'],
                          'fresh_violations': record['fresh_violations'],
                          'pivot_sha256': record['pivot_sha256'],
                      }, sort_keys=True))
                  if len(digests) != 1:
                      raise AssertionError(f'low-n lex-pivot set drift: {sorted(digests)}')
                  discovered = next(iter(digests))
                  print(f'OZ_LEX_PIVOT_SIGNATURE={discovered}')

                  smoke_request = dict(request)
                  smoke_request.update({
                      'request_id': 'OZ-RT-BZ-T3-016-A-LEX-PIVOT-SWEEP-SMOKE',
                      'enabled': True,
                      'expected_pivot_sha256': discovered,
                      'n_start': 5,
                      'n_stop': 8,
                      'reconstruction_fit_count': 3,
                      'holdout_count': 1,
                  })
                  request_path = root / 'request.json'
                  output = root / 'chunk-0'
                  request_path.write_text(json.dumps(smoke_request), encoding='utf-8')
                  metadata = lex_pivot_sweep.run_chunk(
                      request_path, Path('source-smoke'), 0, output
                  )
                  replay = lex_pivot_sweep.verify_chunk(request_path, 0, output)
                  if metadata['n_start'] != 5 or metadata['n_stop'] != 5:
                      raise AssertionError('lex-pivot smoke chunk range drift')
                  if replay['samples_verified'] != 1:
                      raise AssertionError('lex-pivot smoke replay count drift')
                  if replay['pivot_sha256'] != discovered:
                      raise AssertionError('lex-pivot smoke pivot digest drift')

          if __name__ == '__main__':
              main()
          PY
          python "$RUNNER_TEMP/lex-pivot-smoke-driver.py"
      - name: Replay multiprime lex-pivot signatures
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import lex_pivot_multiprime
          import lex_pivot_sweep

          request = lex_pivot_multiprime.load_request(os.environ['MULTIPRIME_REQUEST_PATH'])
          fit_rows = lex_pivot_sweep.EXPECTED_RANK + int(request['fit_extra_rows'])
          fresh_rows = int(request['fresh_rows'])
          nb = int(request['solver_block_size'])
          expected = request['expected_pivot_sha256']

          with tempfile.TemporaryDirectory(prefix='oz-lex-multiprime-smoke-') as tmp:
              cache = Path(tmp) / 'qrow_cache.pkl'
              lex_pivot_sweep._install_source_modules(
                  Path('source-smoke'), cache, prewarm=True
              )
              for prime in request['replay_primes']:
                  for n in (3, 4, 5):
                      _section, data = lex_pivot_sweep._lex_shape(
                          n, int(prime), fit_rows, fresh_rows, nb, expected
                      )
                      record = data['record']
                      if record['rank'] != lex_pivot_sweep.EXPECTED_RANK:
                          raise AssertionError(f'multiprime rank drift at p={prime} n={n}')
                      if record['solver_nbad'] != 0 or record['fresh_violations'] != 0:
                          raise AssertionError(f'multiprime residual drift at p={prime} n={n}')
                      if record['normalized_section_sha256'] is None:
                          raise AssertionError(f'multiprime normalization singularity at p={prime} n={n}')
                      print(json.dumps({
                          'prime': prime,
                          'n': n,
                          'rank': record['rank'],
                          'fresh_violations': record['fresh_violations'],
                          'pivot_sha256': record['pivot_sha256'],
                      }, sort_keys=True))
          PY

  sample:
    needs: validate-request
    if: >-
      needs.validate-request.outputs.enabled == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHUNK_INDEX: ${{ matrix.chunk }}
      OUTPUT_DIR: lex-pivot-sweep-chunk-${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact protected or dispatched subject
        env:
          SUBJECT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact Odd Zeta dependencies
        run: python -m pip install --requirement requirements/oz_source_revision_delta.txt
      - name: Acquire exact locked upstream source
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$SOURCE_REPO" source
          git -C source checkout --detach "$SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD^{tree})" = 'be780558454b704bdd016a3070d698c2e106e2b8'
      - name: Generate lex-pivot affine sample chunk
        run: |
          cat > "$RUNNER_TEMP/lex-pivot-sweep-driver.py" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import lex_pivot_sweep

          def main() -> None:
              metadata = lex_pivot_sweep.run_chunk(
                  os.environ['LEX_REQUEST_PATH'],
                  Path('source'),
                  int(os.environ['CHUNK_INDEX']),
                  Path(os.environ['OUTPUT_DIR']),
              )
              print(json.dumps({
                  'request_id': metadata['request_id'],
                  'chunk_index': metadata['chunk_index'],
                  'n_start': metadata['n_start'],
                  'n_stop': metadata['n_stop'],
                  'sample_count': metadata['sample_count'],
                  'pivot_sha256': metadata['pivot_sha256'],
                  'coordinate_map_sha256': metadata['coordinate_map_sha256'],
                  'proof_effect': metadata['proof_effect'],
                  'promotion_effect': metadata['promotion_effect'],
              }, sort_keys=True))

          if __name__ == '__main__':
              main()
          PY
          python "$RUNNER_TEMP/lex-pivot-sweep-driver.py"
      - name: Independently verify serialized chunk contract
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import lex_pivot_sweep

          replay = lex_pivot_sweep.verify_chunk(
              os.environ['LEX_REQUEST_PATH'],
              int(os.environ['CHUNK_INDEX']),
              Path(os.environ['OUTPUT_DIR']),
          )
          print(json.dumps(replay, sort_keys=True))
          PY
      - name: Capture execution environment
        run: |
          {
            python --version
            uname -a
            python -m pip freeze
            git -C source rev-parse HEAD
            git -C source rev-parse HEAD^{tree}
          } > "$OUTPUT_DIR/environment.txt"
      - name: Preserve content-addressed lex-pivot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oz-t3-016-a-lex-pivot-${{ needs.validate-request.outputs.request_id }}-chunk-${{ matrix.chunk }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  multiprime-sample:
    needs: validate-request
    if: >-
      needs.validate-request.outputs.multiprime_enabled == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        prime: ${{ fromJSON(needs.validate-request.outputs.multiprime_primes_json) }}
        chunk: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRIME: ${{ matrix.prime }}
      CHUNK_INDEX: ${{ matrix.chunk }}
      OUTPUT_DIR: lex-pivot-multiprime-p${{ matrix.prime }}-chunk-${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact protected or dispatched subject
        env:
          SUBJECT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact Odd Zeta dependencies
        run: python -m pip install --requirement requirements/oz_source_revision_delta.txt
      - name: Acquire exact locked upstream source
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$SOURCE_REPO" source
          git -C source checkout --detach "$SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD^{tree})" = 'be780558454b704bdd016a3070d698c2e106e2b8'
      - name: Generate multiprime lex-pivot sample chunk
        run: |
          cat > "$RUNNER_TEMP/lex-pivot-multiprime-driver.py" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import lex_pivot_multiprime

          metadata = lex_pivot_multiprime.run_chunk(
              os.environ['MULTIPRIME_REQUEST_PATH'],
              Path('source'),
              int(os.environ['PRIME']),
              int(os.environ['CHUNK_INDEX']),
              Path(os.environ['OUTPUT_DIR']),
          )
          print(json.dumps({
              'request_id': metadata['request_id'],
              'prime': metadata['prime'],
              'chunk_index': metadata['chunk_index'],
              'n_start': metadata['n_start'],
              'n_stop': metadata['n_stop'],
              'sample_count': metadata['sample_count'],
              'pivot_sha256': metadata['pivot_sha256'],
              'coordinate_map_sha256': metadata['coordinate_map_sha256'],
              'proof_effect': metadata['proof_effect'],
              'promotion_effect': metadata['promotion_effect'],
          }, sort_keys=True))
          PY
          python "$RUNNER_TEMP/lex-pivot-multiprime-driver.py"
      - name: Independently verify serialized multiprime chunk contract
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          module_dir = Path(os.environ['MODULE_DIR'])
          sys.path.insert(0, str(module_dir))
          import lex_pivot_multiprime

          replay = lex_pivot_multiprime.verify_chunk(
              os.environ['MULTIPRIME_REQUEST_PATH'],
              int(os.environ['PRIME']),
              int(os.environ['CHUNK_INDEX']),
              Path(os.environ['OUTPUT_DIR']),
          )
          print(json.dumps(replay, sort_keys=True))
          PY
      - name: Capture execution environment
        run: |
          {
            python --version
            uname -a
            python -m pip freeze
            git -C source rev-parse HEAD
            git -C source rev-parse HEAD^{tree}
          } > "$OUTPUT_DIR/environment.txt"
      - name: Preserve content-addressed multiprime lex-pivot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oz-t3-016-a-lex-pivot-${{ needs.validate-request.outputs.multiprime_request_id }}-p${{ matrix.prime }}-chunk-${{ matrix.chunk }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
