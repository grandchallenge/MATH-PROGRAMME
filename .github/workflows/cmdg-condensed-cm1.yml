name: CMDG condensed CM1

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ci/*cmdg*.py"
      - "ci/validate_workflow_coverage*.py"
      - "ci/validate_rh_continuity.py"
      - "governance/cmdg_*.json"
      - "governance/policy_shard_registry.json"
      - "schemas/cmdg_*.json"
      - "schemas/cross_repository_evidence.schema.json"
      - "fixtures/cmdg/**"
      - "fixtures/formal/CMDG-NAT-CONCORDANCE-001/**"
      - "tests/test_cmdg*.py"
      - "tests/**/test_cmdg*.py"
      - "requirements/policy.txt"
      - "evidence/UC-WP02-MATHCERT.json"
      - "campaigns/riemann_hypothesis/RH_WP01_WP02_POST_MERGE_DISPOSITION.md"
      - "docs/domains/riemann_hypothesis.md"
      - "docs/domains/index.md"
      - "docs/AGENT_COUNCIL_ARTIFACT_LEDGER.md"
      - "docs/CAMPAIGN_PROMOTION_REGISTER.md"
      - "reviews/riemann_hypothesis/RH-WP01.agent_review.yaml"
      - "reviews/riemann_hypothesis/RH-WP02.agent_review.yaml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmdg-condensed-cm1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate CMDG condensed CM1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Compile CM1 validator
        run: python -m py_compile ci/validate_cmdg_condensed_cm1.py
      - name: Validate CM1 package
        run: python3 ci/validate_cmdg_condensed_cm1.py
      - name: Run CM1 adversarial mutations
        run: python -m unittest tests.test_cmdg_condensed_cm1
      - name: Revalidate protected V0
        run: python3 ci/validate_cmdg_vertical_spine_v0.py
      - name: Revalidate protected NAT concordance
        run: python3 ci/validate_cmdg_nat_concordance.py
      - name: Revalidate protected Euclid bridge
        run: python3 ci/validate_cmdg_euclid_bridge.py

  formal:
    name: Replay CM1 discrete-underlying adjunction
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject CM1 placeholders and local axioms
        run: |
          if grep -nE '^[[:space:]]*(sorry|axiom)([[:space:]]|$)' fixtures/formal/CMDG-NAT-CONCORDANCE-001/CMDGCondensedCM1.lean; then
            echo "CMDG-CONDENSED-CM1-001 must contain neither sorry nor local axioms."
            exit 1
          fi
      - name: Set up pinned Lean and mathlib cache
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Verify exact pinned mathlib source lineage
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        run: |
          set -euo pipefail
          ML=".lake/packages/mathlib"
          test "$(git -C "$ML" rev-parse HEAD)" = "79d0395a1825a6264ad5d269e35e60537518955e"
          test "$(git -C "$ML" hash-object Mathlib/Condensed/Basic.lean)" = "926e02ac2875d912631dac221bca13990c7d9506"
          test "$(git -C "$ML" hash-object Mathlib/Condensed/Discrete/Basic.lean)" = "064c024b17326bd1bf33f932ca3292f1fe6fcf17"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Sites/ConstantSheaf.lean)" = "bc580cbb21f0458c7cae2f432310a7f27ee9192b"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Sites/Sheaf.lean)" = "d247c155dd0f59d8b63520b06795bed1fce6b1bc"
          test "$(git -C "$ML" hash-object Mathlib/Topology/Category/CompHaus/Limits.lean)" = "908ec21388ee0a7d2d6dfdb9c62fbb564a09e41e"
          test "$(git -C "$ML" hash-object Mathlib/CategoryTheory/Adjunction/Basic.lean)" = "f0e132087a6b1ffa3b39f9dea236a59173e8ce9b"
      - name: Build and replay CM1 fixture
        working-directory: fixtures/formal/CMDG-NAT-CONCORDANCE-001
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set -euo pipefail
          echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
          lake build CMDGCondensedCM1
          lake env lean CMDGCondensedCM1.lean
      - name: Extract CM1 declaration dependencies and axioms
        run: python3 ci/extract_cmdg_lean_dependencies.py fixtures/cmdg/extractor_001/condensed_cm1.json --output cmdg-condensed-cm1-dependencies.json
      - name: Preserve CM1 failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cmdg-condensed-cm1-failure
          path: |
            fixtures/formal/CMDG-NAT-CONCORDANCE-001
            cmdg-condensed-cm1-dependencies.json
          if-no-files-found: warn
