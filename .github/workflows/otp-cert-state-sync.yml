name: OTP Cert-state synchronization

on:
  pull_request:
    paths:
      - ".github/workflows/otp-cert-state-sync.yml"
      - "governance/openai_ten_proofs_cert_state_sync.json"
      - "schemas/openai_ten_proofs_cert_state_sync.schema.json"
      - "governance/validators/openai_ten_proofs_cert_state_sync.py"
      - "ci/openai_ten_proofs_cert_state_sync.py"
      - "tests/test_openai_ten_proofs_cert_state_sync.py"
      - "work_packages/OTP_CERT_STATE_SYNC_001.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cert-state-sync:
    name: validate cross-repository Cert state
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Validate OTP Cert-state synchronization
        run: python ci/openai_ten_proofs_cert_state_sync.py
      - name: Run adversarial mutations
        run: python tests/test_openai_ten_proofs_cert_state_sync.py
