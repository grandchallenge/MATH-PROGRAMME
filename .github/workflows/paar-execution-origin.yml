name: GCL PAAR-C independent execution-origin replay

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact merged MATH-PROGRAMME PR number to corroborate
        required: true
        type: number
      candidate_sha:
        description: Exact reviewed and merged candidate Git SHA
        required: true
        type: string
      material_sha256:
        description: Canonical source PR material SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gcl-paar-c-origin-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  origin:
    if: >-
      github.repository == 'grandchallenge/MATH-PROGRAMME' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    name: Protected PAAR-C bounded replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted protected workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Prepare bounded CPython runner
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run independent bounded assertions
        env:
          GH_TOKEN: ${{ github.token }}
          PAAR_PR: ${{ inputs.pr_number }}
          PAAR_SHA: ${{ inputs.candidate_sha }}
          PAAR_MATERIAL: ${{ inputs.material_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"
          python3 trusted/ci/paar_execution_origin.py capture \
            --candidate-dir trusted \
            --output-file evidence/witness.json \
            --pr-number "$PAAR_PR" \
            --candidate-sha "$PAAR_SHA" \
            --material-sha256 "$PAAR_MATERIAL"
      - name: Upload execution origin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paar-c-origin-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/witness.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
