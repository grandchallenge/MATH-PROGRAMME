name: Administrative maintenance low-friction routine lifecycle

on:
  pull_request:
    paths:
      - '.github/workflows/administrative-maintenance-low-friction.yml'
      - 'ci/administrative_autonomy_low_friction.py'
      - 'governance/administrative_autonomy_low_friction_control.json'
      - 'schemas/administrative_autonomy_low_friction_control.schema.json'
      - 'tests/test_administrative_autonomy_low_friction.py'
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional exact routine PR number; omit for no-op rather than repository sweep.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: administrative-low-friction-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install governed policy dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements/policy.txt
      - name: Validate low-friction control and exhaust state-machine unit matrix
        run: |
          set -euo pipefail
          python ci/administrative_autonomy_low_friction.py validate
          python -m unittest tests.test_administrative_autonomy_low_friction

  lifecycle:
    if: >-
      (github.event_name == 'pull_request_target' &&
       startsWith(github.event.pull_request.head.ref, 'routine/low-friction/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: release-trust
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Mint bounded Candidate lifecycle token
        id: candidate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-contents: write
          permission-pull-requests: write

      - name: Mint read-only ruleset observation token
        id: admin-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-administration: read

      - name: Check out trusted protected implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install governed policy dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements/policy.txt

      - name: Resolve exact routine PR
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          value = os.environ.get('EVENT_PR') if os.environ.get('EVENT_NAME') == 'pull_request_target' else os.environ.get('INPUT_PR')
          if not value or not value.isdigit() or int(value) <= 0:
              raise SystemExit('exact low-friction PR number is required')
          print(f"pr_number={int(value)}")
          PY

      - name: Require separated bounded identities
        env:
          CANDIDATE_LOGIN: ${{ format('{0}[bot]', steps.candidate-token.outputs.app-slug) }}
          REFEREE_LOGIN: 'github-actions[bot]'
          CANDIDATE_APP_ID: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          REFEREE_APP_ID: '15368'
        run: |
          set -euo pipefail
          test "${CANDIDATE_LOGIN}" = 'gcl-release-trust[bot]'
          test "${REFEREE_LOGIN}" = 'github-actions[bot]'
          test "${CANDIDATE_APP_ID}" = '4423678'
          test "${REFEREE_APP_ID}" = '15368'
          test "${CANDIDATE_LOGIN}" != "${REFEREE_LOGIN}"
          test "${CANDIDATE_APP_ID}" != "${REFEREE_APP_ID}"

      - name: Execute complete low-friction lifecycle to terminal proof or fail-closed exception
        env:
          GITHUB_REPOSITORY: grandchallenge/MATH-PROGRAMME
          CANDIDATE_TOKEN: ${{ steps.candidate-token.outputs.token }}
          REFEREE_TOKEN: ${{ github.token }}
          ADMIN_READ_TOKEN: ${{ steps.admin-read-token.outputs.token }}
          CANDIDATE_LOGIN: ${{ format('{0}[bot]', steps.candidate-token.outputs.app-slug) }}
          REFEREE_LOGIN: 'github-actions[bot]'
          CANDIDATE_APP_ID: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          REFEREE_APP_ID: '15368'
        run: |
          set -euo pipefail
          python ci/administrative_autonomy_low_friction.py execute \
            --pr "${{ steps.target.outputs.pr_number }}" \
            --report administrative-low-friction-report.json

      - name: Preserve terminal or fail-closed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: administrative-low-friction-${{ steps.target.outputs.pr_number }}-${{ github.run_id }}
          path: administrative-low-friction-report.json
          if-no-files-found: error
          retention-days: 90

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: release-trust
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Mint bounded Candidate lifecycle token
        id: candidate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-contents: write
          permission-pull-requests: write

      - name: Mint read-only ruleset observation token
        id: admin-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-administration: read

      - name: Check out trusted protected implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install governed policy dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements/policy.txt

      - name: Re-enter every opted-in routine PR without Human Steward routing
        env:
          GITHUB_REPOSITORY: grandchallenge/MATH-PROGRAMME
          CANDIDATE_TOKEN: ${{ steps.candidate-token.outputs.token }}
          REFEREE_TOKEN: ${{ github.token }}
          ADMIN_READ_TOKEN: ${{ steps.admin-read-token.outputs.token }}
          CANDIDATE_LOGIN: ${{ format('{0}[bot]', steps.candidate-token.outputs.app-slug) }}
          REFEREE_LOGIN: 'github-actions[bot]'
          CANDIDATE_APP_ID: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          REFEREE_APP_ID: '15368'
        run: |
          set -euo pipefail
          python ci/administrative_autonomy_low_friction.py sweep \
            --report administrative-low-friction-sweep.json

      - name: Preserve sweep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: administrative-low-friction-sweep-${{ github.run_id }}
          path: administrative-low-friction-*.json
          if-no-files-found: error
          retention-days: 90
