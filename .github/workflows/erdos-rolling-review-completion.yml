name: Erdős 14 critical review Council Clerk completion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcl-erdos-rolling-024-critical-review-completion
  cancel-in-progress: false

jobs:
  council-clerk-complete-reviews:
    if: github.repository == 'grandchallenge/MATH-PROGRAMME' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-trust
    permissions:
      contents: read
    steps:
      - name: Check out immutable protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up pinned supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact roster and hostile/idempotent return tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 tests/test_erdos_catalogue_queue_projection.py
      - name: Mint existing narrowly scoped Council Clerk token
        id: council
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-issues: write
          permission-organization-projects: write
      - name: Apply exact-14 authenticated review return custody
        env:
          GH_TOKEN: ${{ steps.council.outputs.token }}
          GCL_CONTROLLER_ID: erdos-rolling-review-completion
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 ci/erdos_catalogue_queue_projection.py \
            --review-completion --apply \
            --receipt rolling-critical-reviews/receipt.json
      - name: Persist full verified completion or exact failure receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gcl-erdos-rolling-024-council-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: rolling-critical-reviews/receipt.json
          retention-days: 90
          if-no-files-found: warn
