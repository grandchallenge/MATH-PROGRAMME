name: Zensical compatibility probe (non-production)
on:
  pull_request:
    paths:
      - ci/zensical_parity_probe.py
      - ci/renderer_browser_b01.py
      - tests/test_renderer_browser_b01.py
      - requirements/browser-b01.txt
      - ci/zensical_semantic_parity.py
      - ci/zensical_documentary_assets.py
      - tests/test_zensical_search_assets.py
      - tests/test_zensical_semantic_parity.py
      - tests/test_zensical_documentary_assets.py
      - .github/workflows/zensical-parity.yml
  workflow_dispatch:
concurrency:
  group: zensical-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned baseline and candidate generators
        run: python -m pip install --requirement requirements/docs.txt --requirement requirements/zensical-probe.txt
      - name: Test rendered-content parity guard
        run: python -m unittest tests.test_zensical_semantic_parity tests.test_zensical_documentary_assets tests.test_zensical_search_assets -q
      - name: Build source-validated MkDocs baseline
        run: mkdocs build --clean --site-dir .mkdocs-probe-site
      - name: Materialize governed compendia independently of MkDocs hooks
        run: python ci/zensical_parity_probe.py prepare
      - name: Build isolated Zensical candidate
        run: zensical build --config-file zensical-probe.yml --clean
      - name: Compare all HTML routes and required sentinels
        run: python ci/zensical_parity_probe.py verify
      - name: Test browser parity contract
        run: python -m unittest tests.test_renderer_browser_b01 -q
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --requirement requirements/browser-b01.txt
          python -m playwright install --with-deps chromium
      - name: Verify browser math and documentary parity (B01)
        run: python ci/renderer_browser_b01.py --out renderer-b01-evidence
      - name: Preserve real-browser evidence when available
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renderer-b01-browser-evidence
          path: renderer-b01-evidence/
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve parity report when available
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zensical-parity-report
          path: |
            zensical-parity-report.json
            zensical-probe.yml
          if-no-files-found: ignore
          retention-days: 14
