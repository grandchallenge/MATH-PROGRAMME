name: Type Theory Volume IV full development bootstrap
# recover the original continuous Base64 transport; intermediate padding is transport noise

on:
  push:
    branches:
      - docs/type-theory-vol-iv-full-development-003

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reconstruct and verify staged source transport
        shell: bash
        run: |
          set -euo pipefail
          T=.tmp/type-theory-vol-iv-full-development
          cat "$T/src_xz.b64.00" "$T/src_xz.b64.01" "$T/src_xz.b64.02a" "$T/src_xz.b64.02b" "$T/src_xz.b64.03" "$T/src_xz.b64.04" | tr -d '\r\n' > /tmp/raw.b64
          echo "raw_chars=$(stat -c%s /tmp/raw.b64) equals=$(tr -cd '=' < /tmp/raw.b64 | wc -c)"
          tr -d '=' < /tmp/raw.b64 > /tmp/clean.b64
          n=$(stat -c%s /tmp/clean.b64)
          rem=$(( n % 4 ))
          case "$rem" in
            0) : ;;
            2) printf '==' >> /tmp/clean.b64 ;;
            3) printf '=' >> /tmp/clean.b64 ;;
            *) echo "impossible base64 remainder $rem" >&2; exit 1 ;;
          esac
          base64 -d /tmp/clean.b64 > /tmp/vol4-source.xz
          echo "transport_xz_size=$(stat -c%s /tmp/vol4-source.xz)"
          echo "transport_xz_sha256=$(sha256sum /tmp/vol4-source.xz | awk '{print $1}')"
          xz -t /tmp/vol4-source.xz
          xz -dc /tmp/vol4-source.xz > /tmp/vol4-source.payload
          echo "payload_size=$(stat -c%s /tmp/vol4-source.payload)"
          echo "payload_sha256=$(sha256sum /tmp/vol4-source.payload | awk '{print $1}')"
          rm -rf /tmp/vol4-source
          if unzip -t /tmp/vol4-source.payload >/dev/null 2>&1; then
            echo payload_kind=zip
            unzip -q /tmp/vol4-source.payload -d /tmp/vol4-source
          elif tar -tf /tmp/vol4-source.payload >/dev/null 2>&1; then
            echo payload_kind=tar
            mkdir -p /tmp/vol4-source
            tar -xf /tmp/vol4-source.payload -C /tmp/vol4-source
          else
            echo "unrecognized payload" >&2; exit 1
          fi
          echo "source_file_count=$(find /tmp/vol4-source -type f | wc -l)"
          test "$(find /tmp/vol4-source -type f | wc -l)" -eq 101

      - name: Validate exact source and all laboratories
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/vol4-source
          test -f "$S/main.tex"
          test -f "$S/solutions_companion.tex"
          test -f "$S/plates_folio.tex"
          test -f "$S/WORKSET_STATE.json"
          test -f "$S/evidence/FULL_DEVELOPMENT_EVIDENCE.json"
          test "$(find "$S/chapters" -maxdepth 1 -name 'ch*.tex' | wc -l)" -eq 14
          test "$(find "$S/plates" -maxdepth 1 -name 'plate*.tex' | wc -l)" -eq 42
          test "$(find "$S/labs" -maxdepth 1 -name 'lab*.py' | wc -l)" -eq 14
          for f in "$S"/labs/lab*.py; do
            echo "== $f =="
            python "$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('/tmp/vol4-source')
          ex=json.loads((s/'EXERCISE_AUDIT.json').read_text())
          ev=json.loads((s/'evidence/FULL_DEVELOPMENT_EVIDENCE.json').read_text())
          print('exercise_audit=', ex)
          print('evidence_keys=', sorted(ev.keys()))
          assert len(list((s/'chapters').glob('ch*.tex'))) == 14
          assert len(list((s/'plates').glob('plate*.tex'))) == 42
          assert len(list((s/'labs').glob('lab*.py'))) == 14
          PY

      - name: Materialize source and remove all temporary transport
        shell: bash
        run: |
          set -euo pipefail
          DEST=monographs/type-theory/volume-iv-protocol
          rsync -a /tmp/vol4-source/ "$DEST/"
          rm -rf .tmp/type-theory-vol-iv-full-development
          rm -f .github/workflows/type-theory-vol-iv-full-development-bootstrap.yml
          git config user.name "GCL Type Theory Composer"
          git config user.email "type-theory@grandchallenge.invalid"
          git add -A
          git status --short
          git commit -m "docs: complete Type Theory Volume IV full development"
          git push origin HEAD:docs/type-theory-vol-iv-full-development-003
