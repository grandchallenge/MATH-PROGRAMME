name: VGSE final Programme activation

on:
  pull_request:
    paths:
      - "governance/governed_campaign_registry.json"
      - "governance/mathsolve_routing_audit_vgse.json"
      - "governance/campaign_admission_registry.json"
      - "governance/umbrella_runtime_contract_v5.json"
      - "governance/vgse_final_activation.json"
      - "schemas/governed_campaign_registry.schema.json"
      - "schemas/campaign_admission_registry.schema.json"
      - "schemas/mathsolve_routing_audit_vgse.schema.json"
      - "schemas/umbrella_runtime_contract_v5.schema.json"
      - "schemas/vgse_final_activation.schema.json"
      - "ci/campaign_admission_control.py"
      - "ci/umbrella_current_state.py"
      - "tests/test_campaign_admission_control.py"
      - "tests/test_vgse_bounded_admission_decision.py"
      - "tests/test_umbrella_current_state.py"
      - ".github/workflows/vgse-final-activation.yml"
  push:
    branches:
      - main
    paths:
      - "governance/governed_campaign_registry.json"
      - "governance/mathsolve_routing_audit_vgse.json"
      - "governance/campaign_admission_registry.json"
      - "governance/umbrella_runtime_contract_v5.json"
      - "governance/vgse_final_activation.json"
      - "schemas/governed_campaign_registry.schema.json"
      - "schemas/campaign_admission_registry.schema.json"
      - "schemas/mathsolve_routing_audit_vgse.schema.json"
      - "schemas/umbrella_runtime_contract_v5.schema.json"
      - "schemas/vgse_final_activation.schema.json"
      - "ci/campaign_admission_control.py"
      - "ci/umbrella_current_state.py"
      - "tests/test_campaign_admission_control.py"
      - "tests/test_vgse_bounded_admission_decision.py"
      - "tests/test_umbrella_current_state.py"
      - ".github/workflows/vgse-final-activation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Validate bounded activation and successor state
        run: |
          python ci/campaign_admission_control.py
          python ci/umbrella_current_state.py
          python -m unittest tests/test_campaign_admission_control.py -v
          python -m unittest tests/test_vgse_bounded_admission_decision.py -v
          python -m unittest tests/test_umbrella_current_state.py -v
          python -m json.tool governance/vgse_final_activation.json >/dev/null
          python -m json.tool governance/umbrella_runtime_contract_v5.json >/dev/null
