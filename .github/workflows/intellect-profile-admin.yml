name: INTELLECT profile administration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Apply the authorized Phase B repair or verify current state only
        required: true
        type: choice
        options:
          - verify
          - apply
        default: verify

permissions:
  contents: read

concurrency:
  group: intellect-profile-administration
  cancel-in-progress: false

jobs:
  administer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-trust
    steps:
      - name: Mint short-lived Release Trust token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_RELEASE_TRUST_APP_ID }}
          private-key: ${{ secrets.GCL_RELEASE_TRUST_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: |
            MATH-PROGRAMME
            INTELLECT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Require administration credential
        shell: bash
        env:
          GCL_REPOSITORY_ADMIN_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "${GCL_REPOSITORY_ADMIN_TOKEN}" ]]; then
            echo "Missing short-lived Release Trust token."
            exit 1
          fi
      - name: Validate Phase B contract
        run: python ci/intellect_profile_admin.py --mode validate
      - name: Apply or verify INTELLECT profile administration
        shell: bash
        env:
          GCL_REPOSITORY_ADMIN_TOKEN: ${{ steps.app-token.outputs.token }}
          ADMIN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python ci/intellect_profile_admin.py \
            --mode "${ADMIN_MODE}" \
            --wait-seconds 120 \
            --evidence intellect-profile-admin-evidence.json \
            --digest intellect-profile-admin-evidence.json.sha256
      - name: Upload bounded Phase B evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intellect-profile-admin-evidence
          path: |
            intellect-profile-admin-evidence.json
            intellect-profile-admin-evidence.json.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
