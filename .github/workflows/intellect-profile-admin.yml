name: INTELLECT profile administration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Apply the authorized Phase B repair or verify current state only
        required: true
        type: choice
        options:
          - verify
          - apply
        default: verify

permissions:
  contents: read

concurrency:
  group: intellect-profile-administration
  cancel-in-progress: false

jobs:
  administer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-trust
    env:
      GCL_REPOSITORY_ADMIN_TOKEN: ${{ secrets.GCL_REPOSITORY_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Require administration credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GCL_REPOSITORY_ADMIN_TOKEN}" ]]; then
            echo "Missing release-trust environment secret GCL_REPOSITORY_ADMIN_TOKEN."
            exit 1
          fi
      - name: Validate Phase B contract
        run: python ci/intellect_profile_admin.py --mode validate
      - name: Apply or verify INTELLECT profile administration
        shell: bash
        env:
          ADMIN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python ci/intellect_profile_admin.py \
            --mode "${ADMIN_MODE}" \
            --wait-seconds 120 \
            --evidence intellect-profile-admin-evidence.json \
            --digest intellect-profile-admin-evidence.json.sha256
      - name: Upload bounded Phase B evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intellect-profile-admin-evidence
          path: |
            intellect-profile-admin-evidence.json
            intellect-profile-admin-evidence.json.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
