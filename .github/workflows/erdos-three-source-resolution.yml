name: Erdős protected source Council adjudication (three baseline or final two)

on:
  workflow_dispatch:
    inputs:
      source_scope:
        description: "Select exact admitted Council source-correction cohort"
        type: choice
        required: true
        default: original_three
        options:
          - original_three
          - final_two

permissions:
  contents: read

concurrency:
  group: gcl-erdos-three-source-council-adjudication
  cancel-in-progress: false

jobs:
  council-clerk-source-remediation:
    if: github.repository == 'grandchallenge/MATH-PROGRAMME' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-trust
    permissions:
      contents: read
    steps:
      - name: Check out protected source at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up pinned Python interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Test source locks, hostile controls and no-write preflight
        if: inputs.source_scope == 'original_three'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 governance/source_erdos_critical_005/validate.py
          PYTHONPATH=. python3 tests/test_erdos_three_source_resolution.py
      - name: Test final-two source receipts and hostile transition guards
        if: inputs.source_scope == 'final_two'
        run: |
          set -euo pipefail
          python3 governance/source_erdos_critical_005/validate.py
          PYTHONPATH=. python3 tests/test_erdos_final_two_source_resolution.py
      - name: Mint narrowly scoped Council Clerk App token
        id: council
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
          repositories: MATH-PROGRAMME
          permission-issues: write
          permission-organization-projects: read
      - name: Verify Council Clerk token scope
        env:
          GH_TOKEN: ${{ steps.council.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api /installation/repositories --jq '.repositories | length' | grep -x 1
      - name: Source-locked read-only preflight with scoped Council identity
        if: inputs.source_scope == 'original_three'
        env:
          GH_TOKEN: ${{ steps.council.outputs.token }}
          GCL_CONTROLLER_ID: erdos-three-source-resolution
        run: |
          set -euo pipefail
          python3 ci/erdos_three_source_resolution.py --receipt artifacts/erdos-three-source-resolution/preflight.json
      - name: Adjudicate exactly three source revisions
        if: inputs.source_scope == 'original_three'
        env:
          GH_TOKEN: ${{ steps.council.outputs.token }}
          GCL_CONTROLLER_ID: erdos-three-source-resolution
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 ci/erdos_three_source_resolution.py --apply --receipt artifacts/erdos-three-source-resolution/receipt.json
      - name: Source-locked final-two read-only preflight
        if: inputs.source_scope == 'final_two'
        env:
          GH_TOKEN: ${{ steps.council.outputs.token }}
          GCL_CONTROLLER_ID: erdos-final-two-source-resolution
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 ci/erdos_final_two_source_resolution.py --receipt artifacts/erdos-final-two-source-resolution/preflight.json
      - name: Adjudicate exactly two source revisions
        if: inputs.source_scope == 'final_two'
        env:
          GH_TOKEN: ${{ steps.council.outputs.token }}
          GCL_CONTROLLER_ID: erdos-final-two-source-resolution
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          PYTHONPATH=. python3 ci/erdos_final_two_source_resolution.py --apply --receipt artifacts/erdos-final-two-source-resolution/receipt.json
      - name: Retain authenticated receipt and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: erdos-three-source-adjudication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/erdos-three-source-resolution
            artifacts/erdos-final-two-source-resolution
          retention-days: 90
          if-no-files-found: warn
