name: Type Theory Volume IV RC1 evidence packet

on:
  push:
    branches:
      - ci/type-theory-vol-iv-release-packet-001

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packet generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/type-theory-vol-iv-release-packet-001
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact composition branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/type-theory-vol-iv-full-composition-001
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact Gate 7 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate7-artifact
          gh run download 34170916991 \
            --repo grandchallenge/MATH-PROGRAMME \
            --name type-theory-vol-iv-gate7-9e7d817d \
            --dir /tmp/gate7-artifact
          archive="$(find /tmp/gate7-artifact -type f -name 'volume-iv-protocol-9e7d817d.zip' -print -quit)"
          test -n "$archive"
          printf '%s\n' "$archive" > /tmp/gate7-source-archive-path.txt

      - name: Generate and verify bounded packet
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          archive="$(cat /tmp/gate7-source-archive-path.txt)"
          GATE7_SOURCE_ARCHIVE="$archive" python3 ../helper/.github/scripts/type_theory_vol_iv_release_packet.py
          git add monographs/type-theory/volume-iv-protocol
          git diff --cached --name-only | sort > /tmp/actual-release-paths.txt
          diff -u /tmp/expected-release-paths.txt /tmp/actual-release-paths.txt
          test "$(wc -l < /tmp/actual-release-paths.txt)" -eq 29

      - name: Commit bounded evidence packet
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GCL CI Evidence"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs: stage Volume IV RC1 Gate 7 evidence packet"
          git push origin HEAD:docs/type-theory-vol-iv-full-composition-001
