name: OZ T3-015-B targeted diagnostic

on:
  push:
    branches:
      - "codex/oz-t3-015-b-targeted-diagnostic"

permissions:
  contents: read

jobs:
  t3-015-b-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact OZ symbolic dependencies
        run: python -m pip install --requirement requirements/oz_source_revision_delta.txt
      - name: Run T3-015-B only
        run: python -m unittest tests.test_oz_rt_bz_t3_015_b -v
