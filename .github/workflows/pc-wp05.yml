name: PC-WP05 archival checks

on:
  pull_request:
    paths:
      - "campaigns/poincare_reconstruction/WP05_INTEGRATED_CLOSURE/**"
      - "campaigns/poincare_reconstruction/PC_WP05_REFEREE_DECISION.md"
      - "docs/POINCARE_RECONSTRUCTION_ARCHIVE.md"
      - "reviews/poincare/PC-WP05.agent_review.yaml"
      - "ci/*pc_wp05*"
      - "requirements/policy.txt"
      - ".github/workflows/pc-wp05.yml"
  push:
    branches: [main]
    paths:
      - "campaigns/poincare_reconstruction/WP05_INTEGRATED_CLOSURE/**"
      - "campaigns/poincare_reconstruction/PC_WP05_REFEREE_DECISION.md"
      - "docs/POINCARE_RECONSTRUCTION_ARCHIVE.md"
      - "reviews/poincare/PC-WP05.agent_review.yaml"
      - "ci/*pc_wp05*"
      - "requirements/policy.txt"
      - ".github/workflows/pc-wp05.yml"

permissions:
  contents: read

concurrency:
  group: pc-wp05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archival-policy:
    name: Validate PC-WP05 archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Validate archival manifest and trust matrix
        run: python3 ci/validate_pc_wp05_archive.py
      - name: Run adversarial archival tests
        run: python3 ci/test_pc_wp05_archive.py
      - name: Replay WP03 surgery histories
        run: python3 campaigns/poincare_reconstruction/WP03_SURGERY_TOPOLOGY/05_ADVERSARIAL_HISTORIES/validate_histories.py
      - name: Revalidate WP04 certificate policy
        run: python3 ci/validate_pc_wp04_fixture.py fixtures/formal/PC-WP04

  bounded-certificate-replay:
    name: Replay PC-WP04 Lean certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Lean and mathlib cache
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@aa909e45950f6e5dd89e05dfed6b78e190ed99b8
        with:
          lake-package-directory: fixtures/formal/PC-WP04
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Resolve and build bounded certificate
        working-directory: fixtures/formal/PC-WP04
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set -euo pipefail
          echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
          command -v elan
          command -v lake
          elan --version
          lake --version
          test -f lake-manifest.json
          lake build
