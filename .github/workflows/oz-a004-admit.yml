name: OZ A004 admit source records

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/oz-a004-admit.yml

permissions:
  contents: write
  actions: read

jobs:
  admit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download acquired A004 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/oz-a004
          mkdir -p /tmp/oz-a004/artifact /tmp/oz-a004/repo1 /tmp/oz-a004/repo2
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8746466262/zip" \
            -o /tmp/oz-a004/artifact.zip
          unzip -q /tmp/oz-a004/artifact.zip -d /tmp/oz-a004/artifact
          tar -xzf /tmp/oz-a004/artifact/archives/odd-zeta-values-autoformalization-3046acf948896358f420e7a655e7a4235c92028a.tar.gz \
            -C /tmp/oz-a004/repo1 --strip-components=1
          tar -xzf /tmp/oz-a004/artifact/archives/odd-zeta-values-moremath-968477ed7e406df6542f8da6fbe1cd6ca7273c47.tar.gz \
            -C /tmp/oz-a004/repo2 --strip-components=1
          sha256sum -c /tmp/oz-a004/artifact/SOURCE_SHA256SUMS --ignore-missing

      - name: Generate governed A004 records
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'pyyaml==6.0.3'
          printf '%s' '' | base64 -d | gzip -d > /tmp/oz-a004/generate_a004.py
          python3 /tmp/oz-a004/generate_a004.py

          target='campaigns/odd_zeta/OZ_WP00_SOURCE_NORMALIZATION_EQUIVALENCE'
          mkdir -p "${target}/source_lock/A004"
          cp /tmp/oz-a004/out/01_INTAKE_SOURCE_LOCK.yaml "${target}/01_INTAKE_SOURCE_LOCK.yaml"
          cp /tmp/oz-a004/out/06_SOURCE_ACQUISITION_A004.yaml "${target}/06_SOURCE_ACQUISITION_A004.yaml"
          cp /tmp/oz-a004/out/OZ-SRC-RIVER-FORMALIZATION-001.FILE_IDENTITIES.tsv "${target}/source_lock/A004/"
          cp /tmp/oz-a004/out/OZ-SRC-RIVER-MOREMATH-001.FILE_IDENTITIES.tsv "${target}/source_lock/A004/"
          cp /tmp/oz-a004/out/SOURCE_SHA256SUMS "${target}/source_lock/A004/"
          cp /tmp/oz-a004/out/archive-identities.json "${target}/source_lock/A004/"
          cp /tmp/oz-a004/out/source-repositories.json "${target}/source_lock/A004/"

          python3 "${target}/tools/validate_intake_manifest.py" "${target}/01_INTAKE_SOURCE_LOCK.yaml"

      - name: Admit outputs and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/oz-a004-admit.yml
          git add campaigns/odd_zeta/OZ_WP00_SOURCE_NORMALIZATION_EQUIVALENCE
          git config user.name 'gcl-a004-bot'
          git config user.email 'gcl-a004-bot@users.noreply.github.com'
          git commit -m 'Admit OZ-WP00 A004 source locks and permanent intake records'
          git push origin "HEAD:${{ github.head_ref }}"
