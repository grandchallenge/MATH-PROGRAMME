name: Deploy documentation site

on:
  workflow_run:
    workflows: ["Programme policy checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    permissions:
      actions: read
      contents: read
      pages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Require validated commit to remain current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          validated_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${validated_sha}" != "${current_main_sha}" ]]; then
            echo "Validated commit ${validated_sha} is no longer current main ${current_main_sha}; refusing stale publication."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Download and verify policy-validated site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import shutil
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          run_id = int(os.environ["RUN_ID"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          listing_url = (
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts"
              "?per_page=100"
          )
          with urllib.request.urlopen(
              urllib.request.Request(listing_url, headers=headers), timeout=30
          ) as response:
              listing = json.load(response)

          matches = [
              artifact
              for artifact in listing.get("artifacts", [])
              if artifact.get("name") == "validated-site" and not artifact.get("expired")
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one unexpired validated-site artifact for run {run_id}, found {len(matches)}"
              )
          artifact = matches[0]
          digest = str(artifact.get("digest", ""))
          if not digest.startswith("sha256:"):
              raise SystemExit(f"validated-site artifact lacks a SHA-256 digest: {digest!r}")

          archive_request = urllib.request.Request(
              str(artifact["archive_download_url"]), headers=headers
          )
          with urllib.request.urlopen(archive_request, timeout=60) as response:
              artifact_zip = response.read()
          actual_digest = hashlib.sha256(artifact_zip).hexdigest()
          expected_digest = digest.split(":", 1)[1]
          if actual_digest != expected_digest:
              raise SystemExit(
                  f"workflow artifact digest mismatch: {actual_digest} != {expected_digest}"
              )

          artifact_dir = Path("validated-artifact")
          if artifact_dir.exists():
              shutil.rmtree(artifact_dir)
          artifact_dir.mkdir()
          root = artifact_dir.resolve()
          with zipfile.ZipFile(io.BytesIO(artifact_zip)) as bundle:
              for member in bundle.infolist():
                  destination = (artifact_dir / member.filename).resolve()
                  if not destination.is_relative_to(root):
                      raise SystemExit(f"unsafe workflow-artifact member: {member.filename}")
              bundle.extractall(artifact_dir)

          archive_path = artifact_dir / "validated-site.tar.gz"
          checksum_path = artifact_dir / "validated-site.tar.gz.sha256"
          if not archive_path.is_file() or not checksum_path.is_file():
              raise SystemExit("validated-site artifact is missing its site archive or checksum")
          checksum_fields = checksum_path.read_text(encoding="utf-8").split()
          if len(checksum_fields) != 2 or checksum_fields[1] != "validated-site.tar.gz":
              raise SystemExit("validated-site inner checksum record is malformed")
          actual_inner = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if actual_inner != checksum_fields[0]:
              raise SystemExit(
                  f"validated-site inner digest mismatch: {actual_inner} != {checksum_fields[0]}"
              )

          site = Path("site")
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()
          with tarfile.open(archive_path, mode="r:gz") as archive:
              archive.extractall(site, filter="data")
          if not (site / "index.html").is_file():
              raise SystemExit("validated site archive has no index.html")
          print(
              f"verified policy artifact {artifact['id']} from run {run_id}: "
              f"artifact sha256={actual_digest}, site archive sha256={actual_inner}"
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
