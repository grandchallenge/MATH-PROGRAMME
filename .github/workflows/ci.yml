name: Programme policy checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: programme-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-json:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Parse schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid json: {path}")
          PY

      - name: Check exact algebraic fixture
        run: python3 ci/check_algebraic_fixture.py fixtures/algebraic/UF-INV-001

      - name: Run adversarial fixture tests
        run: python3 ci/test_algebraic_fixture.py

      - name: Check radical membership fixture
        run: python3 ci/check_radical_fixture.py fixtures/algebraic/RAD-NIL-002

      - name: Run adversarial radical tests
        run: python3 ci/test_radical_fixture.py

      - name: Check application manifest
        run: python3 ci/validate_grobner_manifest.py

      - name: Run adversarial manifest tests
        run: python3 ci/test_grobner_manifest.py

      - name: Check Chaidez pedagogy contract
        run: python3 ci/validate_chaidez_pedagogy.py

      - name: Run adversarial pedagogy tests
        run: python3 ci/test_chaidez_pedagogy.py

      - name: Check ResearchMath intake fixture
        run: python3 ci/validate_researchmath_fixture.py

      - name: Run adversarial ResearchMath intake tests
        run: python3 ci/test_researchmath_fixture.py

      - name: Install policy dependencies
        run: python -m pip install --requirement requirements/policy.txt

      - name: Validate formal replay content-addressing policy
        run: python3 ci/formal_replay_attestation.py check-policy

      - name: Validate CMDG schema contracts
        run: python3 ci/validate_cmdg_schema_contracts.py

      - name: Validate CMDG runtime graph package
        run: python3 ci/validate_cmdg_graph_package.py --report cmdg-validator-report.json

      - name: Validate CMDG NAT concordance foundational profile
        run: python3 ci/validate_cmdg_nat_foundations_profile.py

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate administrative structural sweep
        run: python3 ci/validate_administrative_structural_sweep.py

      - name: Validate candidate campaign admission
        run: python3 ci/campaign_admission_control.py

      - name: Validate and replay governed campaigns
        run: |
          set -o pipefail
          {
            python3 ci/validate_campaign_replays.py
            python3 ci/test_campaign_replays.py
          } 2>&1 | tee campaign-replays.log

      - name: Preserve campaign replay failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: campaign-replay-failure
          path: campaign-replays.log
          if-no-files-found: warn

      - name: Check LOG-GCD formal fixture
        run: |
          set -o pipefail
          python3 ci/validate_log_gcd_fixture.py fixtures/formal/LOG-GCD-001 2>&1 | tee log-gcd-policy.log

      - name: Preserve LOG-GCD policy failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: log-gcd-policy-failure
          path: log-gcd-policy.log
          if-no-files-found: error

      - name: Run adversarial LOG-GCD fixture tests
        run: python3 ci/test_log_gcd_fixture.py

      - name: Check LOG-GCD published result
        run: |
          set -o pipefail
          python3 ci/validate_log_gcd_publication.py fixtures/formal/LOG-GCD-001 2>&1 | tee log-gcd-publication-policy.log

      - name: Preserve LOG-GCD publication-policy failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: log-gcd-publication-policy-failure
          path: log-gcd-publication-policy.log
          if-no-files-found: error

      - name: Run adversarial LOG-GCD publication tests
        run: python3 ci/test_log_gcd_publication.py

      - name: Validate programme contracts
        run: |
          set -o pipefail
          {
            python ci/validate_programme.py
            python ci/test_validate_programme.py
            python ci/validate_docs.py
            python ci/test_validate_docs.py
            python3 ci/validate_retired_paths.py
            python3 ci/test_retired_paths.py
            # Compatibility markers retained: python3 ci/validate_workflow_coverage.py
            # Compatibility markers retained: python3 ci/test_workflow_coverage.py
            python3 ci/validate_workflow_coverage_v2.py
            python3 ci/test_workflow_coverage_v2.py
            python3 ci/validate_administrative_cadence_reconciliation.py
            python3 ci/validate_policy_reachability.py
            python3 ci/test_policy_reachability.py
            python3 ci/validate_repository_execution.py
            python3 ci/test_repository_execution.py
            python3 ci/validate_workflow_semantics.py
            python3 ci/test_workflow_semantics.py
          } 2>&1 | tee programme-contracts.log

      - name: Preserve programme contract failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: programme-contract-failure
          path: programme-contracts.log
          if-no-files-found: error

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements/docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Package policy-validated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
            -czf validated-site.tar.gz -C site .
          sha256sum validated-site.tar.gz > validated-site.tar.gz.sha256

      - name: Upload policy-validated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-site
          path: |
            validated-site.tar.gz
            validated-site.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  log-gcd-lean:
    name: Replay LOG-GCD-001 in Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate formal replay policy
        run: python3 ci/formal_replay_attestation.py check-policy
      - name: Compute formal replay identity
        id: identity
        run: python3 ci/formal_replay_attestation.py digest --lane log-gcd --github-output "$GITHUB_OUTPUT"
      - name: Restore protected formal replay receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/log-gcd
          key: ${{ steps.identity.outputs.cache_prefix }}probe-${{ github.run_id }}
          restore-keys: |
            ${{ steps.identity.outputs.cache_prefix }}
      - name: Decide replay or attestation reuse
        id: reuse
        run: python3 ci/formal_replay_attestation.py decide --lane log-gcd --receipt .formal-replay/log-gcd/receipt.json --github-output "$GITHUB_OUTPUT"
      - name: Report reused formal attestation
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          echo "REUSED_BIT_IDENTICAL_FORMAL_ATTESTATION"
          cat .formal-replay/log-gcd/receipt.json
      - name: Set up pinned Lean and mathlib cache
        if: steps.reuse.outputs.reuse != 'true'
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/LOG-GCD-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build LOG-GCD fixture
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: fixtures/formal/LOG-GCD-001
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set +e
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json
            lake build
          } > lean-build.log 2>&1
          status=$?
          cat lean-build.log
          exit "$status"
      - name: Extract CMDG LOG-GCD Lean dependencies
        if: steps.reuse.outputs.reuse != 'true'
        run: python3 ci/extract_cmdg_lean_dependencies.py fixtures/cmdg/extractor_001/log_gcd.json --output cmdg-log-gcd-dependencies.json
      - name: Emit successful full-replay receipt
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 ci/formal_replay_attestation.py emit-receipt \
            --lane log-gcd \
            --output .formal-replay/log-gcd/receipt.json \
            --origin-commit "${GITHUB_SHA}" \
            --origin-run-id "${GITHUB_RUN_ID}" \
            --origin-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --origin-event "${GITHUB_EVENT_NAME}" \
            --origin-ref "${GITHUB_REF}" \
            --result-file fixtures/formal/LOG-GCD-001/lean-build.log \
            --result-file cmdg-log-gcd-dependencies.json
      - name: Save protected formal replay receipt
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/log-gcd
          key: ${{ steps.identity.outputs.cache_prefix }}${{ github.run_id }}
      - name: Preserve Lean failure log
        if: failure() && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: log-gcd-lean-failure
          path: fixtures/formal/LOG-GCD-001/lean-build.log
          if-no-files-found: error

  pc-wp04-lean:
    name: Replay PC-WP04 bounded certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install certificate dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Validate bounded certificate policy
        run: |
          python3 ci/validate_pc_wp04_fixture.py fixtures/formal/PC-WP04
          python3 ci/test_pc_wp04_fixture.py
      - name: Reject proof placeholders and opaque axioms
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|axiom)([^A-Za-z]|$)' fixtures/formal/PC-WP04/PCWP04 fixtures/formal/PC-WP04/PCWP04.lean; then
            echo "PC-WP04 must contain neither sorry nor local axioms."
            exit 1
          fi
      - name: Validate formal replay policy
        run: python3 ci/formal_replay_attestation.py check-policy
      - name: Compute formal replay identity
        id: identity
        run: python3 ci/formal_replay_attestation.py digest --lane pc-wp04 --github-output "$GITHUB_OUTPUT"
      - name: Restore protected formal replay receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/pc-wp04
          key: ${{ steps.identity.outputs.cache_prefix }}probe-${{ github.run_id }}
          restore-keys: |
            ${{ steps.identity.outputs.cache_prefix }}
      - name: Decide replay or attestation reuse
        id: reuse
        run: python3 ci/formal_replay_attestation.py decide --lane pc-wp04 --receipt .formal-replay/pc-wp04/receipt.json --github-output "$GITHUB_OUTPUT"
      - name: Report reused formal attestation
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          echo "REUSED_BIT_IDENTICAL_FORMAL_ATTESTATION"
          cat .formal-replay/pc-wp04/receipt.json
      - name: Set up pinned Lean and mathlib cache
        if: steps.reuse.outputs.reuse != 'true'
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/PC-WP04
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build PC-WP04 fixture
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: fixtures/formal/PC-WP04
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set -euo pipefail
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json
            lake build
          } 2>&1 | tee pc-wp04-lean-build.log
      - name: Extract CMDG PC-WP04 Lean dependencies
        if: steps.reuse.outputs.reuse != 'true'
        run: python3 ci/extract_cmdg_lean_dependencies.py fixtures/cmdg/extractor_001/pc_wp04.json --output cmdg-pc-wp04-dependencies.json
      - name: Emit successful full-replay receipt
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 ci/formal_replay_attestation.py emit-receipt \
            --lane pc-wp04 \
            --output .formal-replay/pc-wp04/receipt.json \
            --origin-commit "${GITHUB_SHA}" \
            --origin-run-id "${GITHUB_RUN_ID}" \
            --origin-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --origin-event "${GITHUB_EVENT_NAME}" \
            --origin-ref "${GITHUB_REF}" \
            --result-file fixtures/formal/PC-WP04/pc-wp04-lean-build.log \
            --result-file cmdg-pc-wp04-dependencies.json
      - name: Save protected formal replay receipt
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/pc-wp04
          key: ${{ steps.identity.outputs.cache_prefix }}${{ github.run_id }}

  union-closed-mathcert:
    name: Replay pinned Union-Closed MATHCERT evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install external policy dependencies
        run: python -m pip install --requirement "$GITHUB_WORKSPACE/requirements/policy.txt"
      - name: Validate pinned external evidence
        run: |
          python - <<'PY'
          import json
          evidence = json.load(open("evidence/UC-WP02-MATHCERT.json", encoding="utf-8"))
          expected = {
              "repository": "grandchallenge/MATHCERT",
              "commit": "d59173899dcd1a67dbe8f31de0b9f0917cd1459a",
              "command": ["bash", "ci/check_lean.sh"],
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"external evidence {key} drift: {evidence.get(key)!r} != {value!r}")
          print("external MATHCERT evidence matches workflow pin")
          PY
      - name: Validate formal replay policy
        run: python3 ci/formal_replay_attestation.py check-policy
      - name: Compute formal replay identity
        id: identity
        run: python3 ci/formal_replay_attestation.py digest --lane union-closed-mathcert --github-output "$GITHUB_OUTPUT"
      - name: Restore protected formal replay receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/union-closed-mathcert
          key: ${{ steps.identity.outputs.cache_prefix }}probe-${{ github.run_id }}
          restore-keys: |
            ${{ steps.identity.outputs.cache_prefix }}
      - name: Decide replay or attestation reuse
        id: reuse
        run: python3 ci/formal_replay_attestation.py decide --lane union-closed-mathcert --receipt .formal-replay/union-closed-mathcert/receipt.json --github-output "$GITHUB_OUTPUT"
      - name: Report reused formal attestation
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          echo "REUSED_BIT_IDENTICAL_FORMAL_ATTESTATION"
          cat .formal-replay/union-closed-mathcert/receipt.json
      - name: Checkout pinned MATHCERT repository
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: grandchallenge/MATHCERT
          ref: d59173899dcd1a67dbe8f31de0b9f0917cd1459a
          path: external/MATHCERT
          persist-credentials: false
      - name: Set up pinned Lean and mathlib cache
        if: steps.reuse.outputs.reuse != 'true'
        id: mathcert-lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: external/MATHCERT
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Replay external certification gate
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: external/MATHCERT
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.mathcert-lean-setup.outcome }}
        run: |
          set -euo pipefail
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json
            bash ci/check_lean.sh
          } 2>&1 | tee union-closed-mathcert-replay.log
      - name: Emit successful full-replay receipt
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 ci/formal_replay_attestation.py emit-receipt \
            --lane union-closed-mathcert \
            --output .formal-replay/union-closed-mathcert/receipt.json \
            --origin-commit "${GITHUB_SHA}" \
            --origin-run-id "${GITHUB_RUN_ID}" \
            --origin-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --origin-event "${GITHUB_EVENT_NAME}" \
            --origin-ref "${GITHUB_REF}" \
            --result-file external/MATHCERT/union-closed-mathcert-replay.log
      - name: Save protected formal replay receipt
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/union-closed-mathcert
          key: ${{ steps.identity.outputs.cache_prefix }}${{ github.run_id }}
