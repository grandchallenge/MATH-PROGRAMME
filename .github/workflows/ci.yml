name: Programme policy checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programme-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Parse schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid json: {path}")
          PY

      - name: Check exact algebraic fixture
        run: python3 ci/check_algebraic_fixture.py fixtures/algebraic/UF-INV-001

      - name: Run adversarial fixture tests
        run: python3 ci/test_algebraic_fixture.py

      - name: Check radical membership fixture
        run: python3 ci/check_radical_fixture.py fixtures/algebraic/RAD-NIL-002

      - name: Run adversarial radical tests
        run: python3 ci/test_radical_fixture.py

      - name: Check application manifest
        run: python3 ci/validate_grobner_manifest.py

      - name: Run adversarial manifest tests
        run: python3 ci/test_grobner_manifest.py

      - name: Check Chaidez pedagogy contract
        run: python3 ci/validate_chaidez_pedagogy.py

      - name: Run adversarial pedagogy tests
        run: python3 ci/test_chaidez_pedagogy.py

      - name: Check ResearchMath intake fixture
        run: python3 ci/validate_researchmath_fixture.py

      - name: Run adversarial ResearchMath intake tests
        run: python3 ci/test_researchmath_fixture.py

      - name: Install policy dependencies
        run: python -m pip install jsonschema pyyaml

      - name: Validate and replay governed campaigns
        run: |
          set -o pipefail
          {
            python3 ci/validate_campaign_replays.py
            python3 ci/test_campaign_replays.py
          } 2>&1 | tee campaign-replays.log

      - name: Preserve campaign replay failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-replay-failure
          path: campaign-replays.log
          if-no-files-found: warn

      - name: Check LOG-GCD formal fixture
        run: |
          set -o pipefail
          python3 ci/validate_log_gcd_fixture.py fixtures/formal/LOG-GCD-001 2>&1 | tee log-gcd-policy.log

      - name: Preserve LOG-GCD policy failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: log-gcd-policy-failure
          path: log-gcd-policy.log
          if-no-files-found: error

      - name: Run adversarial LOG-GCD fixture tests
        run: python3 ci/test_log_gcd_fixture.py

      - name: Check LOG-GCD published result
        run: |
          set -o pipefail
          python3 ci/validate_log_gcd_publication.py fixtures/formal/LOG-GCD-001 2>&1 | tee log-gcd-publication-policy.log

      - name: Preserve LOG-GCD publication-policy failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: log-gcd-publication-policy-failure
          path: log-gcd-publication-policy.log
          if-no-files-found: error

      - name: Run adversarial LOG-GCD publication tests
        run: python3 ci/test_log_gcd_publication.py

      - name: Validate programme contracts
        run: |
          set -o pipefail
          {
            python ci/validate_programme.py
            python ci/test_validate_programme.py
            python ci/validate_docs.py
            python ci/test_validate_docs.py
            python3 ci/validate_workflow_coverage.py
            python3 ci/test_workflow_coverage.py
          } 2>&1 | tee programme-contracts.log

      - name: Preserve programme contract failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: programme-contract-failure
          path: programme-contracts.log
          if-no-files-found: error

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build documentation
        run: mkdocs build --strict

  log-gcd-lean:
    name: Replay LOG-GCD-001 in Lean
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up pinned Lean and mathlib cache
        id: lean-setup
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: fixtures/formal/LOG-GCD-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Build LOG-GCD fixture
        working-directory: fixtures/formal/LOG-GCD-001
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set +e
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json
            lake build
          } > lean-build.log 2>&1
          status=$?
          cat lean-build.log
          exit "$status"

      - name: Preserve Lean failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: log-gcd-lean-failure
          path: fixtures/formal/LOG-GCD-001/lean-build.log
          if-no-files-found: error

  pc-wp04-lean:
    name: Replay PC-WP04 bounded certificate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install certificate dependencies
        run: python -m pip install jsonschema
      - name: Validate bounded certificate policy
        run: |
          python3 ci/validate_pc_wp04_fixture.py fixtures/formal/PC-WP04
          python3 ci/test_pc_wp04_fixture.py
      - name: Reject proof placeholders and opaque axioms
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|axiom)([^A-Za-z]|$)' fixtures/formal/PC-WP04/PCWP04 fixtures/formal/PC-WP04/PCWP04.lean; then
            echo "PC-WP04 must contain neither sorry nor local axioms."
            exit 1
          fi
      - name: Set up pinned Lean and mathlib cache
        id: lean-setup
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: fixtures/formal/PC-WP04
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build PC-WP04 fixture
        working-directory: fixtures/formal/PC-WP04
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set -euo pipefail
          echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
          command -v elan
          command -v lake
          elan --version
          lake --version
          test -f lake-manifest.json
          lake build

  union-closed-mathcert:
    name: Replay pinned Union-Closed MATHCERT evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Read pinned external evidence
        id: external-evidence
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          evidence = json.load(open("evidence/UC-WP02-MATHCERT.json", encoding="utf-8"))
          print(f"repository={evidence['repository']}")
          print(f"commit={evidence['commit']}")
          PY
      - name: Checkout pinned MATHCERT repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.external-evidence.outputs.repository }}
          ref: ${{ steps.external-evidence.outputs.commit }}
          path: external/MATHCERT
          persist-credentials: false
      - name: Set up pinned Lean and mathlib cache
        id: mathcert-lean-setup
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: external/MATHCERT
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Replay external certification gate
        working-directory: external/MATHCERT
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.mathcert-lean-setup.outcome }}
        run: |
          set -euo pipefail
          echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
          command -v elan
          command -v lake
          elan --version
          lake --version
          test -f lake-manifest.json
          python -m pip install pyyaml
          bash ci/check_lean.sh
