name: Programme policy checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Parse schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid json: {path}")
          PY

      - name: Check exact algebraic fixture
        run: python3 ci/check_algebraic_fixture.py fixtures/algebraic/UF-INV-001

      - name: Run adversarial fixture tests
        run: python3 ci/test_algebraic_fixture.py

      - name: Check radical membership fixture
        run: python3 ci/check_radical_fixture.py fixtures/algebraic/RAD-NIL-002

      - name: Run adversarial radical tests
        run: python3 ci/test_radical_fixture.py

      - name: Check application manifest
        run: python3 ci/validate_grobner_manifest.py

      - name: Run adversarial manifest tests
        run: python3 ci/test_grobner_manifest.py

      - name: Check Chaidez pedagogy contract
        run: python3 ci/validate_chaidez_pedagogy.py

      - name: Run adversarial pedagogy tests
        run: python3 ci/test_chaidez_pedagogy.py
      - name: Check ResearchMath intake fixture
        run: python3 ci/validate_researchmath_fixture.py

      - name: Run adversarial ResearchMath intake tests
        run: python3 ci/test_researchmath_fixture.py

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build documentation
        run: mkdocs build
