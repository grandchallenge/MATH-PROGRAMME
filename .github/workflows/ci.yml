name: Programme policy checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * *"

permissions:
  contents: read

concurrency:
  group: programme-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  impact:
    name: Classify policy impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      event_mode: ${{ steps.classify.outputs.event_mode }}
      policy_shards: ${{ steps.classify.outputs.policy_shards }}
      unknown_count: ${{ steps.classify.outputs.unknown_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify material impact
        id: classify
        env:
          GCL_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: python3 ci/policy_impact.py classify --github-output "$GITHUB_OUTPUT"
      - name: Report classifier result
        if: always()
        run: |
          printf '%s\n' \
            "event_mode=${{ steps.classify.outputs.event_mode }}" \
            "policy_shards=${{ steps.classify.outputs.policy_shards }}" \
            "unknown_count=${{ steps.classify.outputs.unknown_count }}"

  policy-shard:
    name: Policy shard / ${{ matrix.shard }}
    needs: impact
    if: always() && needs.impact.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.policy_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Install Odd Zeta symbolic dependencies
        if: matrix.shard == 'oz' || matrix.shard == 'campaigns'
        run: python -m pip install --requirement requirements/oz_source_revision_delta.txt
      - name: Install documentation dependencies
        if: matrix.shard == 'docs'
        run: python -m pip install --requirement requirements/docs.txt
      - name: Install Erdős Compendium finite QA dependencies
        if: matrix.shard == 'repository-regression'
        run: python -m pip install --requirement requirements/erdos_compendium_finite_qa.txt
      - name: Execute routed policy shard
        shell: bash
        run: python3 ci/run_policy_shard.py --shard "${{ matrix.shard }}" --log "policy-shard-${{ matrix.shard }}.log"
      - name: Package policy-validated site
        if: matrix.shard == 'docs' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
            -czf validated-site.tar.gz -C site .
          sha256sum validated-site.tar.gz > validated-site.tar.gz.sha256
      - name: Upload policy-validated site
        if: matrix.shard == 'docs' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-site
          path: |
            validated-site.tar.gz
            validated-site.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve routed shard failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: policy-shard-${{ matrix.shard }}-failure
          path: policy-shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 7

  queue-cutover-contract:
    name: Queue class cutover positive and hostile tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify two-class source/pickup separation and fail-closed views
        run: python3 ci/test_gcl_queue_class_cutover.py
      - name: Validate accepted Compendium publication boundary (positive and hostile)
        run: python3 ci/test_erdos_compendium_publication_gate.py
      - name: Test actual Compendium RESULT/1 transport projector and hostile cross-route replay
        run: python3 ci/test_erdos_compendium_direct_return_projector.py
      - name: Guard bounded Compendium Issue Field writer against widened permission scope
        run: python3 ci/test_erdos_compendium_direct_return_permissions.py
      - name: Test source-locked editorial admission and hostile state/readback cases
        run: python3 ci/test_erdos_compendium_editorial_activate.py
      - name: Test exact-14 rolling review completion and idempotent replays
        run: PYTHONPATH=. python3 tests/test_erdos_catalogue_queue_projection.py
      - name: Verify five source-locked Erdős corrections and hostile semantic fixtures
        run: python3 governance/source_erdos_critical_005/validate.py
      - name: Test the sealed scheduled Editorial replay and no-RESULT authority
        run: python3 ci/test_erdos_compendium_editorial_replay.py

  validate-json:
    needs: [impact, policy-shard, queue-cutover-contract]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate routed Programme policy
        run: |
          test "${{ needs.impact.result }}" = "success"
          test "${{ needs.policy-shard.result }}" = "success"
          test "${{ needs.queue-cutover-contract.result }}" = "success"
          echo "POLICY_IMPACT_GATING_AGGREGATE_SUCCESS"
