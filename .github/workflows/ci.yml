name: Programme policy checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 8 * * *"

permissions:
  contents: read

concurrency:
  group: programme-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Classify policy impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      event_mode: ${{ steps.classify.outputs.event_mode }}
      policy_shards: ${{ steps.classify.outputs.policy_shards }}
      unknown_count: ${{ steps.classify.outputs.unknown_count }}
      log_gcd_dirty: ${{ steps.classify.outputs.log_gcd_dirty }}
      pc_wp04_dirty: ${{ steps.classify.outputs.pc_wp04_dirty }}
      union_closed_dirty: ${{ steps.classify.outputs.union_closed_dirty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify exact transition impact
        id: classify
        env:
          GCL_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: python3 ci/policy_impact.py classify --github-output "$GITHUB_OUTPUT"
      - name: Preserve classifier report
        if: always()
        run: |
          printf '%s\n' \
            "event_mode=${{ steps.classify.outputs.event_mode }}" \
            "policy_shards=${{ steps.classify.outputs.policy_shards }}" \
            "unknown_count=${{ steps.classify.outputs.unknown_count }}" \
            "log_gcd_dirty=${{ steps.classify.outputs.log_gcd_dirty }}" \
            "pc_wp04_dirty=${{ steps.classify.outputs.pc_wp04_dirty }}" \
            "union_closed_dirty=${{ steps.classify.outputs.union_closed_dirty }}" \
            > policy-impact-report.txt
      - name: Upload classifier evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: policy-impact-report
          path: policy-impact-report.txt
          if-no-files-found: error
          retention-days: 30

  policy-shard:
    name: Policy shard / ${{ matrix.shard }}
    needs: impact
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [core, fixtures, cmdg, oz, administrative, campaigns, contracts, docs, repository-regression]
    steps:
      - name: Fail closed if impact classification failed
        if: needs.impact.result != 'success'
        run: |
          echo "policy impact classification failed; shard execution cannot be trusted"
          exit 1
      - name: Verified irrelevant-shard no-op
        if: needs.impact.result == 'success' && !contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard)
        run: echo "VERIFIED_POLICY_SHARD_NO_OP ${{ matrix.shard }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard)
        with:
          python-version: "3.12"
      - name: Install governed policy dependencies
        if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard)
        run: python -m pip install --requirement requirements/policy.txt
      - name: Install documentation dependencies
        if: needs.impact.result == 'success' && matrix.shard == 'docs' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard)
        run: python -m pip install --requirement requirements/docs.txt
      - name: Execute governed policy shard
        if: needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 ci/run_policy_shard.py --shard "${SHARD}" --log "policy-shard-${SHARD}.log"
      - name: Package policy-validated site
        if: needs.impact.result == 'success' && matrix.shard == 'docs' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
            -czf validated-site.tar.gz -C site .
          sha256sum validated-site.tar.gz > validated-site.tar.gz.sha256
      - name: Upload policy-validated site
        if: needs.impact.result == 'success' && matrix.shard == 'docs' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-site
          path: |
            validated-site.tar.gz
            validated-site.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve policy shard failure
        if: failure() && needs.impact.result == 'success' && contains(fromJSON(needs.impact.outputs.policy_shards), matrix.shard)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: policy-shard-${{ matrix.shard }}-failure
          path: policy-shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 30

  validate-json:
    needs: [impact, policy-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate routed Programme policy
        run: |
          test "${{ needs.impact.result }}" = "success"
          test "${{ needs.policy-shard.result }}" = "success"
          echo "POLICY_IMPACT_GATING_AGGREGATE_SUCCESS"

  log-gcd-lean:
    name: Replay LOG-GCD-001 in Lean
    needs: impact
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require impact classification
        run: test "${{ needs.impact.result }}" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate formal replay policy
        run: python3 ci/formal_replay_attestation.py check-policy
      - name: Compute formal replay identity
        id: identity
        run: python3 ci/formal_replay_attestation.py digest --lane log-gcd --github-output "$GITHUB_OUTPUT"
      - name: Restore protected formal replay receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/log-gcd
          key: ${{ steps.identity.outputs.cache_prefix }}probe-${{ github.run_id }}
          restore-keys: |
            ${{ steps.identity.outputs.cache_prefix }}
      - name: Decide bit-dirty replay or protected attestation
        id: reuse
        shell: bash
        env:
          EVENT_MODE: ${{ needs.impact.outputs.event_mode }}
          DIRTY: ${{ needs.impact.outputs.log_gcd_dirty }}
        run: |
          MODE="clean"
          if [[ "${EVENT_MODE}" == "formal_sentinel" || "${EVENT_MODE}" == "manual_full" ]]; then MODE="sentinel"; elif [[ "${DIRTY}" == "true" ]]; then MODE="dirty"; fi
          python3 ci/formal_replay_gate.py decide --lane log-gcd --receipt .formal-replay/log-gcd/receipt.json --mode "${MODE}" --github-output "$GITHUB_OUTPUT"
      - name: Report reused formal attestation
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          echo "REUSED_BIT_IDENTICAL_FORMAL_ATTESTATION"
          cat .formal-replay/log-gcd/receipt.json
      - name: Set up pinned Lean and mathlib cache
        if: steps.reuse.outputs.reuse != 'true'
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/LOG-GCD-001
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build LOG-GCD fixture
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: fixtures/formal/LOG-GCD-001
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set +e
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json
            lake build
          } > lean-build.log 2>&1
          status=$?
          cat lean-build.log
          exit "$status"
      - name: Extract CMDG LOG-GCD Lean dependencies
        if: steps.reuse.outputs.reuse != 'true'
        run: python3 ci/extract_cmdg_lean_dependencies.py fixtures/cmdg/extractor_001/log_gcd.json --output cmdg-log-gcd-dependencies.json
      - name: Emit successful protected full-replay receipt
        if: steps.reuse.outputs.reuse != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'))
        run: |
          python3 ci/formal_replay_gate.py emit-receipt \
            --lane log-gcd \
            --output .formal-replay/log-gcd/receipt.json \
            --origin-commit "${GITHUB_SHA}" \
            --origin-run-id "${GITHUB_RUN_ID}" \
            --origin-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --origin-event "${GITHUB_EVENT_NAME}" \
            --origin-ref "refs/heads/main" \
            --result-file fixtures/formal/LOG-GCD-001/lean-build.log \
            --result-file cmdg-log-gcd-dependencies.json
      - name: Save protected formal replay receipt
        if: steps.reuse.outputs.reuse != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/log-gcd
          key: ${{ steps.identity.outputs.cache_prefix }}${{ github.run_id }}
      - name: Preserve Lean failure log
        if: failure() && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: log-gcd-lean-failure
          path: fixtures/formal/LOG-GCD-001/lean-build.log
          if-no-files-found: error

  pc-wp04-lean:
    name: Replay PC-WP04 bounded certificate
    needs: impact
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require impact classification
        run: test "${{ needs.impact.result }}" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install certificate dependencies
        run: python -m pip install --requirement requirements/policy.txt
      - name: Validate bounded certificate policy
        run: |
          python3 ci/validate_pc_wp04_fixture.py fixtures/formal/PC-WP04
          python3 ci/test_pc_wp04_fixture.py
      - name: Reject proof placeholders and opaque axioms
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|axiom)([^A-Za-z]|$)' fixtures/formal/PC-WP04/PCWP04 fixtures/formal/PC-WP04/PCWP04.lean; then
            echo "PC-WP04 must contain neither sorry nor local axioms."
            exit 1
          fi
      - name: Validate formal replay policy
        run: python3 ci/formal_replay_attestation.py check-policy
      - name: Compute formal replay identity
        id: identity
        run: python3 ci/formal_replay_attestation.py digest --lane pc-wp04 --github-output "$GITHUB_OUTPUT"
      - name: Restore protected formal replay receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/pc-wp04
          key: ${{ steps.identity.outputs.cache_prefix }}probe-${{ github.run_id }}
          restore-keys: |
            ${{ steps.identity.outputs.cache_prefix }}
      - name: Decide bit-dirty replay or protected attestation
        id: reuse
        shell: bash
        env:
          EVENT_MODE: ${{ needs.impact.outputs.event_mode }}
          DIRTY: ${{ needs.impact.outputs.pc_wp04_dirty }}
        run: |
          MODE="clean"
          if [[ "${EVENT_MODE}" == "formal_sentinel" || "${EVENT_MODE}" == "manual_full" ]]; then MODE="sentinel"; elif [[ "${DIRTY}" == "true" ]]; then MODE="dirty"; fi
          python3 ci/formal_replay_gate.py decide --lane pc-wp04 --receipt .formal-replay/pc-wp04/receipt.json --mode "${MODE}" --github-output "$GITHUB_OUTPUT"
      - name: Report reused formal attestation
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          echo "REUSED_BIT_IDENTICAL_FORMAL_ATTESTATION"
          cat .formal-replay/pc-wp04/receipt.json
      - name: Set up pinned Lean and mathlib cache
        if: steps.reuse.outputs.reuse != 'true'
        id: lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: fixtures/formal/PC-WP04
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build PC-WP04 fixture
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: fixtures/formal/PC-WP04
        shell: bash
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.lean-setup.outcome }}
        run: |
          set -euo pipefail
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json
            lake build
          } 2>&1 | tee pc-wp04-lean-build.log
      - name: Extract CMDG PC-WP04 Lean dependencies
        if: steps.reuse.outputs.reuse != 'true'
        run: python3 ci/extract_cmdg_lean_dependencies.py fixtures/cmdg/extractor_001/pc_wp04.json --output cmdg-pc-wp04-dependencies.json
      - name: Emit successful protected full-replay receipt
        if: steps.reuse.outputs.reuse != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'))
        run: |
          python3 ci/formal_replay_gate.py emit-receipt \
            --lane pc-wp04 \
            --output .formal-replay/pc-wp04/receipt.json \
            --origin-commit "${GITHUB_SHA}" \
            --origin-run-id "${GITHUB_RUN_ID}" \
            --origin-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --origin-event "${GITHUB_EVENT_NAME}" \
            --origin-ref "refs/heads/main" \
            --result-file fixtures/formal/PC-WP04/pc-wp04-lean-build.log \
            --result-file cmdg-pc-wp04-dependencies.json
      - name: Save protected formal replay receipt
        if: steps.reuse.outputs.reuse != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/pc-wp04
          key: ${{ steps.identity.outputs.cache_prefix }}${{ github.run_id }}

  union-closed-mathcert:
    name: Replay pinned Union-Closed MATHCERT evidence
    needs: impact
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require impact classification
        run: test "${{ needs.impact.result }}" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install external policy dependencies
        run: python -m pip install --requirement "$GITHUB_WORKSPACE/requirements/policy.txt"
      - name: Validate pinned external evidence
        run: |
          python - <<'PY'
          import json
          evidence = json.load(open("evidence/UC-WP02-MATHCERT.json", encoding="utf-8"))
          expected = {
              "repository": "grandchallenge/MATHCERT",
              "commit": "d59173899dcd1a67dbe8f31de0b9f0917cd1459a",
              "command": ["bash", "ci/check_lean.sh"],
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"external evidence {key} drift: {evidence.get(key)!r} != {value!r}")
          print("external MATHCERT evidence matches workflow pin")
          PY
      - name: Validate formal replay policy
        run: python3 ci/formal_replay_attestation.py check-policy
      - name: Compute formal replay identity
        id: identity
        run: python3 ci/formal_replay_attestation.py digest --lane union-closed-mathcert --github-output "$GITHUB_OUTPUT"
      - name: Restore protected formal replay receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/union-closed-mathcert
          key: ${{ steps.identity.outputs.cache_prefix }}probe-${{ github.run_id }}
          restore-keys: |
            ${{ steps.identity.outputs.cache_prefix }}
      - name: Decide bit-dirty replay or protected attestation
        id: reuse
        shell: bash
        env:
          EVENT_MODE: ${{ needs.impact.outputs.event_mode }}
          DIRTY: ${{ needs.impact.outputs.union_closed_dirty }}
        run: |
          MODE="clean"
          if [[ "${EVENT_MODE}" == "formal_sentinel" || "${EVENT_MODE}" == "manual_full" ]]; then MODE="sentinel"; elif [[ "${DIRTY}" == "true" ]]; then MODE="dirty"; fi
          python3 ci/formal_replay_gate.py decide --lane union-closed-mathcert --receipt .formal-replay/union-closed-mathcert/receipt.json --mode "${MODE}" --github-output "$GITHUB_OUTPUT"
      - name: Report reused formal attestation
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          echo "REUSED_BIT_IDENTICAL_FORMAL_ATTESTATION"
          cat .formal-replay/union-closed-mathcert/receipt.json
      - name: Checkout pinned MATHCERT repository
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: grandchallenge/MATHCERT
          ref: d59173899dcd1a67dbe8f31de0b9f0917cd1459a
          path: external/MATHCERT
          persist-credentials: false
      - name: Set up pinned Lean and mathlib cache
        if: steps.reuse.outputs.reuse != 'true'
        id: mathcert-lean-setup
        continue-on-error: true
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          lake-package-directory: external/MATHCERT
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Replay external certification gate
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: external/MATHCERT
        env:
          LEAN_SETUP_OUTCOME: ${{ steps.mathcert-lean-setup.outcome }}
        run: |
          set -euo pipefail
          {
            echo "lean-action setup outcome: ${LEAN_SETUP_OUTCOME}"
            command -v elan
            command -v lake
            elan --version
            lake --version
            test -f lake-manifest.json
            bash ci/check_lean.sh
          } 2>&1 | tee union-closed-mathcert-replay.log
      - name: Emit successful protected full-replay receipt
        if: steps.reuse.outputs.reuse != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'))
        run: |
          python3 ci/formal_replay_gate.py emit-receipt \
            --lane union-closed-mathcert \
            --output .formal-replay/union-closed-mathcert/receipt.json \
            --origin-commit "${GITHUB_SHA}" \
            --origin-run-id "${GITHUB_RUN_ID}" \
            --origin-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --origin-event "${GITHUB_EVENT_NAME}" \
            --origin-ref "refs/heads/main" \
            --result-file external/MATHCERT/union-closed-mathcert-replay.log
      - name: Save protected formal replay receipt
        if: steps.reuse.outputs.reuse != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .formal-replay/union-closed-mathcert
          key: ${{ steps.identity.outputs.cache_prefix }}${{ github.run_id }}
