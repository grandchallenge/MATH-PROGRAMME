name: Type Theory Volume III reviewer bundle packaging

on:
  push:
    branches:
      - reviews/type-theory-vol-iii-reviewer-bundle-002

permissions:
  contents: write
  actions: read

concurrency:
  group: type-theory-vol-iii-reviewer-bundle-002
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Acquire exact Gate 7 freeze artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/grandchallenge/MATH-PROGRAMME/actions/artifacts/9988996014/zip \
            -o /tmp/vol3-gate7-evidence.zip
          rm -rf /tmp/vol3-gate7
          mkdir -p /tmp/vol3-gate7
          unzip -q /tmp/vol3-gate7-evidence.zip -d /tmp/vol3-gate7

      - name: Verify exact admitted/freeze identities
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/vol3-gate7/main.pdf | awk '{print $1}')" = "caf12162ff052db869356c8c0d0fa96dce77b8c40de3bf576e61a2fce30574f3"
          test "$(sha256sum /tmp/vol3-gate7/solutions_companion.pdf | awk '{print $1}')" = "2e1eae3596f7cb386dc2c93064bcc3d1c85f9511f46f49431ed9ede62836677e"
          test "$(sha256sum /tmp/vol3-gate7/plates_folio.pdf | awk '{print $1}')" = "ae718ef486fbee4a89fe5d498a48228d5499100d9e84d04bf67517fb520a0de0"
          test "$(sha256sum /tmp/vol3-gate7/evidence/gate7/source.zip | awk '{print $1}')" = "70c9ffedefa795cf40e2536c45db8a7f3fb0223719d4c6cf24f921e7637d7a62"
          test "$(stat -c %s /tmp/vol3-gate7/evidence/gate7/source.zip)" = "106349"

      - name: Materialize reviewer-facing assets and deterministic bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile

          repo = Path.cwd()
          review = repo / 'monographs/type-theory/volume-iii-proof-program/reviews/RC1'
          assets = review / 'assets'
          assets.mkdir(parents=True, exist_ok=True)
          incoming = Path('/tmp/vol3-gate7')

          exact = {
              '01_PROOF_PROGRAM_RC1.pdf': ('main.pdf','caf12162ff052db869356c8c0d0fa96dce77b8c40de3bf576e61a2fce30574f3'),
              '02_SOLUTIONS_COMPANION_RC1.pdf': ('solutions_companion.pdf','2e1eae3596f7cb386dc2c93064bcc3d1c85f9511f46f49431ed9ede62836677e'),
              '03_PLATE_FOLIO_RC1.pdf': ('plates_folio.pdf','ae718ef486fbee4a89fe5d498a48228d5499100d9e84d04bf67517fb520a0de0'),
          }
          for dst,(src,expected) in exact.items():
              shutil.copy2(incoming/src, assets/dst)
              got=hashlib.sha256((assets/dst).read_bytes()).hexdigest()
              assert got == expected, (dst,got)

          source_name='GCL_Type_Theory_Volume_III_PROOF_PROGRAM_RC1_Source.zip'
          shutil.copy2(incoming/'evidence/gate7/source.zip', assets/source_name)
          source_sha=hashlib.sha256((assets/source_name).read_bytes()).hexdigest()
          assert source_sha == '70c9ffedefa795cf40e2536c45db8a7f3fb0223719d4c6cf24f921e7637d7a62'

          stage=Path('/tmp/vol3-reviewer-bundle')
          if stage.exists(): shutil.rmtree(stage)
          (stage/'review').mkdir(parents=True)
          (stage/'source').mkdir()
          (stage/'reproducibility').mkdir()
          shutil.copy2(review/'REVIEWER_START_HERE.md', stage/'00_START_HERE.md')
          for name in exact:
              shutil.copy2(assets/name, stage/name)
          shutil.copy2(review/'GATE8_REVIEW_PACKET.md', stage/'review/GATE8_REVIEW_PACKET.md')
          shutil.copy2(review/'THEOREM_REVIEW_MATRIX.json', stage/'review/THEOREM_REVIEW_MATRIX.json')
          shutil.copy2(review/'REVIEW_RECORD_TEMPLATE.yaml', stage/'review/REVIEW_RECORD_TEMPLATE.yaml')
          shutil.copy2(assets/source_name, stage/'source'/source_name)
          shutil.copy2(review/'BUILD.md', stage/'reproducibility/BUILD.md')
          shutil.copy2(incoming/'evidence/gate7/environment.txt', stage/'reproducibility/environment.txt')

          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          component_files=[]
          for p in sorted(x for x in stage.rglob('*') if x.is_file()):
              component_files.append({'path':p.relative_to(stage).as_posix(),'size_bytes':p.stat().st_size,'sha256':digest(p)})
          content_manifest={
              'schema_version':'1.0.0',
              'bundle':'GCL Type Theory Volume III RC1 Reviewer Bundle',
              'review_target':{
                  'source_archive_sha256':source_sha,
                  'protected_admission_commit':'69fe9e649ea59c5bc1c27f816bb65f52c2627d79',
                  'protected_admission_release_tree_sha':'fd8ad170e47ef68ae4745d12b27a4200cc1e6be8',
                  'tracking_issue':871,
              },
              'tex_compilation_required_for_gate8':False,
              'files':component_files,
          }
          (stage/'BUNDLE_CONTENTS_MANIFEST.json').write_text(json.dumps(content_manifest,indent=2)+'\n')
          sums=[]
          for p in sorted(x for x in stage.rglob('*') if x.is_file()):
              sums.append(f"{digest(p)}  {p.relative_to(stage).as_posix()}")
          (stage/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')

          bundle_name='GCL_Type_Theory_Volume_III_PROOF_PROGRAM_RC1_Reviewer_Bundle.zip'
          bundle=assets/bundle_name
          if bundle.exists(): bundle.unlink()
          with zipfile.ZipFile(bundle,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in stage.rglob('*') if x.is_file()):
                  rel=p.relative_to(stage).as_posix()
                  zi=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=(0o100644 & 0xFFFF)<<16
                  zi.create_system=3
                  z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          bundle_sha=digest(bundle)

          asset_manifest={
              'schema_version':'1.0.0',
              'review_target':{
                  'source_archive_sha256':source_sha,
                  'protected_admission_commit':'69fe9e649ea59c5bc1c27f816bb65f52c2627d79',
                  'protected_admission_release_tree_sha':'fd8ad170e47ef68ae4745d12b27a4200cc1e6be8',
                  'tracking_issue':871,
              },
              'primary_review_surface':'assets/01_PROOF_PROGRAM_RC1.pdf',
              'tex_compilation_required_for_gate8':False,
              'reviewer_bundle':{'path':'assets/'+bundle_name,'size_bytes':bundle.stat().st_size,'sha256':bundle_sha},
              'assets':[
                  {'path':'assets/'+name,'size_bytes':(assets/name).stat().st_size,'sha256':digest(assets/name)} for name in exact
              ] + [{'path':'assets/'+source_name,'size_bytes':(assets/source_name).stat().st_size,'sha256':source_sha}],
          }
          (review/'REVIEWER_ASSET_MANIFEST.json').write_text(json.dumps(asset_manifest,indent=2)+'\n')

          for name in ['README.md','REVIEWER_START_HERE.md']:
              p=review/name
              p.write_text(p.read_text().replace('__BUNDLE_SHA256__',bundle_sha))

          state_path=repo/'monographs/type-theory/volume-iii-proof-program/WORKSET_STATE.json'
          state=json.loads(state_path.read_text())
          g=state['gate8_review']
          g.update({
              'reviewer_landing_page':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/README.md',
              'reviewer_start_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/REVIEWER_START_HERE.md',
              'optional_build_instructions_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/BUILD.md',
              'reviewer_asset_manifest_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/REVIEWER_ASSET_MANIFEST.json',
              'primary_review_pdf_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/assets/01_PROOF_PROGRAM_RC1.pdf',
              'solutions_pdf_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/assets/02_SOLUTIONS_COMPANION_RC1.pdf',
              'plates_pdf_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/assets/03_PLATE_FOLIO_RC1.pdf',
              'direct_source_archive_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/assets/'+source_name,
              'reviewer_bundle_path':'monographs/type-theory/volume-iii-proof-program/reviews/RC1/assets/'+bundle_name,
              'reviewer_bundle_sha256':bundle_sha,
              'tex_compilation_required':False,
          })
          addition='reviewer-facing bundle and direct camera-ready PDF surfaces prepared; TeX compilation made optional'
          if addition not in state['completed']: state['completed'].append(addition)
          state['current_claim_boundary']='Volume III RC1 is internally composition-complete and its exact source archive is durably admitted on protected main at commit 69fe9e649ea59c5bc1c27f816bb65f52c2627d79 with admission release tree fd8ad170e47ef68ae4745d12b27a4200cc1e6be8. Gate 8 is docketed under issue #871 and has direct camera-ready reviewer assets; it remains pending genuinely independent mathematical review. Publication authority is not granted. Reviewer convenience assets, CI, executable regressions, rendered inspection, durable admission, and review-docket preparation are not independent mathematical review or mathematical certification.'
          state['next_action']='Provide the reviewer landing-page URL to a genuinely independent mathematical reader. The reviewer may conduct the mathematical review directly from the camera-ready PDF; source inspection and recompilation are optional. Admit the completed independent review record through protected controls before any RC_REVIEW_QUALIFIED transition.'
          state_path.write_text(json.dumps(state,indent=2,ensure_ascii=False)+'\n')
          print('bundle_sha256='+bundle_sha)
          PY

      - name: Verify reviewer bundle contents
        run: |
          set -euo pipefail
          ASSETS="monographs/type-theory/volume-iii-proof-program/reviews/RC1/assets"
          unzip -t "${ASSETS}/GCL_Type_Theory_Volume_III_PROOF_PROGRAM_RC1_Reviewer_Bundle.zip"
          python3 -m json.tool monographs/type-theory/volume-iii-proof-program/reviews/RC1/REVIEWER_ASSET_MANIFEST.json >/dev/null
          python3 -m json.tool monographs/type-theory/volume-iii-proof-program/reviews/RC1/THEOREM_REVIEW_MATRIX.json >/dev/null
          python3 -m json.tool monographs/type-theory/volume-iii-proof-program/WORKSET_STATE.json >/dev/null

      - name: Remove temporary packager and commit exact reviewer surface
        run: |
          set -euo pipefail
          git config user.name "GCL Reviewer Bundle Packager"
          git config user.email "reviewer-bundle@grandchallenge.invalid"
          git rm --ignore-unmatch .github/workflows/type-theory-vol-iii-reviewer-bundle.yml
          git add monographs/type-theory/volume-iii-proof-program/reviews/RC1 monographs/type-theory/volume-iii-proof-program/WORKSET_STATE.json
          git diff --cached --check
          git commit -m "review: package Volume III RC1 reviewer surface"
          git push origin HEAD:reviews/type-theory-vol-iii-reviewer-bundle-002
