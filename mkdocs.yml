repo_url: https://github.com/grandchallenge/MATH-PROGRAMME
repo_name: grandchallenge/MATH-PROGRAMME
edit_uri: edit/main/docs/
copyright: Grand Challenge Mathematics Programme · Edition 2026.07 · No theorem without a spine. No proof without a reader.

