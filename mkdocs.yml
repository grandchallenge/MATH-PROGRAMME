site_name: Grand Challenge Mathematics Programme
site_description: A Grand Challenge mathematics programme for turning curiosity into checked understanding.
site_url: https://grandchallenge.github.io/MATH-PROGRAMME/
repo_url: https://github.com/grandchallenge/MATH-PROGRAMME
repo_name: grandchallenge/MATH-PROGRAMME
edit_uri: edit/main/docs/
copyright: Grand Challenge Mathematics Programme · Edition 2026.06 · No theorem without a spine. No proof without a reader.

docs_dir: docs
site_dir: site

nav:
  - Start Here: index.md
  - Programme:
      - Showcase: SHOWCASE.md
      - Fixture Ledger: FIXTURE_LEDGER.md
      - Applications Manifest: GROBNER_APPLICATIONS_MANIFEST.md
      - ResearchMath Intake: RESEARCHMATH_INTAKE_LANE.md
      - ResearchMath Walkthrough: RESEARCHMATH_WALKTHROUGH.md
      - RM-DIO-004 MATHSOLVE Seed: MATHSOLVE_SEED_RM_DIO_004.md
      - External Corpus Intake Standard: EXTERNAL_CORPUS_INTAKE_STANDARD.md
      - Programme Charter: PROGRAMME_CHARTER.md
      - Reader Guide: GRAND_CHALLENGE_READER_GUIDE.md
      - Programme Atlas: PROGRAMME_ATLAS.md
  - Doctrine:
      - Claim Boundary: CLAIM_BOUNDARY_DOCTRINE.md
      - Pedagogy: PEDAGOGICAL_STYLE_GUIDE.md
      - Cross-Pillar Lanes: CROSS_PILLAR_LANES.md
      - Computational Algebraic Geometry: COMPUTATIONAL_ALGEBRAIC_GEOMETRY_LANE.md
      - Reduction and Certificate Foundations: REDUCTION_CERTIFICATE_FOUNDATIONS.md
      - Groebner and EXPSPACE: GROEBNER_EXPSPACE_DOCTRINE.md
      - Resource Budgets: RESOURCE_BUDGET_POLICY.md
  - Domains:
      - Repository Documents: REPOSITORY_DOCS.md
  - Glossary: GLOSSARY.md

theme:
  name: material
  language: en
  logo: assets/grand-challenge-mark.svg
  favicon: assets/grand-challenge-mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/deep.css
  - stylesheets/editorial.css
  - stylesheets/progress.css
  - stylesheets/radical-progress.css
  - stylesheets/applications.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grandchallenge/MATH-PROGRAMME
      name: MATH-PROGRAMME on GitHub
