theme:
  name: material
  language: en
  logo: assets/grand-challenge-mark.svg
  favicon: assets/grand-challenge-mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/deep.css
  - stylesheets/editorial.css
  - stylesheets/progress.css
  - stylesheets/radical-progress.css
  - stylesheets/applications.css
  - stylesheets/minderlings.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grandchallenge/MATH-PROGRAMME
      name: MATH-PROGRAMME on GitHub
