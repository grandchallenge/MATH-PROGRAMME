site_name: GCL · Mathematics Programme
site_description: A governed mathematics programme for discovery, solving, and independent certification.
site_url: https://grandchallenge.github.io/MATH-PROGRAMME/
repo_url: https://github.com/grandchallenge/MATH-PROGRAMME
repo_name: grandchallenge/MATH-PROGRAMME
edit_uri: edit/main/docs/
copyright: Grand Challenge Labs · Mathematics Programme · Edition 2026.09

docs_dir: docs
site_dir: site


