site_name: Grand Challenge Mathematics Programme
site_description: A Grand Challenge mathematics programme for turning curiosity into checked understanding.
site_url: https://grandchallenge.github.io/MATH-PROGRAMME/
repo_url: https://github.com/grandchallenge/MATH-PROGRAMME
repo_name: grandchallenge/MATH-PROGRAMME
edit_uri: edit/main/docs/
copyright: Grand Challenge Mathematics Programme · Edition 2026.06 · No theorem without a spine. No proof without a reader.

docs_dir: docs
site_dir: site

nav:
  - Start Here: index.md
  - Programme:
      - Showcase: SHOWCASE.md
      - Agent Council: MATH_PROGRAMME_AGENT_COUNCIL.md
      - Agent Council Governance: AGENT_COUNCIL_GOVERNANCE.md
      - Agent Council Artifact Ledger: AGENT_COUNCIL_ARTIFACT_LEDGER.md
      - Agent Council Decision Records: AGENT_COUNCIL_DECISION_RECORDS.md
      - Agent Council Terminology Registry: AGENT_COUNCIL_TERMINOLOGY_REGISTRY.md
      - Agent Council WP Checklist: AGENT_COUNCIL_WORK_PACKAGE_CHECKLIST.md
      - Retired Minderlings Pointer: MINDERLINGS.md
      - Fixture Ledger: FIXTURE_LEDGER.md
      - Logarithmic GCD Kernel: LOG_GCD_KERNEL.md
      - LOG-GCD Prior-Art Audit: LOG_GCD_PRIOR_ART_AUDIT.md
      - "Published Result: Logarithmic GCD Kernel": LOG_GCD_PUBLICATION.md
      - "Solved-Problem Archive: Poincare Reconstruction": POINCARE_RECONSTRUCTION_ARCHIVE.md
      - Groebner Applications Manifest: GROBNER_APPLICATIONS_MANIFEST.md
      - ResearchMath Intake: RESEARCHMATH_INTAKE_LANE.md
      - ResearchMath Walkthrough: RESEARCHMATH_WALKTHROUGH.md
      - RM-DIO-004 MATHSOLVE Seed: MATHSOLVE_SEED_RM_DIO_004.md
      - External Corpus Intake Standard: EXTERNAL_CORPUS_INTAKE_STANDARD.md
      - Programme Charter: PROGRAMME_CHARTER.md
      - Reader Guide: GRAND_CHALLENGE_READER_GUIDE.md
      - Programme Atlas: PROGRAMME_ATLAS.md
      - "Resource Note: Project-Based Research": RESOURCE_NOTES/PROJECT_BASED_UNDERGRADUATE_RESEARCH.md
      - Integration Audit 2026-06-21: INTEGRATION_AUDIT_2026_06_21.md
  - Doctrine:
      - Claim Boundary: CLAIM_BOUNDARY_DOCTRINE.md
      - Pedagogy Standard: GRAND_CHALLENGE_PEDAGOGY_STANDARD.md
      - Accessible Research Guide Standard: ACCESSIBLE_RESEARCH_GUIDE_STANDARD.md
      - Foundation-Aware Programme: FOUNDATION_AWARE_MATH_PROGRAMME.md
      - Pedagogy: PEDAGOGICAL_STYLE_GUIDE.md
      - Chaidez Pedagogical Protocol: CHAIDEZ_PEDAGOGICAL_PROTOCOL.md
      - Cross-Pillar Lanes: CROSS_PILLAR_LANES.md
      - Computational Algebraic Geometry: COMPUTATIONAL_ALGEBRAIC_GEOMETRY_LANE.md
      - TROPIC-GROEBNER Route: TROPIC_GROEBNER_ROUTE.md
      - Reduction and Certificate Foundations: REDUCTION_CERTIFICATE_FOUNDATIONS.md
      - Groebner and EXPSPACE: GROEBNER_EXPSPACE_DOCTRINE.md
      - Resource Budgets: RESOURCE_BUDGET_POLICY.md
  - Routes:
      - TCM Semiring-Contraction Route: routes/TCM_SEMIRING_CONTRACTION_ROUTE.md
  - Domains:
      - Repository Documents: REPOSITORY_DOCS.md
  - Glossary: GLOSSARY.md

theme:
  name: material
  language: en
  logo: assets/grand-challenge-mark.svg
  favicon: assets/grand-challenge-mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/deep.css
  - stylesheets/editorial.css
  - stylesheets/progress.css
  - stylesheets/radical-progress.css
  - stylesheets/applications.css
  - stylesheets/minderlings.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grandchallenge/MATH-PROGRAMME
      name: MATH-PROGRAMME on GitHub