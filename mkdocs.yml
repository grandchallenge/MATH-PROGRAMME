      - Millennium Prize Problems: MILLENNIUM_PRIZE_STATUS.md
      - Erdős Compendium: erdos/index.md
      - OpenAI Mathematics 2026 Compendium: oai26/index.md
      - Union-Closed Sets: domains/union_closed.md
      - Navier–Stokes: domains/navier_stokes.md
      - Hodge Conjecture: domains/hodge.md
      - Birch–Swinnerton-Dyer: domains/birch_swinnerton_dyer.md
      - Poincaré Conjecture: domains/poincare_reconstruction.md
      - Yang–Mills: domains/yang_mills.md
      - P versus NP: domains/p_vs_np.md
      - Riemann Hypothesis: domains/riemann_hypothesis.md
  - Current Research:
      - Research Overview: CURRENT_WORK.md
      - Erdős Problem 3: campaigns/GCL_ERDOS3.md
      - OpenMath 2026: campaigns/OPENMATH_2026_STATUS.md
      - OpenMath Research Agenda: campaigns/OPENMATH_2026_RESEARCH_AGENDA.md
      - Geometric Mechanisms: campaigns/VGSE_001_STATUS.md
      - Optimization and Geometry: campaigns/OZ_001_STATUS.md
      - Prime Information: PRIME_INFORMATION_GEOMETRY.md
      - P versus NP from Above:
          - Programme Overview: pnp_above/index.md
          - Reader's Primer: pnp_above/primer.md
          - Technical Spine: pnp_above/technical.md
          - Evidence and Status: pnp_above/evidence.md
          - Research Preprint: pnp_above/preprint.md
  - Results:
      - Research and Results: SHOWCASE.md
      - Condensed Mathematics: CONDENSED_MATHEMATICS_FOR_THE_PERPLEXED.md
      - CM4 Mathematical Result: CMDG_CM4.md
      - Verified Lean Proofs: OPENAI_TEN_PROOFS_VERIFICATION.md
      - Logarithmic GCD Result: LOG_GCD_PUBLICATION.md
      - Poincaré Reconstruction: POINCARE_RECONSTRUCTION_ARCHIVE.md
      - Proof-Checking Examples: FIXTURE_LEDGER.md
  - Books:
      - Documentary Library: documentaries/index.md
  - About GCL:
      - How GCL Works: PROGRAMME_ATLAS.md
      - Reader Guide: GRAND_CHALLENGE_READER_GUIDE.md
      - Programme Charter: PROGRAMME_CHARTER.md
      - Understanding Claim Status: STATUS_TAXONOMY.md
      - Claim Boundaries: CLAIM_BOUNDARY_DOCTRINE.md
