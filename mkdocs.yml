      - Reference Library: REFERENCE_LIBRARY.md
      - Research Records: archives/research.md
      - Proofs and Results: archives/results.md
      - Mathematical Methods: archives/methods.md
      - Documentary Sources: archives/publications.md
      - Governance and History: archives/governance.md

theme:
  name: material
  language: en
  logo: assets/grand-challenge-mark.svg
  favicon: assets/grand-challenge-mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode

hooks:
  - ci/erdos_compendium_hook.py
  - ci/oai26_compendium_hook.py

# Enable the admonition syntax used for authority and status notices.
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/deep.css
  - stylesheets/editorial.css
  - stylesheets/progress.css
  - stylesheets/euclid-book-vii.css
  - stylesheets/gcl-brand.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/semantic-catalog.js
  - javascripts/mkdocs-math.js
